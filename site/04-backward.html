<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NN Internals · 04 Backward Pass</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/design.css">
<style>
/* ---- page-local: gradient flow diagram + saved-tensor rail -------------- */
.diag { width: 100%; display: block; background: var(--surface-1); border-radius: var(--r); }
.diag text { font-family: var(--mono); fill: var(--ink-2); font-size: 11px; }
.diag text.nname { fill: var(--ink); font-size: 12px; font-weight: 700; }
.diag text.nval  { fill: var(--activation); font-size: 11px; }
.diag text.gval  { fill: var(--gradient); font-size: 11px; font-weight: 700; opacity: 0; transition: opacity .35s; }
.diag text.gval.on { opacity: 1; }
.diag text.elab {
  paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round;
}
.diag text.wlab { fill: var(--weight); font-size: 10px; }
.diag text.glab { fill: var(--gradient); font-size: 10px; font-weight: 700; opacity: 0; transition: opacity .35s; }
.diag text.glab.on { opacity: 1; }
.diag text.dirlab { fill: var(--gradient); font-size: 12px; font-weight: 700; letter-spacing: .04em; }

.diag .ebase { stroke: var(--weight); stroke-opacity: .40; stroke-width: 2; }
.diag .nbody { fill: var(--surface-2); stroke: var(--hairline); stroke-width: 1.5; transition: stroke .3s, fill .3s; }
.diag .nbody.lit  { stroke: var(--gradient); stroke-width: 2.5; fill: var(--gradient-w); }
.diag .nbody.dead { stroke: var(--critical); stroke-dasharray: 4 3; }

.diag .gflow {
  fill: none; stroke: var(--gradient); stroke-width: 4; stroke-linecap: round;
  stroke-dasharray: 9 17; stroke-dashoffset: 0; opacity: 0;
  transition: opacity .3s;
}
.diag .gflow.on { opacity: .95; animation: nn-dash 1.05s linear infinite; }
.diag .gflow.zero.on { opacity: .28; stroke: var(--critical); }
@keyframes nn-dash { to { stroke-dashoffset: -52; } }

.diag .dirarrow {
  stroke: var(--gradient); stroke-width: 2.5; fill: none;
  stroke-dasharray: 8 8; animation: nn-dash 1.4s linear infinite; opacity: .8;
}

/* ---- saved tensor rail ------------------------------------------------- */
.savedrail { display: flex; flex-direction: column; gap: 12px; }
.savedrail.anyread .savedcard:not(.reading) { opacity: .38; }
.savedcard {
  position: relative; border: 1px solid var(--hairline); border-radius: 10px;
  padding: 11px 13px 6px; background: var(--surface-2);
  transition: opacity .3s, border-color .3s, box-shadow .3s, transform .3s;
}
.savedcard .cardhead {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font-family: var(--mono); font-size: .74rem; color: var(--ink-muted);
  margin-bottom: 4px;
}
.savedcard.reading {
  border-color: var(--gradient); transform: translateX(6px);
  animation: nn-pulse 1.5s ease-in-out infinite;
}
@keyframes nn-pulse {
  0%, 100% { box-shadow: 0 0 0 3px var(--gradient-w); }
  50%      { box-shadow: 0 0 0 11px color-mix(in srgb, var(--gradient) 4%, transparent); }
}
.readflag {
  display: none; position: absolute; left: -14px; top: 50%;
  transform: translate(-100%, -50%);
  font-family: var(--mono); font-size: .74rem; font-weight: 700;
  color: var(--gradient); z-index: 3;
  background: color-mix(in srgb, var(--gradient) 16%, var(--surface-1));
  border: 1px solid var(--gradient); border-radius: 999px;
  padding: 4px 11px; white-space: nowrap; line-height: 1.35;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--page) 70%, transparent);
}
.savedcard.reading .readflag { display: block; }
@media (max-width: 1100px) {
  .readflag {
    position: static; transform: none; display: none;
    margin: 0 0 8px; text-align: center;
  }
  .savedcard.reading .readflag { display: block; }
  .savedcard.reading { transform: none; }
}
.savedcard.discarded { opacity: .3; border-style: dashed; border-color: var(--critical); }
.savedcard.discarded .tensor-body { filter: grayscale(1); }

.readbanner {
  font-family: var(--mono); font-size: .82rem; padding: 9px 13px;
  border-radius: 8px; border: 1px dashed var(--hairline);
  background: var(--surface-2); color: var(--ink-muted); margin-bottom: 14px;
  transition: border-color .3s, color .3s, background .3s;
}
.readbanner.on {
  border: 1px solid var(--gradient); color: var(--gradient);
  background: var(--gradient-w);
}

/* ---- step panel -------------------------------------------------------- */
.steppanel {
  border: 1px solid var(--hairline); border-left: 3px solid var(--gradient);
  border-radius: 0 10px 10px 0; background: var(--surface-1); padding: 18px 20px;
}
.steplabel {
  font-family: var(--mono); font-size: 1.5rem; font-weight: 700;
  color: var(--gradient); letter-spacing: -.02em;
}
.stepbadge {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-muted);
  border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 9px;
}
.stepnote {
  border-top: 1px solid var(--hairline-2); margin-top: 14px; padding-top: 12px;
  color: var(--ink-2); font-size: .95rem;
}
.readchip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: .76rem; font-weight: 700;
  color: var(--gradient); background: var(--gradient-w);
  border: 1px solid var(--gradient); border-radius: 999px; padding: 2px 10px;
}
.noreadchip {
  display: inline-flex; font-family: var(--mono); font-size: .76rem;
  color: var(--ink-muted); border: 1px dashed var(--hairline);
  border-radius: 999px; padding: 2px 10px;
}

/* ---- chain factor cards ------------------------------------------------ */
.chainrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin: 16px 0; }
.factor {
  border: 1px solid var(--hairline); border-radius: 9px; background: var(--surface-2);
  padding: 9px 12px; min-width: 132px; flex: 1 1 132px;
}
.factor .fsym { font-family: var(--mono); font-size: .78rem; color: var(--ink-muted); }
.factor .frule { font-family: var(--mono); font-size: .72rem; color: var(--ink-muted); margin-top: 2px; }
.factor .fval { font-family: var(--mono); font-size: 1.15rem; font-weight: 700; margin-top: 4px; }
.times {
  display: flex; align-items: center; font-family: var(--mono);
  font-size: 1.2rem; color: var(--ink-muted);
}
.verifybox {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  border-radius: 9px; padding: 12px 16px; font-family: var(--mono); font-size: .9rem;
  border: 1px solid var(--good); background: color-mix(in srgb, var(--good) 10%, transparent);
}
.verifybox.bad { border-color: var(--critical); background: color-mix(in srgb, var(--critical) 10%, transparent); }
.verifybox .mark { font-size: 1.4rem; color: var(--good); }
.verifybox.bad .mark { color: var(--critical); }

.pickrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.pick {
  font-family: var(--mono); font-size: .8rem; padding: 5px 11px; border-radius: 7px;
  background: var(--surface-3); color: var(--ink-2);
  border: 1px solid var(--hairline); cursor: pointer;
}
.pick:hover { border-color: var(--ink-muted); color: var(--ink); }
.pick.sel { background: var(--gradient); border-color: var(--gradient); color: #fff; font-weight: 700; }

/* ---- test report ------------------------------------------------------- */
.report {
  border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden;
  background: var(--surface-2);
}
.report .rhead {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--hairline);
  font-family: var(--mono); font-size: .84rem; background: var(--surface-3);
}
.badge {
  font-family: var(--mono); font-size: .76rem; font-weight: 700; letter-spacing: .1em;
  padding: 3px 11px; border-radius: 5px; text-transform: uppercase;
}
.badge.pass { background: var(--good); color: #fff; }
.badge.fail { background: var(--critical); color: #fff; }
.report .rbody { padding: 4px 16px 14px; }
tr.deadparam td { background: color-mix(in srgb, var(--critical) 9%, transparent); }
tr.deadparam td:first-child::after { content: "  dead unit"; color: var(--critical); font-size: .78em; }
td.ok  { color: var(--good); }

.sbs { display: grid; grid-template-columns: auto auto 1fr; gap: 18px; align-items: start; }
@media (max-width: 860px) { .sbs { grid-template-columns: 1fr; } }
.eqsign { font-family: var(--mono); font-size: 1.4rem; color: var(--ink-muted); padding-top: 34px; }

.gradrow {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 7px 11px; margin-bottom: 5px; border-radius: 7px;
  border: 1px solid var(--hairline-2); background: var(--surface-2);
  opacity: .42; transition: opacity .35s, border-color .35s, background .35s;
}
.gradrow.filled { opacity: 1; border-color: var(--gradient); background: var(--gradient-w); }
.gradrow .gstat {
  margin-left: auto; font-family: var(--mono); font-size: .74rem; color: var(--ink-muted);
}
.gradrow.filled .gstat { color: var(--gradient); font-weight: 700; }

.two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 26px; align-items: start; }
@media (max-width: 1100px) { .two { grid-template-columns: 1fr; } }
</style>

<main class="wrap">

<script src="../assets/data/trace.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/viz.js"></script>
<script>
(function () {
  const T   = NN.T;
  const el  = NN.el;
  const svg = NN.svg;
  const F   = NN.fmt;
  const FS  = NN.fmtSigned;

  /* ------------------------------------------------------------------ *
   * Derived constants. Nothing below is typed by hand: every number is
   * read out of NN.T or computed from values read out of NN.T.
   * ------------------------------------------------------------------ */
  const B      = T.backward;
  const FW     = T.forward;
  const STEPS  = B.steps;
  const NSTEP  = STEPS.length;
  const NH     = FW.z1.length;                 // hidden width, 3
  const NIN    = FW.x.length;                  // input width, 2
  const BPE    = T.memory.dtype_bytes.fp32;    // bytes per fp32 element
  const NPARAM = T.memory.n_params;
  const BYCLS  = T.memory.by_class;            // authoritative per-class totals
  const ACT_EL = BYCLS.activation.elements;
  const GRAD_EL = BYCLS.gradient.elements;
  const DEAD   = FW.relu_mask.indexOf(0);      // index of the dead hidden unit

  /* per-tensor metadata, keyed by name, for shapes and dtype notes */
  const MEMT = {};
  T.memory.per_tensor.forEach(function (t) { MEMT[t.name] = t; });

  function shapeOf(v) {
    return Array.isArray(v[0]) ? [v.length, v[0].length] : [v.length];
  }
  function txt(x, y, s, cls, anchor) {
    const t = svg("text", { x: x, y: y, "text-anchor": anchor || "middle", class: cls || null });
    t.textContent = s;
    return t;
  }
  function mono(s, cls) { return el("span", { class: "mono " + (cls || "") }, s); }

  /* ================================================================== *
   * LEDE
   * ================================================================== */
  NN.$("#lede").innerHTML =
    "The forward pass turned two numbers into a loss of <b class='mono'>" + F(FW.loss, 4) +
    "</b>. The backward pass turns that one number into " + NPARAM +
    " numbers — one per parameter — by applying the chain rule mechanically, " +
    "right to left. It reads tensors that the forward pass had to keep alive, " +
    "and that is the entire reason activation memory exists.";

  /* ================================================================== *
   * 1. THE CHAIN RULE, STATED PROPERLY
   * ================================================================== */
  (function chainSection() {
    const host = NN.$("#chain-prose");

    host.appendChild(el("p", { html:
      "Calculus gives one rule and backpropagation is nothing more than that rule " +
      "applied in a fixed order. If a loss <code>L</code> depends on <code>z1</code>, " +
      "and <code>z1</code> depends on <code>W1</code>, then" }));

    host.appendChild(NN.formula({
      rule: "dL/dW1 &nbsp;=&nbsp; dL/dz1 &nbsp;·&nbsp; dz1/dW1",
      cls: "gradient"
    }));

    host.appendChild(el("p", { html:
      "The first factor, <span class='mono v-gradient'>dL/dz1</span>, is the " +
      "<i>upstream</i> gradient: how much the loss moves when <code>z1</code> moves. " +
      "The second factor, <span class='mono'>dz1/dW1</span>, is the <i>local</i> " +
      "derivative of one operation, and for a matrix multiply it is just the input " +
      "that was multiplied in. Backprop walks the graph from the loss towards the " +
      "inputs, and at each node it multiplies the upstream gradient it was handed by " +
      "that node's local derivative, then hands the result to the node behind it. " +
      "Nothing is recomputed: every layer reuses the result the layer above it " +
      "produced. That reuse is what makes one backward pass cost about the same as " +
      "one forward pass, instead of one forward pass per parameter." }));

    host.appendChild(NN.callout("key", "Right to left is not a style choice",
      "Each step needs the result of the step to its right. <span class='mono'>dL/dW1</span> " +
      "needs <span class='mono'>dL/dz1</span>, which needs <span class='mono'>dL/da1</span>, " +
      "which needs <span class='mono'>dL/dz2</span>, which needs <span class='mono'>dL/dŷ</span>. " +
      "The order is forced by the data dependency, which is also why you cannot start " +
      "the backward pass until the forward pass has finished — and why every " +
      "intermediate the backward pass will need has to survive until then."));

    /* ---- the fully expanded chain for one W1 entry -------------------- */
    const box = NN.$("#chain-expand");
    box.appendChild(el("h3", {}, "The full chain for a single weight"));
    box.appendChild(el("p", { html:
      "Pick one scalar parameter and write out every local derivative between it and " +
      "the loss. Nothing is abbreviated here — this is the whole product, with each " +
      "factor's real value from the trace. Choose an entry of " +
      "<span class='mono v-weight'>W1</span>:" }));

    const picks = el("div", { class: "pickrow" });
    const out   = el("div", {});
    box.appendChild(picks);
    box.appendChild(out);

    const pickBtns = [];
    for (let i = 0; i < NH; i++) for (let j = 0; j < NIN; j++) {
      (function (i, j) {
        const b = el("button", { class: "pick" }, "W1[" + i + "][" + j + "]");
        b.addEventListener("click", function () { renderChain(i, j); });
        picks.appendChild(b);
        pickBtns.push({ b: b, i: i, j: j });
      })(i, j);
    }

    /* the identity-output factor, derived rather than asserted */
    const dyhat_dz2 = B.dL_dz2 / B.dL_dyhat;

    function factorEl(sym, rule, value, cls) {
      return el("div", { class: "factor" }, [
        el("div", { class: "fsym" }, sym),
        el("div", { class: "frule", html: rule }),
        el("div", { class: "fval v-" + cls }, F(value, 4))
      ]);
    }

    function renderChain(i, j) {
      pickBtns.forEach(function (p) { p.b.classList.toggle("sel", p.i === i && p.j === j); });
      out.innerHTML = "";

      const f1 = B.dL_dyhat;              // dL/dŷ  = 2(ŷ − y)
      const f2 = dyhat_dz2;               // dŷ/dz2 = 1 (identity output)
      const f3 = T.init.W2[0][i];         // dz2/da1[i] = W2[0][i]
      const f4 = FW.relu_mask[i];         // da1[i]/dz1[i] = 1[z1[i] > 0]
      const f5 = FW.x[j];                 // dz1[i]/dW1[i][j] = x[j]
      const product = f1 * f2 * f3 * f4 * f5;
      const truth   = B.dL_dW1[i][j];
      const diff    = Math.abs(product - truth);
      const ok      = diff < 1e-12;

      out.appendChild(NN.formula({
        rule: "dL/dW1[" + i + "][" + j + "] &nbsp;=&nbsp; " +
              "<span class='v-gradient'>dL/dŷ</span> · " +
              "<span class='v-gradient'>dŷ/dz2</span> · " +
              "<span class='v-weight'>dz2/da1[" + i + "]</span> · " +
              "<span class='v-activation'>da1[" + i + "]/dz1[" + i + "]</span> · " +
              "<span class='v-activation'>dz1[" + i + "]/dW1[" + i + "][" + j + "]</span>",
        cls: "gradient"
      }));

      const row = el("div", { class: "chainrow" }, [
        factorEl("dL/dŷ", "2(ŷ − y)", f1, "gradient"),
        el("div", { class: "times" }, "×"),
        factorEl("dŷ/dz2", "identity output", f2, "gradient"),
        el("div", { class: "times" }, "×"),
        factorEl("dz2/da1[" + i + "]", "= W2[0][" + i + "]", f3, "weight"),
        el("div", { class: "times" }, "×"),
        factorEl("da1[" + i + "]/dz1[" + i + "]", "= relu_mask[" + i + "]", f4, "activation"),
        el("div", { class: "times" }, "×"),
        factorEl("dz1[" + i + "]/dW1[" + i + "][" + j + "]", "= x[" + j + "]", f5, "activation")
      ]);
      out.appendChild(row);

      out.appendChild(el("div", { class: "verifybox" + (ok ? "" : " bad") }, [
        el("span", { class: "mark" }, ok ? "✓" : "✗"),
        el("span", { html:
          "product = <b class='v-gradient'>" + F(product, 6) + "</b> &nbsp;·&nbsp; " +
          "<span class='muted'>T.backward.dL_dW1[" + i + "][" + j + "] =</span> " +
          "<b class='v-gradient'>" + F(truth, 6) + "</b> &nbsp;·&nbsp; " +
          "<span class='muted'>|difference| =</span> <b>" +
          (diff === 0 ? "0" : diff.toExponential(2)) + "</b>" })
      ]));

      out.appendChild(el("p", { class: "small muted", html:
        f4 === 0
          ? "The ReLU mask factor is <b>0</b>, so the entire product collapses to zero " +
            "no matter how large the other four factors are. One zero anywhere in the " +
            "chain zeroes the whole path. That is the dead unit, two sections down."
          : "Five numbers multiplied together. The backward pass never actually forms " +
            "this product explicitly — it computes the shared prefix once " +
            "(<span class='mono'>dL/dŷ → dL/dz2 → dL/da1 → dL/dz1</span>) and reuses it for " +
            "all " + (NH * NIN) + " entries of W1. Writing it out longhand is only to show " +
            "there is no magic in it." }));

      out.appendChild(NN.callout("why", "What the factors are made of",
        "Two of the five factors are <b>parameters</b> (<span class='mono v-weight'>W2</span>), " +
        "two are <b>saved activations</b> (<span class='mono v-activation'>relu_mask</span>, " +
        "<span class='mono v-activation'>x</span>), and one is the loss derivative. " +
        "You cannot evaluate this product from the weights alone. The activations are " +
        "half the ingredients."));
    }

    renderChain(0, 0);
  })();

  /* ================================================================== *
   * 2. THE NETWORK DIAGRAM (gradients flow right to left)
   * ================================================================== */
  const diagram = (function buildDiagram() {
    const W = 980, H = 430;
    const R = 28, RS = 22;
    const IN   = [{ x: 105, y: 165 }, { x: 105, y: 272 }];
    const HID  = [{ x: 415, y: 95 }, { x: 415, y: 218 }, { x: 415, y: 341 }];
    const OUT  = { x: 705, y: 218 };
    const LOSS = { x: 890, y: 218 };

    const root = svg("svg", {
      class: "diag", viewBox: "0 0 " + W + " " + H, width: "100%", height: H,
      role: "img",
      "aria-label": "Network diagram, 2 inputs to 3 hidden ReLU units to 1 output, " +
                    "with gradients flowing from the loss on the right back to the weights on the left."
    });

    /* --- direction banner --------------------------------------------- */
    const defs = svg("defs", {});
    const mk = svg("marker", {
      id: "gradhead", viewBox: "0 0 10 10", refX: 8, refY: 5,
      markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse"
    });
    mk.appendChild(svg("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "var(--gradient)" }));
    defs.appendChild(mk);
    root.appendChild(defs);

    root.appendChild(svg("path", {
      class: "dirarrow", d: "M 830 30 L 160 30", "marker-end": "url(#gradhead)"
    }));
    root.appendChild(txt(495, 20, "gradient flows this way — backwards, from the loss to the weights", "dirlab"));

    /* --- edge helper --------------------------------------------------- */
    function edge(a, b, ra, rb) {
      const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
      const ux = dx / L, uy = dy / L;
      const p1 = { x: a.x + ux * ra, y: a.y + uy * ra };
      const p2 = { x: b.x - ux * rb, y: b.y - uy * rb };
      const base = svg("line", { class: "ebase", x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y });
      /* the flow path is defined RIGHT-to-LEFT so the dash animation travels backwards */
      const flow = svg("path", {
        class: "gflow",
        d: "M " + p2.x.toFixed(1) + " " + p2.y.toFixed(1) +
           " L " + p1.x.toFixed(1) + " " + p1.y.toFixed(1)
      });
      return { base: base, flow: flow, p1: p1, p2: p2 };
    }
    function at(e, t) {
      return { x: e.p1.x + (e.p2.x - e.p1.x) * t, y: e.p1.y + (e.p2.y - e.p1.y) * t };
    }

    const gBase = svg("g", {}), gFlow = svg("g", {}), gNode = svg("g", {}), gText = svg("g", {});

    /* --- W1 edges: input j -> hidden i --------------------------------- */
    const w1e = [], w1w = [], w1g = [];
    for (let i = 0; i < NH; i++) {
      w1e.push([]); w1w.push([]); w1g.push([]);
      for (let j = 0; j < NIN; j++) {
        const e = edge(IN[j], HID[i], RS, R);
        gBase.appendChild(e.base); gFlow.appendChild(e.flow);
        const t  = j === 0 ? 0.30 : 0.60;
        const p  = at(e, t);
        const wl = txt(p.x, p.y - 6, "w " + F(T.init.W1[i][j], 2), "elab wlab");
        const gl = txt(p.x, p.y + 8, "∇ " + F(B.dL_dW1[i][j], 3), "elab glab");
        gText.appendChild(wl); gText.appendChild(gl);
        w1e[i].push(e); w1w[i].push(wl); w1g[i].push(gl);
      }
    }

    /* --- W2 edges: hidden i -> output ---------------------------------- */
    const w2e = [], w2g = [];
    for (let i = 0; i < NH; i++) {
      const e = edge(HID[i], OUT, R, R);
      gBase.appendChild(e.base); gFlow.appendChild(e.flow);
      const p = at(e, 0.5);
      gText.appendChild(txt(p.x, p.y - 6, "w " + F(T.init.W2[0][i], 2), "elab wlab"));
      const gl = txt(p.x, p.y + 8, "∇ " + F(B.dL_dW2[0][i], 3), "elab glab");
      gText.appendChild(gl);
      w2e.push(e); w2g.push(gl);
    }

    /* --- loss edge: output -> L ---------------------------------------- */
    const le = edge(OUT, LOSS, R, RS);
    gBase.appendChild(le.base); gFlow.appendChild(le.flow);

    /* --- nodes ---------------------------------------------------------- */
    function node(p, r, name, val, valcls) {
      const c = svg("circle", { class: "nbody", cx: p.x, cy: p.y, r: r });
      gNode.appendChild(c);
      gText.appendChild(txt(p.x, p.y - 2, name, "nname"));
      if (val !== null) gText.appendChild(txt(p.x, p.y + 12, val, valcls || "nval"));
      return c;
    }

    IN.forEach(function (p, j) {
      node(p, RS, "x[" + j + "]", F(FW.x[j], 2));
      gText.appendChild(txt(p.x - RS - 8, p.y + 4, T.meta.input.x_meaning[j], null, "end"));
    });

    const hidC = [], hidDa = [], hidDz = [], hidDb = [];
    HID.forEach(function (p, i) {
      const c = node(p, R, "a1[" + i + "]", F(FW.a1[i], 3));
      if (FW.relu_mask[i] === 0) c.classList.add("dead");
      hidC.push(c);
      gText.appendChild(txt(p.x, p.y - R - 8,
        "z1=" + F(FW.z1[i], 2) + "  mask=" + F(FW.relu_mask[i], 0)));
      const a = txt(p.x, p.y + R + 15, "dL/da1 " + FS(B.dL_da1[i], 3), "gval");
      const z = txt(p.x, p.y + R + 29, "dL/dz1 " + FS(B.dL_dz1[i], 3), "gval");
      const b = txt(p.x, p.y + R + 43, "dL/db1 " + FS(B.dL_db1[i], 3), "gval");
      gText.appendChild(a); gText.appendChild(z); gText.appendChild(b);
      hidDa.push(a); hidDz.push(z); hidDb.push(b);
    });

    const outC  = node(OUT, R, "ŷ = z2", F(FW.yhat, 3));
    const outDy = txt(OUT.x, OUT.y + R + 15, "dL/dŷ " + FS(B.dL_dyhat, 3), "gval");
    const outDz = txt(OUT.x, OUT.y + R + 29, "dL/dz2 " + FS(B.dL_dz2, 3), "gval");
    const outDb = txt(OUT.x, OUT.y + R + 43, "dL/db2 " + FS(B.dL_db2[0], 3), "gval");
    gText.appendChild(outDy); gText.appendChild(outDz); gText.appendChild(outDb);

    const lossC = node(LOSS, RS, "L", F(FW.loss, 3));
    gText.appendChild(txt(LOSS.x, LOSS.y + RS + 15, "(ŷ − y)²"));
    gText.appendChild(txt(LOSS.x, LOSS.y - RS - 10, "y = " + F(FW.y, 1)));

    root.appendChild(gBase); root.appendChild(gFlow);
    root.appendChild(gNode); root.appendChild(gText);

    /* --- per-step state application ------------------------------------ */
    function allFlows(fn) {
      w1e.forEach(function (r) { r.forEach(function (e) { fn(e.flow); }); });
      w2e.forEach(function (e) { fn(e.flow); });
      fn(le.flow);
    }
    function clear() {
      allFlows(function (f) { f.classList.remove("on"); });
      hidC.forEach(function (c) { c.classList.remove("lit"); });
      outC.classList.remove("lit"); lossC.classList.remove("lit");
    }

    return {
      el: root,
      apply: function (i) {
        clear();
        const seen = {};
        for (let k = 0; k <= i; k++) seen[STEPS[k].id] = true;
        const id = STEPS[i].id;

        /* cumulative reveal of known gradient values */
        outDy.classList.toggle("on", !!seen.dL_dyhat);
        outDz.classList.toggle("on", !!seen.dL_dz2);
        outDb.classList.toggle("on", !!seen.dL_db2);
        w2g.forEach(function (g) { g.classList.toggle("on", !!seen.dL_dW2); });
        hidDa.forEach(function (g) { g.classList.toggle("on", !!seen.dL_da1); });
        hidDz.forEach(function (g) { g.classList.toggle("on", !!seen.dL_dz1); });
        hidDb.forEach(function (g) { g.classList.toggle("on", !!seen.dL_db1); });
        w1g.forEach(function (r) { r.forEach(function (g) { g.classList.toggle("on", !!seen.dL_dW1); }); });

        /* what is moving right now */
        if (id === "dL_dyhat") { le.flow.classList.add("on"); lossC.classList.add("lit"); outC.classList.add("lit"); }
        if (id === "dL_dz2" || id === "dL_db2") outC.classList.add("lit");
        if (id === "dL_dW2" || id === "dL_da1") {
          outC.classList.add("lit");
          w2e.forEach(function (e, k) {
            e.flow.classList.toggle("zero", id === "dL_dW2" && B.dL_dW2[0][k] === 0);
            e.flow.classList.add("on");
          });
          if (id === "dL_da1") hidC.forEach(function (c) { c.classList.add("lit"); });
        }
        if (id === "dL_dz1" || id === "dL_db1") {
          hidC.forEach(function (c, k) {
            if (FW.relu_mask[k] !== 0) c.classList.add("lit");
          });
        }
        if (id === "dL_dW1") {
          w1e.forEach(function (r, k) {
            r.forEach(function (e) {
              e.flow.classList.toggle("zero", B.dL_dz1[k] === 0);
              e.flow.classList.add("on");
            });
          });
          hidC.forEach(function (c, k) { if (FW.relu_mask[k] !== 0) c.classList.add("lit"); });
        }
      }
    };
  })();

  /* ================================================================== *
   * 3. THE STEPPER — the centrepiece

  (function stepperSection() {

    }

    card("x", "x", FW.saved_for_backward.x, "activation", [NIN],
         "saved by forward", "the layer-1 input");
    card("a1", "a1", FW.saved_for_backward.a1, "activation", [NH],
         "saved by forward", "the layer-2 input");
    card("relu_mask", "relu_mask", FW.saved_for_backward.relu_mask, "activation", [NH],
         "saved by forward",
         "1 where z1 > 0" + (MEMT.relu_mask.note ? "  ·  " + MEMT.relu_mask.note : ""));
    card("W2", "W2", T.init.W2, "weight", [1, NH],

    railHost.appendChild(el("p", { class: "small muted", style: { marginTop: "12px" }, html:
      "Three of these four are <b>activations</b> — they exist only because the forward " +

      "parameter and would have been resident anyway. " +
      "<span class='mono'>T.forward.saved_for_backward</span> lists exactly " +
      Object.keys(FW.saved_for_backward).length + " tensors, and every one of them is " +
      "consumed below." }));

    railHost.appendChild(el("p", { class: "small muted", html:
      "<span class='mono'>relu_mask</span> is counted at " + BPE + " B per element " +
      "everywhere on this page because that is what the trace stores, but the note on " +
      "<span class='mono'>T.memory.per_tensor</span> records what really happens: " +
      "<i>" + MEMT.relu_mask.note + "</i>. A mask is one bit of information per element, " +
      "so frameworks keep it as a byte-wide or bit-packed tensor — or skip it entirely and " +

    /* ---- the step detail panel ---------------------------------------- */
    const detail    = NN.$("#step-detail");
    const panelHost = el("div", {});

    detail.appendChild(bufHost);

    /* ---- the gradient buffer, filling up as backward proceeds --------- */
    const GRADT = T.memory.per_tensor
      .filter(function (t) { return t.cls === "gradient"; })
      .map(function (t) { return { t: t, id: t.name.replace("/", "_") }; });
    const gradTotalBytes = GRADT.reduce(function (a, g) { return a + g.t.elements * BPE; }, 0);

    bufHost.appendChild(el("h3", { style: { marginTop: "0" } }, "The gradient buffer, filling up"));
    bufHost.appendChild(el("p", { class: "small muted", html:
      "Gradients do not exist before the backward pass starts. Each row below is allocated " +
      "and written at the step named on it, and every one of them stays live until the " +
      "optimizer has consumed it. Watch the buffer grow as you step." }));

    const gradRows = GRADT.map(function (g) {
      const bytes = g.t.elements * BPE;
      const status = el("span", { class: "gstat" }, "not yet computed");
      const row = el("div", { class: "gradrow" }, [
        el("span", { class: "mono v-gradient", style: { fontWeight: "700", minWidth: "76px" } }, g.t.name),
        el("span", { class: "small muted mono" }, "(" + g.t.shape.join("×") + ")  " +
          g.t.elements + " × " + BPE + " B = " + NN.bytes(bytes)),
        status
      ]);
      bufHost.appendChild(row);
      return { row: row, status: status, id: g.id, bytes: bytes };
    });

    const gradStripHost = el("div", { style: { marginTop: "10px" } });
    bufHost.appendChild(gradStripHost);

    function renderBuffer(i) {
      const seen = {};
      for (let k = 0; k <= i; k++) seen[STEPS[k].id] = true;
      let live = 0;
      gradRows.forEach(function (r) {
        const on = !!seen[r.id];
        r.row.classList.toggle("filled", on);
        r.status.textContent = on ? "allocated + written" : "not yet computed";
        if (on) live += r.bytes;
      });
      gradStripHost.innerHTML = "";
      gradStripHost.appendChild(NN.memstrip(
        [{ cls: "gradient", bytes: live, label: "gradients " + NN.bytes(live) }],
        gradTotalBytes));
      gradStripHost.appendChild(el("div", { class: "small muted mono" },
        NN.bytes(live) + " of " + NN.bytes(gradTotalBytes) + " of gradient memory live"));
    }

    function renderStep(i) {
      const s = STEPS[i];
      panelHost.innerHTML = "";

      const head = el("div", { style: { display: "flex", alignItems: "baseline", gap: "12px", flexWrap: "wrap" } }, [
        el("span", { class: "steplabel" }, s.label),
        el("span", { class: "stepbadge" }, "step " + (i + 1) + " of " + NSTEP),
        el("span", { class: "stepbadge" }, "T.backward." + s.id)
      ]);

      const readsRow = el("div", { style: { margin: "12px 0", display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" } });
      readsRow.appendChild(el("span", { class: "small muted mono" }, "reads:"));

      } else {

        });

          name: s.label, shape: shapeOf(s.value), values: s.value,

        }));
      }

      const panel = el("div", { class: "steppanel" }, [
        head, readsRow, body,
        el("div", { class: "stepnote" }, s.note)
      ]);
      panelHost.appendChild(panel);

      /* dead-unit annotation where it applies */
      if (s.id === "dL_dz1") {
        panelHost.appendChild(NN.callout("warn", "Unit " + DEAD + " just died",
          "<span class='mono v-gradient'>dL/da1[" + DEAD + "] = " + F(B.dL_da1[DEAD], 4) +
          "</span> — a real, non-zero gradient <i>did</i> arrive at that unit. " +
          "The mask multiplied it by <span class='mono'>" + F(FW.relu_mask[DEAD], 0) +
          "</span> and it became <span class='mono v-gradient'>" + F(B.dL_dz1[DEAD], 4) +
          "</span>. Full section below."));
      }

      /* rail highlighting — the whole point of the page */
      Object.keys(CARDS).forEach(function (k) {
        CARDS[k].classList.toggle("reading", s.reads.indexOf(k) >= 0);
      });
      rail.classList.toggle("anyread", s.reads.length > 0);
      banner.classList.toggle("on", s.reads.length > 0);
      banner.textContent = s.reads.length
        ? "Step " + (i + 1) + " (" + s.label + ") is reading " + s.reads.join(", ") +
          " out of memory right now."
        : "Step " + (i + 1) + " (" + s.label + ") reads nothing from memory — " +
          "it only reshapes the gradient it was handed.";

      diagram.apply(i);
      renderBuffer(i);
    }

    new NN.Stepper({
      mount: NN.$("#step-controls"),
      count: NSTEP,
      labels: STEPS.map(function (s) {
        return s.label + (s.reads.length ? "   reads " + s.reads.join(", ") : "");
      }),
      onStep: renderStep,
      autoplayMs: 2600
    });

    NN.$("#stepper").appendChild(NN.callout("key", "Read the reads column",
      "Of the " + NSTEP + " steps, " +
      STEPS.filter(function (s) { return s.reads.length > 0; }).length +
      " touch a saved tensor and " +
      STEPS.filter(function (s) { return s.reads.length === 0; }).length +
      " do not. The ones that do not are the biases and the pointwise identities — " +
      "they are free. The ones that do are the two weight gradients and the two " +
      "boundary crossings, and they are the reason the forward pass cannot throw " +
      "anything away."));
  })();

  /* ================================================================== *

   * ================================================================== */
  (function deadSection() {

    host.appendChild(el("p", { html:

      "It contributed exactly nothing to the prediction. So when the loss goes looking " +
      "for something to blame, it finds nothing there." }));

    host.appendChild(NN.tiles([
      { k: "z1[" + DEAD + "]", v: F(FW.z1[DEAD], 3), s: "pre-activation, negative", cls: "activation" },
      { k: "a1[" + DEAD + "]", v: F(FW.a1[DEAD], 1), s: "after ReLU", cls: "activation" },
      { k: "dL/da1[" + DEAD + "]", v: FS(B.dL_da1[DEAD], 3), s: "gradient DID arrive", cls: "gradient" },
      { k: "dL/dz1[" + DEAD + "]", v: F(B.dL_dz1[DEAD], 1), s: "mask killed it", cls: "gradient" },
      { k: "dL/db1[" + DEAD + "]", v: F(B.dL_db1[DEAD], 1), s: "bias gets nothing", cls: "gradient" },

      "The detail worth pausing on: <span class='mono v-gradient'>dL/da1[" + DEAD + "] = " +

      "back across the layer boundary and arrived at unit " + DEAD + ". The ReLU derivative " +

    }));

    host.appendChild(el("h3", {}, "Its whole row of W1 is zero"));
    host.appendChild(el("div", { class: "sbs" }, [
      NN.tensor({
        name: "dL/dW1", shape: shapeOf(B.dL_dW1), values: B.dL_dW1,

      }),
      el("div", {}),
      el("div", { class: "small muted", html:
        "<span class='mono v-gradient'>dL/dW1[" + DEAD + "] = [" +
        B.dL_dW1[DEAD].map(function (v) { return F(v, 1); }).join(", ") + "]</span>. " +
        "SGD will apply an update of <span class='mono'>lr × 0 = 0</span> to both of them. " +
        "Next iteration, the same input arrives, <span class='mono'>W1[" + DEAD + "]</span> " +
        "and <span class='mono'>b1[" + DEAD + "]</span> are unchanged, so " +
        "<span class='mono'>z1[" + DEAD + "]</span> is still negative, so the unit is still " +

        "That is a <b>dead ReLU</b>, and it is permanent for this input." })
    ]));

      "Absolute gradient magnitude for all " + NPARAM + " parameters, from " +
      "<span class='mono'>T.gradcheck.analytic</span>. " + zeroIdx.length +
      " of them are exactly zero, and all " + zeroIdx.length + " belong to the dead unit: " +
      zeroIdx.map(function (k) { return "<span class='mono'>" + T.param_names[k] + "</span>"; }).join(", ") + "." }));

    host.appendChild(NN.chart.bars({
      items: T.param_names.map(function (n, k) {
        const g = T.gradcheck.analytic[k];

          color: g === 0 ? "var(--critical)" : "var(--gradient)",
          sub: g === 0 ? "  no blame" : ""

      unit: ""
    }));

      "receives zero gradient forever and is dead weight — it occupies parameter memory, " +
      "optimizer memory and FLOPs, and contributes nothing. In practice a large learning " +
      "rate can push a whole block of units into this state in one step. The standard " +
      "mitigations are all about keeping the derivative non-zero: LeakyReLU and ELU give a " +
      "small slope for negative inputs, GELU and SiLU are smooth everywhere and never have " +
      "an exactly-zero derivative, and careful initialisation plus normalisation layers keep " +
      "pre-activations centred. Modern transformer MLPs use GELU or SwiGLU rather than ReLU " +
      "in large part for this reason."));
  })();

      "There is no way around it. The weight gradient of a matrix multiply is an outer " +
      "product of the output gradient with the input. If you do not have the input, you do " +
      "not have the gradient. Not approximately — you have nothing to compute with." }));

    /* ---- the experiment ------------------------------------------------ */
    host.appendChild(el("h3", {}, "Experiment: what if we hadn't saved a1?"));

    const btn = el("button", { class: "btn primary" }, "Free a1 to save memory");
    const ctrl = el("div", { class: "controls" }, [
      btn,
      el("span", { class: "small muted" }, "toggle the activation in and out of memory")
    ]);
    host.appendChild(ctrl);

    const expo = el("div", { class: "grid2" });
    host.appendChild(expo);

    const memHost = el("div", {});
    host.appendChild(memHost);

    let freed = false;

    /* memory accounting, straight off T.memory.by_class */
    const wBytes  = BYCLS.weight.bytes_fp32;
    const gBytes  = BYCLS.gradient.bytes_fp32;
    const aBytes  = BYCLS.activation.bytes_fp32;
    const a1Bytes = MEMT.a1.elements * BPE;

    function draw() {
      expo.innerHTML = "";
      memHost.innerHTML = "";

      /* left: the a1 card */
      const a1t = NN.tensor({
        name: "a1", shape: [NH], values: FW.a1, cls: "activation", digits: 3,
        note: freed ? "FREED — no longer in memory" : "alive, " + NN.bytes(a1Bytes)
      });
      const a1card = el("div", { class: "savedcard" + (freed ? " discarded" : "") }, [
        el("div", { class: "cardhead" }, [NN.chip("activation"), el("span", {}, freed ? "freed after forward" : "saved for backward")]),
        a1t
      ]);
      expo.appendChild(el("div", {}, [
        el("div", { class: "small muted mono", style: { marginBottom: "8px" } }, "memory"),
        a1card
      ]));

      /* right: can we compute dL/dW2? */
      const right = el("div", {});
      right.appendChild(el("div", { class: "small muted mono", style: { marginBottom: "8px" } }, "dL/dW2 = dL/dz2 ⊗ a1ᵀ"));
      if (!freed) {
        right.appendChild(NN.formula({
          rule: sW2.formula, sub: sW2.substitution, cls: "gradient"
        }));
        right.appendChild(NN.tensor({
          name: "dL/dW2", shape: shapeOf(B.dL_dW2), values: B.dL_dW2,
          cls: "gradient", digits: 4, signed: true, note: "computed"
        }));
      } else {
        right.appendChild(NN.formula({
          rule: sW2.formula,
          sub: F(B.dL_dz2, 2) + " × [ ?, ?, ? ]",
          cls: "gradient"
        }));
        right.appendChild(NN.tensor({
          name: "dL/dW2", shape: shapeOf(B.dL_dW2),
          values: [B.dL_dW2[0].map(function () { return NaN; })],
          cls: "gradient", digits: 4, note: "UNCOMPUTABLE"
        }));
        right.appendChild(el("div", { class: "callout warn", style: { marginTop: "12px" } }, [
          el("div", { class: "t" }, "Dead end"),
          el("div", { html:
            "<span class='mono'>dL/dz2 = " + F(B.dL_dz2, 4) + "</span> is known. The other " +
            "operand is gone. There is no identity, no trick and no cached partial that " +
            "recovers <span class='mono'>a1</span> from the weights and the loss. " +
            "The only way to get it back is to <b>run the forward pass again</b> from " +
            "<span class='mono'>x</span>: recompute <span class='mono'>z1 = W1·x + b1</span>, " +
            "then <span class='mono'>a1 = relu(z1)</span>. Correct answer, paid for twice." })
        ]));
      }
      expo.appendChild(right);

      /* memory strip */
      memHost.appendChild(el("h3", {}, "The memory strip, at the moment backward runs"));
      const segs = [
        { cls: "weight", bytes: wBytes, label: "weights " + NN.bytes(wBytes) },
        { cls: "activation", bytes: freed ? aBytes - a1Bytes : aBytes,
          label: "activations " + NN.bytes(freed ? aBytes - a1Bytes : aBytes) },
        { cls: "gradient", bytes: gBytes, label: "gradients " + NN.bytes(gBytes) }
      ];
      memHost.appendChild(NN.memstrip(segs, wBytes + aBytes + gBytes));
      memHost.appendChild(NN.legend(["weight", "activation", "gradient"]));
      memHost.appendChild(el("p", { class: "small muted", html:
        NPARAM + " parameters × " + BPE + " B = <b>" + NN.bytes(wBytes) + "</b> of weights. " +
        GRAD_EL + " gradient elements × " + BPE + " B = <b>" + NN.bytes(gBytes) + "</b>. " +
        ACT_EL + " activation elements across " + BYCLS.activation.tensors + " tensors (" +
        BYCLS.activation.names.map(function (n) { return "<span class='mono'>" + n + "</span>"; }).join(", ") +
        ") × " + BPE + " B = <b>" + NN.bytes(aBytes) + "</b>" +
        (freed
          ? ", of which <b>" + NN.bytes(a1Bytes) + "</b> has just been freed — " +
            F(a1Bytes / (wBytes + aBytes + gBytes) * 100, 1) + "% of the live footprint. " +
            "In exchange, the backward pass no longer works."
          : ". The activation band is small here because the model is tiny; in a real " +
            "network with a batch dimension it is usually the largest band on the strip. " +
            "Note it counts <span class='mono'>relu_mask</span> at the full " + BPE +
            " B per element, which overstates it — see the note in the rail above.") }));
    }

    btn.addEventListener("click", function () {
      freed = !freed;
      btn.textContent = freed ? "Restore a1 (re-run forward)" : "Free a1 to save memory";
      btn.classList.toggle("primary", !freed);
      draw();
    });
    draw();

    host.appendChild(NN.callout("mem", "This trade has a name: gradient checkpointing",
      "What the toggle above does by hand is exactly the knob that gradient checkpointing " +
      "(activation checkpointing, recomputation) turns automatically. You mark some layers " +
      "as checkpoints, keep only their <i>inputs</i>, and throw away every intermediate " +
      "activation inside them. When backward reaches a checkpointed block, it re-runs that " +
      "block's forward pass to regenerate the activations it needs, uses them, and frees " +
      "them again. " +
      "<br><br>The arithmetic: for a network of <i>n</i> sequential layers, checkpointing " +
      "every √n-th layer reduces activation memory from O(n) to O(√n) at the cost of one " +
      "extra forward pass, roughly +33% step time (forward + forward + backward instead of " +
      "forward + backward). For a 70B-parameter transformer training at long sequence " +
      "length, activations without checkpointing routinely exceed the weights, the " +
      "gradients and the optimizer state combined — which is why almost every large " +
      "training run has it switched on. It is not an optimisation, it is what makes the " +
      "run fit."));

    host.appendChild(NN.callout("why", "Why inference needs none of this",
      "A forward-only pass can free each activation the moment the next layer has consumed " +
      "it, because nothing will ever ask for it again. Peak activation memory for inference " +
      "is roughly the largest single layer, not the sum of all of them. Training holds all " +
      "of them, from the first layer's output until backward walks back to it. Same weights, " +
      "same FLOPs per token, completely different memory profile — and it is the backward " +
      "pass reading <span class='mono'>a1</span> that causes the difference. Inference does " +
      "keep one thing, and only one: <a href='25-kv-cache.html'>page 25</a> is the KV cache, " +
      "and <a href='24-prefill-decode.html'>page 24</a> is why it exists."));
  })();

  /* ================================================================== *
   * 6. GRADIENTS ARE THE SAME SHAPE AS WEIGHTS
   * ================================================================== */
  (function shapeSection() {
    const host = NN.$("#shapes-body");

    host.appendChild(el("p", { html:
      "A gradient answers the question \"if I nudge this one number, how does the loss " +
      "move?\" — and there is one such question per number. So the gradient tensor has " +
      "exactly the same shape as the tensor it differentiates, element for element." }));

    function pair(name, wv, gv, gname) {
      return el("div", { class: "sbs", style: { marginBottom: "10px" } }, [
        NN.tensor({ name: name, shape: shapeOf(wv), values: wv, cls: "weight", digits: 3 }),
        el("div", { class: "eqsign" }, "→"),
        NN.tensor({ name: gname, shape: shapeOf(gv), values: gv, cls: "gradient", digits: 4, signed: true,
                    note: "same " + shapeOf(gv).join("×") + " shape" })
      ]);
    }

    host.appendChild(pair("W1", T.init.W1, B.dL_dW1, "dL/dW1"));
    host.appendChild(pair("W2", T.init.W2, B.dL_dW2, "dL/dW2"));
    host.appendChild(pair("b1", T.init.b1, B.dL_db1, "dL/db1"));
    host.appendChild(pair("b2", T.init.b2, B.dL_db2, "dL/db2"));

    host.appendChild(NN.legend(["weight", "gradient"]));

    const wB = NPARAM * BPE, gB = GRAD_EL * BPE;
    host.appendChild(NN.tiles([
      { k: "parameters", v: String(NPARAM), s: "weight elements", cls: "weight" },
      { k: "gradient elements", v: String(GRAD_EL), s: "one per parameter", cls: "gradient" },
      { k: "weight bytes", v: NN.bytes(wB), s: NPARAM + " × " + BPE + " B fp32", cls: "weight" },
      { k: "gradient bytes", v: NN.bytes(gB), s: GRAD_EL + " × " + BPE + " B fp32", cls: "gradient" },
      { k: "ratio", v: F(gB / wB, 2) + "×", s: "gradients ÷ weights" }
    ]));

    host.appendChild(el("p", { html:
      "<b>" + NN.bytes(wB) + "</b> of weights implies <b>" + NN.bytes(gB) + "</b> of " +
      "gradients: a ratio of exactly <b>" + F(gB / wB, 2) + "</b>. Deciding to train a model " +
      "rather than merely run it doubles the parameter-shaped memory before you have " +
      "allocated a single byte of optimizer state or activation." }));

    host.appendChild(NN.memstrip([
      { cls: "weight", bytes: wB, label: "weights " + NN.bytes(wB) },
      { cls: "gradient", bytes: gB, label: "gradients " + NN.bytes(gB) }
    ], wB + gB));

    /* ---- scale it up, from the shared reference configs ---------------- */
    const RC    = T.reference_configs;
    const MODEL = RC.models.filter(function (m) { return m.name === RC.default_model; })[0];
    const GPU   = RC.gpus.filter(function (g) { return g.name === RC.default_gpu; })[0];
    const both  = function (m) { return 2 * m.params * BPE; };
    const devs  = function (m) { return Math.ceil(both(m) / GPU.hbm_bytes); };
    /* NN.count rounds 70.6e9 to "71B", which reads like a typo next to the
       model's own name. Keep one decimal in the billions range. */
    const pcount = function (n) { return n >= 1e9 ? F(n / 1e9, 1) + "B" : NN.count(n); };

    host.appendChild(el("h3", {}, "The same arithmetic at real model scale"));
    host.appendChild(el("p", { html:
      "The ratio is <b>" + F(gB / wB, 2) + "</b> at every size, so scaling it up is just " +
      "multiplication. Every row below is <span class='mono'>params × " + BPE + " B</span> " +
      "twice — once for the weights, once for the gradient buffer — and the last column is " +
      "how many <b>" + GPU.name + "</b> (" + NN.gibytes(GPU.hbm_bytes) + " = " +
      NN.bytes(GPU.hbm_bytes) + " HBM each) those two " +
      "tensors <i>alone</i> would fill, with nothing left for optimizer state, activations, " +
      "or the model's own code." }));

    const rcTbl = el("table", { class: "data" });
    rcTbl.appendChild(el("thead", {}, el("tr", {}, [
      el("th", {}, "model"),
      el("th", {}, "parameters"),
      el("th", {}, "weights fp32"),
      el("th", {}, "gradients fp32"),
      el("th", {}, "both, live at once"),
      el("th", {}, "× " + GPU.name)
    ])));
    const rcBody = el("tbody", {});
    RC.models.forEach(function (m) {
      const isDef = m.name === RC.default_model;
      rcBody.appendChild(el("tr", {}, [
        el("td", {}, [
          el("span", { style: isDef ? { fontWeight: "700" } : null }, m.name),
          isDef ? el("span", { class: "small muted" }, "  ← default") : null
        ]),
        el("td", { class: "n" }, pcount(m.params)),
        el("td", { class: "n v-weight" }, NN.bytes(m.params * BPE)),
        el("td", { class: "n v-gradient" }, NN.bytes(m.params * BPE)),
        el("td", { class: "n" }, NN.bytes(both(m))),
        el("td", { class: "n" }, String(devs(m)))
      ]));
    });
    rcTbl.appendChild(rcBody);
    host.appendChild(el("div", { class: "scrollx" }, rcTbl));

    host.appendChild(el("p", { class: "small muted", html:
      "Sizes and device capacities come from <span class='mono'>T.reference_configs</span>, " +
      "the shared table this site uses wherever it leaves the toy model. Its own caveat, " +
      "verbatim: <i>" + RC._source + "</i>. Unlike every other number on this page, these " +
      "are not derived from anything — they are quoted, and the byte counts are the " +
      "idealised lower bound rather than what a real run measures." }));

    host.appendChild(NN.callout("mem",
      "The same arithmetic at " + MODEL.name,
      "<span class='mono'>" + pcount(MODEL.params) + "</span> parameters × " + BPE +
      " B = <b>" + NN.bytes(MODEL.params * BPE) + "</b> of fp32 weights, and the gradient " +
      "buffer is another <b>" + NN.bytes(MODEL.params * BPE) + "</b>, for <b>" +
      NN.bytes(both(MODEL)) + "</b> before a single byte of optimizer state or activation " +
      "exists. On " + GPU.name + " at " + NN.gibytes(GPU.hbm_bytes) + " (" +
      NN.bytes(GPU.hbm_bytes) + ") that is <b>" +
      devs(MODEL) + " devices</b>' worth of memory for two tensors that must both be live " +
      "at the same instant — the instant the optimizer step runs. That model is " +
      MODEL.n_layers + " layers of width d_model = " + MODEL.d_model + ", and the exact " +
      "same " + NSTEP + "-step pattern you stepped through above runs inside every one of " +
      "them. Page 15 is about what people do instead. " +
      "<br><br>One real mitigation is visible right here: gradients, unlike weights, are " +
      "consumed once and discarded, so they are the natural candidate for a lower-precision " +
      "buffer or for being reduced-and-freed shard by shard, which is exactly what ZeRO " +
      "stage 2 does."));
  })();

  /* ================================================================== *
   * 7. THE GRADIENT CHECK
   * ================================================================== */
  (function gradcheckSection() {
    const host = NN.$("#gc-body");
    const GC = T.gradcheck;
    const TOL = 1e-6;

    host.appendChild(el("p", { html:
      "Every derivative on this page was worked out by hand and then implemented. Both of " +
      "those are places to make a mistake, and a wrong gradient does not crash — it just " +
      "trains badly, slowly, in a way that looks like a bad hyperparameter. So you check it " +
      "numerically. Perturb one parameter by a tiny ε, re-run the forward pass twice, and " +
      "take the central difference:" }));

    host.appendChild(NN.formula({
      rule: "dL/dθᵢ &nbsp;≈&nbsp; ( L(θ + ε·eᵢ) − L(θ − ε·eᵢ) ) / 2ε",
      cls: "gradient"
    }));

    host.appendChild(el("p", { html:
      "That costs two full forward passes <i>per parameter</i> — " + (2 * NPARAM) +
      " forward passes for this " + NPARAM + "-parameter model, and about 10<sup>11</sup> for " +
      "a 70B model, which is why it is a correctness test and never a training method. " +
      "Backprop gets all " + NPARAM + " in one backward pass. Here is the comparison." }));

    const rows = T.param_names.map(function (name, k) {
      const a = GC.analytic[k], n = GC.numerical[k];
      return { name: name, a: a, n: n, d: Math.abs(a - n), dead: a === 0 };
    });
    const nPass = rows.filter(function (r) { return r.d <= TOL; }).length;

    const rep = el("div", { class: "report" });
    rep.appendChild(el("div", { class: "rhead" }, [
      el("span", { class: "badge " + (GC.passed ? "pass" : "fail") }, GC.passed ? "PASS" : "FAIL"),
      el("span", {}, "gradcheck · analytic vs central-difference"),
      el("span", { class: "muted" }, nPass + " / " + rows.length + " within " + TOL.toExponential(0)),
      el("span", { class: "muted", style: { marginLeft: "auto" } },
        "max |error| = " + GC.max_abs_error.toExponential(3))
    ]));

    const tbl = el("table", { class: "data" });
    const thead = el("thead", {}, el("tr", {}, [
      el("th", {}, "parameter"),
      el("th", {}, "analytic (backprop)"),
      el("th", {}, "numerical (finite diff)"),
      el("th", {}, "|difference|"),
      el("th", {}, "result")
    ]));
    const tbody = el("tbody", {});
    rows.forEach(function (r) {
      const ok = r.d <= TOL;
      tbody.appendChild(el("tr", { class: r.dead ? "deadparam" : null }, [
        el("td", {}, r.name),
        el("td", { class: "n v-gradient" }, FS(r.a, 6)),
        el("td", { class: "n" }, FS(r.n, 6)),
        el("td", { class: "n muted" }, r.d === 0 ? "0" : r.d.toExponential(2)),
        el("td", { class: "n " + (ok ? "ok" : "") }, ok ? "✓ ok" : "✗ FAIL")
      ]));
    });
    tbl.appendChild(thead); tbl.appendChild(tbody);
    rep.appendChild(el("div", { class: "rbody" }, tbl));
    host.appendChild(rep);

    host.appendChild(NN.tiles([
      { k: "parameters checked", v: String(rows.length), s: "T.param_names" },
      { k: "max abs error", v: GC.max_abs_error.toExponential(2), s: "T.gradcheck.max_abs_error", cls: "gradient" },
      { k: "tolerance", v: TOL.toExponential(0), s: "typical fp64 gradcheck bar" },
      { k: "verdict", v: GC.passed ? "PASS" : "FAIL", s: "T.gradcheck.passed" },
      { k: "exact zeros", v: String(rows.filter(function (r) { return r.a === 0; }).length),
        s: "all from the dead unit", cls: "gradient" }
    ]));

    host.appendChild(el("p", { class: "small muted", html:
      "The residual error, <span class='mono'>" + GC.max_abs_error.toExponential(3) +
      "</span>, is not a flaw in the derivation. It is the finite-difference side being " +
      "wrong: the numerator subtracts two nearly-equal fp64 numbers and then divides by a " +
      "small ε, so it loses precision. The analytic column is the exact one. " +
      "Note the dead unit's four parameters agree at exactly zero from both directions — " +
      "the numerical check confirms that perturbing them really does not move the loss at " +
      "all, because a small nudge to <span class='mono'>W1[" + DEAD + "]</span> leaves " +
      "<span class='mono'>z1[" + DEAD + "]</span> still negative and " +
      "<span class='mono'>a1[" + DEAD + "]</span> still zero." }));

    host.appendChild(NN.callout("key", "Gradcheck in a real framework",
      "You do not usually write this loop yourself — <span class='mono'>torch.autograd." +
      "gradcheck</span> does it, and it is standard practice to run it on any custom " +
      "<span class='mono'>autograd.Function</span> before trusting it. Two rules carry over " +
      "from this table: run it in <b>float64</b>, because in float32 the finite-difference " +
      "noise swamps the signal and everything looks broken; and be suspicious of exact zeros " +
      "on both sides, because a bug that returns zero and a genuinely-zero gradient are " +
      "indistinguishable in this test. Here the zeros were explained independently — they " +
      "are the ReLU mask — which is what makes them believable."));
  })();

  NN.page('backward');
})();
</script>
</body>
</html>
