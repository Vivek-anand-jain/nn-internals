  }
});

/* --------------------------------------------- gradcheck: the report */
S({
  chapter: "Backward · the gradient check",
  plain: "Gradient check: " + (T.gradcheck.passed ? "PASS" : "FAIL") +
         ", max |error| = " + T.gradcheck.max_abs_error.toExponential(3),
  notes: "The report, all " + NPARAM + " parameters, analytic against " +
    "central difference. Max absolute disagreement " +
    T.gradcheck.max_abs_error.toExponential(3) + " — and the residual is the " +
    "FINITE-DIFFERENCE side being wrong, not the derivation: the numerator " +
    "subtracts two nearly-equal doubles and then divides by a small epsilon, " +
    "so it loses precision. The analytic column is the exact one. Point at " +
    "the highlighted rows: the dead unit's parameters agree at exactly zero " +
    "from both directions, so the numerical check independently confirms " +
    "that nudging them really does not move the loss at all.",
  build: function () {
    const GC = T.gradcheck, TOL = 1e-6;
    const rows = T.param_names.map(function (name, k) {
      const a = GC.analytic[k], nv = GC.numerical[k];
      return { name: name, a: a, n: nv, dif: Math.abs(a - nv), dead: a === 0 };
    });
    const nPass = rows.filter(function (r) { return r.dif <= TOL; }).length;
    const half = Math.ceil(rows.length / 2);
    const tbl = function (list) {
      return el("table", { class: "data" }, [
        el("thead", {}, el("tr", {}, [
          el("th", { style: { textAlign: "left" } }, "parameter"),
          el("th", {}, "analytic"), el("th", {}, "numerical"),
          el("th", {}, "|Δ|"), el("th", {}, "")])),
        el("tbody", {}, list.map(function (r) {
          const ok = r.dif <= TOL;
          return el("tr", { class: r.dead ? "deadparam" : null }, [
            el("td", { class: "mono" }, r.name),
            el("td", { class: "n v-gradient" }, fS(r.a, 4)),
            el("td", { class: "n" }, fS(r.n, 4)),
            el("td", { class: "n muted" }, r.dif === 0 ? "0" : r.dif.toExponential(1)),
            el("td", { class: "n " + (ok ? "ok" : "") }, ok ? "✓" : "✗")
          ]);
        }))
      ]);
    };
    return [
      kicker("Backward · <b>the gradient check</b>"),
      d("rowflex", [
        el("h2", { class: "stitle sm", style: { margin: "0" },
          html: "Analytic vs finite difference, all " + NPARAM + " parameters" }),
        h("badge " + (GC.passed ? "pass" : "fail"), GC.passed ? "pass" : "fail"),
        h("small muted", nPass + " / " + rows.length + " within " +
          TOL.toExponential(0) + " &nbsp;·&nbsp; max |error| = " +
          GC.max_abs_error.toExponential(3) + " &nbsp;·&nbsp; " +
          "<span class='mono'>T.gradcheck</span>")
      ]),
      gap(8),
      frag(el("div", { class: "cols", style: { alignItems: "flex-start" } },
        [tbl(rows.slice(0, half)), tbl(rows.slice(half))]), "f-fade"),
      frag(d("cols", [
        NN.tiles([
          { k: "parameters checked", v: String(rows.length), s: "T.param_names" },
          { k: "max abs error", v: GC.max_abs_error.toExponential(2),
            s: "T.gradcheck", cls: "gradient" },
          { k: "verdict", v: GC.passed ? "PASS" : "FAIL", s: "T.gradcheck.passed" }
        ]),
        NN.callout("why", "The residual is the CHECK's error, not the derivation's",
          "<span class='mono'>" + GC.max_abs_error.toExponential(3) + "</span> is " +
          "the finite-difference side losing precision: it subtracts two " +
          "nearly-equal doubles and divides by a small ε. The analytic column " +
          "is the exact one. Note the " +
          rows.filter(function (r) { return r.dead; }).length +
          " highlighted rows — the dead unit's parameters agree at exactly " +
          "zero from both directions, which is an independent confirmation " +
          "that nudging them does not move the loss at all.")
      ]), "f-fade")
    ];
  }
});

/* ------------------------------------------------------- memory doubles */
S({

        "Backward also holds " + N_GNODE + " elements (" + B_GNODE + " B) of " +

        "<span class='mono'>dL/dz1</span> — which are freed as soon as the " +
        "chain rule has moved past them. Only the " + N_G +
        " parameter gradients survive to the optimizer step.")),
      frag(NN.callout("mem", "And the gradient is short-lived",
        "Gradients are born in the backward pass and are dead the instant the " +

SEP("optimizer");

/* ==================================================== optimizer helpers */
function chunkRows(flat, cols) {
  const out = [];
  for (let i = 0; i < flat.length; i += cols) out.push(flat.slice(i, i + cols));
  return out;
}
function unpack(vec) {
  let k = 0; const out = {};
  T.param_layout.forEach(function (p) {
    const n = p.shape.reduce(function (a, b) { return a * b; }, 1);
    const flat = vec.slice(k, k + n); k += n;
    out[p.name] = p.shape.length === 2 ? chunkRows(flat, p.shape[1]) : flat;
  });
  return out;
}
const SGD0 = T.runs.sgd.history[0];
const MOM0 = T.runs.momentum.history[0], MOM1 = T.runs.momentum.history[1];
const ADA0 = T.runs.adam.history[0];
const lossPts = function (run) {
  return T.runs[run].history.map(function (r) { return [r.t, r.loss]; });
};

/* ---------------------------------------------------------- SGD update */
S({
  chapter: "Optimizer · SGD", plain: "SGD: θ ← θ − lr · g",
  notes: "The simplest possible optimizer, and the arithmetic is one line. " +
    "Take W1[0][0]: it was " + f(SGD0.theta[0], 2) + ", its gradient is " +
    fS(SGD0.grad[0], 3) + ", the learning rate is " + HP.lr + ", so it moves to " +
    f(SGD0.theta_after[0], 4) + ". Note the minus sign: the gradient points " +
    "uphill, we want to go downhill. Note also that the two dead-unit weights " +
    "do not move at all.",
  build: function (ctx) {
    const before = unpack(SGD0.theta), after = unpack(SGD0.theta_after);
    ctx.bt = tn({ name: "W1 (before)", shape: [3, 2], values: before.W1, cls: "weight", digits: 3 });
    ctx.gt = tn({ name: "dL/dW1", shape: [3, 2], values: T.backward.dL_dW1,
                  cls: "gradient", digits: 3, signed: true });
    ctx.at = tn({ name: "W1 (after)", shape: [3, 2], values: after.W1, cls: "weight", digits: 3 });
    return [
      kicker("Optimizer · stochastic gradient descent"),
      title("<span class='mono'>θ ← θ − " + HP.lr + " × g</span>", true),
      frag(d("rowflex top", [ctx.bt, h("ar", "−  lr ×"), ctx.gt, h("ar", "="), ctx.at]), "f-fade"),
      frag(d("cols", [
        NN.formula({ rule: "W1[0][0]",
          sub: W(SGD0.theta[0], 2) + " − " + HP.lr + " × " + G(SGD0.grad[0], 4),
          result: f(SGD0.theta_after[0], 4), cls: "weight" }),
        NN.formula({ rule: "W1[2][0]  (the dead unit)",
          sub: W(SGD0.theta[4], 2) + " − " + HP.lr + " × " + G(SGD0.grad[4], 1),
          result: f(SGD0.theta_after[4], 4), cls: "weight" })
      ]), "f-fade"),
      frag(d("cols", [
        NN.callout("why", "Why minus",
          "The gradient points in the direction of steepest <em>increase</em> " +
          "of the loss. We want a decrease, so we step against it. The learning " +
          "rate " + O(HP.lr, 2) + " decides how far — too small and nothing " +
          "happens, too large and you overshoot the valley."),
        NN.callout("mem", "Memory cost of SGD: zero extra",
          "Plain SGD keeps no state between steps. Weights " + BY(B_W) +
          " and gradients " + BY(B_G) + " and nothing else — " + R_SGD.bytes_per_param +
          " bytes per parameter in fp32 (" + R_SGD.name + "). Every optimizer " +
          "after this one spends memory to make the update <em>smarter</em>; " +
          "whether that also makes it faster depends on the problem, and on " +
          "this " + NPARAM + "-parameter one it does not.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const hot = n >= 2 ? [[0, 0]] : null;
    ctx.bt.highlight(hot, false); ctx.gt.highlight(hot, false); ctx.at.highlight(hot, false);
  }
});

/* ----------------------------------------------------------- momentum */
S({
  chapter: "Optimizer · momentum", plain: "Momentum: one extra tensor, remembers direction",
  notes: "Momentum keeps a running average of past gradients — a velocity — " +
    "and steps along that instead of the raw gradient. On step 1 the velocity " +
    "is just the gradient. By step 2 it already carries " + HP.beta1 +
    " of the first step forward, which is why it accelerates down long shallow " +
    "valleys and damps oscillation across narrow ones. The cost is one more " +
    "tensor the same size as the parameters: " + R_MOM.bytes_per_param + " bytes per " +
    "parameter in fp32 instead of " + R_SGD.bytes_per_param + ".",
  build: function () {
    const chart = NN.chart.line({
      series: [
        { name: "SGD", color: "var(--accent)", points: lossPts("sgd") },
        { name: "momentum", color: "var(--warning)", points: lossPts("momentum") }
      ],
      width: 560, height: 240, xlabel: "step", ylabel: "loss"
    });
    return [
      kicker("Optimizer · momentum"),
      title("Remember where you were going", true),
      d("cols", [
        d("stack", [
          frag(NN.formula({ rule: "v ← β·v + g",
            sub: "β = " + HP.beta1 + ", v starts at 0", cls: "optimizer" }), "f-left"),
          frag(NN.formula({ rule: "θ ← θ − lr·v", cls: "optimizer" }), "f-left"),
          frag(d("panel o", [ph("velocity for W1[0][0]"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [el("th", {}, "step"), el("th", {}, "g"),
                el("th", {}, "v"), el("th", {}, "θ after")])),
              el("tbody", {}, [MOM0, MOM1].map(function (r) {
                return el("tr", {}, [
                  el("td", {}, "t = " + r.t),
                  el("td", { class: "n v-gradient" }, fS(r.grad[0], 3)),
                  el("td", { class: "n v-optimizer" }, fS(r.velocity[0], 3)),
                  el("td", { class: "n v-weight" }, f(r.theta_after[0], 3))
                ]);
              }))
            ])]), "f-left")
        ]),
        d("stack", [
          frag(d("panel acc", [ph("loss over " + HP.n_steps + " steps"), chart,
            chartKey([{ name: "SGD", color: "var(--accent)" },
                      { name: "momentum", color: "var(--warning)" }])]), "f-right"),
          frag(NN.callout("mem", "One extra tensor, forever",
            "The velocity is the same shape as the parameters and lives for the " +
            "whole run — it is <em>optimizer state</em>, our fourth tensor class. " +
            "<span class='mono'>" + R_MOM.name + "</span> costs " +
            R_MOM.bytes_per_param + " bytes per parameter: " +
            R_MOM.components.weight + " weights + " + R_MOM.components.gradient +
            " gradients + " + R_MOM.components.optimizer + " velocity."), "f-right")
        ])
      ])
    ];
  }
});

/* ------------------------------------------------------------ Adam m,v */
S({
  chapter: "Optimizer · Adam", plain: "Adam keeps two state tensors: m and v",
  notes: "Adam keeps two running averages per parameter: m, the mean of the " +
    "gradient, and v, the mean of the gradient squared. Dividing m by the root " +

/* ================================================== lifetimes & phases */
/* The schedule is not authored here: T.memory.timeline lists what each
   phase allocates and frees, and the generator simulates and asserts it.
   We replay the same alloc/free list to get the per-class split, and we
   plot T.memory.timeline_bytes_fp32 for the curve itself. */
const TL     = MEM.timeline;
const CURVE  = MEM.timeline_bytes_fp32;
const FLOOR  = MEM.floor_bytes_fp32;
const PEAK_B = MEM.peak_bytes_fp32;
const PEAK_I = MEM.peak_phase;
const ACT_PEAK_I = (function () {
  for (let i = 0; i < TL.length; i++) if (TL[i].peak_activations) return i;
  return -1;
})();
const TBYNAME = {};
PT.forEach(function (t) { TBYNAME[t.name] = t; });

/* replay alloc/free to get the resident set at every phase */
const RESIDENT = (function () {
  const live = {};
  PT.forEach(function (t) {
    if (t.cls === "weight" || t.cls === "optimizer") live[t.name] = true;
  });
  return TL.map(function (p) {
    (p.alloc || []).forEach(function (n) { live[n] = true; });
    (p.free  || []).forEach(function (n) { delete live[n]; });
    return Object.keys(live);
  });
})();
function residentBytes(i, cls) {
  return RESIDENT[i].reduce(function (a, n) {
    const t = TBYNAME[n];
    if (!t || (cls && t.cls !== cls)) return a;
    return a + t.elements * FP32B;
  }, 0);
}
/* self-check: our replay must reproduce the curve the generator asserted */
RESIDENT.forEach(function (_, i) {
  if (residentBytes(i) !== CURVE[i]) {
    console.warn("nn-internals slides: phase " + i + " replay " +
                 residentBytes(i) + " != trace " + CURVE[i]);
  }
});
function phaseSegs(i) {
  return ["weight", "optimizer", "activation", "gradient"].map(function (c) {
    return { cls: c, bytes: residentBytes(i, c), label: c };
  }).filter(function (s) { return s.bytes > 0; });
}

    "the backward pass until the optimizer consumes them. Note the gradient " +
    "card: " + N_G + " of its " + BYCLS.gradient.elements + " elements are " +

      ]), "f-fade")
    ];
  }
});

/*  SHARED TRANSFORMER HELPERS                                              */
/*  window.TFORMER (assets/data/transformer.js, generated by                 */
/*  code/transformer_block.py) plus the two grid helpers every transformer   */
/*  run in the deck uses. They sit here, ahead of the first of those runs,   */

/* ======================================================================== */

const XMETA = XF ? XF.meta : null;
const XACT  = XF ? XF.activations : null;
const XPAR  = XF ? XF.params : null;

/* small helpers used only by this half of the deck ---------------------- */
function grid2(rows, cols, fn) {
  const out = [];
  for (let i = 0; i < rows; i++) {
    out.push([]);
    for (let j = 0; j < cols; j++) out[i].push(fn(i, j));
  }
  return out;
}
function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }

/**
 * A heat grid: rows x cols of coloured cells, repainted by .paint(matrix).
 * A null entry renders as a hatched "masked" cell — colour is never the only
 * signal, the cell also carries the text -inf and a title attribute.
 */
function heatGrid(o) {
  const nr = o.rows, nc = o.cols, cw = o.cell || 62;
  const g = el("div", { class: "heat",
    style: { gridTemplateColumns: "56px repeat(" + nc + ", " + cw + "px)" } });
  g.appendChild(el("div", { class: "hlab" }, ""));
  for (let j = 0; j < nc; j++) {
    g.appendChild(el("div", { class: "hlab" }, o.colLab ? o.colLab[j] : "k" + j));
  }
  const cells = [];
  for (let i = 0; i < nr; i++) {
    g.appendChild(el("div", { class: "hlab rw" }, o.rowLab ? o.rowLab[i] : "q" + i));
    cells.push([]);
    for (let j = 0; j < nc; j++) {
      const c = el("div", { class: "hcell" }, "");
      g.appendChild(c); cells[i].push(c);
    }
  }
  const root = el("div", { class: "heatwrap" }, [
    o.caption ? h("ph", o.caption) : null, g ]);
  root.paint = function (m, opt) {
    opt = opt || {};
    const col = opt.color || "var(--accent)";
    let mx = opt.max;
    if (mx === undefined) {
      mx = 0;
      m.forEach(function (r) { r.forEach(function (v) {
        if (v !== null && v !== undefined) mx = Math.max(mx, Math.abs(v)); }); });
    }
    if (!mx) mx = 1;
    for (let i = 0; i < nr; i++) for (let j = 0; j < nc; j++) {
      const v = m[i] && m[i][j] !== undefined ? m[i][j] : null;
      const c = cells[i][j];
      if (v === null) {
        c.className = "hcell masked";
        c.textContent = opt.maskText || "−∞";
        c.style.background = "";
        c.title = "masked — query " + i + " may not read key " + j;
      } else {
        c.className = "hcell" + (opt.hot && opt.hot(i, j) ? " hot" : "");
        c.textContent = f(v, opt.digits === undefined ? 2 : opt.digits);
        c.style.background = "color-mix(in srgb, " + col + " " +
          Math.round(Math.min(1, Math.abs(v) / mx) * 74) + "%, transparent)";
        c.title = "[" + i + "][" + j + "] = " + v;
      }
    }
  };
  root.cells = cells;
  return root;
}

const F2 = window.TF2 || null;

/* The accessors and the pure helpers below are declared at deck scope rather
   than inside the `if (F2)` guard, because three separate runs of slides use
   them — the transformer forward, the transformer backward, and the
   partitioning section inside Part III — and those runs are no longer
   contiguous. Every one is null-safe, so a missing tf2.js still costs only
   the slides that are skipped by the guard. */
const M2    = F2 ? F2.meta : {};
const TOK   = M2.tokens || [];

const SQ    = M2.seq,     DFF = M2.d_ff,   NL = M2.n_layers;
const TW    = M2.world;                 /* TF2's own world size, 2          */

const FL    = F2 ? F2.forward.layers : [];
const PRM   = F2 ? F2.params : {};

function bstep(L, id) {
  return BST.filter(function (s) { return s.layer === L && s.id === id; })[0];
}
function partOf(key) {
  return PART.filter(function (p) { return p.key === key; })[0];
}
function tokLab(i) { return TOK[i]; }
function tokRow(i) { return "t" + i + " “" + TOK[i] + "”"; }

/* ---- matrix helpers. Everything here is a DERIVATION from what TF2 ships,
   and every derivation below is checked against a shipped tensor. -------- */
function mcols(M, a, b) { return M.map(function (r) { return r.slice(a, b); }); }
function mT(M) {
  return M[0].map(function (_, j) { return M.map(function (r) { return r[j]; }); });
}
function mmul(A, B) {
  return A.map(function (r) {
    return B[0].map(function (_, j) {
      let s = 0;
      for (let t = 0; t < B.length; t++) s += r[t] * B[t][j];
      return s;
    });
  });
}
function madd(A, B) {
  return A.map(function (r, i) { return r.map(function (v, j) { return v + B[i][j]; }); });
}
function mscale(A, k) { return A.map(function (r) { return r.map(function (v) { return v * k; }); }); }
function mflat(M) { return [].concat.apply([], M); }
function maxdiff2(A, B) {
  const a = mflat(A), b = mflat(B);
  let e = 0;
  for (let i = 0; i < a.length; i++) e = Math.max(e, Math.abs(a[i] - b[i]));
  return e;
}
function mrow(v) { return [v]; }

/* GELU, tanh approximation — the function transformer_2layer.py actually
   uses. Re-implemented rather than quoted, then checked against the
   activations TF2 shipped. */
const C_GELU = Math.sqrt(2 / Math.PI);
function gelu(x) {
  return 0.5 * x * (1 + Math.tanh(C_GELU * (x + 0.044715 * x * x * x)));
}
function dgelu(x) {
  const t = Math.tanh(C_GELU * (x + 0.044715 * x * x * x));
  return 0.5 * (1 + t) + 0.5 * x * (1 - t * t) * C_GELU * (1 + 3 * 0.044715 * x * x);
}

/* ---- the backward quantities TF2 does not ship, derived and checked ---- */
function mlpBack(L) {
  const lc = FL[L];
  const dD  = bstep(L, "resid2").value;                    /* h2 = h1 + D   */
  const dW2 = mmul(mT(lc.mlp.G), dD);
  const dG  = mmul(dD, mT(PRM["L" + L + ".W2"]));
  const dU  = dG.map(function (r, i) {
    return r.map(function (v, j) { return v * dgelu(lc.mlp.U[i][j]); });
  });
  const dW1 = mmul(mT(lc.mlp.input), dU);
  const dn2 = mmul(dU, mT(PRM["L" + L + ".W1"]));
  return { dD: dD, dG: dG, dU: dU, dW1: dW1, dW2: dW2, dn2: dn2 };
}
function attnBack(L) {
  const lc = FL[L];
  /* dh1 = the residual-2 skip copy + what LayerNorm 2 sent back */
  const dA  = madd(bstep(L, "resid2").value, bstep(L, "ln2").value);
  const dWo = mmul(mT(lc.concat), dA);
  const dO  = mmul(dA, mT(PRM["L" + L + ".Wo"]));
  return { dA: dA, dWo: dWo, dO: dO };
}
function qkvBack(L) {
  const st = bstep(L, "attn");
  const hs = st.heads;
  /* TF2 ships dQ, dK and dV at full d_model width; we also reassemble them
     from the per-head slices and check the two agree. */
  const cat = function (key) {
    return grid2(SQ, DM, function (i, j) { return hs[Math.floor(j / DH)][key][i][j % DH]; });
  };
  const dQ = st.dQ || cat("dQ"), dK = st.dK || cat("dK"), dV = st.dV || cat("dV");
  const e = Math.max(maxdiff2(dQ, cat("dQ")), maxdiff2(dK, cat("dK")),
                     maxdiff2(dV, cat("dV")));
  if (e > 1e-15) {
    console.warn("nn-internals slides: TF2's full-width dQ/dK/dV disagree with the " +
                 "per-head slices by " + e);
  }
  const n1 = FL[L].qkv.input;
  const fromQ = mmul(dQ, mT(PRM["L" + L + ".Wq"]));
  const fromK = mmul(dK, mT(PRM["L" + L + ".Wk"]));
  const fromV = mmul(dV, mT(PRM["L" + L + ".Wv"]));
  return {
    dQ: dQ, dK: dK, dV: dV,
    dWq: mmul(mT(n1), dQ), dWk: mmul(mT(n1), dK), dWv: mmul(mT(n1), dV),
    fromQ: fromQ, fromK: fromK, fromV: fromV,
    dn1: madd(madd(fromQ, fromK), fromV)
  };
}

/* the dense softmax Jacobian of one row */
function softJac(p) {
  return grid2(p.length, p.length, function (i, j) {
    return p[i] * ((i === j ? 1 : 0) - p[j]);
  });
}

function am(name, v, note, dig)  { return mt({ name: name, v: v, cls: "activation", note: note, dig: dig === undefined ? 3 : dig }); }

function streamNote() { return TOK.map(function (t) { return "“" + t + "”"; }).join(" · "); }

/**
 * The flat parameter buffer drawn to scale from TF2.flat_sharding.layout,
 * with a block band above it and shard boundaries drawn on top.
 *   .setWorld(w)  re-draws the boundaries for world size w (a key of by_world)
 *   .mark(k)      lights shard k and names every tensor it touches
 * Boundaries that fall strictly inside a tensor are drawn solid and red;
 * boundaries that land on a tensor edge are drawn dashed and neutral, so
 * "cuts a matrix" is legible without relying on colour.
 */
function flatBuf(o) {
  const segs = o.segs;
  const total = segs.reduce(function (a, s) { return a + s.n; }, 0);
  const Wd = 1060, bh = 44, y0 = 58, Ht = y0 + bh + 32;
  const s = SV("svg", { viewBox: "0 0 " + Wd + " " + Ht, width: "100%",
                        height: Ht, class: "collsvg", role: "img" });
  const X = function (i) { return 8 + (Wd - 16) * i / total; };
  const marks = [];
  let acc = 0;
  segs.forEach(function (sg) {
    const x0 = X(acc), x1 = X(acc + sg.n);
    s.appendChild(SV("rect", { x: x0, y: y0, width: Math.max(1.5, x1 - x0), height: bh,
      rx: 3, fill: "var(--weight-w)", stroke: "var(--weight)", "stroke-width": 1 }));
    if (x1 - x0 > 34) {
      const t1 = SV("text", { x: (x0 + x1) / 2, y: y0 + 19, "text-anchor": "middle",
        "font-size": 11, "font-family": "var(--mono)", fill: "var(--ink-2)" });
      t1.textContent = sg.name; s.appendChild(t1);
      const t2 = SV("text", { x: (x0 + x1) / 2, y: y0 + 34, "text-anchor": "middle",
        "font-size": 10, "font-family": "var(--mono)", fill: "var(--ink-muted)" });
      t2.textContent = sg.n; s.appendChild(t2);
    }
    marks.push({ a: acc, b: acc + sg.n, name: sg.name });
    acc += sg.n;
  });
  /* the block band */
  (o.groups || []).forEach(function (g) {
    s.appendChild(SV("line", { x1: X(g.a) + 2, y1: y0 - 11, x2: X(g.b) - 2, y2: y0 - 11,
      stroke: "var(--accent)", "stroke-width": 3, "stroke-linecap": "round" }));
    const t = SV("text", { x: (X(g.a) + X(g.b)) / 2, y: y0 - 17, "text-anchor": "middle",
      "font-size": 11, "font-family": "var(--mono)", fill: "var(--accent)" });
    t.textContent = g.name; s.appendChild(t);
  });
  const lines = SV("g", {}); s.appendChild(lines);
  const ov = SV("g", {}); s.appendChild(ov);
  const cap = SV("text", { x: 8, y: 18, "font-size": 12.5, "font-family": "var(--mono)",
                           fill: "var(--ink-muted)" });
  s.appendChild(cap);

  let per = o.shardSize || total, N = o.shards || 1;
  s.setWorld = function (n, shardSize) {
    N = n; per = shardSize;
    while (lines.firstChild) lines.removeChild(lines.firstChild);
    for (let k = 1; k < N; k++) {
      const at = Math.min(total, k * per);
      const inside = marks.some(function (m) { return at > m.a && at < m.b; });
      lines.appendChild(SV("line", { x1: X(at), y1: y0 - 6, x2: X(at), y2: y0 + bh + 8,
        stroke: inside ? "var(--critical)" : "var(--ink-muted)",
        "stroke-width": inside ? 3 : 1.6,
        "stroke-dasharray": inside ? null : "4 4" }));
      if (inside) {
        const t = SV("text", { x: X(at), y: y0 + bh + 22, "text-anchor": "middle",
          "font-size": 10, "font-family": "var(--mono)", fill: "var(--critical)" });
        t.textContent = "cuts"; lines.appendChild(t);
      }
    }
  };
  s.mark = function (k) {
    while (ov.firstChild) ov.removeChild(ov.firstChild);
    if (k === null || k === undefined || k < 0) {
      cap.textContent = o.caption || (total + " elements · " + N + " shards of " + per);
      return;
    }
    const a = k * per, b = Math.min(total, (k + 1) * per);
    ov.appendChild(SV("rect", { x: X(a), y: y0 - 5, width: X(b) - X(a), height: bh + 10,
      rx: 5, fill: "color-mix(in srgb, var(--optimizer) 24%, transparent)",
      stroke: "var(--optimizer)", "stroke-width": 2.2 }));
    const hit = marks.filter(function (m) { return m.a < b && m.b > a; });
    cap.textContent = "GPU " + k + " owns elements " + a + "–" + (b - 1) + " · " +
      hit.map(function (m) {
        return (m.a >= a && m.b <= b) ? m.name
             : m.name + "[" + Math.max(0, a - m.a) + ":" + Math.min(m.b - m.a, b - m.a) + "]";
      }).join(" ");
  };
  s.setWorld(N, per);
  s.mark(null);
  return s;
}

            "Token 0's mean is " + A(rows[0].mu, 4) + "; token 1's is " +
            A(rows[1].mu, 4) + ". Nothing is shared. Delete a token and the " +
            "others are bit-identical. That is why a transformer's forward " +
            "pass is a function of <em>this sequence</em> and not of whatever " +
            "else happened to be in the batch."), "f-right"),

            "BatchNorm would take the mean of channel 0 <em>over the batch</em>. " +
            "That makes the forward pass depend on the other examples, needs " +
            "running statistics at inference, and is undefined when generating " +
            "one token at a time. Every one of those failures is fatal for a " +

  },
  render: function (n, ctx) {

/* --------------------------------------- T3. LayerNorm worked, one token */
S({
  chapter: "Forward L0 · LayerNorm 1",
  plain: "One token, all five steps: μ, var, 1/√(var+ε), xhat, gain·xhat+bias",
  notes: "Now the arithmetic, completely, for token 0. Its four channels are " +
    FL[0].ln1.rows[0].x.map(function (v) { return f(v, 3); }).join(", ") +
    ". The mean is " + f(FL[0].ln1.rows[0].mu, 5) + ". The variance — the " +
    "biased one, dividing by d and not d−1, exactly as PyTorch does — is " +
    f(FL[0].ln1.rows[0].var, 5) + ". The reciprocal standard deviation is " +
    f(FL[0].ln1.rows[0].inv_std, 5) + ", and note that we store the " +
    "reciprocal, not the standard deviation, because backward wants to " +
    "multiply rather than divide. Subtract the mean, multiply by that, and " +
    "you get xhat, which has mean zero and unit variance by construction. " +
    "Then the learned gain and bias put a controllable scale and offset back: " +
    "without them the layer could only ever emit unit-variance rows, which " +
    "would be a real loss of expressiveness. Step the build and watch the row " +
    "transform in place. The epsilon of " + M2.eps + " is load-bearing: a " +
    "token whose channels are all equal has variance exactly zero.",
  build: function (ctx) {
    const r = FL[0].ln1.rows[0];
    const g = PRM["L0.ln1.g"], b = PRM["L0.ln1.b"];
    ctx.r = r;
    ctx.row = am("token 0 · “" + TOK[0] + "”", [r.x], "", 4);
    ctx.lab = h("phaselabel", "");
    ctx.stages = [
      { l: "raw channels of token 0", v: r.x },
      { l: "− μ  (" + f(r.mu, 5) + ")",
        v: r.x.map(function (v) { return v - r.mu; }) },
      { l: "× 1/√(var+ε)  (" + f(r.inv_std, 5) + ")  →  xhat", v: r.xhat },
      { l: "× gain + bias  →  LN1 output", v: r.y }
    ];
    return [
      kicker("Forward · block 0 · LayerNorm 1 · worked"),
      title("Five steps on one row, with every intermediate", true),
      d("cols wide-r", [
        d("stack", [
          frag(d("panel a", [ctx.lab, ctx.row]), "f-fade"),
          frag(d("rowflex top", [
            wm("gain g", [g], "learned", 4),
            wm("bias b", [b], "learned", 4)
          ]), "f-fade")
        ]),
        d("stack", [
          frag(NN.formula({ rule: "μ = (1/d) Σ xⱼ",
            sub: "(" + r.x.map(function (v) { return f(v, 3); }).join(" + ") + ") ÷ " + DM,
            result: f(r.mu, 6), cls: "activation" }), "f-right"),
          frag(NN.formula({ rule: "var = (1/d) Σ (xⱼ − μ)²",
            sub: "biased — divide by d, not d−1, as PyTorch does",
            result: f(r.var, 6), cls: "activation" }), "f-right"),
          frag(NN.formula({ rule: "inv_std = 1/√(var + ε)",
            sub: "1 / √(" + f(r.var, 5) + " + " + M2.eps + ")",
            result: f(r.inv_std, 6), cls: "activation" }), "f-right"),
          frag(NN.formula({ rule: "xhatⱼ = (xⱼ − μ) · inv_std",
            sub: "channel 0: (" + f(r.x[0], 3) + " − " + f(r.mu, 4) + ") × " +
                 f(r.inv_std, 4),
            result: f(r.xhat[0], 6), cls: "activation" }), "f-right"),
          frag(NN.formula({ rule: "yⱼ = gⱼ · xhatⱼ + bⱼ",
            sub: W(g[0], 4) + " × " + A(r.xhat[0], 4) + " + " + W(b[0], 4),
            result: f(r.y[0], 6), cls: "activation" }), "f-right")
        ])
      ]),
      frag(d("cols", [
        NN.callout("key", "ε is not decoration",
          "A token whose " + DM + " channels are all equal has variance exactly " +
          "zero. Without <span class='mono'>ε = " + M2.eps + "</span> that " +
          "is a division by zero and the entire step becomes NaN. It happens — " +
          "padding rows, dead channels, an over-aggressive clamp."),
        NN.callout("why", "Why gain and bias exist at all",
          "Normalising forces every row to mean 0 and variance 1. That is a " +
          "strong constraint, and it would cost the model the ability to say " +
          "“this channel matters more”. The learned " +
          "<span class='mono'>g</span> and <span class='mono'>b</span> hand " +
          "that back, at a cost of " + (2 * DM) + " parameters per norm.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const k = NN.clamp(n, 0, ctx.stages.length - 1);
    ctx.row.update([ctx.stages[k].v]);
    ctx.lab.textContent = ctx.stages[k].l;
  }
});

/* ------------------------------------------- T4. LN1 output, all tokens */
S({
  chapter: "Forward L0 · LayerNorm 1",

    "The stream itself will only change when something is ADDED to it, twelve " +
    "slides from now. That is what 'pre-LN' means — normalise on the way into " +
    "the branch, not on the way out of the block — and it is the placement " +
    "that made very deep transformers trainable without a warmup that has to " +

});

/* ------------------------------------------------------ T5. W_q, W_k, W_v */
S({
  chapter: "Forward L0 · Q K V",
  plain: "Three " + DM + "×" + DM + " matrices reading the same input",
  notes: "Attention begins by projecting the normalised stream three times. " +

    "backward pass: because Q, K and V all read " +
    "<span class='mono'>LN1(h)</span>, their three input-gradients have to be " +
    "ADDED together on the way back. One saved tensor, three consumers. The " +
    "names carry the intuition: the query is what a token is looking for, the " +
    "key is what it advertises, the value is what it will actually contribute " +
    "if it gets selected. There is nothing mystical in the arithmetic — each " +
    "is a plain matrix product, " + SQ + "×" + DM + " times " +
    DM + "×" + DM + ". Note the shapes: because W is (d_in, d_out) in " +
    "this convention, a COLUMN of W_q is one output feature.",
  build: function (ctx) {
    return [
      kicker("Forward · block 0 · the projections"),
      title("One input. Three matrices. Three meanings.", true),

        am("LN1(h)", FL[0].qkv.input, "read by all three", 3)]), "f-fade"),
      frag(d("rowflex top", [
        wm("W_q", PRM["L0.Wq"], DM + "×" + DM, 3),
        wm("W_k", PRM["L0.Wk"], DM + "×" + DM, 3),
        wm("W_v", PRM["L0.Wv"], DM + "×" + DM, 3)
      ]), "f-pop"),
      frag(d("rowflex top", [
        am("Q = LN1(h)·W_q", FL[0].qkv.Q, "what I am looking for", 3),

        am("V = LN1(h)·W_v", FL[0].qkv.V, "what I contribute", 3)
      ]), "f-pop"),
      frag(d("cols", [

          "One activation, <span class='mono'>LN1(h)</span>, feeds three " +
          "matmuls. In the backward pass that means three separate " +
          "input-gradients arrive at the same tensor and must be summed. The " +
          "slide that does it is <span class='mono'>Q/K/V backward</span>, and " +

          "<span class='mono'>dQ</span> needs <span class='mono'>K</span> and " +
          "<span class='mono'>dK</span> needs <span class='mono'>Q</span>, so " +
          "both stay resident; <span class='mono'>V</span> is needed for " +

});

/* ------------------------------------------------- T6. one Q entry, worked */
S({
  chapter: "Forward L0 · Q K V",
  plain: "Q[0][0], multiply by multiply",
  notes: "One entry, so nobody suspects the matmul of hiding anything. " +
    "Q[0][0] is the dot product of row 0 of the LayerNorm output with column " +
    "0 of W_q. Four multiplies, one sum. Read them off the screen. The point " +
    "of the highlight is the geometry: a row of the input against a COLUMN of " +
    "the weight matrix, because in this convention W's columns are the output " +
    "features. Keep that picture — when we make W_q column-parallel later, GPU " +
    "0 will own literally the left half of this picture and GPU 1 the right " +
    "half, and each will produce complete, final entries of Q for its own " +
    "output features with no communication at all.",
  build: function (ctx) {
    const inp = FL[0].qkv.input, Wq = PRM["L0.Wq"];
    const terms = grid2(DM, 1, function (t) { return { x: inp[0][t], w: Wq[t][0] }; })
      .map(function (a) { return a[0]; });
    ctx.inp = am("LN1(h)", inp, "", 3);
    ctx.wq  = wm("W_q", Wq, "", 3);
    ctx.q   = am("Q", FL[0].qkv.Q, "", 3);
    return [
      kicker("Forward · block 0 · one dot product"),
      title("Row of the input · column of the weight", true),
      d("cols wide-l", [
        frag(d("rowflex top", [ctx.inp, h("ar", "×"), ctx.wq,
                               h("ar", "="), ctx.q]), "f-fade"),
        d("stack", terms.map(function (t, k) {
          return frag(NN.formula({
            rule: "LN1(h)[0][" + k + "] × W_q[" + k + "][0]",
            sub: A(t.x, 4) + " × " + W(t.w, 4),
            result: f(t.x * t.w, 6), cls: "activation" }), "f-right");
        }).concat([
          frag(NN.formula({ rule: "sum → Q[0][0]",
            sub: terms.map(function (t) { return f(t.x * t.w, 4); }).join(" + "),
            result: f(FL[0].qkv.Q[0][0], 6), cls: "activation" }), "f-pop")
        ]))
      ]),
      frag(NN.callout("why", "Hold this picture for the partitioning section",
        "The whole input row is needed; only <em>one column</em> of " +
        "<span class='mono'>W_q</span> is. So a GPU holding half the columns of " +
        "<span class='mono'>W_q</span> can compute half the columns of " +
        "<span class='mono'>Q</span>, exactly and finally, provided it has the " +
        "whole input. That single sentence is column parallelism."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const k = NN.clamp(n, 0, DM);
    ctx.inp.highlight(k > 0 ? grid2(1, k, function (a, j) { return [0, j]; }) : null, k > 0);
    ctx.wq.highlight(k > 0 ? grid2(k, 1, function (i) { return [i, 0]; }) : null, k > 0);
    ctx.q.highlight(n >= DM + 1 ? [[0, 0]] : null, n >= DM + 1);
  }
});

/* ------------------------------------------------------- T7. the head split */

    NH + " column groups of " + DH + ". Head 0 takes columns 0 to " + (DH - 1) +

    "for V, with the same column ranges, which is what makes the per-head " +
    "score matrices well-defined. Step the build and watch the cut land. Two " +
    "consequences worth stating. Attention is then computed entirely inside a " +
    "head — head 0 never touches a number belonging to head 1 — so heads are " +
    "embarrassingly parallel, which is exactly why tensor parallelism splits " +
    "attention by head. And the head width " + DH + " is what appears in the " +
    "1/√d_head scale two slides from now, not the model width.",
  build: function (ctx) {
    ctx.q = am("Q", FL[0].qkv.Q, SQ + " × " + DM, 3);

    ctx.h1 = am("Q head 1", FL[0].heads[1].Q,
      "columns " + FL[0].heads[1].cols[0] + "–" + (FL[0].heads[1].cols[1] - 1), 3);
    ctx.cap = h("phaselabel", "");
    return [
      kicker("Forward · block 0 · heads"),
      title("A head is a slice of columns, not a separate matrix", true),
      d("cols wide-l", [
        d("stack", [
          frag(d("panel a", [ctx.cap, ctx.q]), "f-fade"),
          frag(d("rowflex top", [ctx.h0, h("ar", "·"), ctx.h1]), "f-pop")
        ]),
        d("stack", [
          frag(d("panel a tight", [ph("the same cut, applied to all three"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", {}, "head"), el("th", {}, "columns"),
                el("th", {}, "Q shape"), el("th", {}, "K shape"), el("th", {}, "V shape")])),
              el("tbody", {}, FL[0].heads.map(function (H) {
                return el("tr", {}, [
                  el("td", { class: "v-activation" }, "head " + H.head),
                  el("td", { class: "n mono" }, H.cols[0] + "–" + (H.cols[1] - 1)),
                  el("td", { class: "n" }, SQ + "×" + DH),
                  el("td", { class: "n" }, SQ + "×" + DH),
                  el("td", { class: "n" }, SQ + "×" + DH)
                ]);

          frag(NN.callout("key", "One matmul, then a view",
            "Nothing is copied and nothing is looped. The projection produced " +
            "one <span class='mono'>" + SQ + "×" + DM + "</span> tensor; " +
            "the heads are a <em>reshape</em> of it into " +

  },
  render: function (n, ctx) {
    const c0 = grid2(SQ, DH, function (i, j) { return [i, j]; });

    "so doubling the context quadruples it. At this toy size that is " +

/* --------------------------------------------------------- T9. the scale */
S({
  chapter: "Forward L0 · the scale",
  plain: "Divide by √d_head = √" + DH + " — and why",
  notes: "Then multiply every score by 1/√d_head, which here is 1/√" +
    DH + " = " + f(SCL, 6) + ". This is not cosmetic and it is worth being " +
    "precise about why. A dot product of two d-dimensional vectors whose " +
    "entries are roughly independent with variance σ² has variance " +
    "d·σ⁴ — so its typical MAGNITUDE grows like √d. Leave " +
    "it unscaled and wider heads produce systematically larger scores. Large " +
    "scores drive the softmax toward a one-hot vector. And the gradient of a " +
    "saturated softmax is nearly zero — we prove that algebraically in the " +
    "backward half, where dL/dsᵢ = pᵢ(dL/dpᵢ − Σⱼ " +
    "pⱼ dL/dpⱼ): if one p is 1 and the rest are 0, every term in that " +
    "expression collapses. So the scale is there to keep the softmax in the " +
    "regime where it still has a gradient. Watch the heatmap: the extremes " +
    "come in toward the middle.",
  build: function (ctx) {
    const H = FL[0].heads[0];
    ctx.H = H;
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 92,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i; }) });
    ctx.cap = h("phaselabel", "");
    return [
      kicker("Forward · block 0 · head 0 · scaling"),
      title("<span class='mono'>s = (QₕKₕᵀ) / √d_head</span>", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "the scale itself",
            sub: "1 / √" + DH,
            result: f(SCL, 8), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "entry [0][0]",
            sub: f(H.raw[0][0], 5) + " × " + f(SCL, 5),
            result: f(H.scaled[0][0], 6), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "largest |score| in this head",
            sub: "raw " + f(Math.max.apply(null, mflat(H.raw).map(Math.abs)), 4) +
                 "  →  scaled",
            result: f(Math.max.apply(null, mflat(H.scaled).map(Math.abs)), 4),
            cls: "activation" }), "f-left"),
          frag(NN.callout("why", "The chain, stated properly",
            "Dot products of d-dimensional vectors grow like " +
            "<span class='mono'>√d</span> → wide heads give big " +
            "scores → <span class='mono'>softmax</span> saturates toward " +
            "one-hot → its Jacobian " +
            "<span class='mono'>pᵢ(δᵢⱼ − pⱼ)</span> " +
            "goes to zero → <b>no gradient reaches Q or K at all</b>. " +
            "Dividing by <span class='mono'>√d_head</span> keeps the " +
            "scores size-independent of the head width."), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.cap, ctx.hm]), "f-right")])
      ]),
      frag(NN.callout("key", "It is d_head, not d_model",
        "The vectors being dotted are one head wide, " + DH + " here, not " +
        DM + ". Getting this wrong is a real bug: it does not crash, it just " +
        "trains slightly worse forever."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    if (n >= 3) {
      ctx.hm.paint(ctx.H.scaled, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = "scaled by 1/√" + DH + " — the range has shrunk";
    } else {
      ctx.hm.paint(ctx.H.raw, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = "raw q·k";
    }
  }
});

/* ------------------------------------------------------ T10. causal mask */
S({
  chapter: "Forward L0 · causal mask",
  plain: "The causal mask: an upper triangle of −∞",
  notes: "The model is trained to predict every next token at once, which is " +
    "only a legitimate exercise if position i cannot see position i+1. So " +
    "every score strictly above the diagonal is set to minus infinity BEFORE " +
    "the softmax, and exp(−∞) is exactly zero. Step the rows: " +
    "“" + TOK[0] + "” may read only itself, “" + TOK[1] +
    "” may read two, “" + TOK[2] + "” may read all three. Six " +
    "of the nine entries survive; three are masked. Note the rendering: masked " +
    "cells are hatched AND carry the text −∞, because colour must " +
    "never be the only signal. Two consequences. In a naive implementation " +
    "half the score matrix is computed and then discarded — which is why fused " +
    "kernels skip whole masked tiles rather than computing and masking them. " +
    "And row i never changes when token i+1 arrives, which is precisely the " +
    "property that makes a KV cache correct.",
  build: function (ctx) {
    const H = FL[0].heads[0];
    ctx.H = H;
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 92,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i + " " + t; }) });
    ctx.cap = h("phaselabel", "");
    const nMask = mflat(H.masked).filter(function (v) { return v === null; }).length;
    return [
      kicker("Forward · block 0 · head 0 · masking"),
      title("A token may not read the future", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "maskᵢⱼ",
            sub: "0 if j ≤ i, −∞ otherwise",
            result: (SQ * SQ - nMask) + " of " + (SQ * SQ) + " entries survive",
            cls: "activation" }), "f-left"),
          frag(d("panel a tight", [ph("who may read whom"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", { style: { textAlign: "left" } }, "query"),
                el("th", { style: { textAlign: "left" } }, "may attend to"),
                el("th", {}, "count")])),
              el("tbody", {}, TOK.map(function (t, i) {
                return el("tr", {}, [
                  el("td", { style: { textAlign: "left" } }, "“" + t + "”"),
                  el("td", { style: { textAlign: "left" }, class: "mono" },
                    TOK.slice(0, i + 1).map(function (u) { return "“" + u + "”"; }).join(", ")),
                  el("td", { class: "n" }, String(i + 1))
                ]);
              }))
            ])]), "f-left"),
          frag(NN.callout("key", "Why −∞ and not 0",
            "The mask is applied <em>before</em> the softmax and " +
            "<span class='mono'>exp(−∞) = 0</span>. Zeroing " +
            "<em>after</em> the softmax would leave the surviving weights not " +
            "summing to one, because the denominator would still carry the " +
            "future's contribution. Same picture, wrong arithmetic."), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.cap, ctx.hm]), "f-right")])
      ]),
      frag(d("cols", [
        NN.callout("warn", "Half the FLOPs go in the bin",
          "A naive kernel computes all " + (SQ * SQ) + " scores and throws " +
          nMask + " away. At real sequence lengths that is nearly half the " +
          "attention FLOPs of the whole model. Fused kernels never touch a " +
          "fully-masked tile."),
        NN.callout("why", "And it is why the KV cache is correct",
          "Row i is a function of tokens 0..i only. Appending token i+1 cannot " +
          "change it. So at generation time every previous key and value can " +
          "be kept and reused, and a new token costs one row instead of a " +
          "whole matrix.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const rows = NN.clamp(n - 1, 0, SQ);
    if (n <= 1) {
      ctx.hm.paint(ctx.H.scaled, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = "scaled scores — nothing masked yet";
    } else {
      const m = ctx.H.scaled.map(function (r, i) {
        return r.map(function (v, j) {
          return (i < rows && ctx.H.masked[i][j] === null) ? null : v;
        });
      });
      ctx.hm.paint(m, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = rows >= SQ
        ? "causal mask applied · hatched cells are −∞"
        : "masking row " + (rows - 1) + " · “" + TOK[rows - 1] + "”";
    }
  }
});

/* ---------------------------------------------------------- T11. softmax */
S({
  chapter: "Forward L0 · softmax",
  plain: "Softmax: each row becomes a distribution that sums to exactly 1",
  notes: "Exponentiate and divide by the row sum. What comes out is a set of " +
    "non-negative weights summing to one — an honest weighted average over the " +
    "visible tokens. Read the last row out loud: “" + TOK[SQ - 1] +
    "” puts " + f(FL[0].heads[0].P[SQ - 1][0] * 100, 0) + "% of its " +
    "attention on “" + TOK[0] + "”, " +
    f(FL[0].heads[0].P[SQ - 1][1] * 100, 0) + "% on “" + TOK[1] +
    "” and " + f(FL[0].heads[0].P[SQ - 1][2] * 100, 0) + "% on itself. Row " +
    "0 is degenerate by construction: the mask left it one visible key, so its " +
    "weight is exactly 1 whatever the score was. The row sums are not asserted " +
    "— TF2 records them, and they are " +
    FL[0].heads[0].row_sums.join(", ") + ". One implementation note: the row " +
    "maximum is subtracted before exponentiating, purely for numerical safety, " +
    "and it cancels exactly between numerator and denominator so the answer is " +
    "unchanged.",
  build: function (ctx) {
    const H = FL[0].heads[0];
    ctx.H = H;
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 92,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i; }) });
    ctx.cap = h("phaselabel", "");
    const i = SQ - 1;
    const vis = H.masked[i].filter(function (v) { return v !== null; });
    const mx = Math.max.apply(null, vis);
    const exps = H.masked[i].map(function (v) { return v === null ? 0 : Math.exp(v - mx); });
    const den = exps.reduce(function (a, b) { return a + b; }, 0);
    return [
      kicker("Forward · block 0 · head 0 · softmax"),
      title("Exponentiate, then divide by the row sum", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "pᵢⱼ = exp(sᵢⱼ − maxᵢ) / Σ exp(sᵢₖ − maxᵢ)",
            sub: "row " + i + " · max = " + f(mx, 5), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "the exponentials of row " + i,
            sub: exps.map(function (v) { return f(v, 4); }).join(" , "),
            result: "Σ = " + f(den, 6), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "p[" + i + "][0]",
            sub: f(exps[0], 5) + " ÷ " + f(den, 5),
            result: f(H.P[i][0], 6), cls: "activation" }), "f-left"),
          frag(d("panel a tight", [ph("row sums · recorded by the generator, not asserted"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", { style: { textAlign: "left" } }, "row"),
                el("th", {}, "Σ p"), el("th", {}, "|Σ − 1|")])),
              el("tbody", {}, H.row_sums.map(function (s, k) {
                return el("tr", {}, [
                  el("td", { style: { textAlign: "left" } }, tokRow(k)),
                  el("td", { class: "n v-activation" }, f(s, 12)),
                  el("td", { class: "n" }, f(Math.abs(s - 1), 1))
                ]);
              }))
            ])]), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.cap, ctx.hm]), "f-right")])
      ]),
      frag(NN.callout("key", "Why subtract the maximum",
        "<span class='mono'>exp()</span> of a large score overflows — in fp16 " +
        "once the score passes " + f(Math.log(T.formats.fp16.max_finite), 1) +
        ", which real attention scores reach. Subtracting the row maximum makes " +
        "the largest exponent exactly <span class='mono'>exp(0) = 1</span>, and " +
        "the constant cancels between numerator and denominator, so the result " +
        "is algebraically identical and numerically safe."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    if (n >= 2) {
      ctx.hm.paint(ctx.H.P, { color: "var(--activation)", digits: 3, max: 1 });
      ctx.cap.textContent = "attention weights · every row sums to 1";
    } else {
      ctx.hm.paint(ctx.H.masked, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = "masked scores, before the softmax";
    }
  }
});

/* -------------------------------------------------- T12. O = P V, convex */
S({
  chapter: "Forward L0 · P·V",
  plain: "Oₕ = P·Vₕ is a convex combination of value rows",
  notes: "This is the sentence that makes attention click, so say it slowly. " +
    "Row i of P is a set of non-negative numbers summing to one. The output " +
    "for token i is that row used as MIXING WEIGHTS over the value vectors: " +
    "outᵢ = Σⱼ pᵢⱼ · vⱼ. A weighted average " +
    "with non-negative weights summing to one is a convex combination — the " +
    "output literally lies inside the convex hull of the value rows it is " +
    "allowed to see. It cannot invent a direction that no visible token " +
    "contributed. Read token " + (SQ - 1) + ": " +
    FL[0].heads[0].P[SQ - 1].map(function (p, j) {
      return f(p, 3) + "×v" + j; }).join(" + ") + " in every channel. " +
    "And the only thing that distinguishes this from a fixed convolution is " +
    "that the weights were computed from the data at run time. That is the " +
    "whole of attention; the last four slides existed only to produce those " +
    "weights.",
  build: function (ctx) {
    const H = FL[0].heads[0];
    const i = SQ - 1;
    ctx.probs = am("P row " + i + " · “" + TOK[i] + "”", [H.P[i]],
                   "sums to " + f(H.row_sums[i], 6), 4);
    ctx.v = am("V head 0", H.V, "one row per token", 3);
    ctx.out = am("O head 0", H.O, "", 4);
    const terms = H.P[i].map(function (p, j) { return { p: p, v: H.V[j][0] }; });
    return [
      kicker("Forward · block 0 · head 0 · the average"),
      title("Attention output = a weighted average of value rows", true),
      d("cols wide-l", [
        d("stack", [
          frag(d("rowflex top", [ctx.probs, h("ar", "×"), ctx.v,
                                 h("ar", "="), ctx.out]), "f-fade"),
          frag(NN.formula({ rule: "O[" + i + "][0] = Σⱼ pⱼ · vⱼ[0]",
            sub: terms.map(function (t) { return f(t.p, 3) + "×" + f(t.v, 3); }).join(" + "),
            result: f(H.O[i][0], 6), cls: "activation" }), "f-pop")
        ]),
        d("stack", [
          frag(NN.callout("key", "Convex combination — the phrase that matters",
            "The weights are non-negative and sum to " +
            f(H.row_sums[i], 4) + ". So the output for a token lies " +
            "<em>inside the convex hull</em> of the value vectors it is allowed " +
            "to read. Attention cannot manufacture a direction; it can only " +
            "blend directions that are already present in the visible " +
            "context."), "f-right"),
          frag(NN.callout("why", "The only difference from a convolution",
            "A convolution mixes neighbours with <em>fixed</em> weights learned " +
            "once. Attention mixes them with weights computed from the content, " +
            "per token, per head, at run time. That is the entire structural " +
            "difference — and it is why attention needs a " +
            "<span class='mono'>seq²</span> intermediate and a convolution " +
            "does not."), "f-right"),
          frag(NN.callout("mem", "Both P and V must survive to backward",
            "<span class='mono'>d(P·V)/dP = Vᵀ</span> and " +
            "<span class='mono'>d(P·V)/dV = Pᵀ</span>. A matmul's " +
            "backward re-reads both of its inputs, so the " +
            "<span class='mono'>seq²</span> probability matrix is on the " +
            "list of things forward may not free — unless you recompute " +
            "it, which is what FlashAttention does."), "f-right")
        ])
      ])
    ];
  },
  render: function (n, ctx) {
    const i = SQ - 1;
    ctx.probs.highlight(n >= 1 ? grid2(1, SQ, function (a, j) { return [0, j]; }) : null, false);
    ctx.v.highlight(n >= 1 ? grid2(SQ, 1, function (r) { return [r, 0]; }) : null, n >= 1);
    ctx.out.highlight(n >= 2 ? [[i, 0]] : null, n >= 2);
  }
});

/* --------------------------------------------------------- T13. head 1 */
S({
  chapter: "Forward L0 · head 1",
  plain: "Head 1: same machinery, genuinely different attention",
  notes: "The same five operations on the other column block, and the point of " +
    "the slide is that the answer is different. Compare the two probability " +
    "matrices: head 0's last row is " +
    FL[0].heads[0].P[SQ - 1].map(function (v) { return f(v, 3); }).join(", ") +
    " and head 1's is " +
    FL[0].heads[1].P[SQ - 1].map(function (v) { return f(v, 3); }).join(", ") +
    ". Different slices of Q and K produce different similarity structures, " +
    "which is the entire reason to have more than one head. Structurally, note " +
    "what has NOT happened: head 1 never read a single number belonging to " +
    "head 0. No sum, no reduction, no communication. That independence is what " +
    "lets tensor parallelism put whole heads on separate GPUs and compute " +
    "attention with zero bytes on the wire.",
  build: function (ctx) {
    ctx.hm0 = heatGrid({ rows: SQ, cols: SQ, cell: 74,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i; }),
      caption: "head 0 · attention weights" });
    ctx.hm1 = heatGrid({ rows: SQ, cols: SQ, cell: 74,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i; }),
      caption: "head 1 · attention weights" });
    return [
      kicker("Forward · block 0 · the second head"),
      title(NH + " heads, " + NH + " different opinions about the same sentence", true),
      frag(d("cols", [
        d("panel a", [ctx.hm0]),
        d("panel a", [ctx.hm1])
      ]), "f-fade"),
      frag(d("rowflex top", [
        am("O head 0", FL[0].heads[0].O, "columns 0–" + (DH - 1), 4),
        am("O head 1", FL[0].heads[1].O, "columns " + DH + "–" + (DM - 1), 4)
      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("key", "Heads never talk — until W_o",
          "Head 1's scores came from head 1's columns of Q and K, and mixed " +
          "head 1's columns of V. Not one number crossed. The only place the " +
          "heads meet is the output projection two slides from now, which is " +
          "exactly why that matrix is the one tensor parallelism makes " +
          "row-parallel."),
        NN.callout("why", "And they really do differ",
          "Row " + (SQ - 1) + " of head 0 is [" +
          FL[0].heads[0].P[SQ - 1].map(function (v) { return f(v, 3); }).join(", ") +
          "]; of head 1 it is [" +
          FL[0].heads[1].P[SQ - 1].map(function (v) { return f(v, 3); }).join(", ") +
          "]. Same tokens, same sentence, different learned notion of " +
          "relevance. That diversity is the whole return on multi-head " +
          "attention.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    ctx.hm0.paint(FL[0].heads[0].P, { color: "var(--activation)", digits: 3, max: 1 });
    ctx.hm1.paint(FL[0].heads[1].P, { color: "var(--activation)", digits: 3, max: 1 });
  }
});

/* ---------------------------------------------------------- T14. concat */
S({
  chapter: "Forward L0 · concat",
  plain: "Concatenate the heads back into one " + SQ + "×" + DM + " tensor",
  notes: "The heads finish and their outputs are laid side by side in the same " +
    "column order they were cut from: head 0's " + DH + " columns, then head " +
    "1's. This is the exact inverse of the split slide — a view, not a copy, " +
    "and no arithmetic at all. Worth pausing on what the concatenated tensor " +
    "is: it is not yet the attention output. It is " + NH + " independent " +
    "narrow attentions stacked next to each other, and if you stopped here the " +
    "model would be " + NH + " small models glued together with no interaction. " +
    "The next matrix is what makes them one operation.",
  build: function (ctx) {
    ctx.h0 = am("O head 0", FL[0].heads[0].O, "→ columns 0–" + (DH - 1), 4);
    ctx.h1 = am("O head 1", FL[0].heads[1].O, "→ columns " + DH + "–" + (DM - 1), 4);
    ctx.cat = am("concat O", FL[0].concat, SQ + " × " + DM, 4);
    return [
      kicker("Forward · block 0 · concatenation"),
      title("The inverse of the head split — also just a view", true),
      frag(d("rowflex top", [ctx.h0, h("ar", "‖"), ctx.h1,
                             h("ar", "="), ctx.cat]), "f-fade"),
      frag(d("cols3", [
        panel("a tight", [ph("head 0 lands in"),
          h("small mono", "columns 0–" + (DH - 1))]),
        panel("a tight", [ph("head 1 lands in"),
          h("small mono", "columns " + DH + "–" + (DM - 1))]),
        panel("a tight", [ph("arithmetic performed"),
          h("small mono", "none — a reshape")])
      ]), "f-pop"),
      frag(NN.callout("warn", "Right now this is still " + NH + " separate models",
        "Nothing in the concatenated tensor mixes a head-0 channel with a " +
        "head-1 channel. Stop here and you have " + NH + " independent " +
        DH + "-wide attentions sharing a residual stream. The output " +
        "projection is what turns them into one operation — and it is the " +
        "reason multi-head attention is not just an ensemble."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const on = n >= 1;
    ctx.cat.highlight(on ? grid2(SQ, DH, function (i, j) { return [i, j]; }) : null, on);
  }
});


/* ------------------------------------------------- T15. output projection */
S({
  chapter: "Forward L0 · W_o",
  plain: "W_o: the one place the heads are allowed to meet",
  notes: "One more " + DM + "×" + DM + " matrix, applied to the concatenated " +
    "head outputs. Because it is a full matrix, every output channel is a " +
    "combination of ALL " + DM + " concatenated channels — head 0's and head " +
    "1's together. This is the only mixing across heads anywhere in the " +
    "architecture. Work the entry: Attn_out[0][0] is the dot of concat row 0 " +
    "with column 0 of W_o. Then note the shape pairing for later: the heads " +
    "split the OUTPUT dimension of Q/K/V, and W_o consumes exactly that " +
    "dimension as its INPUT. Split outputs feeding split inputs is precisely " +
    "the structure that lets tensor parallelism make Q/K/V column-parallel and " +
    "W_o row-parallel with no reshuffle in between.",
  build: function (ctx) {
    const cat = FL[0].concat, Wo = PRM["L0.Wo"];
    const terms = [];
    for (let t = 0; t < DM; t++) terms.push({ x: cat[0][t], w: Wo[t][0] });
    ctx.cat = am("concat O", cat, "", 3);
    ctx.wo = wm("W_o", Wo, DM + "×" + DM, 3);
    ctx.out = am("Attn(LN1(h))", FL[0].attn_out, "the sub-layer's delta", 4);
    return [
      kicker("Forward · block 0 · output projection"),
      title("<span class='mono'>Attn out = concat · W_o</span>", true),
      frag(d("rowflex top", [ctx.cat, h("ar", "×"), ctx.wo,
                             h("ar", "="), ctx.out]), "f-fade"),
      frag(NN.formula({ rule: "Attn out[0][0] = concat[0] · W_o[:,0]",
        sub: terms.map(function (t) { return f(t.x, 3) + "×" + f(t.w, 3); }).join(" + "),
        result: f(FL[0].attn_out[0][0], 6), cls: "activation" }), "f-left"),
      frag(d("cols", [
        NN.callout("key", "Without W_o, multi-head attention is an ensemble",
          "Each head produced a " + DH + "-wide vector from its own slice of " +
          "Q, K and V. Concatenation alone leaves them un-mixed. " +
          "<span class='mono'>W_o</span> is a full " + DM + "×" + DM +
          " mix, and it is the single operation that makes " + NH +
          " heads one attention rather than " + NH + " attentions."),
        NN.callout("why", "Remember this shape pairing",
          "Q/K/V were split along their <em>output</em> dimension into heads. " +
          "<span class='mono'>W_o</span> consumes that same dimension as its " +
          "<em>input</em>. Split-outputs feeding split-inputs is the exact " +
          "structure Megatron exploits — and the partitioning slides at the " +
          "end of this section do it on these very numbers.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const on = n >= 2;
    ctx.cat.highlight(on ? grid2(1, DM, function (a, j) { return [0, j]; }) : null, on);
    ctx.wo.highlight(on ? grid2(DM, 1, function (i) { return [i, 0]; }) : null, on);
    ctx.out.highlight(on ? [[0, 0]] : null, on);
  }
});

/* ------------------------------------------------------- T16. residual 1 */
S({
  chapter: "Forward L0 · residual 1",
  plain: "The first residual add: h ← h + Attn(LN1(h))",
  notes: "And now the attention sub-layer ends the only way it can: by adding " +
    "its result to the stream. Show both operands and the sum. Channel 0 of " +
    "token 0 was " + f(FL[0].stream_in[0][0], 5) + ", attention contributed " +
    fS(FL[0].attn_out[0][0], 5) + ", so the stream becomes " +
    f(FL[0].resid1[0][0], 5) + ". Three things follow from the fact that this " +
    "is an ADD and not a replace. The sub-layer's output has to be " +
    "commensurate with the stream — same shape, comparable scale — which is " +
    "what the LayerNorm on the way in was for. The block can learn to do " +
    "nothing, by driving its branch to zero, which means adding layers is " +
    "never worse than not adding them. And addition has derivative one, so in " +
    "the backward pass the gradient arriving at the top of this add reaches " +
    "the bottom of it completely untouched. That last one is why the stack " +
    "trains.",
  build: function (ctx) {
    ctx.a = am("h · stream in", FL[0].stream_in, "", 4);
    ctx.b = am("Attn(LN1(h))", FL[0].attn_out, "the branch", 4);
    ctx.c = am("h ← h + Attn", FL[0].resid1, "stream out", 4);
    return [
      kicker("Forward · block 0 · residual add"),
      title("The stream is never overwritten. Only added to.", true),
      frag(d("rowflex top", [ctx.a, h("ar", "+"), ctx.b, h("ar", "="), ctx.c]), "f-fade"),
      frag(NN.formula({ rule: "one channel of one token",
        sub: A(FL[0].stream_in[0][0], 5) + "  +  " + fS(FL[0].attn_out[0][0], 5),
        result: f(FL[0].resid1[0][0], 6), cls: "activation" }), "f-left"),
      frag(d("cols3", [
        NN.callout("key", "Derivative one, in both directions",
          "<span class='mono'>∂(a+b)/∂a = ∂(a+b)/∂b = 1</span>. " +
          "The backward pass hands the <em>same</em> gradient to the branch " +
          "and to the skip. Nothing is scaled, nothing is attenuated."),
        NN.callout("why", "A block can learn to be a no-op",
          "Drive <span class='mono'>W_o</span> to zero and the block becomes " +
          "the identity. So a deeper network can always represent everything a " +
          "shallower one could — adding capacity is never a step backwards, " +

    ];
  },
  render: function (n, ctx) {

  }
});

/* ---------------------------------------------------------- T18. MLP up */
S({
  chapter: "Forward L0 · MLP up",
  plain: "W_up: widen every token from " + DM + " to " + DFF + " channels",
  notes: "The MLP sub-layer is the two-layer network from the first half of " +
    "this deck, applied to every token independently — no token sees any " +
    "other in here, which is the exact complement of attention. The first " +
    "matrix widens: " + DM + " in, " + DFF + " out, " + (DM * DFF) + " " +
    "parameters. Read one pre-activation: U[0][0] is row 0 of LN2's output " +
    "dotted with column 0 of W_up, which comes to " +
    f(FL[0].mlp.U[0][0], 5) + ". The useful intuition for the widening is that " +
    "each of the " + DFF + " columns is a learned feature detector, and the " +
    "pre-activation says how strongly this token fires it. That is why " +
    "splitting W_up by column later means giving each GPU whole neurons.",
  build: function (ctx) {
    const inp = FL[0].mlp.input, W1 = PRM["L0.W1"];
    const terms = [];
    for (let t = 0; t < DM; t++) terms.push({ x: inp[0][t], w: W1[t][0] });
    ctx.inp = am("LN2(h)", inp, SQ + "×" + DM, 3);
    ctx.w = wm("W_up", W1, DM + "×" + DFF, 2);
    ctx.u = am("U = LN2(h)·W_up", FL[0].mlp.U, SQ + "×" + DFF + " pre-activations", 2);
    return [
      kicker("Forward · block 0 · MLP · up-projection"),
      title("Every token, on its own, widened to " + DFF + " channels", true),
      frag(d("rowflex top", [ctx.inp, h("ar", "×"), ctx.w]), "f-fade"),
      frag(ctx.u, "f-pop"),
      frag(NN.formula({ rule: "U[0][0] = LN2(h)[0] · W_up[:,0]",
        sub: terms.map(function (t) { return f(t.x, 3) + "×" + f(t.w, 3); }).join(" + "),
        result: f(FL[0].mlp.U[0][0], 6), cls: "activation" }), "f-left"),
      frag(d("cols", [
        NN.callout("key", "No token talks to any other in here",
          "Attention mixes across rows; the MLP works strictly along a row. " +
          "The two sub-layers are exact complements, and that is why a " +
          "transformer block needs both."),
        NN.callout("mem", "The widest tensors in the block are born here",
          "<span class='mono'>U</span> and the GELU output are each " +
          "<span class='mono'>seq × d_ff</span> = " + (SQ * DFF) +
          " elements, and backward needs both — the pre-activation for the " +
          "GELU derivative, the activation for <span class='mono'>dW_down</span>. " +
          "This toy uses a " + (DFF / DM) + "× expansion; real blocks use 4× or " +

    ];
  },
  render: function (n, ctx) {

    ctx.w.highlight(on ? grid2(DM, 1, function (i) { return [i, 0]; }) : null, on);
    ctx.u.highlight(on ? [[0, 0]] : null, on);
  }
});

/* ------------------------------------------------------------ T19. GELU */
S({
  chapter: "Forward L0 · GELU",
  plain: "GELU: a smooth gate, and the real pre-activations sitting on it",
  notes: "The nonlinearity. GELU is x times a smooth gate that goes from 0 to " +
    "1 — the tanh approximation, which is what real transformers ship. Put the " +
    "actual " + (SQ * DFF) + " pre-activations on the curve so nobody has to " +
    "imagine them: they run from " +
    f(Math.min.apply(null, mflat(FL[0].mlp.U)), 3) + " to " +
    f(Math.max.apply(null, mflat(FL[0].mlp.U)), 3) + ", so this block sits " +
    "squarely in the bend, not out on either asymptote. Then the comparison " +
    "that matters. Under ReLU a pre-activation of " +
    f(FL[0].mlp.U[0][1], 3) + " outputs exactly zero and receives exactly zero " +
    "gradient — the dying-unit failure we watched on the toy MLP. Under GELU " +
    "it outputs " + f(FL[0].mlp.G[0][1], 4) + " and its derivative is " +
    f(dgelu(FL[0].mlp.U[0][1]), 4) + ", small but alive. Attenuated, not " +
    "annihilated. That is the whole reason the field moved off ReLU inside " +
    "transformer MLPs.",
  build: function (ctx) {
    const pre = mflat(FL[0].mlp.U);
    const curve = [];
    for (let x = -3; x <= 3.001; x += 0.06) curve.push([x, gelu(x)]);
    const marks = pre.map(function (v) { return [v, gelu(v)]; });
    const neg = FL[0].mlp.U[0][1];
    return [
      kicker("Forward · block 0 · MLP · nonlinearity"),
      title("<span class='mono'>GELU(x) = x · Φ(x)</span> — a gate, not a cliff", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "the tanh approximation, as shipped",
            sub: "0.5·x·(1 + tanh(√(2/π)·(x + 0.044715·x³)))",
            cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "a NEGATIVE pre-activation · U[0][1]",
            sub: "GELU(" + f(neg, 4) + ")",
            result: f(gelu(neg), 6), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "the same unit under ReLU",
            sub: "max(0, " + f(neg, 4) + ")",
            result: "0 — and a gradient of 0 with it", cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "GELU's derivative there",
            sub: "d/dx at x = " + f(neg, 4),
            result: f(dgelu(neg), 6) + " — alive", cls: "gradient" }), "f-left"),
          frag(NN.callout("key", "The answer to the dead unit",
            "We watched a ReLU unit in the " + NPARAM + "-parameter model take " +
            "a pre-activation of " + f(T.forward.z1[2], 2) + ", output exactly " +
            "zero, and receive exactly zero gradient forever. GELU multiplies " +
            "by a smooth gate instead of clamping, so a negative pre-activation " +
            "is attenuated and keeps a non-zero derivative. Same architecture, " +
            "no dead capacity."), "f-left")
        ]),
        d("stack", [
          frag(d("panel a", [ph("GELU, with this block's " + pre.length +
            " real pre-activations marked"),
            NN.chart.line({
              series: [
                { name: "GELU(x)", color: "var(--accent)", points: curve, dots: false },
                { name: "this block's pre-activations", color: "var(--activation)",
                  points: marks }
              ],
              width: 560, height: 270, xlabel: "pre-activation U", ylabel: "GELU(U)"
            }),
            chartKey([{ name: "GELU(x), tanh approximation", color: "var(--accent)" },
                      { name: "the " + pre.length + " values of U in this block",
                        color: "var(--activation)" }])]), "f-right"),
          frag(d("rowflex", [
            d("pill", "min U = " + f(Math.min.apply(null, pre), 4)),
            d("pill", "max U = " + f(Math.max.apply(null, pre), 4)),
            d("pill hot", pre.filter(function (v) { return v < 0; }).length +
              " of " + pre.length + " are negative — and all of them still " +
              "carry gradient")
          ]), "f-pop")
        ])
      ])
    ];
  }
});

/* --------------------------------------------------------- T20. MLP down */
S({
  chapter: "Forward L0 · MLP down",
  plain: "W_down: narrow " + DFF + " back to " + DM,
  notes: "The second matrix narrows back to the stream width, because the " +
    "block has to be shape-preserving — that is the property that lets you " +
    "stack it. " + DFF + " in, " + DM + " out, " + (DFF * DM) + " parameters. " +
    "Note the contraction direction: this matmul sums over the " + DFF +
    " wide channels. Hold that thought, because it is why W_down is the " +
    "second row-parallel matrix: a GPU that owns half the wide channels can " +
    "compute a partial contribution to every output channel, and no output " +
    "channel completely. Also worth saying: the MLP is " +
    f((DM * DFF + DFF * DM) / (NP2 / NL) * 100, 0) + "% of this block's " +
    "parameters at a " + (DFF / DM) + "× expansion. Be careful quoting the " +
    "grown-up figure, because it depends on which architecture you mean: a " +
    "classic 2-matrix MLP at 4× expansion puts the MLP at " +
    f(8 / 12 * 100, 0) + "% of the block's matrices, while " + MODEL.name +
    ", which uses SwiGLU's three matrices, puts it at " +
    (XR ? f(XR.exact.mlp_share_of_layer * 100, 0) : "over 80") +
    "% — the number the scaling run quotes.",
  build: function (ctx) {
    ctx.g = am("GELU(U)", FL[0].mlp.G, SQ + "×" + DFF, 2);
    ctx.w = wm("W_down", PRM["L0.W2"], DFF + "×" + DM, 2);
    ctx.o = am("D = GELU(U)·W_down", FL[0].mlp.D, SQ + "×" + DM, 4);
    return [
      kicker("Forward · block 0 · MLP · down-projection"),
      title("Back to " + DM + " channels — the block must preserve its shape", true),
      frag(ctx.g, "f-fade"),
      frag(d("rowflex top", [ctx.w, h("ar", "→"), ctx.o]), "f-pop"),
      frag(NN.formula({ rule: "D[0][0] = Σ over the " + DFF + " wide channels",
        sub: "GELU(U)[0] · W_down[:,0]",
        result: f(FL[0].mlp.D[0][0], 6), cls: "activation" }), "f-left"),
      frag(d("cols", [
        NN.callout("key", "The contraction runs over d_ff",
          "Every output channel sums over all " + DFF + " wide channels. So a " +
          "GPU holding half of them produces a <em>partial sum</em> for every " +
          "output — full shape, incomplete value. That is exactly the " +
          "row-parallel situation, and it is why an all-reduce has to follow."),
        NN.callout("mem", "Where the parameters actually are",
          "Attention here is 4 × " + (DM * DM) + " = " + (4 * DM * DM) +
          " parameters; the MLP is " + (DM * DFF) + " + " + (DFF * DM) + " = " +
          (2 * DM * DFF) + ". At this " + (DFF / DM) + "× expansion the MLP is " +
          f(2 * DM * DFF / (4 * DM * DM + 2 * DM * DFF) * 100, 0) +
          "% of the matrices. A classic 4× two-matrix MLP is " +
          f(8 / 12 * 100, 0) + "% (8d² against 4d²); " + MODEL.name +
          "'s SwiGLU has <em>three</em> matrices and grouped-query attention, " +
          "which takes it to " +
          (XR ? f(XR.exact.mlp_share_of_layer * 100, 0) : "over 80") +
          "%. Same argument, three different numbers — quote the architecture " +
          "with the figure.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const on = n >= 3;
    ctx.g.highlight(on ? grid2(1, DFF, function (a, j) { return [0, j]; }) : null, on);
    ctx.w.highlight(on ? grid2(DFF, 1, function (i) { return [i, 0]; }) : null, on);
    ctx.o.highlight(on ? [[0, 0]] : null, on);
  }
});

/* ------------------------------------------------------- T21. residual 2 */

    "Notice the total structure of a block, which is now complete and is " +
    "worth stating as a sentence: the stream goes straight through, and TWO " +
    "branches hang off it, each of which reads the stream through a LayerNorm " +
    "and writes back through an addition. Nothing else happens. Every " +
    "transformer you have ever met is that, repeated.",
  build: function (ctx) {
    ctx.a = am("h after residual 1", FL[0].resid1, "", 4);

      title("Two branches, two adds, and the shape never changed", true),

      frag(d("arrowline", [

      ]), "f-pop"),

      ]), "f-fade"),

        "The block returns exactly the tensor shape it was handed. No reshape, " +
