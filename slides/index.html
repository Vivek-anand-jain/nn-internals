/* ====================================================== build the deck */
const deck   = document.getElementById("deck");
const nodes  = [];

SLIDES.forEach(function (def, idx) {
  const sec   = d("slide");
  sec.setAttribute("aria-hidden", "true");
  const stage = d("stage");
  const inner = d("inner");
  const fit   = d("fit");
  const ctx   = {};
  const kids  = def.build ? def.build(ctx) : [];
  (Array.isArray(kids) ? kids : [kids]).forEach(function (k, i) {
    if (!k) return;
    k.style.setProperty("--i", i);
    fit.appendChild(k);
  });
  inner.appendChild(fit); stage.appendChild(inner); sec.appendChild(stage);
  deck.appendChild(sec);
  sec._frags = NN.$$(".fragment", fit);
  sec._ctx   = ctx;
  sec._def   = def;
  sec._fit   = fit;
  /* Render every slide once, fully, so that slides which draw their content
     in render() have something in them before they are first visited — the
     overview thumbnails and the fit-to-box measurement both need it. */
  if (def.render) def.render(sec._frags.length, ctx);
  nodes.push(sec);
});

const COUNT = nodes.length;
document.getElementById("cTot").textContent = String(COUNT);

/* ======================================================= layout / fit */
let _fitRaf = null;
function relayout() {
  const bottom = 52 + (notesOpen ? 176 : 0);
  document.documentElement.style.setProperty("--deckbottom", bottom + "px");
  const availH = window.innerHeight - 49 - bottom - 22;
  const k = Math.min((window.innerWidth - 56) / 1280, availH / 720);
  document.documentElement.style.setProperty("--k", Math.max(0.25, k));
  if (_fitRaf) cancelAnimationFrame(_fitRaf);
  _fitRaf = requestAnimationFrame(function () {
    nodes.forEach(function (s) {
      const hgt = s._fit.offsetHeight;
      s._fit.style.setProperty("--fit", hgt > 686 ? (686 / hgt).toFixed(4) : "1");
    });
  });
}
window.addEventListener("resize", relayout);

/* ============================================================== state */
let cur = 0, fragN = 0, notesOpen = false, gridOpen = false,
    helpOpen = false, blacked = false, hashLock = false, pending = null;

const pbar     = document.getElementById("pbar");
const cNum     = document.getElementById("cNum");
const chapEl   = document.getElementById("chap");
const dotsEl   = document.getElementById("fragdots");
const notesEl  = document.getElementById("notes");
const nHead    = document.getElementById("notesHead");
const nBody    = document.getElementById("notesBody");
const nNext    = document.getElementById("notesNext");
const btnPrev  = document.getElementById("btnPrev");
const btnNext  = document.getElementById("btnNext");

function totalFrags(i) { return nodes[i]._frags.length; }

function paintFrags() {
  const s = nodes[cur];
  s._frags.forEach(function (e, i) { e.classList.toggle("on", i < fragN); });
  dotsEl.innerHTML = "";
  for (let i = 0; i < s._frags.length; i++) {
    dotsEl.appendChild(el("i", { class: i < fragN ? "on" : "" }));
  }
  if (s._def.render) s._def.render(fragN, s._ctx);
  btnPrev.disabled = (cur === 0 && fragN === 0);
  btnNext.disabled = (cur === COUNT - 1 && fragN === totalFrags(cur));
}

function paintSlide() {
  nodes.forEach(function (s, i) {
    s.classList.toggle("current", i === cur);
    s.classList.toggle("past", i < cur);
    s.setAttribute("aria-hidden", i === cur ? "false" : "true");
  });
  const def = nodes[cur]._def;
  cNum.textContent = String(cur + 1);
  chapEl.textContent = def.chapter || "";
  pbar.style.width = (COUNT === 1 ? 100 : (cur / (COUNT - 1)) * 100) + "%";
  nHead.textContent = "Slide " + (cur + 1) + " — " + (def.plain || "notes");
  nBody.innerHTML = def.notes || "<em class='muted'>No notes.</em>";
  nNext.textContent = cur < COUNT - 1
    ? "Next up: " + (nodes[cur + 1]._def.plain || "") +
      "   ·   " + totalFrags(cur) + " build step" + (totalFrags(cur) === 1 ? "" : "s") + " on this slide"
    : "Last slide.";
  NN.$$(".thumb", thumbsEl).forEach(function (t, i) {
    t.classList.toggle("current", i === cur);
  });
  relayout();
}

function go(i, frag) {
  const t = NN.clamp(i, 0, COUNT - 1);
  const nf = frag === "all" ? totalFrags(t) : NN.clamp(frag || 0, 0, totalFrags(t));
  if (t !== cur) { cur = t; fragN = nf; paintSlide(); paintFrags(); }
  else { fragN = nf; paintFrags(); }
  writeHash();
}
function writeHash() {
  const want = "#" + (cur + 1);
  if (location.hash !== want) { hashLock = true; location.hash = want; }
}
function next() {
  if (fragN < totalFrags(cur)) { fragN++; paintFrags(); return; }
  if (cur < COUNT - 1) { pending = 0; go(cur + 1, 0); }
}
function prev() {
  if (fragN > 0) { fragN--; paintFrags(); return; }
  if (cur > 0) { pending = "all"; go(cur - 1, "all"); }
}
function nextSlide() { if (cur < COUNT - 1) go(cur + 1, 0); }
function prevSlide() { if (cur > 0) go(cur - 1, 0); }

window.addEventListener("hashchange", function () {
  if (hashLock) { hashLock = false; return; }
  const i = parseInt(location.hash.replace("#", ""), 10);
  if (!isNaN(i)) go(i - 1, pending === null ? "all" : pending);
  pending = null;
});

/* =============================================================== grid */
const gridEl   = document.getElementById("gridview");
const thumbsEl = document.getElementById("thumbs");
let thumbsBuilt = false;
function buildThumbs() {
  if (thumbsBuilt) return;
  thumbsBuilt = true;
  nodes.forEach(function (s, i) {
    /* draw the slide in its finished state before taking the snapshot */
    if (s._def.render) s._def.render(s._frags.length, s._ctx);
    const tw = d("tw");
    const clone = s.querySelector(".stage").cloneNode(true);
    clone.style.transform = "none";
    clone.style.setProperty("--k", 1);
    tw.appendChild(clone);
    const t = d("thumb", [tw, h("tn", "<b>" + (i + 1) + "</b><span>" +
      (s._def.plain || "").replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>")]);
    t.addEventListener("click", function () { toggleGrid(false); go(i, "all"); });
    thumbsEl.appendChild(t);
  });
  /* put the live slide back into its current build state */
  paintFrags();
  scaleThumbs();
}
function scaleThumbs() {
  NN.$$(".thumb", thumbsEl).forEach(function (t) {
    const w = t.clientWidth || 248;
    t.querySelector(".tw").style.transform = "scale(" + (w / 1280) + ")";
  });
}
function toggleGrid(on) {
  gridOpen = on === undefined ? !gridOpen : on;
  if (gridOpen) { buildThumbs(); scaleThumbs(); }
  gridEl.classList.toggle("open", gridOpen);
  document.getElementById("btnGrid").classList.toggle("on", gridOpen);
  if (gridOpen) {
    const c = NN.$$(".thumb", thumbsEl)[cur];
    if (c && c.scrollIntoView) {
      c.scrollIntoView({ block: "center", behavior: RM ? "auto" : "smooth" });
    }
  }
}
window.addEventListener("resize", function () { if (thumbsBuilt) scaleThumbs(); });

/* ============================================================== notes */
function toggleNotes(on) {
  notesOpen = on === undefined ? !notesOpen : on;
  notesEl.classList.toggle("open", notesOpen);
  document.getElementById("btnNotes").classList.toggle("on", notesOpen);
  relayout();
}

/* =============================================================== help */
const helpEl = document.getElementById("help");
const KEYS = [
  ["→ · Space · Page Down · Enter", "next build step, then next slide"],
  ["← · Backspace · Page Up", "previous build step, then previous slide"],
  ["↓ / ↑", "skip to next / previous slide, ignoring builds"],
  ["Home / End", "first / last slide"],
  ["G", "overview grid — click a thumbnail to jump"],
  ["Esc", "open the grid, or close whatever is open"],
  ["S", "speaker notes panel"],
  ["F", "fullscreen"],
  ["B or .", "blackout the screen"],
  ["T", "light / dark theme"],
  ["?", "this list"],
  ["click", "right third = forward, left third = back"]
];
(function () {
  const list = document.getElementById("keysList");
  KEYS.forEach(function (k) {
    list.appendChild(el("div", {}, k[0].split(" · ").map(function (x, i) {
      return el("span", {}, [i ? " · " : "", el("kbd", {}, x)]);
    })));
    list.appendChild(el("div", { class: "muted", text: k[1] }));
  });
})();
function toggleHelp(on) {
  helpOpen = on === undefined ? !helpOpen : on;
  helpEl.classList.toggle("open", helpOpen);
}

/* ========================================================== blackout */
const blackEl = document.getElementById("black");
function toggleBlack() { blacked = !blacked; blackEl.classList.toggle("on", blacked); }

/* ========================================================== keyboard */
document.addEventListener("keydown", function (e) {
  if (/input|textarea|select/i.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (blacked && k !== "b" && k !== "B" && k !== "." && k !== "Escape") { return; }
  switch (k) {
    case "ArrowRight": case " ": case "PageDown": case "Enter":
      e.preventDefault(); next(); break;
    case "ArrowLeft": case "PageUp": case "Backspace":
      e.preventDefault(); prev(); break;
    case "ArrowDown": e.preventDefault(); nextSlide(); break;
    case "ArrowUp":   e.preventDefault(); prevSlide(); break;
    case "Home": e.preventDefault(); go(0, 0); break;
    case "End":  e.preventDefault(); go(COUNT - 1, "all"); break;
    case "g": case "G": toggleGrid(); break;
    case "s": case "S": toggleNotes(); break;
    case "f": case "F":
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
      else { document.exitFullscreen(); }
      break;
    case "b": case "B": case ".": e.preventDefault(); toggleBlack(); break;
    case "t": case "T": document.getElementById("themeToggle").click(); break;
    case "?": toggleHelp(); break;
    case "Escape":
      if (helpOpen) toggleHelp(false);
      else if (blacked) toggleBlack();
      else toggleGrid();
      break;
  }
});

/* ===================================================== click / pointer */
const NOCLICK = "a,button,input,select,textarea,svg,.tensor,.chart,.no-nav,.memstrip,.bits";
deck.addEventListener("click", function (e) {
  if (e.target.closest && e.target.closest(NOCLICK)) return;
  const third = window.innerWidth / 3;
  if (e.clientX > third * 2) next();
  else if (e.clientX < third) prev();
});
const ehL = document.getElementById("ehL"), ehR = document.getElementById("ehR");
document.addEventListener("mousemove", function (e) {
  if (gridOpen || helpOpen) { ehL.classList.remove("show"); ehR.classList.remove("show"); return; }
  const third = window.innerWidth / 3;
  ehL.classList.toggle("show", e.clientX < third * .6 && cur > 0);
  ehR.classList.toggle("show", e.clientX > window.innerWidth - third * .6);
});
btnNext.addEventListener("click", next);
btnPrev.addEventListener("click", prev);
document.getElementById("btnGrid").addEventListener("click", function () { toggleGrid(); });
document.getElementById("btnNotes").addEventListener("click", function () { toggleNotes(); });
document.getElementById("btnHelp").addEventListener("click", function () { toggleHelp(); });
helpEl.addEventListener("click", function () { toggleHelp(false); });

/* touch: swipe */
let tx = null, ty = null;
deck.addEventListener("touchstart", function (e) {
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, { passive: true });
deck.addEventListener("touchend", function (e) {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
  tx = null;
});

/* redraw charts that read CSS variables when the theme flips */
window.addEventListener("nn:theme", function () {
  const s = nodes[cur];
  if (s._def.render) s._def.render(fragN, s._ctx);
});

/* ============================================================== start */
const startHash = parseInt(location.hash.replace("#", ""), 10);
cur = (!isNaN(startHash) && startHash >= 1 && startHash <= COUNT) ? startHash - 1 : 0;
fragN = 0;
paintSlide(); paintFrags(); relayout();
window.addEventListener("load", relayout);
setTimeout(relayout, 250);

/* expose for the console */
NN.deck = { go: go, next: next, prev: prev, slides: SLIDES };

})();
</script>
</body>
</html>
