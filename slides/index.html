<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NN Internals · Slides</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/design.css">
<style>
/* ==========================================================================
   Deck chrome. Everything visual that is not already in design.css.
   The stage is a fixed 1280x720 box scaled to the viewport, so every size
   below can be written in px and stay proportional on any screen.
   ========================================================================== */
html, body { height: 100%; overflow: hidden; }
body { background: var(--page); }

/* ------------------------------------------------------------- the deck */
#deck {
  position: fixed; top: 49px; left: 0; right: 0;
  bottom: var(--deckbottom, 52px); z-index: 1;
  transition: bottom .3s cubic-bezier(.32,.72,.24,1);
}

.slide {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transform: translateX(5%) scale(.975);
  transition: opacity .42s ease, transform .52s cubic-bezier(.32,.72,.24,1);
  will-change: opacity, transform;
}
.slide.past { transform: translateX(-5%) scale(.975); }
.slide.current { opacity: 1; pointer-events: auto; transform: none; z-index: 2; }

.stage {
  position: relative; width: 1280px; height: 720px;
  /* The stage is a fixed 1280x720 box that is SCALED to fit, never shrunk:
     as a flex item it would otherwise flex-shrink below 1280 on a narrow
     viewport, reflowing every slide's contents inside a smaller box on top
     of the scale that --k has already applied. */
  flex: 0 0 auto;
  transform: scale(var(--k, 1)); transform-origin: center center;
}
.inner {
  position: absolute; inset: 0; padding: 0 74px;
  display: flex; flex-direction: column; justify-content: center;
}
.fit { width: 100%; transform: scale(var(--fit, 1)); transform-origin: center center; }

/* ------------------------------------------------------ slide typography */
.stage .kicker {
  font-family: var(--mono); font-size: 15px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--ink-muted); margin-bottom: 14px;
}
.stage .kicker b { color: var(--accent); font-weight: 600; }
.stage .stitle {
  font-size: 46px; line-height: 1.1; margin: 0 0 18px;
  letter-spacing: -.025em; font-weight: 680;
}
.stage .stitle.sm { font-size: 36px; }
.stage .lead { font-size: 21px; line-height: 1.5; color: var(--ink-2); max-width: 76ch; }
.stage p { font-size: 19px; line-height: 1.55; }
.stage .say { font-size: 22px; line-height: 1.5; color: var(--ink-2); }
.stage .bignum {
  font-family: var(--mono); font-size: 72px; font-weight: 700;
  letter-spacing: -.03em; line-height: 1.05;
}
.stage .midnum { font-family: var(--mono); font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
.stage .phaselabel {
  font-family: var(--mono); font-size: 21px; font-weight: 700;
  min-height: 52px; display: flex; align-items: center;
}
.stage .hugetitle {
  font-size: 78px; line-height: 1.03; letter-spacing: -.035em;
  font-weight: 700; margin: 0 0 22px;
}
.stage .subtitle { font-size: 25px; color: var(--ink-2); line-height: 1.45; max-width: 30ch; }
.stage .cell { font-size: 15px; min-width: 72px; padding: 9px 11px; }
.stage .tensor-label { font-size: 14px; }
.stage .tensor-shape { font-size: 13px; }
.stage .formula { font-size: 19px; padding: 16px 20px; }
.stage .formula .sub { font-size: 16px; }
.stage .callout { font-size: 18px; padding: 16px 20px; }
.stage .callout .t { font-size: 13px; }
.stage .tile .v { font-size: 30px; }
.stage .tile .k { font-size: 12px; }
.stage .tile .s { font-size: 13px; }
.stage .tclass { font-size: 14px; padding: 3px 11px 3px 9px; }
.stage table.data { font-size: 16px; }
.stage table.data th { font-size: 12px; }
.stage .small { font-size: 15px; }
.stage .ckey {
  font-family: var(--mono); font-size: 14px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 8px;
}
.stage .ckey i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.stage code { font-size: .95em; }

/* ------------------------------------------------------------- layouts */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; align-items: center; }
.cols.wide-l { grid-template-columns: 1.35fr 1fr; }
.cols.wide-r { grid-template-columns: 1fr 1.35fr; }
.cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: stretch; }
.cols4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: stretch; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.rowflex { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.rowflex.top { align-items: flex-start; }
.gap8 { height: 8px; } .gap16 { height: 16px; } .gap24 { height: 24px; }

.panel {
  background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 20px 22px;
}
.panel.tight { padding: 14px 16px; }
.panel .ph {
  font-family: var(--mono); font-size: 12px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px;
}
.panel.w { border-left: 3px solid var(--weight); }
.panel.g { border-left: 3px solid var(--gradient); }
.panel.a { border-left: 3px solid var(--activation); }
.panel.o { border-left: 3px solid var(--optimizer); }
.panel.acc { border-left: 3px solid var(--accent); }
.panel.crit { border-left: 3px solid var(--critical); }

.arrowline {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 19px;
}
.arrowline .ar { color: var(--ink-muted); font-size: 22px; }

.pill {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 15px; font-weight: 600;
  padding: 6px 13px; border-radius: 999px;
  border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink-2);
}
.pill.hot { border-color: var(--critical); color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }

.deadflag {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--mono); font-size: 16px; font-weight: 700;
  color: var(--critical); border: 1px dashed var(--critical);
  background: color-mix(in srgb, var(--critical) 10%, transparent);
  padding: 7px 14px; border-radius: 8px;
}

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-family: var(--mono); font-size: 16px; }
.kv .k { color: var(--ink-muted); }

/* the READS box — the thesis of the deck */
.readbox {
  border-radius: 12px; padding: 16px 20px;
  border: 1px solid var(--activation);
  background: var(--activation-w);
}
.readbox.none { border: 1px dashed var(--hairline); background: var(--surface-2); }
.readbox .rt {
  font-family: var(--mono); font-size: 13px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--activation); font-weight: 700; margin-bottom: 8px;
}
.readbox.none .rt { color: var(--ink-muted); }
.readbox.wgt { border-color: var(--weight); background: var(--weight-w); }
.readbox.wgt .rt { color: var(--weight); }

/* ------------------------------------------------------ network diagram */
.net { display: block; width: 100%; }
.net .edge { stroke-width: 2; fill: none; opacity: .85; }
.net .node circle { stroke-width: 2; }
.net text { font-family: var(--mono); fill: var(--ink-2); }
.net .elabel { font-size: 12px; fill: var(--ink-muted); }

@keyframes drawEdge { from { stroke-dashoffset: 460; } to { stroke-dashoffset: 0; } }
.slide.current .net .edge {
  stroke-dasharray: 460; stroke-dashoffset: 460;
  animation: drawEdge .75s cubic-bezier(.3,.7,.2,1) forwards;
  animation-delay: calc(var(--e, 0) * 55ms + 120ms);
}

/* --------------------------------------------------------- entrance/frag */
@keyframes riseIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
.slide.current .fit > *:not(.fragment) {
  animation: riseIn .5s cubic-bezier(.2,.72,.3,1) both;
  animation-delay: calc(var(--i, 0) * 70ms);
}
.fragment {
  opacity: 0; transform: translateY(14px);
  transition: opacity .38s ease, transform .42s cubic-bezier(.2,.72,.3,1), filter .38s;
}
.fragment.on { opacity: 1; transform: none; }
.fragment.f-left  { transform: translateX(-26px); }
.fragment.f-right { transform: translateX(26px); }
.fragment.f-pop   { transform: scale(.9); }
.fragment.f-fade  { transform: none; }
.fragment.f-left.on, .fragment.f-right.on, .fragment.f-pop.on { transform: none; }
/* a fragment that dims what came before it */
.dimmed { opacity: .3; filter: saturate(.4); transition: opacity .4s, filter .4s; }

/* ------------------------------------------------------------- chrome */
.deckbar {
  position: fixed; top: 0; left: 0; right: 0; height: 46px; z-index: 30;
  display: flex; align-items: center; gap: 14px; padding: 0 18px;
  background: color-mix(in srgb, var(--page) 82%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--hairline-2);
}
.deckbar .brand { font-size: .9rem; }
.deckbar .chap {
  font-family: var(--mono); font-size: .74rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-muted);
  border-left: 1px solid var(--hairline); padding-left: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.deckbar .spacer { flex: 1; }
.deckbar .iconbtn { font-size: .74rem; padding: 4px 9px; }
.deckbar .iconbtn.on { color: var(--ink); border-color: var(--weight); background: var(--weight-w); }

.progress {
  position: fixed; top: 46px; left: 0; right: 0; height: 3px; z-index: 30;
  background: var(--surface-2);
}
.progress i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--activation), var(--weight));
  transition: width .42s cubic-bezier(.32,.72,.24,1);
}

.deckfoot {
  position: fixed; bottom: 0; left: 0; right: 0; height: 52px; z-index: 30;
  display: flex; align-items: center; gap: 12px; padding: 0 18px;
  background: color-mix(in srgb, var(--page) 82%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--hairline-2);
}
.navbtn {
  width: 34px; height: 30px; border-radius: 7px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--hairline);
  color: var(--ink-2); font-size: 15px; line-height: 1;
}
.navbtn:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-muted); }
.navbtn:disabled { opacity: .3; cursor: not-allowed; }
.fragdots { display: flex; gap: 5px; align-items: center; }
.fragdots i {
  width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3);
  border: 1px solid var(--hairline); transition: background .25s, transform .25s;
}
.fragdots i.on { background: var(--activation); border-color: var(--activation); transform: scale(1.2); }
.deckfoot .hint { font-size: .74rem; color: var(--ink-muted); font-family: var(--mono); }
.counter {
  margin-left: auto; font-family: var(--mono); font-size: .82rem;
  color: var(--ink-muted); font-variant-numeric: tabular-nums;
}
.counter b { color: var(--ink); font-size: 1rem; }

/* edge affordances for click-to-navigate */
.edgehint {
  position: fixed; top: 0; bottom: 0; width: 16%; z-index: 5;
  pointer-events: none; opacity: 0; transition: opacity .25s;
  display: flex; align-items: center; font-size: 34px; color: var(--ink-muted);
}
.edgehint.l { left: 0; justify-content: flex-start; padding-left: 14px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--ink) 7%, transparent), transparent); }
.edgehint.r { right: 0; justify-content: flex-end; padding-right: 14px;
  background: linear-gradient(270deg, color-mix(in srgb, var(--ink) 7%, transparent), transparent); }
.edgehint.show { opacity: 1; }

/* ---------------------------------------------------------- notes panel */
.notes {
  position: fixed; left: 0; right: 0; bottom: 52px; z-index: 25;
  height: 0; overflow: hidden;
  background: var(--surface-1); border-top: 1px solid var(--hairline);
  transition: height .3s cubic-bezier(.32,.72,.24,1);
}
.notes.open { height: 176px; }
.notes .ni { padding: 14px 22px; max-width: 1100px; margin: 0 auto; }
.notes .nh {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--optimizer); margin-bottom: 6px;
}
.notes .nb { font-size: .95rem; line-height: 1.55; color: var(--ink-2); }
.notes .nn { margin-top: 8px; font-size: .8rem; color: var(--ink-muted); font-family: var(--mono); }

/* ----------------------------------------------------------- grid view */
.gridview {
  position: fixed; inset: 0; z-index: 60; overflow-y: auto;
  background: color-mix(in srgb, var(--page) 96%, transparent);
  backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity .25s;
  padding: 62px 26px 40px;
}
.gridview.open { opacity: 1; pointer-events: auto; }
.gridview h3 { margin: 0 0 18px; font-size: 1.05rem; }
.gridview h3 span { color: var(--ink-muted); font-weight: 400; font-size: .85rem; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 18px; }
.thumb {
  position: relative; cursor: pointer; border-radius: 9px; overflow: hidden;
  border: 1px solid var(--hairline); background: var(--surface-1);
  aspect-ratio: 16 / 9; transition: transform .18s, border-color .18s, box-shadow .18s;
}
.thumb:hover { transform: translateY(-3px); border-color: var(--weight); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
.thumb.current { border-color: var(--activation); box-shadow: 0 0 0 2px var(--activation-w); }
.thumb .tw {
  position: absolute; top: 0; left: 0; width: 1280px; height: 720px;
  transform-origin: top left; pointer-events: none;
}
.thumb .tn {
  position: absolute; left: 0; bottom: 0; right: 0; z-index: 2;
  font-family: var(--mono); font-size: .68rem; padding: 4px 8px;
  background: color-mix(in srgb, var(--page) 80%, transparent);
  color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px;
}
.thumb .tn b { color: var(--ink-muted); font-weight: 600; }
.thumb .fragment { opacity: 1 !important; transform: none !important; }
.thumb .fit > * { animation: none !important; }
.thumb .net .edge { stroke-dasharray: none !important; stroke-dashoffset: 0 !important; animation: none !important; }

/* --------------------------------------------------------- help / black */
.overlay {
  position: fixed; inset: 0; z-index: 80; display: flex;
  align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--page) 92%, transparent);
  backdrop-filter: blur(8px);
  opacity: 0; pointer-events: none; transition: opacity .22s;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.helpcard {
  background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 26px 30px; max-width: 620px;
}
.helpcard h3 { margin-top: 0; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 9px 18px; font-size: .9rem; }
.keys kbd {
  font-family: var(--mono); font-size: .78rem; background: var(--surface-3);
  border: 1px solid var(--hairline); border-bottom-width: 2px;
  border-radius: 5px; padding: 2px 7px; white-space: nowrap;
}
#black {
  position: fixed; inset: 0; z-index: 90; background: #000;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
#black.on { opacity: 1; pointer-events: auto; }

/* ------------------------------------------------ attention heat grid */
/* Used for the score matrix, the causal mask and the softmax output.
   Colour is never the only channel: every cell also carries its number,
   and a masked cell is hatched and reads "−inf". */
.heatwrap { display: inline-block; }
.stage .heat { display: grid; gap: 4px; font-family: var(--mono); }
.stage .heat .hlab {
  font-size: 12px; color: var(--ink-muted); white-space: nowrap;
  display: flex; align-items: center; justify-content: center;
}
.stage .heat .hlab.rw { justify-content: flex-end; padding-right: 7px; }
.stage .heat .hcell {
  height: 40px; border-radius: 5px; font-size: 14px; color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--hairline-2);
  transition: background .35s ease, border-color .3s ease, color .3s ease;
}
.stage .heat .hcell.masked {
  color: var(--ink-muted); border-style: dashed;
  background: repeating-linear-gradient(45deg,
    var(--surface-3), var(--surface-3) 4px,
    var(--surface-2) 4px, var(--surface-2) 8px);
}
.stage .heat .hcell.hot { border-color: var(--ink); }

/* ---------------------------------------------- collective visualiser */
/* Four GPU boxes, one slot per chunk, curved arrows for data in flight.
   The dashes travel, so "moving" is animated rather than implied. */
.collsvg { display: block; width: 100%; }
.collsvg .cslot {
  transition: fill .42s ease, stroke .42s ease;
  transform-box: fill-box; transform-origin: center;
}
.collsvg .cslottext { transition: opacity .3s ease; }
.collsvg .cslot.fresh { animation: slotpop .5s cubic-bezier(.2,.72,.3,1); }
@keyframes slotpop {
  0%   { transform: scale(.84); opacity: .25; }
  62%  { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.collsvg .flowline {
  stroke-dasharray: 7 6;
  animation: flowdash .95s linear infinite;
}
@keyframes flowdash { to { stroke-dashoffset: -26; } }

/* the pipeline occupancy grid needs a lighter touch inside the stage */
.stage .pipecell { font-size: 11px; }
.stage .pipestage, .stage .pipehdr { font-size: 12px; }
.stage .commwhy { font-size: 15px; }
.stage .commop { font-size: 15px; }
.stage .commtensor, .stage .commbytes { font-size: 13px; }
.stage .commphase { font-size: 12px; }
.stage .gpu-head { font-size: 12px; }
.stage .gpu-line { font-size: 13px; }
.stage .shardname { font-size: 12px; }
.stage .shardseg { height: 14px; }

/* -------------------------------------------------- section separators */
/* Signposts, not content. Two things make a separator unmistakable at a
   glance, both when paging and as a thumbnail in the grid:

   1. It is full-bleed. The card covers the whole 1280x720 stage instead of
      sitting inside the 74px gutters every content slide respects.
   2. The surface is INVERTED. --sepbase is mostly --ink, so a separator is a
      pale slab in the dark theme and a near-black slab in the light one,
      and the body text flips to --page. Nothing else in the deck does that.

   On top of the inverted slab sits a wash of the section's OWN tensor
   colour — the backward runs lean on --gradient, the optimizer run on
   --optimizer — with --accent as the neutral wherever no single class owns
   the section. No fifth hue: --sepc is always one of the five variables the
   deck already has, and the class is named in words on the card too, so
   colour never carries the meaning on its own.

   Geometry: the card is the only child of .fit, so .fit collapses to zero
   height and is centred in .inner. Backing out the 74px gutter and half the
   720px stage puts the card exactly over the stage. .fit is the containing
   block because it carries a transform. */
.sepslide {
  position: absolute; top: -360px; left: -74px;
  width: 1280px; height: 720px; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 96px; overflow: hidden;
  --sepc: var(--accent);
  --sepbase: color-mix(in srgb, var(--ink) 82%, var(--page));
  background:
    linear-gradient(118deg,
      color-mix(in srgb, var(--sepc) 32%, var(--sepbase)) 0%,
      color-mix(in srgb, var(--sepc) 11%, var(--sepbase)) 46%,
      var(--sepbase) 100%);
  border-left: 14px solid var(--sepc);
  color: var(--page);
}
.sepslide.sep-weight     { --sepc: var(--weight); }
.sepslide.sep-gradient   { --sepc: var(--gradient); }
.sepslide.sep-activation { --sepc: var(--activation); }
.sepslide.sep-optimizer  { --sepc: var(--optimizer); }

/* the big ghost numeral: part numeral on a part card, section number on a
   topic card. Decorative only — everything it says is also in the kicker. */
.sepslide .sepghost {
  position: absolute; right: 52px; bottom: -64px; z-index: 0;
  font-family: var(--mono); font-weight: 700; font-size: 340px;
  line-height: .78; letter-spacing: -.05em;
  color: var(--page); opacity: .13;
  pointer-events: none; user-select: none;
}
.sepslide.sep-part .sepghost { font-size: 300px; }

.sepslide > *:not(.sepghost) { position: relative; z-index: 1; }

.sepslide .sepkicker {
  font-family: var(--mono); font-size: 17px; letter-spacing: .2em;
  text-transform: uppercase; font-weight: 600; margin-bottom: 16px;
  color: color-mix(in srgb, var(--page) 74%, var(--sepc));
}
.sepslide .septitle {
  font-size: 78px; line-height: 1.02; letter-spacing: -.035em;
  font-weight: 700; margin: 0 0 22px; max-width: 19ch;
  color: var(--page);
}
.sepslide.sep-part .septitle { font-size: 96px; }
.sepslide .sepq {
  font-size: 26px; line-height: 1.38; max-width: 46ch; margin-bottom: 30px;
  color: color-mix(in srgb, var(--page) 84%, var(--ink));
  border-left: 3px solid color-mix(in srgb, var(--page) 55%, transparent);
  padding-left: 18px;
}
.sepslide .seprow {
  display: flex; gap: 12px; flex-wrap: wrap;
  align-items: center; margin-bottom: 20px;
}
.sepslide .sepchip {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--mono); font-size: 15px; padding: 8px 15px;
  border-radius: 999px;
  color: color-mix(in srgb, var(--page) 82%, var(--ink));
  border: 1px solid color-mix(in srgb, var(--page) 32%, transparent);
  background: color-mix(in srgb, var(--ink) 14%, transparent);
}
.sepslide .sepchip b { color: var(--page); font-weight: 600; }
.sepslide .sepchip i {
  width: 11px; height: 11px; border-radius: 3px;
  background: var(--sepc); display: inline-block;
  outline: 1px solid color-mix(in srgb, var(--page) 40%, transparent);
}

/* the "you are here" track: one tick per topic section, in deck order */
.sepslide .sepdots { display: flex; gap: 5px; align-items: center; }
.sepslide .sepdots i {
  width: 22px; height: 6px; border-radius: 3px; display: inline-block;
  background: color-mix(in srgb, var(--page) 22%, transparent);
}
.sepslide .sepdots i.done { background: color-mix(in srgb, var(--page) 52%, transparent); }

<script>
(function () {
"use strict";

const T = NN.T, el = NN.el, f = NN.fmt, fS = NN.fmtSigned, BY = NN.bytes;
const RM = !!(window.matchMedia &&
              window.matchMedia("(prefers-reduced-motion: reduce)").matches);
NN.initTheme();

/* ====================================================== small builders */
function d(cls, kids)      { return el("div", { class: cls }, kids); }
function h(cls, s)         { return el("div", { class: cls, html: s }); }
function frag(e, kind)     { e.classList.add("fragment"); if (kind) e.classList.add(kind); return e; }
function kicker(s)         { return h("kicker", s); }
function title(s, sm)      { return el("h2", { class: "stitle" + (sm ? " sm" : ""), html: s }); }
function lead(s)           { return h("lead", s); }
function say(s)            { return h("say", s); }
function panel(cls, kids)  { return d("panel " + (cls || ""), kids); }
function ph(s)             { return h("ph", s); }
function n_(v, cls, dig)   { return '<span class="num' + (cls ? " v-" + cls : "") + '">' + f(v, dig) + "</span>"; }
function nS_(v, cls, dig)  { return '<span class="num' + (cls ? " v-" + cls : "") + '">' + fS(v, dig) + "</span>"; }
function tn(o)             { return NN.tensor(o); }
function gap(px)           { return el("div", { style: { height: px + "px" } }); }
/* Charts get a written key: colour never carries meaning on its own. */
function chartKey(items) {
  return d("rowflex", items.map(function (it) {
    return el("span", { class: "ckey" }, [
      el("i", { style: { background: it.color } }), it.name]);
  }));
}

/* Class-coloured value, used constantly in prose. */
function W(v, dig)  { return n_(v, "weight", dig); }
function G(v, dig)  { return nS_(v, "gradient", dig); }
function A(v, dig)  { return n_(v, "activation", dig); }
function O(v, dig)  { return n_(v, "optimizer", dig); }

/* ============================================ numbers derived from NN.T */
const HP      = T.meta.hyperparams;
const MEM     = T.memory;
const NPARAM  = MEM.n_params;
const FP32B   = MEM.dtype_bytes.fp32;
const BF16B   = MEM.dtype_bytes.bf16;
const PT      = MEM.per_tensor;
const BYCLS   = MEM.by_class;
const byClass = function (c) { return PT.filter(function (t) { return t.cls === c; }); };

/* Weight / activation / optimizer counts come straight from by_class.
   For gradients we want the parameter gradients only — by_class.gradient
   also counts the transient node gradients (dL/dz1 and friends), which are
   not 1:1 with the parameters. */
const N_W = BYCLS.weight.elements;
const N_G = MEM.param_gradient_elements;
const N_A = BYCLS.activation.elements;
const N_O = BYCLS.optimizer.elements;
const N_GNODE = MEM.node_gradient_elements;
const B_W = BYCLS.weight.bytes_fp32;
const B_G = N_G * FP32B;
const B_A = BYCLS.activation.bytes_fp32;
const B_O = BYCLS.optimizer.bytes_fp32;
const B_GNODE = N_GNODE * FP32B;
const OPT_TENSORS = BYCLS.optimizer.tensors;

/* Bytes-per-parameter recipes come from the trace, not from arithmetic
   done here. The headline mixed-precision recipe is the one holding bf16
   weights, bf16 gradients and an fp32 master copy plus both Adam moments. */
const RECIPES = MEM.recipes;
function recipe(sub) {
  return RECIPES.filter(function (r) { return r.name.indexOf(sub) >= 0; })[0];
}
const R_MIX = RECIPES.filter(function (r) {
  return r.components.weight === BF16B && r.components.gradient === BF16B &&
         r.components.optimizer === FP32B * (1 + OPT_TENSORS);
})[0];
const R_SGD  = recipe("fp32 SGD");
const R_MOM  = recipe("momentum");
const R_ADAM = recipe("fp32 Adam");
const BPP_MIXED = R_MIX.bytes_per_param;

/* -------------------------------------------------- reference configs */
/* Published model shapes and GPU capacities. These are the one set of
   numbers in the project that are quoted rather than derived, so the
   caveat travels with them onto the slides. */
const RC    = T.reference_configs;
const MODEL = RC.models.filter(function (m) { return m.name === RC.default_model; })[0];
const GPUD  = RC.gpus.filter(function (g) { return g.name === RC.default_gpu; })[0];
/* Units. Model, gradient and activation memory are decimal GB (10^9 B) —
   the base NN.bytes uses and the base the literature quotes. Device capacity
   is the one binary quantity in the deck: an "80 GB" card is 80 GiB, and
   wherever it appears next to a decimal figure both bases are stated. */
const GBD   = 1e9;                /* decimal GB, for chart axes            */
const GBY   = NN.gibytes;         /* binary, for device capacity only      */
const CAP   = function (b) { return GBY(b) + " (" + BY(b) + ")"; };
const bn    = NN.count;           /* 70.6e9 -> "70.6B" */
function sourceNote(extra) {
  return h("small muted",
    "Shapes for <b>" + MODEL.name + "</b> and capacity for <b>" + GPUD.name +
    "</b> come from <span class='mono'>T.reference_configs</span> — " +
    RC._source + "." + (extra ? " " + extra : ""));
}

const CFG = {
  name: MODEL.name, d: MODEL.d_model, layers: MODEL.n_layers,
  heads: MODEL.n_heads, kv_heads: MODEL.n_kv_heads || MODEL.n_heads,
  d_ff: MODEL.d_ff || 4 * MODEL.d_model, vocab: MODEL.vocab,
  seq: MODEL.seq, batch: 1, params: MODEL.params   /* batch: scenario choice */
};
CFG.head_dim  = CFG.d / CFG.heads;
CFG.d_kv      = CFG.kv_heads * CFG.head_dim;
CFG.attn_par  = 2 * CFG.d * CFG.d + 2 * CFG.d * CFG.d_kv;
CFG.mlp_par   = 3 * CFG.d * CFG.d_ff;
CFG.layer_par = CFG.attn_par + CFG.mlp_par;
CFG.embed_par = 2 * CFG.vocab * CFG.d;
/* what the shape alone accounts for, versus the published parameter count */
CFG.derived   = CFG.layers * CFG.layer_par + CFG.embed_par;
CFG.stateB    = CFG.params * BPP_MIXED;
CFG.gradB     = CFG.params * R_MIX.components.gradient;
const GPU_B   = GPUD.hbm_bytes;
const GPUS    = Math.ceil(CFG.stateB / GPU_B);

/* ------------------------------------------- the worked transformer block */
/* transformer.js carries the per-family parameter accounting and the
   Korthikanti activation-memory terms. If it is not loaded the deck still
   works: ACT falls back to a clearly-labelled heuristic. */
const XF  = window.TFORMER || null;
const XR  = XF && XF.real
  ? XF.real.models.filter(function (m) { return m.name === MODEL.name; })[0]
  : null;
const XA  = XF ? XF.actmem : null;
const ACTC = XA ? XA.coeff_by_dtype.bf16 : null;

/* activation bytes per layer, Korthikanti Table-2 accounting */
function actLinearPerLayer(seq, batch) {
  return ACTC ? seq * batch * CFG.d * ACTC.linear
              : 10 * seq * batch * CFG.d * BF16B;
}
function actQuadPerLayer(seq, batch) {
  return ACTC ? CFG.heads * seq * seq * batch * ACTC.quad
              : CFG.heads * seq * seq * batch * BF16B;
}
function actFlashPerLayer(seq, batch) {
  return ACTC ? CFG.heads * seq * batch * ACTC.flash_extra : 0;
}
/* what one sequence costs across the whole stack, with FlashAttention on */
CFG.actFlashSeq = CFG.layers *
  (actLinearPerLayer(CFG.seq, 1) + actFlashPerLayer(CFG.seq, 1));
CFG.actFullSeq  = CFG.layers *
  (actLinearPerLayer(CFG.seq, 1) + actQuadPerLayer(CFG.seq, 1));
CFG.actPerSeq   = CFG.actFlashSeq;   /* the honest number: nobody materialises */
CFG.crossBatch  = Math.max(1, Math.ceil(CFG.gradB / CFG.actPerSeq));
CFG.attnMatB    = actQuadPerLayer(CFG.seq, CFG.batch);

/* parameter accounting: the worked breakdown if transformer.js is present,
   our own shape arithmetic otherwise */
const P_LAYER = XR ? XR.exact.per_layer : CFG.layer_par;
const P_ATTN  = XR ? XR.exact.attn      : CFG.attn_par;
const P_MLP   = XR ? XR.exact.mlp       : CFG.mlp_par;
const P_EMBED = XR ? XR.exact.embed + XR.exact.lm_head : CFG.embed_par;
const P_EXACT = XR ? XR.exact.total     : CFG.derived;

/* ================================================== network diagram SVG */
const SV = NN.svg;
function netSVG(o) {
  o = o || {};
  const Wd = 900, Ht = o.height || 290;
  const s = SV("svg", { viewBox: "0 0 " + Wd + " " + Ht, width: "100%",
                        height: Ht, class: "net", role: "img" });
  const cx = [130, 450, 780];
  const ys = [[Ht * .36, Ht * .66], [Ht * .2, Ht * .5, Ht * .8], [Ht * .5]];
  const back = !!o.back;
  const edgeCol = back ? "var(--gradient)" : "var(--weight)";
  let ei = 0;

  function edge(x1, y1, x2, y2, lab, dead) {
    const p = SV("path", {
      class: "edge", d: "M" + x1 + " " + y1 + " C " + (x1 + 90) + " " + y1 +
             ", " + (x2 - 90) + " " + y2 + ", " + x2 + " " + y2,
      stroke: dead ? "var(--ink-muted)" : edgeCol,
      "stroke-opacity": dead ? .3 : .8,
      style: "--e:" + (ei++)
    });
    s.appendChild(p);
    if (lab !== undefined && o.labels !== false) {
      const t = SV("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 6,
                             "text-anchor": "middle", class: "elabel" });
      t.textContent = lab; s.appendChild(t);
    }
  }
  /* input -> hidden */
  for (let j = 0; j < 2; j++) for (let i = 0; i < 3; i++) {
    edge(cx[0] + 26, ys[0][j], cx[1] - 26, ys[1][i], f(T.init.W1[i][j], 2),
         o.dead && i === 2);
  }
  /* hidden -> output */
  for (let i = 0; i < 3; i++) {
    edge(cx[1] + 26, ys[1][i], cx[2] - 26, ys[2][0], f(T.init.W2[0][i], 2),
         o.dead && i === 2);
  }
  function node(x, y, label, val, cls, dead) {
    const g = SV("g", { class: "node" });
    g.appendChild(SV("circle", {
      cx: x, cy: y, r: 26,
      fill: dead ? "var(--surface-2)" : "var(--" + cls + "-w)",
      stroke: dead ? "var(--critical)" : "var(--" + cls + ")",
      "stroke-dasharray": dead ? "4 3" : null
    }));
    const t1 = SV("text", { x: x, y: y + (val !== undefined ? -2 : 5),
                            "text-anchor": "middle", "font-size": "13",
                            fill: dead ? "var(--critical)" : "var(--" + cls + ")" });
    t1.textContent = label; g.appendChild(t1);
    if (val !== undefined) {
      const t2 = SV("text", { x: x, y: y + 13, "text-anchor": "middle",
                              "font-size": "12", fill: "var(--ink-muted)" });
      t2.textContent = f(val, 2); g.appendChild(t2);
    }
    s.appendChild(g);
  }
  const V = o.values;
  node(cx[0], ys[0][0], "x₁", V ? T.forward.x[0] : undefined, "activation");
  node(cx[0], ys[0][1], "x₂", V ? T.forward.x[1] : undefined, "activation");
  for (let i = 0; i < 3; i++) {
    node(cx[1], ys[1][i], "h" + (i + 1),
         V ? T.forward.a1[i] : undefined, "activation", o.dead && i === 2);
  }
  node(cx[2], ys[2][0], "ŷ", V ? T.forward.yhat : undefined, "activation");

  if (o.caption !== false) {
    [["input", cx[0]], ["hidden · ReLU", cx[1]], ["output", cx[2]]].forEach(function (c) {
      const t = SV("text", { x: c[1], y: Ht - 4, "text-anchor": "middle",
                             "font-size": "12", fill: "var(--ink-muted)" });
      t.textContent = c[0]; s.appendChild(t);
    });
  }
  return s;
}

/* =========================================================== the slides */
const SLIDES = [];
function S(o) { SLIDES.push(o); }

/* ==================================================== section separators */
/* A full-bleed signpost before every part and every topic run, so a viewer
   can see at a glance — paging through, or scanning the overview grid —
   where one topic ends and the next begins.

   SECTIONS is the single source of truth. Each card counts itself out of
   this list rather than quoting a hand-typed "3 of 14", and the slide range
   it shows is filled in by finishSections() once every slide has been
   pushed, so inserting or dropping a slide anywhere keeps every separator
   honest. Each section maps to one of the four tensor classes where one
   genuinely owns it, and to --accent where none does; no fifth hue.

   Separators carry no fragments: one key press gets past one. */
const ROMAN = ["", "I", "II", "III"];
const _M2META = (window.TF2 && window.TF2.meta) || {};
const _PAMETA = (window.PARALLEL && window.PARALLEL.meta) || {};

const TOY_MLP  = T.meta.architecture + " · " + NPARAM + " parameters";
const TOY_TF2  = _M2META.n_layers + " stacked pre-LN blocks · " +
                 _M2META.n_params + " parameters · " + _M2META.seq +
                 " tokens × " + _M2META.d_model + " channels";
const TOY_REAL = MODEL.name + " · d = " + CFG.d + " · " + CFG.layers +
                 " layers · " + bn(CFG.params) + " parameters";
const TOY_PAR  = _PAMETA.world + " simulated GPUs · " +
                 (_PAMETA.dims || []).join("→") + " MLP · " +
                 _PAMETA.n_params + " parameters";

const SECTIONS = [
  /* ------------------------------------------------------------- Part I */
  { id: "part1", kind: "part", part: 1, title: "The Mechanics", cls: "accent",
    q: "What is one training step actually made of, byte for byte?",
    toy: TOY_MLP, toyNew: true,
    say: "Part one opens. Everything here happens on a model with " + NPARAM +
      " parameters, small enough that every number on every slide is a real " +
      "number out of a real trace rather than an illustration. Say what the " +
      "part delivers: by the end of it they can name every tensor a training " +
      "step touches, say which of four classes it belongs to, and say when it " +
      "is born and when it is allowed to die. Pause here — this is the moment " +
      "to ask who in the room has written a backward pass by hand." },

  { id: "forward", part: 1, title: "Forward", cls: "activation",
    q: "How do a handful of weights turn two numbers into one prediction?",
    toy: TOY_MLP,
    say: "The forward pass. Nothing in this run is difficult, and that is the " +
      "point — a matmul is multiply, add, repeat, and we are going to do every " +
      "one of them out loud. Flag what to watch for: one hidden unit comes out " +
      "negative, and that single fact gets cashed in three separate times " +
      "before the deck ends. Take questions on notation now, before the " +
      "arithmetic starts." },

  { id: "backward", part: 1, title: "Backward", cls: "gradient",
    q: "Where does a gradient come from, and what does computing one force you to remember?",
    toy: TOY_MLP,
    say: "The backward pass, and the argument the whole deck rests on. Ask the " +
      "room to watch the READS line on every step: some steps need only the " +
      "gradient flowing in from the right, and some have to re-read a tensor " +
      "the forward pass produced. The second kind is the entire reason " +
      "activation memory exists. Pause and let people predict which steps " +
      "those will be before you walk them." },

  { id: "optimizer", part: 1, title: "Optimizer", cls: "optimizer",
    q: "Given a gradient, how does a parameter actually move — and what does the move cost?",
    toy: TOY_MLP,
    say: "Optimizers, in increasing order of memory: SGD keeps nothing, " +
      "momentum keeps one tensor per parameter, Adam keeps two plus an fp32 " +
      "master copy. The punchline is the bytes-per-parameter figure at the end " +
      "of the run — " + BPP_MIXED + " bytes — and it is worth letting people " +
      "guess it before you show it. Almost everyone guesses two." },

  { id: "memory", part: 1, title: "Lifetimes & Memory", cls: "accent",
    q: "When is each tensor born, and when is it allowed to die?",
    toy: TOY_MLP,
    say: "The synthesis run for part one: four classes, four lifetimes, and " +
      "one curve of resident bytes across a single iteration. If people take " +
      "away one picture from the first half of this deck it should be that " +
      "curve. Pause — this is the natural break before the model changes." },

  /* ------------------------------------------------------------ Part II */
  { id: "part2", kind: "part", part: 2, title: "A Real Transformer", cls: "accent",
    q: "What changes when the layer is attention instead of a matmul?",
    toy: TOY_TF2, toyNew: true,
    say: "New model, same discipline. From here the object is two stacked " +
      "pre-LN transformer blocks — " + (_M2META.n_params || "a few hundred") +
      " parameters, " + (_M2META.seq || 3) + " tokens, " +
      (_M2META.d_model || 4) + " channels — still small enough that every " +
      "matrix fits on a slide and every number is generated rather than drawn. " +
      "Set the expectation clearly: nothing from part one becomes wrong here. " +
      "It gets bigger and it gains two new shapes, LayerNorm and softmax. " +
      "Questions on the toy's dimensions now, please." },

  { id: "tfforward", part: 2, title: "Transformer Forward", cls: "activation",
    q: "What does attention actually compute, number by number?",
    toy: TOY_TF2,
    say: "The long run. A token goes from the residual stream through " +
      "LayerNorm, Q/K/V, the head split, raw scores, the scale, the causal " +
      "mask, softmax, the value average, the output projection and the MLP — " +
      "and then all of it again, because there are two blocks. Tell people up " +
      "front they can follow one number, channel 0 of token 0, the whole way " +
      "down. Take questions here; there is no good place to stop once it " +
      "starts." },

  { id: "tfbackward", part: 2, title: "Transformer Backward", cls: "gradient",
    q: "What does the chain rule look like through LayerNorm and softmax?",
    toy: TOY_TF2,
    say: "Backward through the same two blocks, derived by hand and checked " +
      "against finite differences. Two results earn the run on their own: " +
      "LayerNorm's gradient has two correction terms the naive answer misses, " +
      "and the softmax Jacobian is dense, which is why every row of dS sums to " +
      "exactly zero. Both are shown on real numbers. Pause here — this is the " +
      "hardest stretch in the deck and people will want to ask." },

  { id: "cost", part: 2, title: "What It Costs", cls: "weight",
    q: "How much memory does a real transformer need, and which term explodes first?",
    toy: TOY_REAL, toyNew: true,
    say: "The mechanism is behind us; now we price it. Same block, real " +
      "dimensions: " + MODEL.name + " at d = " + CFG.d + ". The activation " +
      "census first — which saved tensors grow with sequence length and which " +
      "grow with its square — then parameter counting in terms of d_model, " +
      "then bytes per parameter. This run motivates every single thing in " +
      "part three, so do not rush it." },

  /* ----------------------------------------------------------- Part III */
  { id: "part3", kind: "part", part: 3, title: "Many GPUs", cls: "accent",
    q: "When one card is not enough, which of the four classes do you stop replicating?",
    toy: TOY_PAR, toyNew: true,
    say: "Part three. The model changes again — back to an MLP, because the " +
      "subject is now the communication rather than the layer — running on " +
      (_PAMETA.world || 4) + " simulated GPUs with every collective and every " +
      "per-GPU tensor recorded. Every strategy in this part is proven " +
      "numerically to reproduce the single-GPU answer; none of it is asserted. " +
      "Take a break here if you are taking one." },

  { id: "collectives", part: 3, title: "Collectives", cls: "accent",
    q: "What are the primitives that every parallel strategy is built out of?",
    toy: TOY_PAR,
    say: "Vocabulary first, one slide per operation, animated on four GPUs. " +
      "Two facts have to land: all-reduce is exactly reduce-scatter followed " +

let SEP_END = 0;

/** The card itself. Full-bleed, one child of .fit, no fragments. */
function sepCard(s) {
  const topics = SECTIONS.filter(function (x) { return x.kind !== "part"; });
  const parts  = SECTIONS.filter(function (x) { return x.kind === "part"; });
  const isPart = s.kind === "part";
  const pos    = topics.indexOf(s) + 1;

  /* The swatch is decorative, so the class it stands for is written out
     beside it — colour never carries meaning on its own in this project. */
  const chips = [
    d("sepchip", [el("i", { title: "section colour: " + s.cls }),
      el("span", { html: (isPart
        ? "part <b>" + ROMAN[s.part] + "</b> of <b>" + parts.length + "</b>"
        : "section <b>" + pos + "</b> of <b>" + topics.length + "</b>") +
        " · " + (s.cls === "accent" ? "neutral" : s.cls) })]),
    d("sepchip", [el("span", { html:
      "slides <b>" + s.first + "–" + s.last + "</b> of " + SEP_END })]),
    d("sepchip", [el("span", { html:
      (s.toyNew ? "new model · " : "model · ") + "<b>" + s.toy + "</b>" })])
  ];

  /* One tick per topic section. On a topic card the current section is lit
     and the ones behind it are half-lit; on a part card every section that
     belongs to the part is lit at once, which is what the part covers. */
  const dots = d("sepdots", topics.map(function (x, i) {
    const on = isPart ? x.part === s.part : x === s;
    const past = isPart ? x.part < s.part : i < pos - 1;
    return el("i", { class: on ? "here" : (past ? "done" : ""),
                     title: (i + 1) + ". " + x.title });
  }));

  return d("sepslide sep-" + s.cls + (isPart ? " sep-part" : ""), [
    h("sepghost", isPart ? ROMAN[s.part] : String(pos)),
    h("sepkicker", isPart
      ? "Part " + ROMAN[s.part]
      : "Part " + ROMAN[s.part] + " · section " + pos + " of " + topics.length),
    el("h2", { class: "septitle", html: s.title }),
    h("sepq", s.q),
    d("seprow", chips),
    dots
  ]);
}

/** Push one separator. Records where it landed so ranges can be derived. */
function SEP(id) {
  const s = SECTIONS.filter(function (x) { return x.id === id; })[0];
  s.index = SLIDES.length;
  S({
    chapter: s.kind === "part"
      ? "Part " + ROMAN[s.part]
      : "Part " + ROMAN[s.part] + " · " + s.title,
    plain: (s.kind === "part" ? "PART " + ROMAN[s.part] + " — " : "— ") +
           s.title.toUpperCase() + (s.kind === "part" ? "" : " —"),
    notes: s.say,
    build: function () { return [sepCard(s)]; }
  });
}

/** Run once, after the last slide has been pushed and before the deck is
    built: fills in each card's slide range and appends it to its notes. */
function finishSections() {
  const placed = SECTIONS.filter(function (x) { return x.index !== undefined; });
  const parts  = placed.filter(function (x) { return x.kind === "part"; });
  placed.forEach(function (s, i) {
    const nxt = placed[i + 1];
    s.first = s.index + 2;
    s.last  = nxt ? nxt.index : SEP_END;
  });
  parts.forEach(function (s, i) {
    const nxt = parts[i + 1];
    s.last = nxt ? nxt.index : SEP_END;
  });
  placed.forEach(function (s) {
    SLIDES[s.index].notes = s.say + "  ——  Signpost only: it covers slides " +
      s.first + "–" + s.last + " of " + SEP_END + " and has no build steps, " +
      "so one key press gets past it.";
  });
}

/* --------------------------------------- 9-11. one hidden unit at a time */
function z1Slide(i) {
  const wk = T.forward.z1_work[i];
  const dead = wk.out < 0;
  return {
    chapter: "Forward · hidden unit " + (i + 1),
    plain: "z1[" + i + "] = " + f(wk.out, 2) + (dead ? "  (negative)" : ""),
    notes: "Hidden unit " + (i + 1) + ". Two multiplies, one add, one bias. " +
      "This is a matrix-vector product done by hand: row " + i + " of W1 against " +
      "x. " + (dead
        ? "This one comes out negative — " + f(wk.out, 2) + " — and that single " +
          "fact will echo through the entire rest of the deck."
        : "Nothing exotic; the only reason to show it is so that nobody thinks " +
          "there is anything hidden inside a matmul."),
    build: function (ctx) {
      ctx.W1 = tn({ name: "W1", shape: [3, 2], values: T.init.W1, cls: "weight", digits: 2 });
      ctx.x  = tn({ name: "x", shape: [2], values: T.forward.x, cls: "activation", digits: 2 });
      ctx.b1 = tn({ name: "b1", shape: [3], values: T.init.b1, cls: "weight", digits: 2 });
      ctx.acc = h("bignum v-activation", "0");
      ctx.accLabel = h("small muted", "accumulator");
      ctx.wk = wk;
      const prods = wk.products.map(function (p, k) {
        return frag(NN.formula({
          rule: "W1[" + i + "][" + k + "] × x[" + k + "]",
          sub: W(p.w, 2) + " × " + A(p.x, 2),
          result: f(p.prod, 4), cls: "activation"
        }), "f-right");
      });
      return [
        kicker("Forward · multiply, accumulate"),
        title("z1[" + i + "] &nbsp;=&nbsp; W1[" + i + "] · x + b1[" + i + "]", true),
        d("cols wide-r", [
          d("stack", [
            d("rowflex top", [ctx.W1, ctx.x, ctx.b1]),
            panel("a tight", [ctx.accLabel, ctx.acc])
          ]),
          d("stack", prods.concat([
            frag(NN.formula({ rule: "sum of products",
              sub: wk.products.map(function (p) { return f(p.prod, 2); }).join(" + "),
              result: f(wk.sum_of_products, 4), cls: "activation" }), "f-right"),
            frag(NN.formula({ rule: "+ bias b1[" + i + "]",
              sub: f(wk.sum_of_products, 4) + " + " + W(wk.bias, 2),
              result: f(wk.out, 4), cls: "activation" }), "f-right"),
            frag(dead
              ? h("deadflag", "z1[" + i + "] = " + f(wk.out, 2) + " — negative. " +
                  "Remember this number.")
              : h("pill", "z1[" + i + "] = " + f(wk.out, 2)), "f-pop")
          ]))
        ])
      ];
    },
    render: function (n, ctx) {
      const hot = [];
      for (let k = 0; k < Math.min(n, 2); k++) hot.push([i, k]);
      ctx.W1.highlight(hot.length ? hot : null, hot.length > 0);
      ctx.x.highlight(hot.length ? hot.map(function (p) { return [p[1], 0]; }) : null,
                      hot.length > 0);
      ctx.b1.highlight(n >= 4 ? [[i, 0]] : null, n >= 4);
      let v = 0, lab = "accumulator";
      if (n >= 1) v = ctx.wk.products[0].prod;
      if (n >= 2) v = ctx.wk.products[0].prod + ctx.wk.products[1].prod;
      if (n >= 3) { v = ctx.wk.sum_of_products; lab = "sum of products"; }
      if (n >= 4) { v = ctx.wk.out; lab = "z1[" + i + "] — pre-activation"; }
      ctx.acc.textContent = f(v, 4);
      ctx.accLabel.textContent = lab;
    }
  };
}
S(z1Slide(0)); S(z1Slide(1)); S(z1Slide(2));

/* ------------------------------------------------------------ 12. ReLU */
S({
  chapter: "Forward · ReLU", plain: "ReLU kills unit 3 — the dead unit",
  notes: "ReLU is max(0, z), applied elementwise. Units one and two pass " +
    "through untouched. Unit three had a pre-activation of " +
    f(T.forward.z1[2], 2) + ", so it becomes exactly zero. Two consequences, " +
    "both of which we will cash in later: it contributes nothing to the " +
    "prediction, and it will receive exactly zero gradient. Also point at the " +
    "mask — one bit per unit — which the framework has to keep.",
  build: function (ctx) {
    ctx.z1 = tn({ name: "z1", shape: [3], values: T.forward.z1, cls: "activation",
                  digits: 2, note: "pre-activation" });
    ctx.a1 = tn({ name: "a1", shape: [3], values: T.forward.a1, cls: "activation",
                  digits: 2, note: "post-activation" });
    ctx.mk = tn({ name: "relu_mask", shape: [3], values: T.forward.relu_mask,
                  cls: "activation", digits: 0, note: "1 = alive" });
    return [
      kicker("Forward · the nonlinearity"),
      title("<span class='mono'>a1 = max(0, z1)</span>", true),
      d("cols wide-l", [
        frag(d("rowflex top", [ctx.z1, h("ar", "→"), ctx.a1, ctx.mk]), "f-fade"),
        d("stack", [
          frag(NN.formula({ rule: "relu(z1[2])", sub: "max(0, " + f(T.forward.z1[2], 2) + ")",
                            result: f(T.forward.a1[2], 0), cls: "activation" }), "f-right"),
          frag(h("deadflag", "Unit 3 is dead for this input."), "f-pop")
        ])
      ]),
      frag(d("cols", [
        NN.callout("why", "It cannot affect the prediction",
          "a1[2] = " + A(T.forward.a1[2], 0) + ", so whatever W2[0][2] = " +
          W(T.init.W2[0][2], 2) + " happens to be, that path contributes " +
          f(T.init.W2[0][2] * T.forward.a1[2], 0) + " to the output."),
        NN.callout("mem", "The mask is not free",
          "Backward needs to know <em>which</em> units were alive. That is " +
          T.forward.relu_mask.length + " more values here; in a transformer it is " +
          "one byte or one bit per activation element, kept from forward until " +
          "backward.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    ctx.z1.highlight(n >= 1 ? [[2, 0]] : null, false);
    ctx.a1.highlight(n >= 1 ? [[2, 0]] : null, false);
    ctx.mk.highlight(n >= 1 ? [[2, 0]] : null, false);
  }
});

/* -------------------------------------------------------- 13. output layer */
S({
  chapter: "Forward · output", plain: "ŷ = W2·a1 + b2 = " + f(T.forward.yhat, 2),
  notes: "The output layer is one more dot product. Land hard on the third " +
    "term: W2[0][2] times a1[2] is " + f(T.init.W2[0][2], 2) + " times zero, " +
    "which is zero. The dead unit is not merely small — it is arithmetically " +
    "absent. And there is no activation function on the output, because we are " +
    "predicting an unbounded real number.",
  build: function (ctx) {
    const wk = T.forward.z2_work[0];
    ctx.W2 = tn({ name: "W2", shape: [1, 3], values: T.init.W2, cls: "weight", digits: 2 });
    ctx.a1 = tn({ name: "a1", shape: [3], values: T.forward.a1, cls: "activation", digits: 2 });
    const prods = wk.products.map(function (p, k) {
      const zero = p.prod === 0;
      return frag(NN.formula({
        rule: "W2[0][" + k + "] × a1[" + k + "]" + (zero ? "   ← the dead unit" : ""),
        sub: W(p.w, 2) + " × " + A(p.x, 2),
        result: f(p.prod, 4), cls: zero ? "gradient" : "activation"
      }), "f-right");
    });
    return [
      kicker("Forward · output layer"),
      title("ŷ &nbsp;=&nbsp; W2 · a1 + b2", true),
      d("cols wide-r", [
        d("stack", [
          frag(d("rowflex top", [ctx.W2, ctx.a1]), "f-fade"),
          frag(h("deadflag", f(wk.products[2].w, 2) + " × " + f(wk.products[2].x, 1) + " = " +
            f(wk.products[2].prod, 0) + " — the third path is arithmetically absent"), "f-pop")
        ]),
        d("stack", prods.concat([
          frag(NN.formula({ rule: "sum + b2",
            sub: f(wk.sum_of_products, 4) + " + " + W(wk.bias, 2),
            result: f(wk.out, 4), cls: "activation" }), "f-right")
        ]))
      ])
    ];
  },
  render: function (n, ctx) {
    const k = Math.min(n, 3);
    const hot = []; for (let i = 0; i < k; i++) hot.push([0, i]);
    ctx.W2.highlight(hot.length ? hot : null, hot.length > 0);
    ctx.a1.highlight(hot.length ? hot.map(function (p) { return [p[1], 0]; }) : null,
                     hot.length > 0);
  }
});

/* ------------------------------------------------------- 14. prediction */
S({
  chapter: "Forward · prediction", plain: "The prediction is wrong: " + f(T.forward.yhat, 2) + " vs " + f(T.forward.y, 1),
  notes: "Here is the whole point of the forward pass: a number to be wrong " +
    "about. We predicted " + f(T.forward.yhat, 2) + " hundred thousand dollars " +
    "against a true price of " + f(T.forward.y, 1) + ". The error is " +
    f(T.forward.error, 2) + " — and crucially it is signed. The sign says " +
    "which direction to move; the magnitude says how far.",
  build: function () {
    return [
      kicker("Forward · the result"),
      title("A prediction, and how wrong it is"),
      frag(d("cols3", [
        panel("a", [ph("prediction ŷ"), h("bignum v-activation", f(T.forward.yhat, 2))]),
        panel("acc", [ph("truth y"), h("bignum", f(T.forward.y, 2))]),
        panel("g", [ph("error  ŷ − y"), h("bignum v-gradient", fS(T.forward.error, 2))])
      ]), "f-pop"),
      frag(say("The model predicted a <b>negative</b> price. That is what an " +
        "untrained network does: the weights were chosen without ever having " +
        "seen a house."), "f-fade"),
      frag(NN.callout("key", "The sign is the useful part",
        "An error of " + G(T.forward.error, 2) + " says: the prediction is too " +
        "low, by a lot. Backpropagation is the machinery for splitting that one " +
        "signed number across all " + NPARAM + " parameters, in proportion to " +
        "how much each of them contributed."))
    ];
  }
});

/* ------------------------------------------------------------- 15. loss */
S({
  chapter: "Loss", plain: "Loss = (ŷ − y)² = " + f(T.forward.loss, 4),
  notes: "Squaring does two jobs: it makes the error positive so that errors " +
    "in both directions count as bad, and it punishes big misses more than " +
    "small ones. The parabola on the right is the loss as a function of the " +
    "prediction; we are sitting on the left arm of it, far from the bottom. " +
    "Training is the process of sliding down that curve — except in " + NPARAM +
    " dimensions instead of one.",
  build: function () {
    const pts = [];
    for (let v = -2.2; v <= 3.3; v += 0.11) pts.push([v, (v - T.forward.y) * (v - T.forward.y)]);
    const chart = NN.chart.line({
      series: [
        { name: "(ŷ − y)²", color: "var(--accent)", points: pts, dots: false },
        { name: "we are here", color: "var(--activation)",
          points: [[T.forward.yhat, T.forward.loss]] }
      ],
      width: 560, height: 250, xlabel: "prediction ŷ", ylabel: "loss"
    });
    return [
      kicker("Loss"),
      title("One number that says how bad the whole thing is", true),
      d("cols", [
        d("stack", [
          frag(NN.formula({ rule: "L = (ŷ − y)²",
            sub: "(" + f(T.forward.yhat, 2) + " − " + f(T.forward.y, 1) + ")²",
            result: f(T.forward.loss, 4), cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "= error²",
            sub: "(" + f(T.forward.error, 2) + ")²",
            result: f(T.forward.loss, 4), cls: "gradient" }), "f-left"),
          frag(NN.callout("why", "Why square it",
            "Squaring makes both directions of error costly, and makes big " +
            "misses hurt disproportionately. It also has a very convenient " +
            "derivative — <span class='mono'>2(ŷ − y)</span> — which is the " +
            "first thing the backward pass computes."), "f-left")
        ]),
        frag(d("panel g", [ph("the loss surface, in one dimension"), chart,
          chartKey([{ name: "(ŷ − y)² for any prediction", color: "var(--accent)" },
                    { name: "our ŷ = " + f(T.forward.yhat, 2), color: "var(--activation)" }])]), "f-right")
      ])
    ];
  }
});

/* -------------------------------------------------- 16. why one scalar */
S({
  chapter: "Loss", plain: "Why the loss must be a single scalar",
  notes: "This is a question people rarely ask and always benefit from. A " +
    "derivative dL/dθ only makes sense if L is one number: 'if I nudge this " +
    "one parameter, how much does that one number change?' If the loss were a " +
    "vector you would get a Jacobian per parameter and no way to rank two " +
    "candidate updates. The whole of training is: collapse everything to one " +
    "scalar, then take " + NPARAM + " partial derivatives of it.",
  build: function () {
    return [
      kicker("Loss"),
      title("Everything funnels through one number"),
      frag(d("arrowline", [
        panel("a tight", [ph(NPARAM + " parameters"), h("midnum v-weight", String(NPARAM))]),
        h("ar", "→"),
        panel("a tight", [ph("one prediction"), h("midnum v-activation", f(T.forward.yhat, 2))]),
        h("ar", "→"),
        panel("g tight", [ph("one scalar loss"), h("midnum v-gradient", f(T.forward.loss, 4))]),
        h("ar", "⇢"),
        frag(panel("g tight", [ph("back out: " + NPARAM + " partials"),
          h("midnum v-gradient", "∂L/∂θᵢ")]), "f-pop")
      ]), "f-fade"),
      frag(NN.callout("key", "A derivative needs a scalar",
        "<span class='mono'>∂L/∂θᵢ</span> asks: if I nudge parameter i, how much " +
        "does L change? That question only has a single answer when L is a " +
        "single number. Multi-objective training does exist — it just weights " +
        "the objectives into one scalar first."), "f-fade"),
      frag(d("cols", [
        NN.tiles([{ k: "loss", v: f(T.forward.loss, 4), s: "one scalar", cls: "gradient" }]),
        NN.tiles([{ k: "gradients to compute", v: String(NPARAM),
                    s: "one per parameter", cls: "gradient" }])
      ]))
    ];
  }
});

SEP("backward");

/* ============================================== backward pass machinery */
const STEPS = T.backward.steps;
const NSTEP = STEPS.length;
const SAVED_KEYS = Object.keys(T.forward.saved_for_backward);
const READ_SRC = {
  x:         { values: T.forward.x,          cls: "activation", shape: [2],
               why: "the layer input, saved during the forward pass" },
  a1:        { values: T.forward.a1,         cls: "activation", shape: [3],
               why: "the hidden activation, saved during the forward pass" },
  relu_mask: { values: T.forward.relu_mask,  cls: "activation", shape: [3],
               why: "which units were alive, saved during the forward pass" },
  W2:        { values: T.init.W2,            cls: "weight",     shape: [1, 3],
               why: "a live parameter — nothing had to be saved for this one" }
};
function isSaved(name) { return SAVED_KEYS.indexOf(name) >= 0; }

/* -------------------------------------------------- 17. backward plan */
S({
  chapter: "Backward pass", plain: "The plan: " + NSTEP + " steps, right to left",
  notes: "Before we walk it, the shape of the thing. Backpropagation is the " +
    "chain rule applied " + NSTEP + " times, from the loss backwards to the " +
    "first weight matrix. Each step takes the gradient that arrived from its " +
    "right and produces the gradient to pass further left, plus — if it owns " +
    "parameters — the gradient for those. Keep an eye on the READS line on " +
    "each of the next " + NSTEP + " slides; that is the whole argument of this deck.",
  build: function () {
    const chain = STEPS.map(function (s, i) {
      return frag(d("pill" + (s.reads.some(isSaved) ? " hot" : ""),
        (i + 1) + ". " + s.label + (s.reads.length ? "  ← " + s.reads.join(", ") : "")), "f-pop");
    });
    return [
      kicker("Backward pass"),
      title("The chain rule, " + NSTEP + " times, in reverse order"),
      frag(netSVG({ height: 230, back: true, dead: true, labels: false, values: true }), "f-fade"),
      d("rowflex", chain),
      frag(NN.callout("key", "Read the arrows on the left of each step",
        "Some steps need nothing but the gradient flowing in. Others must " +
        "re-read a tensor that the <em>forward</em> pass produced. Those are the " +
        "reason activation memory exists, and the reason it scales with batch " +
        "size and sequence length."), "f-fade")
    ];
  }
});

/* ------------------------------------------ 18..(17+NSTEP). one per step */
/* Presenter framing per step, keyed by the id in the trace. The factual
   note always comes from T.backward.steps[i].note. */
const STEP_SAY = {
  dL_dyhat: "Where every gradient in the network comes from. The derivative of " +
    "a square is two times the thing, and the thing is the signed error. Note " +
    "it is bigger than the error itself — the 2 is real and it propagates.",
  dL_dz2: "A free step, and worth saying so. The output has no activation " +
    "function, so the gradient passes through untouched. In a network with a " +
    "sigmoid or softmax head this is where that derivative would appear.",
  dL_dW2: "The first weight gradient, and the first time backward has to look " +
    "backwards in time. Say the sentence explicitly: to know how much a weight " +
    "is to blame, you have to know what it was multiplied by.",
  dL_db2: "Biases are the easy case. A bias adds itself in with a coefficient " +
    "of one, so its derivative is one, so it simply receives whatever arrived. " +
    "No saved tensor needed — which is why bias gradients are never the " +
    "memory problem.",
  dL_da1: "The gradient crosses a layer boundary. This one reads the weights, " +
    "not an activation — and the weights are live parameters we are keeping " +
    "anyway. Contrast the two rules: input-gradient uses the weights, " +
    "weight-gradient uses the input.",
  dL_dz1: "The ReLU derivative is a gate: one where the unit was alive, zero " +
    "where it was clamped. That means backward must know which units were " +
    "alive, which means the mask had to be saved. And here is where the dead " +
    "unit's gradient becomes exactly zero.",
  dL_dW1: "The same rule as dL/dW2, one layer down, and the same dependency on " +
    "a saved tensor — this time the network input itself. Point at the third " +
    "row while you say it: two zeros, because the incoming gradient for that " +
    "unit was zero.",
  dL_db1: "The last step, and the cheapest. Every bias gradient in the network " +
    "is just the gradient of its own pre-activation. We now have all " +
    NPARAM + " numbers and the backward pass is finished."
};
STEPS.forEach(function (st, si) {
  const arr = Array.isArray(st.value);
  const flat = arr ? [].concat.apply([], st.value) : [st.value];
  const readsSaved = st.reads.some(isSaved);
  S({
    chapter: "Backward · step " + (si + 1) + " of " + NSTEP,
    plain: st.label + " = " + (arr
      ? "[" + flat.map(function (v) { return f(v, 2); }).join(", ") + "]"
      : fS(st.value, 3)),
    notes: st.note + "  ——  " + STEP_SAY[st.id] + (readsSaved
      ? "  ——  Stop here. This step cannot be computed from the incoming " +
        "gradient alone: it re-reads " + st.reads.join(" and ") + ", a tensor " +
        "the forward pass produced and the framework has been holding in " +
        "memory ever since."
      : ""),
    build: function (ctx) {
      const valNode = arr
        ? tn({ name: st.label, values: st.value, cls: "gradient", digits: 4, signed: true })
        : h("bignum v-gradient", fS(st.value, 4));

      const readNodes = st.reads.length
        ? st.reads.map(function (r) {
            const src = READ_SRC[r];
            return d("readbox" + (isSaved(r) ? "" : " wgt"), [
              h("rt", isSaved(r)
                ? "READS SAVED ACTIVATION · " + r
                : "READS LIVE PARAMETER · " + r),
              d("rowflex", [
                tn({ name: r, shape: src.shape, values: src.values, cls: src.cls, digits: 2 }),
                h("say", src.why)
              ])
            ]);
          })
        : [d("readbox none", [h("rt", "READS NOTHING SAVED"),
            h("say", "Only the gradient flowing in from the right.")])];

      return [
        kicker("Backward · step <b>" + (si + 1) + " / " + NSTEP + "</b> · " +
               "<span class='mono'>" + st.id + "</span>"),
        title("<span class='mono v-gradient'>" + st.label + "</span>", true),
        d("cols wide-l", [
          d("stack", [
            frag(NN.formula({ rule: st.formula, cls: "gradient" }), "f-left"),
            frag(NN.formula({ rule: "substitute", sub: st.substitution, cls: "gradient" }), "f-left"),
            frag(d("panel g", [ph("result · " + st.label), valNode]), "f-pop")
          ]),
          d("stack", readNodes.map(function (rn, k) {
            return frag(rn, "f-right");
          }))
        ]),
        frag(h("say", st.note), "f-fade")
      ];
    }
  });
});

/* ------------------------------------------------- the thesis slide */
S({
  chapter: "Backward pass · the thesis", plain: "Backward reads forward. That is why activations are stored.",
  notes: "This is the single most important slide in the deck. Of the " + NSTEP +
    " backward steps, " + STEPS.filter(function (s) { return s.reads.some(isSaved); }).length +
    " re-read a tensor produced during the forward pass. A weight gradient is " +
    "always the incoming gradient times the saved input. So the framework " +
    "cannot free x, a1 or the ReLU mask when the forward pass ends — it has to " +
    "hold them until backward consumes them. That is activation memory, and " +
    "unlike weight memory it scales with batch size and sequence length.",
  build: function () {
    const rows = STEPS.map(function (s) {
      const saved = s.reads.some(isSaved);
      return el("tr", {}, [
        el("td", {}, s.label),
        el("td", { style: { textAlign: "left" }, html: s.reads.length
          ? s.reads.map(function (r) {
              return "<span class='mono " + (isSaved(r) ? "v-activation" : "v-weight") +
                     "'>" + r + "</span>";
            }).join(", ")
          : "<span class='muted'>—</span>" }),
        el("td", { style: { textAlign: "left" }, html: saved
          ? "<span class='v-activation'>saved from forward</span>"
          : (s.reads.length ? "<span class='v-weight'>live parameter</span>"
                            : "<span class='muted'>incoming gradient only</span>") })
      ]);
    });
    const nSaved = STEPS.filter(function (s) { return s.reads.some(isSaved); }).length;
    return [
      kicker("The thesis"),
      el("h2", { class: "stitle", html:
        "The backward pass <span class='v-activation'>re-reads</span> the forward pass." }),
      d("cols wide-l", [
        frag(d("panel a", [
          ph("what each of the " + NSTEP + " steps had to read"),
          el("table", { class: "data" }, [
            el("thead", {}, el("tr", {}, [
              el("th", {}, "step"), el("th", { style: { textAlign: "left" } }, "reads"),
              el("th", { style: { textAlign: "left" } }, "kind")])),
            el("tbody", {}, rows)
          ])
        ]), "f-left"),
        d("stack", [
          frag(NN.tiles([
            { k: "steps", v: String(NSTEP), s: "chain-rule links" },
            { k: "read a saved activation", v: String(nSaved),
              s: SAVED_KEYS.join(", "), cls: "activation" }
          ]), "f-right"),
          frag(NN.callout("mem", "This is the whole argument",
            "A weight gradient is <em>always</em> the incoming gradient times " +
            "the saved input: <span class='mono'>dL/dW = dL/dz ⊗ inputᵀ</span>. " +
            "So the input has to still be there. The forward pass cannot free " +
            "its outputs — it has to hand them to the backward pass, which may " +
            "not run for milliseconds."), "f-right"),
          frag(NN.callout("warn", "And it scales with the batch, not the model",
            "Weights are fixed by the architecture. Activations are " +
            "<span class='mono'>batch × sequence × hidden</span> per layer. " +
            "Double the batch and weight memory does not move — activation " +
            "memory doubles."), "f-right")
        ])
      ])
    ];
  }
});

/* ----------------------------------------------- the dead unit's gradient */
S({
  chapter: "Backward · the dead unit", plain: "The dead unit's gradient is exactly zero",
  notes: "Cash in the promise from the forward pass. Unit 3 had a " +
    "pre-activation of " + f(T.forward.z1[2], 2) + ", ReLU clamped it to zero, " +
    "so the mask entry is zero, so dL/dz1[2] is zero, so the entire row of " +
    "dL/dW1 for that unit is zero — not small, exactly zero. It contributed " +
    "nothing to the prediction, so it takes none of the blame. And because SGD " +
    "multiplies the gradient by the learning rate, those weights will not move " +
    "this step. If the unit stays negative for every input, it never moves again.",
  build: function (ctx) {
    ctx.dW1 = tn({ name: "dL/dW1", shape: [3, 2], values: T.backward.dL_dW1,
                   cls: "gradient", digits: 3, signed: true });
    ctx.db1 = tn({ name: "dL/db1", shape: [3], values: T.backward.dL_db1,
                   cls: "gradient", digits: 3, signed: true });
    ctx.mk  = tn({ name: "relu_mask", shape: [3], values: T.forward.relu_mask,
                   cls: "activation", digits: 0 });
    return [
      kicker("The dead unit"),
      title("Row 2 of <span class='mono'>dL/dW1</span> is <span class='v-gradient'>[0, 0]</span>", true),
      d("cols wide-l", [
        frag(d("rowflex top", [ctx.dW1, ctx.db1, ctx.mk]), "f-fade"),
        d("stack", [
          frag(NN.formula({ rule: "dL/dz1[2] = dL/da1[2] × mask[2]",
            sub: fS(T.backward.dL_da1[2], 3) + " × " + f(T.forward.relu_mask[2], 0),
            result: f(T.backward.dL_dz1[2], 0), cls: "gradient" }), "f-right"),
          frag(NN.formula({ rule: "dL/dW1[2] = dL/dz1[2] ⊗ xᵀ",
            sub: f(T.backward.dL_dz1[2], 0) + " × [" +
                 T.forward.x.map(function (v) { return f(v, 1); }).join(", ") + "]",
            result: "[" + T.backward.dL_dW1[2].map(function (v) { return f(v, 0); }).join(", ") + "]",
            cls: "gradient" }), "f-right"),
          frag(h("deadflag", "Exactly zero — not merely small"), "f-pop")
        ])
      ]),
      frag(NN.callout("warn", "A dying ReLU",
        "The update is <span class='mono'>θ − lr × 0 = θ</span>: these three " +
        "weights do not move this step. If unit 3 is negative for every input " +
        "in the dataset, it receives zero gradient forever and is permanently " +
        "dead capacity — memory and FLOPs spent on a unit that can never learn. " +
        "This is why leaky ReLU, GELU and SiLU exist."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const on = n >= 1;
    ctx.dW1.highlight(on ? [[2, 0], [2, 1]] : null, on);
    ctx.db1.highlight(on ? [[2, 0]] : null, on);

/* ==================================================== optimizer helpers */
function chunkRows(flat, cols) {
  const out = [];
  for (let i = 0; i < flat.length; i += cols) out.push(flat.slice(i, i + cols));
  return out;
}
function unpack(vec) {
  let k = 0; const out = {};
  T.param_layout.forEach(function (p) {
    const n = p.shape.reduce(function (a, b) { return a * b; }, 1);
    const flat = vec.slice(k, k + n); k += n;
    out[p.name] = p.shape.length === 2 ? chunkRows(flat, p.shape[1]) : flat;
  });
  return out;
}
const SGD0 = T.runs.sgd.history[0];
const MOM0 = T.runs.momentum.history[0], MOM1 = T.runs.momentum.history[1];
const ADA0 = T.runs.adam.history[0];
const lossPts = function (run) {
  return T.runs[run].history.map(function (r) { return [r.t, r.loss]; });
};

  notes: "The simplest possible optimizer, and the arithmetic is one line. " +

    fS(SGD0.grad[0], 3) + ", the learning rate is " + HP.lr + ", so it moves to " +
    f(SGD0.theta_after[0], 4) + ". Note the minus sign: the gradient points " +
    "uphill, we want to go downhill. Note also that the two dead-unit weights " +
    "do not move at all.",
  build: function (ctx) {

    ctx.bt = tn({ name: "W1 (before)", shape: [3, 2], values: before.W1, cls: "weight", digits: 3 });
    ctx.gt = tn({ name: "dL/dW1", shape: [3, 2], values: T.backward.dL_dW1,

      frag(d("cols", [

SEP("memory");

/* ================================================== lifetimes & phases */
/* The schedule is not authored here: T.memory.timeline lists what each
   phase allocates and frees, and the generator simulates and asserts it.
   We replay the same alloc/free list to get the per-class split, and we
   plot T.memory.timeline_bytes_fp32 for the curve itself. */
const TL     = MEM.timeline;
const CURVE  = MEM.timeline_bytes_fp32;
const FLOOR  = MEM.floor_bytes_fp32;
const PEAK_B = MEM.peak_bytes_fp32;
const PEAK_I = MEM.peak_phase;
const ACT_PEAK_I = (function () {
  for (let i = 0; i < TL.length; i++) if (TL[i].peak_activations) return i;
  return -1;
})();
const TBYNAME = {};
PT.forEach(function (t) { TBYNAME[t.name] = t; });

/* replay alloc/free to get the resident set at every phase */
const RESIDENT = (function () {
  const live = {};
  PT.forEach(function (t) {
    if (t.cls === "weight" || t.cls === "optimizer") live[t.name] = true;
  });
  return TL.map(function (p) {
    (p.alloc || []).forEach(function (n) { live[n] = true; });
    (p.free  || []).forEach(function (n) { delete live[n]; });
    return Object.keys(live);
  });
})();
function residentBytes(i, cls) {
  return RESIDENT[i].reduce(function (a, n) {
    const t = TBYNAME[n];
    if (!t || (cls && t.cls !== cls)) return a;
    return a + t.elements * FP32B;
  }, 0);
}
/* self-check: our replay must reproduce the curve the generator asserted */
RESIDENT.forEach(function (_, i) {
  if (residentBytes(i) !== CURVE[i]) {
    console.warn("nn-internals slides: phase " + i + " replay " +
                 residentBytes(i) + " != trace " + CURVE[i]);
  }
});
function phaseSegs(i) {
  return ["weight", "optimizer", "activation", "gradient"].map(function (c) {
    return { cls: c, bytes: residentBytes(i, c), label: c };
  }).filter(function (s) { return s.bytes > 0; });
}

    "the backward pass until the optimizer consumes them. Note the gradient " +
    "card: " + N_G + " of its " + BYCLS.gradient.elements + " elements are " +
    "parameter gradients, one per weight; the other " + N_GNODE + " are " +
    "transient node gradients that exist only while the chain rule is walking " +
    "backwards. Every memory optimisation you have ever heard of is an " +
    "exploitation of one of these lifetimes.",
  build: function () {

      frag(d("cols3", [

  if (e > 1e-12) console.warn("nn-internals slides: local GELU disagrees with TF2 by " + e);
})();

/* self-check: the residual adds really are adds */
(function () {
  let e = 0;
  FL.forEach(function (lc) {
    e = Math.max(e, maxdiff2(madd(lc.stream_in, lc.attn_out), lc.resid1));
    e = Math.max(e, maxdiff2(madd(lc.resid1, lc.mlp.D), lc.resid2));
  });
  if (e > 1e-12) console.warn("nn-internals slides: TF2 residual adds do not add, by " + e);
})();

const MB = [mlpBack(0), mlpBack(1)];
const AB = [attnBack(0), attnBack(1)];
const QB = [qkvBack(0), qkvBack(1)];
(function () {
  let e = 0;
  for (let L = 0; L < NL; L++) {
    e = Math.max(e,
      maxdiff2(MB[L].dW1, GR2["L" + L + ".W1"]),
      maxdiff2(MB[L].dW2, GR2["L" + L + ".W2"]),
      maxdiff2(MB[L].dn2, bstep(L, "mlp").value),
      maxdiff2(AB[L].dWo, GR2["L" + L + ".Wo"]),
      maxdiff2(AB[L].dO,  bstep(L, "wo").value),
      maxdiff2(QB[L].dQ,  bstep(L, "attn").value),
      maxdiff2(QB[L].dWq, GR2["L" + L + ".Wq"]),
      maxdiff2(QB[L].dWk, GR2["L" + L + ".Wk"]),
      maxdiff2(QB[L].dWv, GR2["L" + L + ".Wv"]),
      maxdiff2(QB[L].dn1, bstep(L, "qkv").value));
  }

                 "disagrees with TF2 by " + e);

})();

S({
  chapter: "Forward L0 · LayerNorm 1",

      { l: "× 1/√(var+ε)  (" + f(r.inv_std, 5) + ")  →  xhat", v: r.xhat },
