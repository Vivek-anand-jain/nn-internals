            "</span> and <span class='mono'>rstd = " +
            f(r.saved_for_backward.rstd, 4) + "</span> for every token — " +
            XACT.per_tensor.filter(function (t) { return t.name.indexOf("mean, rstd") > 0; })
              .reduce(function (a, t) { return a + t.elements; }, 0) +
            " elements across both norms here. Tiny per token, and there are " +
            "two norms per block times " + CFG.layers + " blocks times every " +
            "token in the batch."), "f-right"),
          frag(NN.callout("key", "ε is load-bearing",
            "A token whose channels are all equal has variance exactly zero. " +
            "Without <span class='mono'>ε = " + r.eps + "</span> that is a " +
            "division by zero and the whole step becomes NaN. This is a real " +
            "failure mode, not a hypothetical one."), "f-right")
        ])
      ])
    ];
  },
  render: function (n, ctx) {
    const k = NN.clamp(n, 0, ctx.stages.length - 1);
    ctx.acc.update([ctx.stages[k].v]);
    ctx.lab.textContent = ctx.stages[k].l;
  }
});

/* -------------------------------------------------------- A4. Q, K, V */
S({
  chapter: "Transformer · Q K V", plain: "Q, K, V: three linear reads of the same vector",
  notes: "Attention starts by projecting the normalised stream three times " +
    "with three different learned matrices. Same input, three outputs. The " +
    "names are the useful part: the query is what this token is looking for, " +
    "the key is what it advertises to others, the value is what it will " +
    "actually contribute if it is selected. Nothing mystical happens here — " +
    "walk one entry: q[0][0] is the dot product of the LN1 output of token 0 " +
    "with column 0 of W_q, which is " +
    XF.attn.q_work[0][0].products.map(function (p) { return f(p.prod, 3); }).join(" + ") +
    " = " + f(XF.attn.q_work[0][0].out, 4) + ". The heads then simply carve " +
    "these " + XMETA.d_model + " columns into " + XMETA.n_heads + " groups of " +
    XMETA.d_head + ". Parameter note: the four projection matrices are " +
    XPAR.general_formula.attention_weights + " of the block.",
  build: function (ctx) {
    const wk = XF.attn.q_work[0][0];
    ctx.wq = tn({ name: "W_q", shape: [XMETA.d_model, XMETA.d_model], values: XF.attn.W_q,
                  cls: "weight", digits: 2 });
    ctx.inp = tn({ name: "LN1(x)", shape: XF.input.shape, values: XF.attn.input,
                   cls: "activation", digits: 2 });
    ctx.q = tn({ name: "Q", shape: XF.input.shape, values: XF.attn.q, cls: "activation", digits: 2 });
    return [
      kicker("Transformer · attention · projection"),
      title("One input, three matrices, three meanings", true),
      frag(d("rowflex top", [ctx.inp, h("ar", "×"), ctx.wq, h("ar", "="), ctx.q,
        h("ar", "·"),
        tn({ name: "K", shape: XF.input.shape, values: XF.attn.k, cls: "activation",
             digits: 2, note: "what I advertise" }),
        tn({ name: "V", shape: XF.input.shape, values: XF.attn.v, cls: "activation",
             digits: 2, note: "what I contribute" })
      ]), "f-fade"),
      frag(d("rowflex", [
        d("pill", "query — what this token is looking for"),
        d("pill", "key — what it advertises"),
        d("pill", "value — what it contributes if chosen")
      ]), "f-fade"),
      d("cols", [
        frag(NN.formula({ rule: "Q[0][0] = LN1(x)[0] · W_q[:,0]",
          sub: wk.products.map(function (p) { return f(p.x, 2) + "×" + f(p.w, 1); }).join(" + "),
          result: f(wk.out, 4), cls: "activation" }), "f-left"),
        frag(NN.callout("mem", "Three tensors that must be kept",
          "Q, K and V are each <span class='mono'>seq × d</span> — " +
          (3 * XMETA.seq_len * XMETA.d_model) + " elements here. For " +
          MODEL.name + " at " + CFG.seq + " tokens that is " +
          BY(3 * CFG.seq * CFG.d * BF16B) + " a block in bf16, before a single " +
          "attention score exists."), "f-right")
      ]),
      frag(h("small muted",
        "<b>Heads are a reshape, not a loop.</b> " + XMETA.n_heads +
        " heads of width " + XMETA.d_head + " means these " +
        XMETA.d_model + " columns are read in " + XMETA.n_heads +
        " groups. There is one matmul, not " + XMETA.n_heads + "."))
    ];
  },
  render: function (n, ctx) {
    const on = n >= 1;
    ctx.wq.highlight(on ? grid2(XMETA.d_model, 1, function (i) { return [i, 0]; }) : null, on);
    ctx.inp.highlight(on ? grid2(1, XMETA.d_model, function (i, j) { return [0, j]; }) : null, on);
    ctx.q.highlight(n >= 2 ? [[0, 0]] : null, n >= 2);
  }
});

/* -------------------------------------------------- A5. the score matrix */
S({
  chapter: "Transformer · scores", plain: "The score matrix: every query against every key",
  notes: "Here is the operation that makes a transformer a transformer, and " +
    "the operation that makes it expensive. Every query dots with every key, " +
    "which for " + XMETA.seq_len + " tokens is " + (XMETA.seq_len * XMETA.seq_len) +
    " numbers per head. Then divide by the square root of the head width. That " +
    "scaling is not cosmetic: the dot product of two " + XMETA.d_head +
    "-dimensional vectors with unit-ish entries has variance proportional to " +
    XMETA.d_head + ", so without the divide the scores grow with head width, " +
    "the softmax saturates, and the gradient through it goes to zero. Watch " +
    "the heatmap change when the scale is applied — the extremes come in " +
    "toward the middle. The shape of this object is the whole memory story of " +
    "long context: " + XACT.score_matrix_formula + " here; at " + CFG.seq +
    " tokens and " + CFG.heads + " heads it is " +
    NN.count(CFG.heads * CFG.seq * CFG.seq) + " numbers per layer per sequence.",
  build: function (ctx) {
    const H = XF.attn.heads[0];
    ctx.hm = heatGrid({ rows: XMETA.seq_len, cols: XMETA.seq_len, cell: 88,
      rowLab: XMETA.tokens.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: XMETA.tokens.map(function (t, i) { return "k" + i; }),
      caption: "head 0 · scores" });
    ctx.H = H;
    ctx.cap = h("phaselabel", "");
    return [
      kicker("Transformer · attention · scores"),
      title("Every query, against every key — that is the seq² object", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "scoreᵢⱼ = qᵢ · kⱼ",
            sub: "raw q₀·k₀ = " + f(H.scores_raw[0][0], 4),
            result: (XMETA.seq_len * XMETA.seq_len) + " numbers per head",
            cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "scale = " + XF.attn.scale_formula,
            sub: f(H.scores_raw[0][0], 4) + " × " + f(XF.attn.scale, 4),
            result: f(H.scores_scaled[0][0], 4), cls: "activation" }), "f-left"),
          frag(NN.callout("why", "Why divide by √d_head",
            "A dot product of two <span class='mono'>" + XMETA.d_head +
            "</span>-dimensional vectors has variance proportional to " +
            XMETA.d_head + ". Leave it unscaled and wider heads produce larger " +
            "scores, the softmax saturates to a one-hot, and its gradient " +
            "vanishes."), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.cap, ctx.hm]), "f-right")])
      ]),
      frag(NN.callout("mem", "This is the tensor that ruins long context",
        "<span class='mono'>" + XACT.score_matrix_formula + "</span> here. " +
        "For " + MODEL.name + " at " + CFG.seq + " tokens: " +
        CFG.heads + " × " + CFG.seq + "² = " +
        NN.count(CFG.heads * CFG.seq * CFG.seq) + " elements per layer, per " +
        "sequence, and it quadruples every time you double the context."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    if (n >= 2) {
      ctx.hm.paint(ctx.H.scores_scaled, { color: "var(--accent)", digits: 2 });
      ctx.cap.textContent = "scaled by 1/√" + XMETA.d_head;
    } else {
      ctx.hm.paint(ctx.H.scores_raw, { color: "var(--accent)", digits: 2 });
      ctx.cap.textContent = "raw q · k";
    }
  }
});

/* ------------------------------------------------------ A6. causal mask */
S({
  chapter: "Transformer · causal mask", plain: "Causal masking: a token may not read the future",
  notes: "The model is trained to predict the next token at every position at " +
    "once. That is only a legitimate exercise if position i cannot see " +
    "position i+1 — otherwise the answer is in the input and the model learns " +
    "to copy. So before the softmax, every score above the diagonal is set to " +
    "minus infinity, which becomes exactly zero after the exponential. Step " +
    "through the rows: token 0 sees only itself, token 1 sees two, token 2 " +
    "sees all three. Two things worth saying out loud. The masked half is " +
    "computed and then thrown away in a naive implementation — half the " +
    "attention FLOPs are wasted, which is why fused kernels skip the blocks " +
    "entirely. And this is why generation can cache K and V: position i's row " +
    "never changes when you append position i+1.",
  build: function (ctx) {
    const H = XF.attn.heads[0];
    ctx.H = H;
    ctx.hm = heatGrid({ rows: XMETA.seq_len, cols: XMETA.seq_len, cell: 88,
      rowLab: XMETA.tokens.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: XMETA.tokens.map(function (t, i) { return "k" + i + " " + t; }) });
    ctx.cap = h("phaselabel", "");
    return [
      kicker("Transformer · attention · masking"),
      title("Set the future to <span class='mono'>−∞</span> before the softmax", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "mask", sub: XMETA.mask,
            result: sum(XF.attn.mask.map(function (r) { return sum(r); })) + " of " +
                    (XMETA.seq_len * XMETA.seq_len) + " entries survive",
            cls: "activation" }), "f-left"),
          frag(NN.callout("key", "Why it has to be −∞ and not 0",
            "The mask is applied <em>before</em> the softmax, and " +
            "<span class='mono'>exp(−∞) = 0</span>. Zeroing after the softmax " +
            "would leave the surviving weights not summing to one — the " +
            "denominator would still contain the future's contribution."), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.cap, ctx.hm]), "f-right")])
      ]),
      frag(d("cols", [
        NN.callout("warn", "Half the FLOPs are thrown away",
          "A naive implementation computes the whole " + XMETA.seq_len + "×" +
          XMETA.seq_len + " matrix and discards the upper triangle. At " +
          CFG.seq + " tokens that is " +
          NN.count(CFG.heads * CFG.seq * (CFG.seq - 1) / 2) +
          " scores per layer computed for nothing. Fused kernels skip whole " +
          "masked tiles instead."),
        NN.callout("why", "And it is why the KV cache works",
          "Row i does not change when token i+1 arrives — the future cannot " +
          "reach backwards. So at generation time the keys and values of every " +
          "previous token can be kept and reused, and each new token costs one " +
          "row rather than a whole matrix.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const rows = NN.clamp(n - 1, 0, XMETA.seq_len);
    if (n <= 1) {
      ctx.hm.paint(ctx.H.scores_scaled, { color: "var(--accent)", digits: 2 });
      ctx.cap.textContent = "scaled scores, nothing masked yet";
    } else {
      const m = ctx.H.scores_scaled.map(function (r, i) {
        return r.map(function (v, j) {
          return (i < rows && ctx.H.scores_masked[i][j] === null) ? null : v; });
      });
      ctx.hm.paint(m, { color: "var(--accent)", digits: 2 });
      ctx.cap.textContent = rows >= XMETA.seq_len
        ? "causal mask applied — strictly lower triangular"
        : "masking row " + (rows - 1) + " · " + XMETA.tokens[rows - 1];
    }
  }
});

/* --------------------------------------------------------- A7. softmax */
S({
  chapter: "Transformer · softmax", plain: "Softmax: each row becomes a probability distribution",
  notes: "Exponentiate, then divide by the row sum. What comes out is a set of " +
    "non-negative weights that sum to one — an honest weighted average over " +
    "the visible tokens. Two implementation details worth knowing. The maximum " +
    "of the row is subtracted before the exponential, purely for numerical " +
    "safety: exp of a large score overflows, and subtracting a constant leaves " +
    "the result algebraically unchanged because the constant cancels between " +
    "numerator and denominator. And the generator checks it: across all " +
    XF.attn.softmax_check.n_rows_checked + " rows of all heads the row sums " +
    "deviate from 1 by at most " + f(XF.attn.softmax_check.max_abs_deviation, 1) +
    ". Read row 2 out loud: this token puts " +
    f(XF.attn.heads[0].probs[2][0] * 100, 0) + "% of its attention on token 0, " +
    f(XF.attn.heads[0].probs[2][1] * 100, 0) + "% on token 1 and " +
    f(XF.attn.heads[0].probs[2][2] * 100, 0) + "% on itself.",
  build: function (ctx) {
    const H = XF.attn.heads[0];
    ctx.H = H;
    ctx.hm = heatGrid({ rows: XMETA.seq_len, cols: XMETA.seq_len, cell: 88,
      rowLab: XMETA.tokens.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: XMETA.tokens.map(function (t, i) { return "k" + i; }) });
    ctx.cap = h("phaselabel", "");
    const sw = H.softmax_work[XMETA.seq_len - 1];
    return [
      kicker("Transformer · attention · softmax"),
      title("Exponentiate, then divide by the row sum", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "pᵢⱼ = exp(sᵢⱼ − maxᵢ) / Σ exp(sᵢⱼ − maxᵢ)",
            sub: "row " + (XMETA.seq_len - 1) + ": max = " + f(sw.max, 4),
            cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "exponentials",
            sub: sw.exps.map(function (v) { return f(v, 3); }).join(" , "),
            result: "Σ = " + f(sw.denom, 5), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "verified, not asserted",
            sub: XF.attn.softmax_check.n_rows_checked + " rows across " +
                 XMETA.n_heads + " heads, tolerance " + XF.attn.softmax_check.tolerance,
            result: "max |Σ − 1| = " + f(XF.attn.softmax_check.max_abs_deviation, 1),
            cls: "activation" }), "f-left"),
          frag(NN.callout("key", "Why subtract the max",
            "<span class='mono'>exp()</span> of a large score overflows — in " +
            "fp16 once the score passes " + f(Math.log(T.formats.fp16.max_finite), 1) +
            ", which real scores reach. Subtracting the row " +
            "maximum makes the largest exponent exactly " +
            "<span class='mono'>exp(0) = 1</span>, and the constant cancels " +
            "between numerator and denominator so the answer is unchanged."), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.cap, ctx.hm]), "f-right")])
      ])
    ];
  },
  render: function (n, ctx) {
    if (n >= 2) {
      ctx.hm.paint(ctx.H.probs, { color: "var(--activation)", digits: 2, max: 1 });
      ctx.cap.textContent = "attention weights · every row sums to 1";
    } else {
      ctx.hm.paint(ctx.H.scores_masked, { color: "var(--accent)", digits: 2 });
      ctx.cap.textContent = "masked scores, before softmax";
    }
  }
});

/* ------------------------------------------------------------- A8. AV */
S({
  chapter: "Transformer · A·V", plain: "The output is a weighted average of value vectors",
  notes: "After all that, what attention actually produces is embarrassingly " +
    "simple: a weighted average. Row i of the probability matrix says how much " +
    "of each token's value vector to take, and you take exactly that. Token " +
    (XMETA.seq_len - 1) + " gets " +
    XF.attn.heads[0].out_work[XMETA.seq_len - 1][0].terms
      .map(function (t) { return f(t.p, 2) + "×" + f(t.v, 2); }).join(" + ") + " = " +
    f(XF.attn.heads[0].out_work[XMETA.seq_len - 1][0].out, 4) + " in channel 0. " +
    "The point to make is that the weights are data-dependent — that is the " +
    "entire difference from a fixed convolution. Which tokens matter is " +
    "decided at run time by the content, and the machinery on the last three " +
    "slides exists only to compute those weights.",
  build: function (ctx) {
    const H = XF.attn.heads[0];
    const i = XMETA.seq_len - 1;
    const wk = H.out_work[i][0];
    ctx.probs = tn({ name: "probs row " + i, shape: [1, XMETA.seq_len], values: [H.probs[i]],
                     cls: "activation", digits: 3 });
    ctx.v = tn({ name: "V (head 0)", shape: [XMETA.seq_len, XMETA.d_head], values: H.v,
                 cls: "activation", digits: 2 });
    ctx.out = tn({ name: "head 0 out", shape: [XMETA.seq_len, XMETA.d_head], values: H.out,
                   cls: "activation", digits: 3 });
    return [
      kicker("Transformer · attention · the average"),
      title("<span class='mono'>out = P · V</span> — nothing more than that", true),
      d("cols wide-l", [
        frag(d("rowflex top", [ctx.probs, h("ar", "×"), ctx.v, h("ar", "="), ctx.out]), "f-fade"),
        d("stack", [
          frag(NN.formula({ rule: "out[" + i + "][0] = Σⱼ pⱼ · vⱼ[0]",
            sub: wk.terms.map(function (t) { return f(t.p, 2) + "×" + f(t.v, 2); }).join(" + "),
            result: f(wk.out, 4), cls: "activation" }), "f-right"),
          frag(NN.callout("key", "The weights are computed from the data",
            "A convolution has fixed weights that do not depend on the input. " +
            "Here the mixing weights are produced by the input itself, per " +
            "token, per head, at run time. That is the only structural " +
            "difference — and it is why attention needs a seq² intermediate " +
            "and a convolution does not."), "f-right")
        ])
      ]),
      frag(NN.callout("mem", "Both P and V have to survive to backward",
        "<span class='mono'>d(P·V)/dP = Vᵀ</span> and " +
        "<span class='mono'>d(P·V)/dV = Pᵀ</span> — exactly the rule we proved " +
        "on the toy model, that a matmul's backward re-reads both of its " +
        "inputs. So the probability matrix, the seq² one, is on the list of " +
        "things the forward pass may not free. Unless you recompute it, which " +
        "is precisely what FlashAttention does."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const i = XMETA.seq_len - 1;
    const on = n >= 1;
    ctx.probs.highlight(on ? grid2(1, XMETA.seq_len, function (a, j) { return [0, j]; }) : null, false);
    ctx.v.highlight(on ? grid2(XMETA.seq_len, 1, function (r) { return [r, 0]; }) : null, on);
    ctx.out.highlight(n >= 2 ? [[i, 0]] : null, n >= 2);
  }
});

/* --------------------------------------- A9. concat heads + output proj */
S({
  chapter: "Transformer · output projection", plain: "Concatenate the heads, project, add back to the stream",
  notes: "The heads computed their averages independently and in parallel; now " +
    "their outputs are laid side by side — head 0 takes channels " +
    XF.attn.heads[0].dims.join(" and ") + ", head 1 takes " +
    XF.attn.heads[1].dims.join(" and ") + " — and one more matrix mixes across " +
    "them. That mixing is the only place the heads talk to each other, which " +
    "is worth stressing: without W_o the heads would be " + XMETA.n_heads +
    " independent narrow models glued together. Then the result is added to " +
    "the residual stream and the attention sub-layer is over. Note for later: " +
    "W_o is the matrix that tensor parallelism makes row-parallel, precisely " +
    "because the heads before it are already split across GPUs.",
  build: function (ctx) {
    const wk = XF.attn.o_work[0][0];
    ctx.cat = tn({ name: "concat", shape: XF.input.shape, values: XF.attn.concat,
                   cls: "activation", digits: 2, note: "heads side by side" });
    ctx.wo = tn({ name: "W_o", shape: [XMETA.d_model, XMETA.d_model], values: XF.attn.W_o,
                  cls: "weight", digits: 2 });
    ctx.out = tn({ name: "Attn out", shape: XF.input.shape, values: XF.attn.out,
                   cls: "activation", digits: 2 });
    return [
      kicker("Transformer · attention · output"),
      title("One matrix is the only place the heads meet", true),
      frag(d("rowflex top", [
        d("stack", [
          h("small muted", "head 0 → channels " + XF.attn.heads[0].dims.join(", ") +
            " · head 1 → channels " + XF.attn.heads[1].dims.join(", ")),
          ctx.cat]),
        h("ar", "×"), ctx.wo, h("ar", "="), ctx.out
      ]), "f-fade"),
      frag(NN.formula({ rule: "Attn out[0][0] = concat[0] · W_o[:,0]",
        sub: wk.products.map(function (p) { return f(p.x, 2) + "×" + f(p.w, 1); }).join(" + "),
        result: f(wk.out, 4), cls: "activation" }), "f-left"),
      frag(d("cols", [
        NN.callout("key", "Without W_o the heads never interact",
          "Each head produced a " + XMETA.d_head + "-wide vector from its own " +
          "slice of Q, K and V. Concatenation alone would leave " +
          XMETA.n_heads + " independent narrow attentions. " +
          "<span class='mono'>W_o</span> is a full " + XMETA.d_model + "×" +
          XMETA.d_model + " mix, and it is what makes multi-head attention one " +
          "operation rather than " + XMETA.n_heads + "."),
        NN.callout("why", "Remember this shape",
          "The heads are split along the output dimension; " +
          "<span class='mono'>W_o</span> consumes that same dimension as its " +
          "input. That pairing — split outputs feeding split inputs — is " +
          "exactly the structure tensor parallelism exploits, thirty slides " +
          "from now.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const on = n >= 2;
    ctx.cat.highlight(on ? grid2(1, XMETA.d_model, function (a, j) { return [0, j]; }) : null, on);
    ctx.wo.highlight(on ? grid2(XMETA.d_model, 1, function (i) { return [i, 0]; }) : null, on);
    ctx.out.highlight(on ? [[0, 0]] : null, on);
  }
});

/* ------------------------------------------------------ A10. MLP sub-layer */
S({
  chapter: "Transformer · MLP", plain: "The MLP sub-layer: widen, bend, narrow",
  notes: "The second sub-layer is the toy model from the first half of this " +
    "deck, unchanged. Normalise, project up from " + XMETA.d_model + " to " +
    XMETA.d_ff + ", apply a nonlinearity, project back down. It is applied to " +
    "each token independently — no token talks to any other in here, which is " +
    "the exact complement of attention. The nonlinearity is " +
    XMETA.nonlinearity + " rather than ReLU: instead of a hard gate at zero it " +
    "multiplies by a smooth gate, so a slightly negative pre-activation gets " +
    "scaled down rather than annihilated. Look at the numbers — a " +
    "pre-activation of " + f(XF.mlp.gelu_detail[0][1].pre, 3) + " has gate " +
    f(XF.mlp.gelu_detail[0][1].gate, 3) + " and comes out as " +
    f(XF.mlp.gelu_detail[0][1].out, 3) + ", small but not dead. That is the " +
    "fix for the dying-ReLU problem we watched in the first half. This toy " +
    "uses " + XPAR.toy_expansion + "× expansion so the grid fits; real blocks " +

  build: function (ctx) {

    "sequence and it quadruples. FlashAttention removes it from memory " +
    "entirely — it never writes the score matrix to HBM, keeping only " +
    "per-row softmax statistics, and recomputes tiles in the backward pass. " +
    "The FLOPs do not go away; the memory does.",

    const flashPts = seqs.map(function (q) { return [q, actFlashPerLayer(q, 1) / GBD]; });

/* Scenario choices — not facts about the model or the hardware, so they are
   not in the trace, and every slide that uses one says so. */

const BPP = {
  ddp:  BPP_MIXED,
  z1:   R_W + R_G + OPTB / NGPU,
  z2:   R_W + (R_G + OPTB) / NGPU,
  z3:   BPP_MIXED / NGPU
};
const perGPU = function (bpp) { return CFG.params * bpp / GBD; };   /* GB */

            " instead of " + BY(CFG.stateB) + ". The fp32 master copy is the " +
            "one term you cannot quantise away — the next slide but one says " +

        ])

  }
});

/* ======================================================================== */
/*  PART C · DISTRIBUTED TRAINING                                           */
/*  window.PARALLEL (assets/data/parallel.js, code/parallel_toy.py) is a     */
/*  simulated 4-GPU training step of a 4->8->8->8->1 MLP under every major   */
/*  strategy, with the collective schedule and a numerical proof that each   */
/*  strategy reproduces the single-GPU answer.                              */
/* ======================================================================== */

const PA = window.PARALLEL || null;
if (!PA) {
  console.error("nn-internals slides: parallel.js did not load. " +
                "Run `python3 code/parallel_toy.py` to regenerate it.");
}

if (PA) {

const PM    = PA.meta;
const WORLD = PM.world;
const NPAR  = PM.n_params;          /* 193 */
const DIMS  = PM.dims;
const PMOD  = PA.model;
const STRAT = PA.strategies;
const COLL  = PA.collectives;
const SUB   = ["₀", "₁", "₂", "₃", "₄", "₅", "₆", "₇"];
const SUP   = ["⁰", "¹", "²", "³", "⁴", "⁵", "⁶", "⁷"];
const byOp  = function (op) {
  return COLL.filter(function (c) { return c.op === op; })[0];
};

/* Ring cost factor. The generator now publishes the number per world size on
   every collective, so nothing here parses the formula string; the string is
   only ever displayed. */
function ringFactor(op, N) {
  const c = typeof op === "string" ? byOp(op) : op;
  if (!c) { console.warn("nn-internals slides: unknown collective"); return 1; }
  const at = c.ring_factor_at_world && c.ring_factor_at_world[String(N)];
  return at === undefined ? c.ring_factor_numeric : at;
}
/* self-check: the published factors, the ring table and the DDP schedule
   payload all have to agree, or one of the three has drifted. */
(function () {
  const rt = PA.ring.table.filter(function (r) { return r.world === WORLD; })[0];
  if (rt) {
    if (Math.abs(ringFactor("all_reduce", WORLD) - rt.all_reduce) > 1e-9 ||
        Math.abs(ringFactor("all_gather", WORLD) - rt.all_gather) > 1e-9) {
      console.warn("nn-internals slides: ring_factor_at_world disagrees with PARALLEL.ring.table");
    }
  }
  const ddpSent = STRAT.ddp.schedule[0].sent_per_gpu_elements;
  if (Math.abs(ddpSent - ringFactor("all_reduce", WORLD) * NPAR) > 1e-6) {
    console.warn("nn-internals slides: DDP schedule payload disagrees with the ring factor");
  }
})();

/* --------------------------------------------------------- the wires */
/* PARALLEL.interconnects quotes vendor bandwidths (NVLink figures are
   BIDIRECTIONAL in marketing, so always read per_dir_GBps), and
   PARALLEL.cost_model is a labelled MODEL, not a measurement. Every slide
   that turns bytes into seconds says so on the slide itself. */
const ICON = PA.interconnects;
const CM   = PA.cost_model;
const linkNamed = function (frag) {
  return ICON.links.filter(function (l) { return l.name.indexOf(frag) >= 0; })[0];
};
const NVL = linkNamed("NVLink " + GPUD.nvlink_gen) || linkNamed("NVLink");
const IBL = linkNamed("InfiniBand NDR") || linkNamed("InfiniBand");
/** seconds to move `bytes` per GPU over a link, at the model's achieved fraction */
function wireSeconds(bytes, l) {
  return bytes / (l.per_dir_GBps * 1e9 * CM.achieved_fraction);
}
const MODEL_CAVEAT =
  "<b>" + CM._status + "</b> Bandwidth is taken at " +
  f(CM.achieved_fraction * 100, 0) + "% of nominal (" + CM.achieved_note +
  ") and the model ignores " + CM.ignores.slice(0, 3).join(", ") + ".";

/**
 * A shard bar that can own SEVERAL slices, which NN.gpu.shard cannot express.
 * Same markup and the same CSS classes, so a replicated tensor and a sharded
 * one are drawn by the same grammar: filled = held here, hollow = elsewhere.
 */
function shardBar(o) {
  const n = o.parts, own = o.own;
  const bar = el("div", { class: "shardbar" });
  for (let i = 0; i < n; i++) {
    const mine = own === "all" || (!!own && own.indexOf(i) >= 0);
    bar.appendChild(el("div", {
      class: "shardseg" + (mine ? " mine" : ""),
      style: { background: mine ? (o.color || "var(--weight)") : "var(--surface-3)" },
      title: o.name + " shard " + i + (mine ? " — held on this GPU" : " — held elsewhere")
    }));
  }
  return el("div", { class: "shardrow" }, [
    el("span", { class: "shardname" }, o.name), bar
  ]);
}

/* ---------------------------------------------------------------------- */
/*  The collective visualiser: four GPU boxes, labelled chunks, real moves. */
/* ---------------------------------------------------------------------- */
/**
 * spec = {
 *   world, slots, color,
 *   states: [ grid ],            grid[gpu][slot] = label | null
 *   moves:  [ [[src,dst,label], ...] ],   parallel to states
 *   caps:   [ caption ]
 * }
 * Returns an <svg> with .step(k).
 */
let _collUID = 0;
function collSVG(spec) {
  const N = spec.world, SL = spec.slots;
  const BW = 218, BH = 34 + SL * 30, GAPX = 26, X0 = 30, YB = 104;
  const Wd = X0 * 2 + N * BW + (N - 1) * GAPX;
  const Ht = YB + BH + 14;
  const uid = "collhead" + (_collUID++);
  const s = SV("svg", { viewBox: "0 0 " + Wd + " " + Ht, width: "100%",
                        height: Ht, class: "collsvg", role: "img" });

  const defs = SV("defs", {});
  const mk = SV("marker", { id: uid, viewBox: "0 0 8 8", refX: 7, refY: 4,
                            markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
  mk.appendChild(SV("path", { d: "M0 0 L8 4 L0 8 z", fill: spec.color }));
  defs.appendChild(mk); s.appendChild(defs);

  const bx = function (g) { return X0 + g * (BW + GAPX); };
  const rects = [], texts = [];
  for (let g = 0; g < N; g++) {
    const x = bx(g);
    s.appendChild(SV("rect", { x: x, y: YB, width: BW, height: BH, rx: 10,
      fill: "var(--surface-2)", stroke: "var(--hairline)", "stroke-width": 1.5 }));
    const hd = SV("text", { x: x + BW / 2, y: YB + 20, "text-anchor": "middle",
      "font-size": 13, "font-family": "var(--mono)", fill: "var(--ink-muted)" });
    hd.textContent = "GPU " + g;
    s.appendChild(hd);
    rects.push([]); texts.push([]);
    for (let k = 0; k < SL; k++) {
      const y = YB + 30 + k * 30;
      const r = SV("rect", { x: x + 13, y: y, width: BW - 26, height: 25, rx: 5,
        class: "cslot", fill: "var(--surface-3)", stroke: "var(--hairline-2)" });
      const t = SV("text", { x: x + BW / 2, y: y + 17, "text-anchor": "middle",
        "font-size": 13, "font-family": "var(--mono)", class: "cslottext",
        fill: "var(--ink-2)" });
      s.appendChild(r); s.appendChild(t);
      rects[g].push(r); texts[g].push(t);
    }
  }
  const flow = SV("g", { class: "flows" });
  s.appendChild(flow);

  let last = null;
  s.step = function (k) {
    const idx = NN.clamp(k, 0, spec.states.length - 1);
    const st = spec.states[idx];
    const prev = spec.states[idx - 1] || null;
    for (let g = 0; g < N; g++) for (let j = 0; j < SL; j++) {
      const v = st[g][j];
      const changed = prev && prev[g][j] !== v && v !== null;
      texts[g][j].textContent = v === null ? "" : v;
      rects[g][j].setAttribute("fill", v === null ? "var(--surface-3)"
        : "color-mix(in srgb, " + spec.color + " 26%, var(--surface-3))");
      rects[g][j].setAttribute("stroke", v === null ? "var(--hairline-2)" : spec.color);
      rects[g][j].setAttribute("class", "cslot" + (changed && idx !== last ? " fresh" : ""));
    }
    while (flow.firstChild) flow.removeChild(flow.firstChild);
    (spec.moves[idx] || []).forEach(function (mv) {
      const a = bx(mv[0]) + BW / 2, b = bx(mv[1]) + BW / 2;
      const dist = Math.abs(mv[1] - mv[0]);
      const lift = 26 + 24 * dist;
      const p = SV("path", {
        d: "M" + a + " " + (YB - 3) + " Q" + ((a + b) / 2) + " " + (YB - 3 - lift) +
           " " + b + " " + (YB - 3),
        fill: "none", stroke: spec.color, "stroke-width": 2.2, class: "flowline",
        "marker-end": "url(#" + uid + ")"
      });
      flow.appendChild(p);
      if (mv[2]) {
        const lt = SV("text", { x: (a + b) / 2, y: YB - 8 - lift * 0.52,
          "text-anchor": "middle", "font-size": 12, "font-family": "var(--mono)",
          fill: spec.color });
        lt.textContent = mv[2];
        flow.appendChild(lt);
      }
    });
    last = idx;
  };
  s.step(0);
  return s;
}

/* Build the state machine for one collective, at the deck's world size. */
function collSpec(op) {
  const N = WORLD, SL = WORLD;
  const empty = function () {
    const g = [];
    for (let i = 0; i < N; i++) { g.push([]); for (let j = 0; j < SL; j++) g[i].push(null); }
    return g;
  };
  const full = function (fn) {
    const g = empty();
    for (let i = 0; i < N; i++) for (let j = 0; j < SL; j++) g[i][j] = fn(i, j);
    return g;
  };
  const chunk = function (j) { return "x" + SUB[j]; };
  const part  = function (i, j) { return "g" + SUP[i] + SUB[j]; };
  const total = function (j) { return "Σ" + SUB[j]; };
  const wgt   = function (j) { return "w" + SUB[j]; };
  const cell  = function (i, j) { return "c" + SUP[i] + SUB[j]; };
  const onlyMine = function (fn) {
    const g = empty();
    for (let i = 0; i < N; i++) g[i][i] = fn(i);
    return g;
  };
  const ringMoves = function (labFn) {
    const mv = [];
    for (let i = 0; i < N; i++) mv.push([i, (i + 1) % N, labFn ? labFn(i) : null]);
    return mv;
  };
  const toRoot = function (labFn) {
    const mv = [];
    for (let i = 1; i < N; i++) mv.push([i, 0, labFn ? labFn(i) : null]);
    return mv;
  };
  const fromRoot = function (labFn) {
    const mv = [];
    for (let i = 1; i < N; i++) mv.push([0, i, labFn ? labFn(i) : null]);
    return mv;
  };

  switch (op) {
    case "broadcast": {
      const a = empty();
      for (let j = 0; j < SL; j++) a[0][j] = wgt(j);
      const c = full(function (i, j) { return wgt(j); });
      return { color: "var(--weight)", states: [a, a, c],
        moves: [[], fromRoot(function () { return "whole buffer"; }), []],
        caps: ["GPU 0 holds the buffer. Nobody else has anything.",
               "One → all. Every other rank receives the whole thing.",
               "Every rank now holds an identical copy."] };
    }
    case "scatter": {
      const a = empty();
      for (let j = 0; j < SL; j++) a[0][j] = chunk(j);
      const c = onlyMine(function (i) { return chunk(i); });
      return { color: "var(--activation)", states: [a, a, c],
        moves: [[], fromRoot(function (i) { return chunk(i); }), []],
        caps: ["GPU 0 holds a buffer cut into " + N + " pieces.",
               "One → all, but split: rank i is sent piece i and nothing else.",
               "Each rank holds exactly its own piece. This is how a batch is handed out."] };
    }
    case "gather": {
      const a = onlyMine(function (i) { return chunk(i); });
      const c = empty();
      for (let j = 0; j < SL; j++) c[0][j] = chunk(j);
      for (let i = 1; i < N; i++) c[i][i] = chunk(i);
      return { color: "var(--activation)", states: [a, a, c],
        moves: [[], toRoot(function (i) { return chunk(i); }), []],
        caps: ["Every rank holds one piece.",
               "All → one. Every piece is sent to the root and concatenated in rank order.",
               "GPU 0 holds the whole tensor. This is checkpointing and logging."] };
    }
    case "all_gather": {
      const a = onlyMine(function (i) { return chunk(i); });
      const b = onlyMine(function (i) { return chunk(i); });
      for (let i = 0; i < N; i++) b[i][(i + N - 1) % N] = chunk((i + N - 1) % N);
      const c = full(function (i, j) { return chunk(j); });
      return { color: "var(--weight)", states: [a, b, c],
        moves: [[], ringMoves(function (i) { return chunk(i); }), []],
        caps: ["Every rank holds one piece — this is what a sharded weight looks like.",
               "Round 1 of " + (N - 1) + ": each rank forwards its piece to its right neighbour.",
               "After " + (N - 1) + " rounds every rank holds all " + N +
               " pieces. This is FSDP re-materialising a layer."] };
    }
    case "reduce": {
      const a = full(part);
      const c = full(part);
      for (let j = 0; j < SL; j++) c[0][j] = total(j);
      return { color: "var(--gradient)", states: [a, a, c],
        moves: [[], toRoot(function (i) { return "g" + SUP[i]; }), []],
        caps: ["Every rank holds its own full vector — four different answers.",
               "All → one, summing on the way in.",
               "GPU 0 holds the elementwise sum. Nobody else learned anything."] };
    }
    case "reduce_scatter": {
      const a = full(part);
      const c = onlyMine(total);
      return { color: "var(--gradient)", states: [a, a, c],
        moves: [[], ringMoves(function (i) { return "g" + SUP[i] + " chunks"; }), []],
        caps: ["Every rank holds a full vector of partial results.",
               "Sum and split in one pass: chunk j is accumulated as it travels to rank j.",
               "Rank i holds the fully-summed chunk i — and only that. " +
               "No rank ever held a full reduced buffer."] };
    }
    case "all_reduce": {
      const a = full(part);
      const c = full(function (i, j) { return total(j); });
      return { color: "var(--gradient)", states: [a, a, c],
        moves: [[], ringMoves(function (i) { return "g" + SUP[i]; }), []],
        caps: ["Every rank holds its own full vector — four different gradients.",
               "Every chunk travels the ring twice: once accumulating, once distributing.",
               "Every rank holds the identical sum. This is the DDP gradient step."] };
    }
    case "all_to_all": {
      const a = full(cell);
      const c = full(function (i, j) { return cell(j, i); });
      const mv = [];
      for (let j = 1; j < N; j++) mv.push([0, j, cell(0, j)]);
      return { color: "var(--activation)", states: [a, a, c],
        moves: [[], mv, []],
        caps: ["Rank i holds " + N + " chunks, one destined for each rank.",
               "Rank i sends its j-th chunk to rank j. Only GPU 0's sends are drawn — " +
               "every other rank does exactly the same thing at the same time.",
               "A distributed transpose: rank j now holds the j-th chunk of everyone. " +
               "This is how MoE routing moves tokens to experts."] };
    }
  }
  return null;
}

/** One slide per collective, built from PARALLEL.collectives. */
function collectiveSlide(op, extraNote) {
  const c = byOp(op), spec = collSpec(op);
  const fac = ringFactor(c, WORLD);
  return {
    chapter: "Collectives · " + op,
    plain: op + " · " + c.sig,
    notes: c.what + "  ——  Used for: " + c.used_for + "  ——  Cost: a ring " +
      "implementation makes every GPU send " + c.ring_factor + ", which at " +
      "world " + WORLD + " and the toy model's " + NPAR + " gradient elements " +
      "is " + f(fac * NPAR, 2) + " elements per GPU. Its inverse is " +
      c.inverse + ". " + (extraNote || "") + "  ——  Walk the three build steps " +
      "and read the chunk labels out loud; the point of these eight slides is " +
      "that every distributed strategy later in the deck is one of these " +
      "operations applied to one of our four tensor classes.",
    build: function (ctx) {
      ctx.viz = collSVG({ world: WORLD, slots: WORLD, color: spec.color,
                          states: spec.states, moves: spec.moves });
      ctx.cap = h("phaselabel", spec.caps[0]);
      ctx.spec = spec;
      return [
        kicker("Collectives · <b>" + op + "</b> · " + c.sig),
        title("<span class='mono'>" + op + "</span> — " + c.what, true),
        frag(d("panel acc", [ctx.viz, ctx.cap]), "f-fade"),
        frag(d("cols3", [

S({
  chapter: "Collectives · the decomposition", plain: "all_reduce IS reduce_scatter followed by all_gather",
  notes: "This is the most useful single fact in the whole of distributed " +
    "training and it takes thirty seconds to state. An all-reduce is not a " +
    "primitive. It is literally implemented as a reduce-scatter — which leaves " +
    "each rank owning the fully-summed shard it is responsible for — followed " +
    "by an all-gather that hands everyone a copy of everyone else's shard. Look " +
    "at the ring factors: reduce_scatter is " + byOp("reduce_scatter").ring_factor +
    ", all_gather is " + byOp("all_gather").ring_factor + ", and their sum is " +
    byOp("all_reduce").ring_factor + ". Exactly. Now hold the thought that will " +
    "come back in twenty slides: if a rank only ever needs its own shard, the " +
    "second half is pure waste. Skipping it costs nothing and saves half the " +
    "traffic — and it is the whole of ZeRO stage 2.",
  build: function (ctx) {
    const N = WORLD, SL = WORLD;
    const part = function (i, j) { return "g" + SUP[i] + SUB[j]; };
    const total = function (j) { return "Σ" + SUB[j]; };
    const gridOf = function (fn) {
      const g = [];
      for (let i = 0; i < N; i++) { g.push([]); for (let j = 0; j < SL; j++) g[i].push(fn(i, j)); }
      return g;
    };
    const a = gridOf(part);
    const mid = gridOf(function (i, j) { return i === j ? total(j) : null; });
    const z = gridOf(function (i, j) { return total(j); });
    const ring = [];
    for (let i = 0; i < N; i++) ring.push([i, (i + 1) % N, null]);
    ctx.viz = collSVG({ world: N, slots: SL, color: "var(--gradient)",
      states: [a, a, mid, mid, z],
      moves: [[], ring, [], ring, []] });
    ctx.caps = [
      "Start: four ranks, four different partial gradients.",
      "① reduce-scatter — sum as it travels, each chunk landing on its owner.",
      "Halfway: rank i holds the finished chunk i. " +
        "<b>If that is all rank i needs, stop here.</b>",
      "② all-gather — every owner broadcasts its finished chunk back around.",
      "Done: every rank holds the identical, fully-reduced vector."
    ];
    ctx.cap = h("phaselabel", ctx.caps[0]);
    const rsF = ringFactor("reduce_scatter", WORLD);
    const agF = ringFactor("all_gather", WORLD);
    const arF = ringFactor("all_reduce", WORLD);
    return [
      kicker("Collectives · the decomposition that matters"),
      title("<span class='mono'>all_reduce</span> is not a primitive", true),
      frag(d("panel g", [ctx.viz, ctx.cap]), "f-fade"),
      d("rowflex", [
        frag(d("pill", "① reduce_scatter"), "f-pop"),
        frag(d("pill hot", "each rank owns one finished shard"), "f-pop"),
        frag(d("pill", "② all_gather"), "f-pop"),
        frag(d("pill", "everyone holds everything"), "f-pop")
      ]),
      frag(d("cols3", [
        NN.formula({ rule: "reduce_scatter", sub: byOp("reduce_scatter").ring_factor,
          result: f(rsF, 3) + " × S", cls: "gradient" }),
        NN.formula({ rule: "+ all_gather", sub: byOp("all_gather").ring_factor,
          result: f(agF, 3) + " × S", cls: "weight" }),
        NN.formula({ rule: "= all_reduce", sub: byOp("all_reduce").ring_factor,
          result: f(arF, 3) + " × S", cls: "gradient" })
      ]), "f-fade"),
      frag(NN.callout("key", "Remember the halfway point",
        "After the reduce-scatter, rank i already holds the completely-summed " +
        "shard i. The all-gather exists only to give every rank a copy of every " +
        "other shard. If a rank is only ever going to update its own shard of " +
        "the parameters, that second half is " +
        f(agF / arF * 100, 0) + "% of the traffic spent on data it will throw " +

  render: function (n, ctx) {

/* ---------------------------------------------------------- C11. the ring */
function ringPhases(N) {
  const out = [];
  for (let p = 0; p < N - 1; p++) {
    const send = [];
    for (let i = 0; i < N; i++) send.push(((i - p) % N + N) % N);
    out.push({ kind: "reduce-scatter", round: p + 1, send: send });
  }
  for (let p = 0; p < N - 1; p++) {
    const send = [];
    for (let i = 0; i < N; i++) send.push(((i + 1 - p) % N + N) % N);
    out.push({ kind: "all-gather", round: p + 1, send: send });
  }
  return out;
}

S({
  chapter: "Collectives · the ring", plain: "The ring algorithm, all " +
    (2 * (WORLD - 1)) + " phases",
  notes: "How is an all-reduce actually implemented? Not by everyone shouting " +
    "at everyone. Arrange the GPUs in a ring; each one only ever sends to its " +
    "right-hand neighbour and receives from its left. Cut the buffer into N " +
    "chunks. For N−1 rounds each GPU forwards a chunk and adds what it " +
    "receives — after those rounds each GPU owns exactly one fully-summed " +
    "chunk. Then for another N−1 rounds those finished chunks travel the same " +
    "way without accumulation until everyone has all of them. That is " +
    (2 * (WORLD - 1)) + " phases at world " + WORLD + ", each moving one Nth " +
    "of the buffer. Step through them and watch which chunk each GPU is " +
    "sending. The payoff is the next slide, and it is the reason this " +
    "algorithm won.",
  build: function (ctx) {
    ctx.phases = ringPhases(WORLD);
    ctx.ring = NN.gpu.ring({ count: WORLD, size: 384, r: 140 });
    ctx.lab = h("phaselabel", "");
    ctx.desc = h("say", "");
    const beats = ctx.phases.map(function (p, i) {
      return frag(d("pill" + (p.kind === "all-gather" ? "" : " hot"),
        (i + 1) + " · " + p.kind + " " + p.round), "f-pop");
    });
    return [
      kicker("Collectives · ring all-reduce"),
      title("Every GPU only ever talks to its right-hand neighbour"),
      d("cols wide-r", [
        d("panel g", [ph("world " + WORLD + " · " + (2 * (WORLD - 1)) + " phases"),
          ctx.ring, ctx.lab]),
        d("stack", [
          frag(NN.formula({ rule: "phases", sub: "2 × (N − 1)",
            result: String(2 * (WORLD - 1)) + " at N = " + WORLD, cls: "gradient" }), "f-right"),
          frag(NN.formula({ rule: "each phase moves", sub: "S / N",
            result: f(NPAR / WORLD, 2) + " of " + NPAR + " elements",

      ]),

    ];
  },
  render: function (n, ctx) {
    const on = n >= 4;
    const k = NN.clamp(n - 4, 0, ctx.phases.length - 1);
    const p = ctx.phases[k];
    const labels = [];
    for (let i = 0; i < WORLD; i++) {
      labels.push(on ? "G" + i + "→c" + SUB[p.send[i]] : "G" + i);
    }

const DDP = STRAT.ddp;
const DDPMEM = DDP.memory_per_gpu;
const DDPTOT = DDPMEM.weights + DDPMEM.gradients + DDPMEM.optimizer;

/* the last layer's weight gradient is a single row — small enough to print
   all four per-GPU versions side by side */
const LAST = PM.n_layers - 1;
const GBASE = PMOD.dWs[LAST][0];
const GLOC  = DDP.local.map(function (l) { return l.dWs[LAST][0]; });

S({
  chapter: "Data parallel · the split", plain: "Split the batch: one sample per GPU",
  notes: "The simplest thing you can do with " + WORLD + " GPUs: put the whole " +
    "model on each of them and give each one a different slice of the batch. " +
    "Here the batch is " + PM.batch + " and the world is " + WORLD + ", so it is " +
    "one sample each — real runs give each GPU dozens. Note what is replicated " +
    "and what is not: " + DDP.replicates + " are replicated; " + DDP.splits +
    " is split. Activations are the one thing that genuinely shrinks, because " +
    "each GPU only ever computes activations for its own samples. Look at the " +
    "per-GPU losses — " + DDP.local.map(function (l) { return f(l.loss, 3); }).join(", ") +
    " — they are wildly different, because one house is not the dataset. The " +
    "full-batch loss is " + f(PMOD.loss, 4) + ", and averaging the four gives " +
    "exactly that.",
  build: function () {
    const cards = NN.gpu.grid({ count: WORLD,
      label: function (g) { return "GPU " + g; },

            "   ŷ = " + f(l.yhat[0][0], 3)),

S({
  chapter: "Data parallel · overlap", plain: "Bucketing: the all-reduce hides inside the backward pass",
  notes: "A naive implementation waits for the whole backward pass, then " +
    "all-reduces " + NPAR + " elements, then steps — and the network sits idle " +
    "during backward while the GPUs sit idle during the all-reduce. Real DDP " +
    "does not do that. Gradients are produced in reverse layer order, so the " +
    "last layer's gradient is ready long before the first layer's. Group them " +
    "into buckets of a few tens of megabytes and fire each bucket's all-reduce " +
    "the moment it is complete. By the time backward finishes, most of the " +
    "traffic has already happened. This is the single reason DDP is fast in " +
    "practice, and it is also why bucket size is a tuning knob: too small and " +
    "you pay latency per bucket, too large and there is nothing left to " +
    "overlap.",

/*  PART E · ZeRO / FSDP                                                    */
/* ======================================================================== */
const Z1 = STRAT.zero1, Z2 = STRAT.zero2, Z3 = STRAT.zero3;
const memTot = function (s) {
  const m = s.memory_per_gpu;
  return m.weights + m.gradients + m.optimizer;
};
const LADDER = [
  { s: DDP, k: "DDP", t: memTot(DDP) },
  { s: Z1, k: Z1.name, t: memTot(Z1) },
  { s: Z2, k: Z2.name, t: memTot(Z2) },
  { s: Z3, k: Z3.name, t: memTot(Z3) }
];

S({
  chapter: "ZeRO · the redundancy", plain: "Look at what four DDP replicas actually hold",
  notes: "Put the four DDP replicas side by side and stare at them. They are " +
    "identical. Bit for bit. Every GPU holds a copy of the same " + DDPMEM.optimizer +

    " copies are never read by anybody. The same for the gradients: after the " +
    "all-reduce every rank holds the same averaged vector, and each rank is " +
    "going to use it to update every parameter — even though, if we divided " +
    "the work, each rank would only need to touch one quarter of them. ZeRO's " +
    "entire idea is in that observation. It is not compression and it is not " +
    "approximation. It is noticing that N copies of a thing that one copy " +
    "would do is N−1 copies too many, and then paying the communication " +
    "needed to keep it that way.",
  build: function () {

      frag(d("cols3", [

        panel("g tight", [ph("gradients · " + DDPMEM.gradients + " elems"),

        panel("o tight", [ph("optimizer · " + DDPMEM.optimizer + " elems"),

  }
});

S({

});

S({
  chapter: "ZeRO · the insight", plain: "The insight: change what the second half carries",
  notes: "This is the slide the whole ZeRO section is built around, so slow " +
    "down. DDP ends its backward pass with an all-reduce of the gradients, and " +
    "we established ten slides ago that an all-reduce IS a reduce-scatter " +
    "followed by an all-gather. Look at what each half is for. The " +
    "reduce-scatter does the actual summing and leaves rank i holding the " +
    "finished gradient shard i. The all-gather exists only so that every rank " +
    "can then run the optimizer over every parameter. But it does not have to. " +
    "Let rank i run the optimizer over shard i alone — which is all it has " +
    "state for — and then all-gather the UPDATED WEIGHTS instead of the " +
    "gradients. Same two collectives, same payload size, " +
    f(ringFactor("reduce_scatter", WORLD), 3) + "S + " +
    f(ringFactor("all_gather", WORLD), 3) + "S = " +
    f(ringFactor("all_reduce", WORLD), 3) + "S either way. And now no rank " +
    "needs full optimizer state, and no rank needs a full gradient buffer. " +
    "That is stages 1 and 2, and the wire does not notice.",

      frag(d("panel g", [ph("DDP · all_reduce the gradients · " + f(arF, 3) + "S"),
        d("arrowline", [

          h("ar", "→"),
          d("pill", "rank i owns finished gradient shard i"),
          h("ar", "→"),
          d("pill", "② all_gather the GRADIENTS · " + f(agF, 3) + "S"),

          d("pill", "② all_gather the UPDATED WEIGHTS · " + f(agF, 3) + "S"),

        ])]), "f-pop"),
      frag(d("cols", [
        NN.callout("key", "The wire does not notice",
          "<span class='mono'>" + f(rsF, 3) + "S + " + f(agF, 3) + "S = " +

S({
  chapter: "ZeRO · the cycle", plain: "The gather–use–free cycle, layer by layer",
  notes: "Here is what ZeRO-3 actually does, step by step, and it is the " +
    "mechanic that explains the cost. Walk the schedule: for each of the " +
    PM.n_layers + " layers in turn, all-gather that layer's weights from the " +
    WORLD + " shards, run the layer, then free the full copy immediately — " +
    "keeping only your own shard. Peak memory is therefore your shard of " +
    "everything, plus ONE materialised layer, not the whole model. Then the " +
    "backward pass walks the layers in reverse and has to gather each one " +
    "AGAIN, because it was thrown away. That second gather is where the " +
    Z3.comm_vs_ddp + "× comes from. In practice frameworks prefetch layer i+1 " +
    "while layer i computes, so if the interconnect is fast enough the gathers " +
    "are invisible — and if it is not, the GPUs stall waiting for weights. " +
    "That is exactly why ZeRO-3 wants NVLink or a good fabric.",
  build: function (ctx) {
    ctx.sched = Z3.schedule;
    ctx.host = d("stack");
    ctx.state = d("stack");
    ctx.lab = h("phaselabel", "");
    const beats = ctx.sched.map(function (c, i) {
      return frag(d("pill" + (c.op === "reduce_scatter" ? " hot" : ""),
        (i + 1) + " · " + c.op + " · " + c.phase), "f-pop");
    });
    return [
      kicker("Distributed · ZeRO-3 · the mechanic"),
      title("Materialise a layer, use it, throw it away", true),
      d("cols wide-l", [
        d("panel w", [ph("what is resident right now"), ctx.lab, ctx.state]),
        d("stack", [ctx.host])
      ]),
      d("rowflex", beats),
      frag(NN.callout("mem", "Peak is one layer, not one model",
        "The weight shard at rest is " + Z3.peak.at_rest + " elements. On top " +
        "of it sits a materialised layer — the largest here is " +
        Z3.peak.largest_layer_params + " — so the peak is " +
        Z3.peak.peak_no_prefetch + ", and " + Z3.peak.peak_with_prefetch +
        " once the next layer is being prefetched alongside. The next slide is " +
        "entirely about that gap. For " + MODEL.name + " one materialised block " +
        "is " + BY(P_LAYER * R_W) + " against " + BY(CFG.stateB) +
        " of model state spread over the cluster."), "f-fade"),
      frag(NN.callout("warn", "And it is why prefetch is not optional",
        "Two all-gathers and one reduce-scatter per layer per step. Frameworks " +
        "gather layer i+1 while layer i computes; if the fabric cannot keep up, " +
        "the GPUs idle waiting for weights they cannot compute without. This is " +
        "the reason people stop at ZeRO-1 or ZeRO-2 when they can afford to."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const k = NN.clamp(n - 1, 0, ctx.sched.length - 1);
    const c = ctx.sched[k];
    ctx.host.innerHTML = "";
    ctx.host.appendChild(NN.gpu.commCard(c));
    ctx.lab.textContent = (k + 1) + " / " + ctx.sched.length + " · " + c.phase;
    ctx.state.innerHTML = "";
    /* which layer, if any, is currently whole on this GPU */
    const mLayer = /W(\d+)/.exec(c.tensor || "");
    const live = c.op === "all_gather" && mLayer ? parseInt(mLayer[1], 10) : -1;
    PMOD.layer_params.forEach(function (p, L) {
      ctx.state.appendChild(shardBar({
        name: "W" + L, parts: WORLD,
        own: live === L ? "all" : [0], color: "var(--weight)" }));
    });
    ctx.state.appendChild(el("div", { class: "gpu-line" },
      live >= 0 ? "layer " + live + " is WHOLE here — " +
        PMOD.layer_params[live] + " elements, freed the moment it is used"
                : "GPU 0 holds shard 0 of every layer — " + memTot(Z3) + " elements"));
  }
});

S({
  chapter: "ZeRO · at rest vs at peak", plain: "“params / N” is the at-rest figure. The peak is what has to fit.",
  notes: "The most commonly repeated claim about ZeRO-3 is that per-GPU memory " +
    "becomes the model divided by the world size. That is true, and it is the " +
    "at-rest figure: " + Z3.peak.at_rest + " elements here. But a GPU cannot " +
    "multiply by a quarter of a matrix. The instant a layer is needed it is " +
    "materialised in full, and if the framework is prefetching the next layer " +
    "while computing this one — which it must, or the GPUs stall — then two " +
    "whole layers are resident at once. The data gives all three: at rest " +
    Z3.peak.at_rest + ", peak without prefetch " + Z3.peak.peak_no_prefetch +
    ", peak with prefetch " + Z3.peak.peak_with_prefetch + ". That last one is " +
    f(Z3.peak.ratio_to_at_rest, 3) + "× the number people quote, and it is the " +
    "number that has to fit. The structure is peak/at_rest = 1 + (N−1)/L: " +
    "the deeper the model, the smaller the gather overhead relative to the " +
    "shard, so ZeRO-3 rewards depth and punishes a model that is a few very " +
    "wide layers. And the hard limit: " + Z3.peak.note.split("--")[1],
  build: function (ctx) {
    const pk = Z3.peak;
    const Lm = pk.layer_params.length;
    const pts = [];
    for (let L = 2; L <= 96; L++) pts.push([L, 1 + (WORLD - 1) / L]);
    return [
      kicker("Distributed · ZeRO-3 · the number that actually has to fit"),
      title("At rest " + pk.at_rest + " elements. At peak " +
            pk.peak_with_prefetch + ".", true),
      d("cols wide-l", [
        frag(d("panel o", [ph("elements resident on one GPU"),
          NN.chart.bars({ items: [
            { label: "at rest · the quoted figure", value: pk.at_rest,
              color: "var(--optimizer)", sub: "· params ÷ " + WORLD },
            { label: "+ one materialised layer", value: pk.peak_no_prefetch,
              color: "var(--weight)",
              sub: "· largest layer is " + pk.largest_layer_params },
            { label: "+ prefetching the next one", value: pk.peak_with_prefetch,
              color: "var(--critical)",
              sub: "· " + f(pk.ratio_to_at_rest, 3) + "× the quoted figure" }
          ], unit: "elems" })]), "f-left"),
        d("stack", [
          frag(NN.formula({ rule: "peak / at_rest", sub: "1 + (N − 1) / L",
            result: f(pk.ratio_to_at_rest, 3) + " at N = " + WORLD + ", L = " + Lm,
            cls: "optimizer" }), "f-right"),
          frag(d("panel acc tight", [ph("gathered on top of the shard, per layer"),
            d("rowflex", pk.gather_extra_per_layer.map(function (g, L) {
              return d("pill", "W" + L + " · +" + g);
            }))]), "f-right"),
          frag(d("panel acc tight", [ph("peak ÷ at-rest as the model gets deeper"),
            NN.chart.line({ series: [{ name: "1 + (N−1)/L", color: "var(--optimizer)",
              points: pts, dots: false }], width: 520, height: 176,
              xlabel: "layers L", ylabel: "× at-rest", yMin: 1, yMax: 2.6,
              margin: { t: 12, r: 16, b: 32, l: 54 } })]), "f-right")
        ])
      ]),
      frag(d("cols", [
        NN.callout("key", "ZeRO-3 rewards depth",
          "The gather overhead is one layer; the shard is the whole model over " +
          "N. A deep, narrow model amortises the gather over many layers and " +
          "the ratio approaches 1; a shallow, very wide one pays almost a whole " +
          "layer on top of its shard. " + MODEL.name + " has " + CFG.layers +
          " layers, which puts the ratio at " +
          f(1 + (WORLD - 1) / CFG.layers, 3) + " at world " + WORLD + "."),
        NN.callout("warn", "And there is a floor ZeRO-3 cannot cross",
          pk.note)
      ]), "f-fade")
    ];
  }
});

/* ======================================================================== */
/*  PART F · TENSOR PARALLEL                                                */
/* ======================================================================== */
const TP = STRAT.tp;

/* The generator now ships the per-GPU partials on every block
   (per_gpu_hidden, per_gpu_partial_out, summed_before_bias, after_bias) and
   the slides RENDER those. We still re-run the Megatron forward here and
   compare, because two independent implementations agreeing is a stronger
   statement than either one alone — and a silent divergence between the
   generator and the deck is exactly the failure this project exists to avoid. */
const tpCalc = (function () {
  const Ws = PMOD.Ws, bs = PMOD.bs, X = PMOD.X;
  function mm(A, B) {           /* A (m x k) · B (k x n) */
    const m = A.length, k = B.length, n = B[0].length, out = [];
    for (let i = 0; i < m; i++) {
      out.push([]);
      for (let j = 0; j < n; j++) {
        let s = 0;
        for (let t = 0; t < k; t++) s += A[i][t] * B[t][j];
        out[i].push(s);
      }
    }
    return out;
  }
  function tr(A) {
    const out = [];
    for (let j = 0; j < A[0].length; j++) {
      out.push([]);
      for (let i = 0; i < A.length; i++) out[j].push(A[i][j]);
    }
    return out;
  }
  const blocks = [];
  let hFull = X;
  TP.blocks.forEach(function (blk) {
    const Lc = blk.col_layer, Lr = blk.row_layer, per = blk.units_per_gpu;
    const shardsA = [], partials = [];
    for (let g = 0; g < WORLD; g++) {
      const Wg = Ws[Lc].slice(g * per, (g + 1) * per);
      const bg = bs[Lc].slice(g * per, (g + 1) * per);
      const zg = mm(hFull, tr(Wg)).map(function (row) {
        return row.map(function (v, j) { return v + bg[j]; });
      });
      shardsA.push(zg.map(function (row) {
        return row.map(function (v) { return v > 0 ? v : 0; });
      }));
    }
    for (let g = 0; g < WORLD; g++) {
      const Wg = Ws[Lr].map(function (row) { return row.slice(g * per, (g + 1) * per); });
      partials.push(mm(shardsA[g], tr(Wg)));
    }
    const summed = partials[0].map(function (row, i) {
      return row.map(function (v, j) {
        let s = 0;
        for (let g = 0; g < WORLD; g++) s += partials[g][i][j];
        return s;
      });
    });
    const z = summed.map(function (row) {
      return row.map(function (v, j) { return v + bs[Lr][j]; });
    });
    const isLast = Lr === PM.n_layers - 1;
    hFull = isLast ? z : z.map(function (row) {
      return row.map(function (v) { return v > 0 ? v : 0; });
    });
    blocks.push({ blk: blk, shardsA: shardsA, partials: partials,
                  summed: summed, out: z });
  });
  let err = 0;
  hFull.forEach(function (row, i) {
    row.forEach(function (v, j) { err = Math.max(err, Math.abs(v - PMOD.yhat[i][j])); });
  });
  if (err > 1e-9) {
    console.warn("nn-internals slides: TP recomputation disagrees with PARALLEL.model.yhat " +
                 "by " + err);
  }
  /* cross-check every stored partial against the local re-run */
  let xerr = 0;
  TP.blocks.forEach(function (blk, bi) {
    const mine = blocks[bi];
    (blk.per_gpu_partial_out || []).forEach(function (p, g) {
      p.forEach(function (row, i) {
        row.forEach(function (v, j) {
          xerr = Math.max(xerr, Math.abs(v - mine.partials[g][i][j]));
        });
      });
    });
    (blk.summed_before_bias || []).forEach(function (row, i) {
      row.forEach(function (v, j) {
        xerr = Math.max(xerr, Math.abs(v - mine.summed[i][j]));
      });
    });
  });
  if (xerr > 1e-12) {
    console.warn("nn-internals slides: stored TP partials disagree with the " +
                 "local re-run by " + xerr);
  }
  return { blocks: blocks, yhat: hFull, err: err, crosscheck: xerr };
})();

/* the block ending in yhat — rendered from the SHIPPED partials */
const TPBLK = TP.blocks[TP.blocks.length - 1];
const TPB = {
  blk:      TPBLK,
  partials: TPBLK.per_gpu_partial_out,
  summed:   TPBLK.summed_before_bias,
  out:      TPBLK.after_bias,
  hidden:   TPBLK.per_gpu_hidden
};

S({
  chapter: "Tensor parallel · the cut", plain: "A different cut: split the weight matrix itself",
  notes: "Data parallelism split the batch and ZeRO split the storage; " +
    "everybody still computed whole layers. Tensor parallelism does something " +
    "categorically different: it cuts the weight matrices, and therefore the " +
    "computation, into pieces. " + TP.name + " splits " + TP.splits +
    " and replicates " + TP.replicates + ". That last part is the giveaway: " +
    "every GPU sees the whole batch and computes a piece of every activation, " +
    "which is the opposite of DDP. It is the only strategy that shrinks a " +
    "single layer's activation tensors, which is what you need when one layer " +
    "on its own does not fit. The cost is that the pieces have to be " +
    "reassembled inside the forward pass, on the critical path, which is why " +
    "TP lives on NVLink.",
  build: function () {
    return [
      kicker("Distributed · tensor parallel"),
      title("Cut the matrix, not the batch"),
      frag(d("cols3", [
        panel("w", [ph("data parallel"),
          h("small", "same weights everywhere, different samples"),
          h("small muted", "activations ÷ N, weights × N replicated")]),
        panel("o", [ph("ZeRO"),
          h("small", "same computation everywhere, state split"),
          h("small muted", "storage ÷ N, computation unchanged")]),
        panel("a", [ph("tensor parallel"),
          h("small", "same samples everywhere, different slice of every matrix"),
          h("small muted", "weights ÷ N <em>and</em> the activations with them")])
      ]), "f-pop"),
      frag(d("cols", [
        NN.tiles([
          { k: "splits", v: "weight matrices", s: TP.splits, cls: "weight" },
          { k: "replicates", v: "the batch", s: TP.replicates, cls: "activation" },
          { k: "per-GPU model state", v: memTot(TP) + " elems",
            s: "of " + memTot(DDP) + " on one GPU", cls: "optimizer" }
        ]),
        NN.callout("key", "The only strategy that shrinks one layer",
          "If a single layer's activations do not fit on a card, no amount of " +
          "data parallelism or ZeRO helps — both still compute the whole layer " +
          "on one device. Tensor parallelism is the one that makes the layer " +
          "itself smaller.")
      ]), "f-fade")
    ];
  }
});

S({
  chapter: "Tensor parallel · row", plain: "Row-parallel: split the input dimension",
  notes: "The second way to cut a matrix, and it is the mirror image. Split by " +
    "INPUT dimension: GPU g gets columns " + "[g·" + TP.blocks[0].units_per_gpu +
    ", …) of W, which is exactly the slice of the input it already has from " +
    "the column-parallel layer before it. No reshuffle, no communication to " +
    "line the pieces up. But now the situation is reversed: each GPU can " +
    "compute a contribution to every output, and none of them can compute any " +
    "output completely, because each is missing the other three quarters of " +
    "the contraction. What comes out is a partial sum — full shape, wrong " +
    "values. The bias is deliberately NOT added yet: adding it on four GPUs " +
    "would add it four times.",
  build: function () {

/*  PART G · PIPELINE PARALLEL                                              */
/* ======================================================================== */
const PP = STRAT.pp;
const SCHED_G = PP.schedules.gpipe;      /* all forwards, then all backwards */
const SCHED_1 = PP.schedules["1f1b"];    /* warm up, alternate, drain        */
const PGRID = SCHED_G.grid;
const PSLOTS = PGRID[0].length;

/* Rebuild the generator's occupancy grid here so a naive (M = 1) schedule
   can be drawn with the same rule. Checked against PARALLEL's own grid. */
function pipeGrid(P, M) {
  const total = 2 * M + 2 * (P - 1);
  const g = [];
  for (let s = 0; s < P; s++) {
    const row = [];
    for (let t = 0; t < total; t++) row.push(null);
    g.push(row);
  }
  for (let m = 0; m < M; m++) for (let s = 0; s < P; s++) g[s][s + m] = "F" + m;
  const base = M + P - 1;
  for (let m = 0; m < M; m++) for (let s = P - 1; s >= 0; s--) {
    const t = base + m + (P - 1 - s);
    if (t < total) g[s][t] = "B" + m;
  }
  return g;
}
function bubbleOf(grid) {
  let idle = 0, tot = 0;
  grid.forEach(function (r) { r.forEach(function (v) { tot++; if (!v) idle++; }); });
  return idle / tot;
}
(function () {
  const mine = pipeGrid(WORLD, PP.n_micro);
  if (JSON.stringify(mine) !== JSON.stringify(SCHED_G.grid)) {
    console.warn("nn-internals slides: local GPipe grid disagrees with PARALLEL");
  }
  [SCHED_G, SCHED_1].forEach(function (sc) {
    if (Math.abs(bubbleOf(sc.grid) - sc.stats.bubble_measured) > 1e-5) {
      console.warn("nn-internals slides: counted bubble disagrees with stats for " +
                   sc.what);
    }
  });
})();
/* The M = 1 case is a slider-style derivation, not shipped data: the same
   rule the generator uses, run with one micro-batch. */
const NAIVE = pipeGrid(WORLD, 1);

S({

S({
  chapter: "Pipeline parallel · micro-batching", plain: "Micro-batching: keep the pipe full",
  notes: "The fix is the one every factory learned a century ago. Do not push " +
    "one big item through; cut it into M pieces and keep them all in flight. " +
    "As soon as stage 0 has finished micro-batch 0 it starts micro-batch 1, " +
    "while stage 1 works on micro-batch 0. After " + (WORLD - 1) + " slots " +
    "every stage has something to do, and it stays that way until the batch " +
    "runs out. The idle time does not vanish — the fill at the start and the " +
    "drain at the end are unavoidable — but it is now amortised over M " +
    "micro-batches instead of one. With M = " + PP.n_micro + " here the idle " +
    "fraction falls from " + f(bubbleOf(NAIVE) * 100, 0) + "% to " +
    f(PP.bubble_fraction * 100, 0) + "%. The catch, and it is a real one, is " +
    "that every micro-batch in flight is holding its own activations.",
  build: function () {
    return [
      kicker("Distributed · pipeline parallel · micro-batching"),
      title("Cut the batch into " + PP.n_micro + " pieces and overlap them"),
      frag(d("arrowline", [
        d("panel a tight", [ph("batch " + PM.batch),
          h("midnum v-activation", String(PM.batch))]),
        h("ar", "→"),
        d("panel a tight", [ph("÷ " + PP.n_micro + " micro-batches"),
          h("midnum v-activation", String(PM.batch / PP.n_micro) + " each")]),
        h("ar", "→"),
        d("panel g tight", [ph("idle drops"),
          h("midnum v-gradient", f(bubbleOf(NAIVE) * 100, 0) + "% → " +

      frag(d("cols", [
        NN.callout("key", "The fill and the drain never go away",
          "At the start, stage s has nothing to do for its first s slots. At " +
          "the end it runs dry the same way. That cost is fixed at " +
          (WORLD - 1) + " slots; micro-batching does not remove it, it spreads " +
          "it over more useful work."),

          "Each one that has been forwarded but not yet backwarded is holding " +

  }
});

S({
  chapter: "Pipeline parallel · the formula", plain: "The bubble is " + PP.bubble_formula,
  notes: "The counting argument is short. Each stage is idle for exactly P−1 " +

    WORLD + " and M = " + PP.n_micro + " that is " +
    f(PP.bubble_fraction, 4) + ", which is exactly the idle-cell count on the " +
    "previous slide. Read the curve: the bubble falls like 1/M, so the first " +
    "few micro-batches buy you a great deal and the twentieth buys almost " +
    "nothing. The working rule people use is M ≥ 4P, which puts the bubble " +
    "around " + f((WORLD - 1) / (4 * WORLD + WORLD - 1) * 100, 0) +
    "%. And note what the formula does NOT contain: the model size, the layer " +
    "width, the batch size. Only the shape of the schedule.",
  build: function () {
    const pts = [];
    for (let M = 1; M <= 32; M++) pts.push([M, (WORLD - 1) / (M + WORLD - 1)]);
    const rule = 4 * WORLD;

      kicker("Distributed · pipeline parallel · the arithmetic"),
      title("<span class='mono'>bubble = " + PP.bubble_formula + "</span>", true),
      d("cols wide-r", [
        d("stack", [

            result: "P − 1 = " + (WORLD - 1), cls: "gradient" }), "f-left"),

});

S({
  chapter: "Pipeline parallel · interleaving", plain: "Interleaved stages: cut the bubble again",
  notes: "One more trick, and it is the one that makes pipeline parallelism " +
    "viable at large P. Instead of giving stage s one contiguous block of " +
    "layers, give it v non-contiguous chunks — stage 0 gets layers 0 and 4, " +
    "stage 1 gets 1 and 5, and so on. Now a micro-batch visits every stage v " +
    "times per forward pass, the pipeline effectively has v times as many " +
    "slots to fill, and the bubble becomes (P−1)/(v·M+P−1) — divided by v. The " +
    "cost is v times as many point-to-point messages, which is affordable " +
    "precisely because those messages were cheap to begin with. Megatron calls " +
    "this the interleaved schedule and it is standard at large scale. Note the " +
    "constraint: the number of layers must be divisible by P times v.",
  build: function () {
    const M = PP.n_micro;
    const series = [1, 2, 4].map(function (v, i) {
      const pts = [];
      for (let m = 1; m <= 32; m++) pts.push([m, (WORLD - 1) / (v * m + WORLD - 1)]);
      return { name: "v = " + v, color: ["var(--gradient)", "var(--warning)", "var(--good)"][i],
               points: pts, dots: false };
    });
    return [
      kicker("Distributed · pipeline parallel · interleaving"),
      title("Give each stage several non-contiguous chunks", true),
      d("cols wide-r", [
        d("stack", [
          frag(d("panel w tight", [ph("contiguous · v = 1"),
            h("small mono", "stage 0: layers 0 · stage 1: layer 1 · stage 2: layer 2 · " +
              "stage 3: layer 3")]), "f-left"),
          frag(d("panel a tight", [ph("interleaved · v = 2, twice as many chunks"),
            h("small mono", "stage 0: layers 0, 4 · stage 1: layers 1, 5 · " +
              "stage 2: layers 2, 6 · stage 3: layers 3, 7")]), "f-left"),
          frag(NN.formula({ rule: "bubble with v chunks per stage",
            sub: "(P−1) / (v·M + P−1), at P = " + WORLD + ", M = " + M,
            result: f((WORLD - 1) / (1 * M + WORLD - 1) * 100, 1) + "% → " +
                    f((WORLD - 1) / (2 * M + WORLD - 1) * 100, 1) + "% at v = 2",
            cls: "gradient" }), "f-left"),
          frag(NN.callout("warn", "What it costs",
            "v times as many stage-boundary messages, because a micro-batch " +
            "now crosses the whole ring v times per pass. That is affordable " +
            "only because those messages are point-to-point and small — the " +
            "same property that made PP the cheap axis in the first place. " +
            "And the layer count must divide by P × v."), "f-left")
        ]),
        frag(d("panel g", [ph("bubble fraction, P = " + WORLD),
          NN.chart.line({ series: series, width: 560, height: 250,
            xlabel: "micro-batches M", ylabel: "idle fraction", yMin: 0, yMax: 0.8 }),
          chartKey(series.map(function (s) { return { name: s.name, color: s.color }; }))]),
          "f-right")
      ])
    ];
  }
});

/* ======================================================================== */
/*  PART H · COMPOSING THE THREE AXES                                       */
/* ======================================================================== */
/* The recipe below is a SCENARIO, not a fact about the model — it is stated
   as such on the slide. Every number in it is derived from CFG and R_MIX. */
const REC = { tp: 8, pp: 2, dp: 4 };
REC.gpus     = REC.tp * REC.pp * REC.dp;
REC.shardTPP = REC.tp * REC.pp;
REC.wB       = CFG.params * R_W / REC.shardTPP;
REC.gB       = CFG.params * R_G / REC.shardTPP;
REC.oB       = CFG.params * OPTB / REC.shardTPP / REC.dp;   /* + ZeRO-1 over DP */
REC.stateB   = REC.wB + REC.gB + REC.oB;
REC.layersPerStage = CFG.layers / REC.pp;

S({
  chapter: "3D · composition", plain: "TP × PP × DP factorises the GPU count",
  notes: "The three axes are orthogonal and they multiply. A cluster of N GPUs " +
    "is arranged as a TP degree times a PP degree times a DP degree, and the " +
    "product must be exactly N. Each axis attacks a different one of the four " +
    "tensor classes we traced at the start of this deck: tensor parallelism " +
    "splits the weights inside a layer and the activations with them, pipeline " +
    "parallelism splits the depth so no GPU holds all the layers, data " +
    "parallelism splits the batch and — with ZeRO on top — the optimizer " +
    "state. That is what '3D parallelism' means. It is not three clever " +
    "techniques; it is one factorisation, chosen so that each factor lands on " +
    "the part of the hardware that can afford its communication pattern.",
  build: function () {
    return [
      kicker("Distributed · composing the axes"),
      title("<span class='mono'>N = TP × PP × DP</span>", true),
      frag(d("cols3", [
        panel("a", [ph("tensor parallel · innermost"),
          h("say", "Splits every weight matrix and every activation inside a " +
            "layer. Two all-reduces per block, on the critical path."),
          h("small muted", "wants NVLink · degree ≤ GPUs per node")]),
        panel("g", [ph("pipeline parallel · outermost"),
          h("say", "Splits the layer stack into stages. Point-to-point " +
            "messages of one micro-batch at each boundary."),
          h("small muted", "survives slow links · costs a bubble")]),
        panel("o", [ph("data parallel · overlappable"),
          h("say", "Splits the batch. One gradient all-reduce per step, and " +

      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("key", "Each axis attacks a different tensor class",
          "TP shrinks <span class='v-weight'>weights</span> and " +
          "<span class='v-activation'>activations</span> inside a layer. " +
          "PP shrinks <span class='v-weight'>weights</span> by depth. " +
          "DP shrinks <span class='v-activation'>activations</span> by batch, " +

      ]), "f-fade")
    ];
  }
});

S({
  chapter: "3D · topology", plain: "Map the axes onto the hardware, innermost first",
  notes: "The ordering is not arbitrary and getting it wrong is the classic " +

    "little that communication can be hidden. Tensor parallelism is worst on " +
    "both counts — big activation payloads, on the critical path, " +
    "unoverlappable — so it goes innermost, on NVLink, inside a node, never " +
    "crossing a network boundary. Pipeline parallelism is the opposite: tiny " +
    "point-to-point messages, naturally spread out in time, so it goes " +
    "outermost across nodes or even across racks. Data parallelism sits in " +
    "between: one big collective per step, but it overlaps with the backward " +
    "pass almost completely, so it tolerates a slower link than TP but wants " +
    "better than PP. The mnemonic: TP inside the box, DP inside the rack, PP " +
    "across the building.",

  notes: "One honest loose end. Three of the four classes have clean answers: " +

    "size, exactly, with a well-understood communication cost. Activations are " +
    "different. They are not a fixed quantity you can shard once — they are " +
    "regenerated on every step, they scale with batch and sequence rather than " +
    "with the model, and the seq² term inside attention scales worse than " +
    "that. Data parallelism divides them by the world size, tensor parallelism " +
    "divides them by the TP degree, but neither makes them small; they make " +
    "them proportional. So the remaining levers are different in kind: " +
    "recompute instead of remember, never materialise the score matrix, shard " +
    "the sequence dimension itself. That is where the current work is, and it " +
    "is why every new attention variant you read about is fundamentally a " +
    "memory paper.",
