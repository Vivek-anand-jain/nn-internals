      kicker("Forward · block 0 · one dot product"),
      title("Row of the input · column of the weight", true),
      d("cols wide-l", [
        frag(d("rowflex top", [ctx.inp, h("ar", "×"), ctx.wq,
                               h("ar", "="), ctx.q]), "f-fade"),
        d("stack", terms.map(function (t, k) {
          return frag(NN.formula({
            rule: "LN1(h)[0][" + k + "] × W_q[" + k + "][0]",
            sub: A(t.x, 4) + " × " + W(t.w, 4),
            result: f(t.x * t.w, 6), cls: "activation" }), "f-right");
        }).concat([
          frag(NN.formula({ rule: "sum → Q[0][0]",
            sub: terms.map(function (t) { return f(t.x * t.w, 4); }).join(" + "),
            result: f(FL[0].qkv.Q[0][0], 6), cls: "activation" }), "f-pop")
        ]))
      ]),
      frag(NN.callout("why", "Hold this picture for the partitioning section",
        "The whole input row is needed; only <em>one column</em> of " +
        "<span class='mono'>W_q</span> is. So a GPU holding half the columns of " +
        "<span class='mono'>W_q</span> can compute half the columns of " +
        "<span class='mono'>Q</span>, exactly and finally, provided it has the " +
        "whole input. That single sentence is column parallelism."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const k = NN.clamp(n, 0, DM);
    ctx.inp.highlight(k > 0 ? grid2(1, k, function (a, j) { return [0, j]; }) : null, k > 0);
    ctx.wq.highlight(k > 0 ? grid2(k, 1, function (i) { return [i, 0]; }) : null, k > 0);
    ctx.q.highlight(n >= DM + 1 ? [[0, 0]] : null, n >= DM + 1);
  }
});

/* ------------------------------------------------------- T7. the head split */
S({
  chapter: "Forward L0 · the head split",
  plain: "The head split: cut Q, K and V by COLUMN into " + NH + " blocks of " + DH,
  notes: "This is the slide that unsticks people. There is no loop over heads " +
    "and there are no separate per-head matrices. There is one " +
    SQ + "×" + DM + " matrix Q, and 'multi-head' means you read it in " +
    NH + " column groups of " + DH + ". Head 0 takes columns 0 to " + (DH - 1) +
    ", head 1 takes columns " + DH + " to " + (DM - 1) + ". Same for K and same " +
    "for V, with the same column ranges, which is what makes the per-head " +
    "score matrices well-defined. Step the build and watch the cut land. Two " +
    "consequences worth stating. Attention is then computed entirely inside a " +
    "head — head 0 never touches a number belonging to head 1 — so heads are " +
    "embarrassingly parallel, which is exactly why tensor parallelism splits " +
    "attention by head. And the head width " + DH + " is what appears in the " +
    "1/√d_head scale two slides from now, not the model width.",
  build: function (ctx) {
    ctx.q = am("Q", FL[0].qkv.Q, SQ + " × " + DM, 3);
    ctx.h0 = am("Q head 0", FL[0].heads[0].Q,
      "columns " + FL[0].heads[0].cols[0] + "–" + (FL[0].heads[0].cols[1] - 1), 3);
    ctx.h1 = am("Q head 1", FL[0].heads[1].Q,
      "columns " + FL[0].heads[1].cols[0] + "–" + (FL[0].heads[1].cols[1] - 1), 3);
    ctx.cap = h("phaselabel", "");
    return [
      kicker("Forward · block 0 · heads"),
      title("A head is a slice of columns, not a separate matrix", true),
      d("cols wide-l", [
        d("stack", [
          frag(d("panel a", [ctx.cap, ctx.q]), "f-fade"),
          frag(d("rowflex top", [ctx.h0, h("ar", "·"), ctx.h1]), "f-pop")
        ]),
        d("stack", [
          frag(d("panel a tight", [ph("the same cut, applied to all three"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", {}, "head"), el("th", {}, "columns"),
                el("th", {}, "Q shape"), el("th", {}, "K shape"), el("th", {}, "V shape")])),
              el("tbody", {}, FL[0].heads.map(function (H) {
                return el("tr", {}, [
                  el("td", { class: "v-activation" }, "head " + H.head),
                  el("td", { class: "n mono" }, H.cols[0] + "–" + (H.cols[1] - 1)),
                  el("td", { class: "n" }, SQ + "×" + DH),
                  el("td", { class: "n" }, SQ + "×" + DH),
                  el("td", { class: "n" }, SQ + "×" + DH)
                ]);
              }))
            ])]), "f-right"),
          frag(NN.callout("key", "One matmul, then a view",
            "Nothing is copied and nothing is looped. The projection produced " +
            "one <span class='mono'>" + SQ + "×" + DM + "</span> tensor; " +
            "the heads are a <em>reshape</em> of it into " +
            "<span class='mono'>" + SQ + "×" + NH + "×" + DH +
            "</span>. Frameworks literally call <span class='mono'>.view()</span> " +
            "here."), "f-right"),
          frag(NN.callout("why", "Why heads at all",
            "One head of width " + DM + " can only express one similarity " +
            "structure per position. " + NH + " heads of width " + DH +
            " cost exactly the same parameters and the same FLOPs, and give " +
            NH + " independent similarity structures that " +
            "<span class='mono'>W_o</span> then mixes. It is a strictly better " +
            "use of the same budget."), "f-right")
        ])
      ])
    ];
  },
  render: function (n, ctx) {
    const c0 = grid2(SQ, DH, function (i, j) { return [i, j]; });
    const c1 = grid2(SQ, DH, function (i, j) { return [i, DH + j]; });
    if (n >= 2) {
      ctx.q.highlight(c0.concat(c1), false);
      ctx.cap.textContent = "cut into " + NH + " column blocks of " + DH;
    } else if (n >= 1) {
      ctx.q.highlight(c0, true);
      ctx.cap.textContent = "head 0 takes columns 0–" + (DH - 1);
    } else {
      ctx.q.highlight(null, false);
      ctx.cap.textContent = "Q · one matrix, " + DM + " columns";
    }
  }
});

/* -------------------------------------------------------- T8. raw scores */
S({
  chapter: "Forward L0 · scores",
  plain: "Raw scores: Qₕ · Kₕᵀ, every query against every key",
  notes: "Inside head 0 now. Every query row dots with every key row, which " +
    "gives a " + SQ + "×" + SQ + " matrix — one number for how much " +
    "token i wants to read token j. Work one entry: q0·k0 is " +
    FL[0].heads[0].Q[0].map(function (v, t) {
      return f(v, 3) + "×" + f(FL[0].heads[0].K[0][t], 3);
    }).join(" + ") + " = " + f(FL[0].heads[0].raw[0][0], 5) + ". This is the " +
    "operation that makes a transformer a transformer and it is also the " +
    "operation that makes it expensive: the object is seq by seq, per head, " +
    "so doubling the context quadruples it. At this toy size that is " +
    (NH * SQ * SQ) + " numbers, which is nothing; at a hundred thousand tokens " +
    "it is the dominant term in the whole model's activation memory, and it is " +
    "the reason FlashAttention exists.",
  build: function (ctx) {
    const H = FL[0].heads[0];
    ctx.H = H;
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 92,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i + " " + t; }),
      caption: "head 0 · raw q·k" });
    return [
      kicker("Forward · block 0 · head 0 · scores"),
      title("The " + SQ + "×" + SQ + " object: how much each token wants each other token", true),
      d("cols wide-r", [
        d("stack", [
          frag(d("rowflex top", [
            am("Q head 0", H.Q, "", 3), h("ar", "×"),
            am("K head 0 ᵀ", mT(H.K), "transposed", 3)
          ]), "f-fade"),
          frag(NN.formula({ rule: "score₀₀ = q₀ · k₀",
            sub: H.Q[0].map(function (v, t) {
              return f(v, 3) + "×" + f(H.K[0][t], 3); }).join(" + "),
            result: f(H.raw[0][0], 6), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "shape",
            sub: "(" + SQ + "×" + DH + ") · (" + DH + "×" + SQ + ")",
            result: SQ + "×" + SQ + " per head, " + (NH * SQ * SQ) + " numbers in all",
            cls: "activation" }), "f-left"),
          frag(NN.callout("mem", "This is the quadratic term, in miniature",
            "<span class='mono'>heads × seq²</span> = " +
            ACT2.filter(function (a) { return a.name === "attention probs P"; })[0].elements +
            " elements per block here. Every other tensor in the block grows " +
            "like <span class='mono'>seq</span>; this one grows like " +
            "<span class='mono'>seq²</span>, and it is the only place in " +
            "the architecture where that happens."), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.hm]), "f-right")])
      ])
    ];
  },
  render: function (n, ctx) {
    ctx.hm.paint(ctx.H.raw, { color: "var(--accent)", digits: 3 });
  }
});

/* --------------------------------------------------------- T9. the scale */
S({
  chapter: "Forward L0 · the scale",
  plain: "Divide by √d_head = √" + DH + " — and why",
  notes: "Then multiply every score by 1/√d_head, which here is 1/√" +
    DH + " = " + f(SCL, 6) + ". This is not cosmetic and it is worth being " +
    "precise about why. A dot product of two d-dimensional vectors whose " +
    "entries are roughly independent with variance σ² has variance " +
    "d·σ⁴ — so its typical MAGNITUDE grows like √d. Leave " +
    "it unscaled and wider heads produce systematically larger scores. Large " +
    "scores drive the softmax toward a one-hot vector. And the gradient of a " +
    "saturated softmax is nearly zero — we prove that algebraically in the " +
    "backward half, where dL/dsᵢ = pᵢ(dL/dpᵢ − Σⱼ " +
    "pⱼ dL/dpⱼ): if one p is 1 and the rest are 0, every term in that " +
    "expression collapses. So the scale is there to keep the softmax in the " +
    "regime where it still has a gradient. Watch the heatmap: the extremes " +
    "come in toward the middle.",
  build: function (ctx) {
    const H = FL[0].heads[0];
    ctx.H = H;
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 92,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i; }) });
    ctx.cap = h("phaselabel", "");
    return [
      kicker("Forward · block 0 · head 0 · scaling"),
      title("<span class='mono'>s = (QₕKₕᵀ) / √d_head</span>", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "the scale itself",
            sub: "1 / √" + DH,
            result: f(SCL, 8), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "entry [0][0]",
            sub: f(H.raw[0][0], 5) + " × " + f(SCL, 5),
            result: f(H.scaled[0][0], 6), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "largest |score| in this head",
            sub: "raw " + f(Math.max.apply(null, mflat(H.raw).map(Math.abs)), 4) +
                 "  →  scaled",
            result: f(Math.max.apply(null, mflat(H.scaled).map(Math.abs)), 4),
            cls: "activation" }), "f-left"),
          frag(NN.callout("why", "The chain, stated properly",
            "Dot products of d-dimensional vectors grow like " +
            "<span class='mono'>√d</span> → wide heads give big " +
            "scores → <span class='mono'>softmax</span> saturates toward " +
            "one-hot → its Jacobian " +
            "<span class='mono'>pᵢ(δᵢⱼ − pⱼ)</span> " +
            "goes to zero → <b>no gradient reaches Q or K at all</b>. " +
            "Dividing by <span class='mono'>√d_head</span> keeps the " +
            "scores size-independent of the head width."), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.cap, ctx.hm]), "f-right")])
      ]),
      frag(NN.callout("key", "It is d_head, not d_model",
        "The vectors being dotted are one head wide, " + DH + " here, not " +
        DM + ". Getting this wrong is a real bug: it does not crash, it just " +
        "trains slightly worse forever."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    if (n >= 3) {
      ctx.hm.paint(ctx.H.scaled, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = "scaled by 1/√" + DH + " — the range has shrunk";
    } else {
      ctx.hm.paint(ctx.H.raw, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = "raw q·k";
    }
  }
});

/* ------------------------------------------------------ T10. causal mask */
S({
  chapter: "Forward L0 · causal mask",
  plain: "The causal mask: an upper triangle of −∞",
  notes: "The model is trained to predict every next token at once, which is " +
    "only a legitimate exercise if position i cannot see position i+1. So " +
    "every score strictly above the diagonal is set to minus infinity BEFORE " +
    "the softmax, and exp(−∞) is exactly zero. Step the rows: " +
    "“" + TOK[0] + "” may read only itself, “" + TOK[1] +
    "” may read two, “" + TOK[2] + "” may read all three. Six " +
    "of the nine entries survive; three are masked. Note the rendering: masked " +
    "cells are hatched AND carry the text −∞, because colour must " +
    "never be the only signal. Two consequences. In a naive implementation " +
    "half the score matrix is computed and then discarded — which is why fused " +
    "kernels skip whole masked tiles rather than computing and masking them. " +
    "And row i never changes when token i+1 arrives, which is precisely the " +
    "property that makes a KV cache correct.",
  build: function (ctx) {
    const H = FL[0].heads[0];
    ctx.H = H;
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 92,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i + " " + t; }) });
    ctx.cap = h("phaselabel", "");
    const nMask = mflat(H.masked).filter(function (v) { return v === null; }).length;
    return [
      kicker("Forward · block 0 · head 0 · masking"),
      title("A token may not read the future", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "maskᵢⱼ",
            sub: "0 if j ≤ i, −∞ otherwise",
            result: (SQ * SQ - nMask) + " of " + (SQ * SQ) + " entries survive",
            cls: "activation" }), "f-left"),
          frag(d("panel a tight", [ph("who may read whom"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", { style: { textAlign: "left" } }, "query"),
                el("th", { style: { textAlign: "left" } }, "may attend to"),
                el("th", {}, "count")])),
              el("tbody", {}, TOK.map(function (t, i) {
                return el("tr", {}, [
                  el("td", { style: { textAlign: "left" } }, "“" + t + "”"),
                  el("td", { style: { textAlign: "left" }, class: "mono" },
                    TOK.slice(0, i + 1).map(function (u) { return "“" + u + "”"; }).join(", ")),
                  el("td", { class: "n" }, String(i + 1))
                ]);
              }))
            ])]), "f-left"),
          frag(NN.callout("key", "Why −∞ and not 0",
            "The mask is applied <em>before</em> the softmax and " +
            "<span class='mono'>exp(−∞) = 0</span>. Zeroing " +
            "<em>after</em> the softmax would leave the surviving weights not " +
            "summing to one, because the denominator would still carry the " +
            "future's contribution. Same picture, wrong arithmetic."), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.cap, ctx.hm]), "f-right")])
      ]),
      frag(d("cols", [
        NN.callout("warn", "Half the FLOPs go in the bin",
          "A naive kernel computes all " + (SQ * SQ) + " scores and throws " +
          nMask + " away. At real sequence lengths that is nearly half the " +
          "attention FLOPs of the whole model. Fused kernels never touch a " +
          "fully-masked tile."),
        NN.callout("why", "And it is why the KV cache is correct",
          "Row i is a function of tokens 0..i only. Appending token i+1 cannot " +
          "change it. So at generation time every previous key and value can " +
          "be kept and reused, and a new token costs one row instead of a " +
          "whole matrix.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const rows = NN.clamp(n - 1, 0, SQ);
    if (n <= 1) {
      ctx.hm.paint(ctx.H.scaled, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = "scaled scores — nothing masked yet";
    } else {
      const m = ctx.H.scaled.map(function (r, i) {
        return r.map(function (v, j) {
          return (i < rows && ctx.H.masked[i][j] === null) ? null : v;
        });
      });
      ctx.hm.paint(m, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = rows >= SQ
        ? "causal mask applied · hatched cells are −∞"
        : "masking row " + (rows - 1) + " · “" + TOK[rows - 1] + "”";
    }
  }
});

/* ---------------------------------------------------------- T11. softmax */
S({
  chapter: "Forward L0 · softmax",
  plain: "Softmax: each row becomes a distribution that sums to exactly 1",
  notes: "Exponentiate and divide by the row sum. What comes out is a set of " +
    "non-negative weights summing to one — an honest weighted average over the " +
    "visible tokens. Read the last row out loud: “" + TOK[SQ - 1] +
    "” puts " + f(FL[0].heads[0].P[SQ - 1][0] * 100, 0) + "% of its " +
    "attention on “" + TOK[0] + "”, " +
    f(FL[0].heads[0].P[SQ - 1][1] * 100, 0) + "% on “" + TOK[1] +
    "” and " + f(FL[0].heads[0].P[SQ - 1][2] * 100, 0) + "% on itself. Row " +
    "0 is degenerate by construction: the mask left it one visible key, so its " +
    "weight is exactly 1 whatever the score was. The row sums are not asserted " +
    "— TF2 records them, and they are " +
    FL[0].heads[0].row_sums.join(", ") + ". One implementation note: the row " +
    "maximum is subtracted before exponentiating, purely for numerical safety, " +
    "and it cancels exactly between numerator and denominator so the answer is " +
    "unchanged.",
  build: function (ctx) {
    const H = FL[0].heads[0];
    ctx.H = H;
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 92,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i; }) });
    ctx.cap = h("phaselabel", "");
    const i = SQ - 1;
    const vis = H.masked[i].filter(function (v) { return v !== null; });
    const mx = Math.max.apply(null, vis);
    const exps = H.masked[i].map(function (v) { return v === null ? 0 : Math.exp(v - mx); });
    const den = exps.reduce(function (a, b) { return a + b; }, 0);
    return [
      kicker("Forward · block 0 · head 0 · softmax"),
      title("Exponentiate, then divide by the row sum", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "pᵢⱼ = exp(sᵢⱼ − maxᵢ) / Σ exp(sᵢₖ − maxᵢ)",
            sub: "row " + i + " · max = " + f(mx, 5), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "the exponentials of row " + i,
            sub: exps.map(function (v) { return f(v, 4); }).join(" , "),
            result: "Σ = " + f(den, 6), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "p[" + i + "][0]",
            sub: f(exps[0], 5) + " ÷ " + f(den, 5),
            result: f(H.P[i][0], 6), cls: "activation" }), "f-left"),
          frag(d("panel a tight", [ph("row sums · recorded by the generator, not asserted"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", { style: { textAlign: "left" } }, "row"),
                el("th", {}, "Σ p"), el("th", {}, "|Σ − 1|")])),
              el("tbody", {}, H.row_sums.map(function (s, k) {
                return el("tr", {}, [
                  el("td", { style: { textAlign: "left" } }, tokRow(k)),
                  el("td", { class: "n v-activation" }, f(s, 12)),
                  el("td", { class: "n" }, f(Math.abs(s - 1), 1))
                ]);
              }))
            ])]), "f-left")
        ]),
        d("stack", [frag(d("panel a", [ctx.cap, ctx.hm]), "f-right")])
      ]),
      frag(NN.callout("key", "Why subtract the maximum",
        "<span class='mono'>exp()</span> of a large score overflows — in fp16 " +
        "once the score passes " + f(Math.log(T.formats.fp16.max_finite), 1) +
        ", which real attention scores reach. Subtracting the row maximum makes " +
        "the largest exponent exactly <span class='mono'>exp(0) = 1</span>, and " +
        "the constant cancels between numerator and denominator, so the result " +
        "is algebraically identical and numerically safe."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    if (n >= 2) {
      ctx.hm.paint(ctx.H.P, { color: "var(--activation)", digits: 3, max: 1 });
      ctx.cap.textContent = "attention weights · every row sums to 1";
    } else {
      ctx.hm.paint(ctx.H.masked, { color: "var(--accent)", digits: 3 });
      ctx.cap.textContent = "masked scores, before the softmax";
    }
  }
});

/* -------------------------------------------------- T12. O = P V, convex */
S({
  chapter: "Forward L0 · P·V",
  plain: "Oₕ = P·Vₕ is a convex combination of value rows",
  notes: "This is the sentence that makes attention click, so say it slowly. " +
    "Row i of P is a set of non-negative numbers summing to one. The output " +
    "for token i is that row used as MIXING WEIGHTS over the value vectors: " +
    "outᵢ = Σⱼ pᵢⱼ · vⱼ. A weighted average " +
    "with non-negative weights summing to one is a convex combination — the " +
    "output literally lies inside the convex hull of the value rows it is " +
    "allowed to see. It cannot invent a direction that no visible token " +
    "contributed. Read token " + (SQ - 1) + ": " +
    FL[0].heads[0].P[SQ - 1].map(function (p, j) {
      return f(p, 3) + "×v" + j; }).join(" + ") + " in every channel. " +
    "And the only thing that distinguishes this from a fixed convolution is " +
    "that the weights were computed from the data at run time. That is the " +
    "whole of attention; the last four slides existed only to produce those " +
    "weights.",
  build: function (ctx) {
    const H = FL[0].heads[0];
    const i = SQ - 1;
    ctx.probs = am("P row " + i + " · “" + TOK[i] + "”", [H.P[i]],
                   "sums to " + f(H.row_sums[i], 6), 4);
    ctx.v = am("V head 0", H.V, "one row per token", 3);
    ctx.out = am("O head 0", H.O, "", 4);
    const terms = H.P[i].map(function (p, j) { return { p: p, v: H.V[j][0] }; });
    return [
      kicker("Forward · block 0 · head 0 · the average"),
      title("Attention output = a weighted average of value rows", true),
      d("cols wide-l", [
        d("stack", [
          frag(d("rowflex top", [ctx.probs, h("ar", "×"), ctx.v,
                                 h("ar", "="), ctx.out]), "f-fade"),
          frag(NN.formula({ rule: "O[" + i + "][0] = Σⱼ pⱼ · vⱼ[0]",
            sub: terms.map(function (t) { return f(t.p, 3) + "×" + f(t.v, 3); }).join(" + "),

  },
  render: function (n, ctx) {

/* --------------------------------------------------------- T13. head 1 */

    "which is the entire reason to have more than one head. Structurally, note " +
    "what has NOT happened: head 1 never read a single number belonging to " +

        NN.callout("why", "And they really do differ",

/* ---------------------------------------------------------- T14. concat */

  },

/* ------------------------------------------------- T15. output projection */
S({
  chapter: "Forward L0 · W_o",
  plain: "W_o: the one place the heads are allowed to meet",
  notes: "One more " + DM + "×" + DM + " matrix, applied to the concatenated " +
    "head outputs. Because it is a full matrix, every output channel is a " +
    "combination of ALL " + DM + " concatenated channels — head 0's and head " +
    "1's together. This is the only mixing across heads anywhere in the " +
    "architecture. Work the entry: Attn_out[0][0] is the dot of concat row 0 " +
    "with column 0 of W_o. Then note the shape pairing for later: the heads " +
    "split the OUTPUT dimension of Q/K/V, and W_o consumes exactly that " +
    "dimension as its INPUT. Split outputs feeding split inputs is precisely " +
    "the structure that lets tensor parallelism make Q/K/V column-parallel and " +
    "W_o row-parallel with no reshuffle in between.",
  build: function (ctx) {
    const cat = FL[0].concat, Wo = PRM["L0.Wo"];
    const terms = [];

    ctx.cat = am("concat O", cat, "", 3);
    ctx.wo = wm("W_o", Wo, DM + "×" + DM, 3);
    ctx.out = am("Attn(LN1(h))", FL[0].attn_out, "the sub-layer's delta", 4);
    return [
      kicker("Forward · block 0 · output projection"),
      title("<span class='mono'>Attn out = concat · W_o</span>", true),
      frag(d("rowflex top", [ctx.cat, h("ar", "×"), ctx.wo,
                             h("ar", "="), ctx.out]), "f-fade"),
      frag(NN.formula({ rule: "Attn out[0][0] = concat[0] · W_o[:,0]",
        sub: terms.map(function (t) { return f(t.x, 3) + "×" + f(t.w, 3); }).join(" + "),
        result: f(FL[0].attn_out[0][0], 6), cls: "activation" }), "f-left"),
      frag(d("cols", [
        NN.callout("key", "Without W_o, multi-head attention is an ensemble",
          "Each head produced a " + DH + "-wide vector from its own slice of " +
          "Q, K and V. Concatenation alone leaves them un-mixed. " +
          "<span class='mono'>W_o</span> is a full " + DM + "×" + DM +
          " mix, and it is the single operation that makes " + NH +
          " heads one attention rather than " + NH + " attentions."),
        NN.callout("why", "Remember this shape pairing",
          "Q/K/V were split along their <em>output</em> dimension into heads. " +
          "<span class='mono'>W_o</span> consumes that same dimension as its " +
          "<em>input</em>. Split-outputs feeding split-inputs is the exact " +

  },

    ctx.out.highlight(on ? [[0, 0]] : null, on);
  }
});

/* ------------------------------------------------------- T16. residual 1 */
S({
  chapter: "Forward L0 · residual 1",
  plain: "The first residual add: h ← h + Attn(LN1(h))",
  notes: "And now the attention sub-layer ends the only way it can: by adding " +
    "its result to the stream. Show both operands and the sum. Channel 0 of " +
    "token 0 was " + f(FL[0].stream_in[0][0], 5) + ", attention contributed " +
    fS(FL[0].attn_out[0][0], 5) + ", so the stream becomes " +
    f(FL[0].resid1[0][0], 5) + ". Three things follow from the fact that this " +
    "is an ADD and not a replace. The sub-layer's output has to be " +
    "commensurate with the stream — same shape, comparable scale — which is " +
    "what the LayerNorm on the way in was for. The block can learn to do " +
    "nothing, by driving its branch to zero, which means adding layers is " +
    "never worse than not adding them. And addition has derivative one, so in " +
    "the backward pass the gradient arriving at the top of this add reaches " +
    "the bottom of it completely untouched. That last one is why the stack " +
    "trains.",
  build: function (ctx) {
    ctx.a = am("h · stream in", FL[0].stream_in, "", 4);
    ctx.b = am("Attn(LN1(h))", FL[0].attn_out, "the branch", 4);
    ctx.c = am("h ← h + Attn", FL[0].resid1, "stream out", 4);
    return [
      kicker("Forward · block 0 · residual add"),
      title("The stream is never overwritten. Only added to.", true),
      frag(d("rowflex top", [ctx.a, h("ar", "+"), ctx.b, h("ar", "="), ctx.c]), "f-fade"),
      frag(NN.formula({ rule: "one channel of one token",
        sub: A(FL[0].stream_in[0][0], 5) + "  +  " + fS(FL[0].attn_out[0][0], 5),
        result: f(FL[0].resid1[0][0], 6), cls: "activation" }), "f-left"),
      frag(d("cols3", [
        NN.callout("key", "Derivative one, in both directions",
          "<span class='mono'>∂(a+b)/∂a = ∂(a+b)/∂b = 1</span>. " +
          "The backward pass hands the <em>same</em> gradient to the branch " +
          "and to the skip. Nothing is scaled, nothing is attenuated."),
        NN.callout("why", "A block can learn to be a no-op",
          "Drive <span class='mono'>W_o</span> to zero and the block becomes " +
          "the identity. So a deeper network can always represent everything a " +
          "shallower one could — adding capacity is never a step backwards, " +
          "which is not true of a plain stack."),
        NN.callout("mem", "And it costs a tensor",
          "The stream after each add is <span class='mono'>seq × d</span> and " +
          "must be kept: " + (SQ * DM) + " elements here, twice per block, " +
          "times every layer and every sequence in the batch.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const hot = n >= 2 ? [[0, 0]] : null;

  }
});

/* ---------------------------------------------------------- T18. MLP up */
S({
  chapter: "Forward L0 · MLP up",
  plain: "W_up: widen every token from " + DM + " to " + DFF + " channels",
  notes: "The MLP sub-layer is the two-layer network from the first half of " +
    "this deck, applied to every token independently — no token sees any " +
    "other in here, which is the exact complement of attention. The first " +
    "matrix widens: " + DM + " in, " + DFF + " out, " + (DM * DFF) + " " +
    "parameters. Read one pre-activation: U[0][0] is row 0 of LN2's output " +
    "dotted with column 0 of W_up, which comes to " +
    f(FL[0].mlp.U[0][0], 5) + ". The useful intuition for the widening is that " +
    "each of the " + DFF + " columns is a learned feature detector, and the " +
    "pre-activation says how strongly this token fires it. That is why " +
    "splitting W_up by column later means giving each GPU whole neurons.",
  build: function (ctx) {
    const inp = FL[0].mlp.input, W1 = PRM["L0.W1"];
    const terms = [];
    for (let t = 0; t < DM; t++) terms.push({ x: inp[0][t], w: W1[t][0] });
    ctx.inp = am("LN2(h)", inp, SQ + "×" + DM, 3);
    ctx.w = wm("W_up", W1, DM + "×" + DFF, 2);
    ctx.u = am("U = LN2(h)·W_up", FL[0].mlp.U, SQ + "×" + DFF + " pre-activations", 2);
    return [
      kicker("Forward · block 0 · MLP · up-projection"),
      title("Every token, on its own, widened to " + DFF + " channels", true),

      frag(ctx.u, "f-pop"),
      frag(NN.formula({ rule: "U[0][0] = LN2(h)[0] · W_up[:,0]",
        sub: terms.map(function (t) { return f(t.x, 3) + "×" + f(t.w, 3); }).join(" + "),
        result: f(FL[0].mlp.U[0][0], 6), cls: "activation" }), "f-left"),
      frag(d("cols", [
        NN.callout("key", "No token talks to any other in here",
          "Attention mixes across rows; the MLP works strictly along a row. " +
          "The two sub-layers are exact complements, and that is why a " +
          "transformer block needs both."),
        NN.callout("mem", "The widest tensors in the block are born here",
          "<span class='mono'>U</span> and the GELU output are each " +
          "<span class='mono'>seq × d_ff</span> = " + (SQ * DFF) +
          " elements, and backward needs both — the pre-activation for the " +
          "GELU derivative, the activation for <span class='mono'>dW_down</span>. " +
          "This toy uses a " + (DFF / DM) + "× expansion; real blocks use 4× or " +

    ];
  },

    ctx.u.highlight(on ? [[0, 0]] : null, on);
  }
});

/* ------------------------------------------------------------ T19. GELU */
S({
  chapter: "Forward L0 · GELU",
  plain: "GELU: a smooth gate, and the real pre-activations sitting on it",
  notes: "The nonlinearity. GELU is x times a smooth gate that goes from 0 to " +
    "1 — the tanh approximation, which is what real transformers ship. Put the " +
    "actual " + (SQ * DFF) + " pre-activations on the curve so nobody has to " +
    "imagine them: they run from " +
    f(Math.min.apply(null, mflat(FL[0].mlp.U)), 3) + " to " +
    f(Math.max.apply(null, mflat(FL[0].mlp.U)), 3) + ", so this block sits " +
    "squarely in the bend, not out on either asymptote. Then the comparison " +
    "that matters. Under ReLU a pre-activation of " +
    f(FL[0].mlp.U[0][1], 3) + " outputs exactly zero and receives exactly zero " +
    "gradient — the dying-unit failure we watched on the toy MLP. Under GELU " +
    "it outputs " + f(FL[0].mlp.G[0][1], 4) + " and its derivative is " +
    f(dgelu(FL[0].mlp.U[0][1]), 4) + ", small but alive. Attenuated, not " +
    "annihilated. That is the whole reason the field moved off ReLU inside " +
    "transformer MLPs.",
  build: function (ctx) {
    const pre = mflat(FL[0].mlp.U);
    const curve = [];
    for (let x = -3; x <= 3.001; x += 0.06) curve.push([x, gelu(x)]);
    const marks = pre.map(function (v) { return [v, gelu(v)]; });
    const neg = FL[0].mlp.U[0][1];
    return [
      kicker("Forward · block 0 · MLP · nonlinearity"),
      title("<span class='mono'>GELU(x) = x · Φ(x)</span> — a gate, not a cliff", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "the tanh approximation, as shipped",
            sub: "0.5·x·(1 + tanh(√(2/π)·(x + 0.044715·x³)))",
            cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "a NEGATIVE pre-activation · U[0][1]",
            sub: "GELU(" + f(neg, 4) + ")",
            result: f(gelu(neg), 6), cls: "activation" }), "f-left"),
          frag(NN.formula({ rule: "the same unit under ReLU",
            sub: "max(0, " + f(neg, 4) + ")",
            result: "0 — and a gradient of 0 with it", cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "GELU's derivative there",
            sub: "d/dx at x = " + f(neg, 4),
            result: f(dgelu(neg), 6) + " — alive", cls: "gradient" }), "f-left"),
          frag(NN.callout("key", "The answer to the dead unit",
            "We watched a ReLU unit in the " + NPARAM + "-parameter model take " +
            "a pre-activation of " + f(T.forward.z1[2], 2) + ", output exactly " +
            "zero, and receive exactly zero gradient forever. GELU multiplies " +
            "by a smooth gate instead of clamping, so a negative pre-activation " +
            "is attenuated and keeps a non-zero derivative. Same architecture, " +
            "no dead capacity."), "f-left")
        ]),
        d("stack", [
          frag(d("panel a", [ph("GELU, with this block's " + pre.length +
            " real pre-activations marked"),
            NN.chart.line({
              series: [
                { name: "GELU(x)", color: "var(--accent)", points: curve, dots: false },
                { name: "this block's pre-activations", color: "var(--activation)",
                  points: marks }
              ],
              width: 560, height: 270, xlabel: "pre-activation U", ylabel: "GELU(U)"
            }),
            chartKey([{ name: "GELU(x), tanh approximation", color: "var(--accent)" },

  }
});

/* --------------------------------------------------------- T20. MLP down */
S({
  chapter: "Forward L0 · MLP down",
  plain: "W_down: narrow " + DFF + " back to " + DM,
  notes: "The second matrix narrows back to the stream width, because the " +
    "block has to be shape-preserving — that is the property that lets you " +
    "stack it. " + DFF + " in, " + DM + " out, " + (DFF * DM) + " parameters. " +
    "Note the contraction direction: this matmul sums over the " + DFF +
    " wide channels. Hold that thought, because it is why W_down is the " +
    "second row-parallel matrix: a GPU that owns half the wide channels can " +
    "compute a partial contribution to every output channel, and no output " +
    "channel completely. Also worth saying: the MLP is " +
    f((DM * DFF + DFF * DM) / (NP2 / NL) * 100, 0) + "% of this block's " +
    "parameters at a " + (DFF / DM) + "× expansion, and at the 4× real models " +
    "use it is about two thirds.",
  build: function (ctx) {
    ctx.g = am("GELU(U)", FL[0].mlp.G, SQ + "×" + DFF, 2);
    ctx.w = wm("W_down", PRM["L0.W2"], DFF + "×" + DM, 2);
    ctx.o = am("D = GELU(U)·W_down", FL[0].mlp.D, SQ + "×" + DM, 4);
    return [
      kicker("Forward · block 0 · MLP · down-projection"),
      title("Back to " + DM + " channels — the block must preserve its shape", true),
      frag(ctx.g, "f-fade"),
      frag(d("rowflex top", [ctx.w, h("ar", "→"), ctx.o]), "f-pop"),
      frag(NN.formula({ rule: "D[0][0] = Σ over the " + DFF + " wide channels",
        sub: "GELU(U)[0] · W_down[:,0]",
        result: f(FL[0].mlp.D[0][0], 6), cls: "activation" }), "f-left"),
      frag(d("cols", [
        NN.callout("key", "The contraction runs over d_ff",
          "Every output channel sums over all " + DFF + " wide channels. So a " +
          "GPU holding half of them produces a <em>partial sum</em> for every " +
          "output — full shape, incomplete value. That is exactly the " +
          "row-parallel situation, and it is why an all-reduce has to follow."),
        NN.callout("mem", "Where the parameters actually are",
          "Attention here is 4 × " + (DM * DM) + " = " + (4 * DM * DM) +
          " parameters; the MLP is " + (DM * DFF) + " + " + (DFF * DM) + " = " +
          (2 * DM * DFF) + ". At this " + (DFF / DM) + "× expansion the MLP is " +
          f(2 * DM * DFF / (4 * DM * DM + 2 * DM * DFF) * 100, 0) +

  },
  render: function (n, ctx) {

    ctx.w.highlight(on ? grid2(DFF, 1, function (i) { return [i, 0]; }) : null, on);
    ctx.o.highlight(on ? [[0, 0]] : null, on);
  }
});

/* ------------------------------------------------------- T21. residual 2 */
S({

/* -------------------------------------------------- T22. block 1 receives */
S({
  chapter: "Forward L1 · the stream accumulates",
  plain: "Block 1 receives block 0's output — the stream carries history",
  notes: "Block 1 is the same seven operations with its own twenty tensors, so " +

    "tensor entering block 1 is not the input any more. It is the input PLUS " +
    "what attention contributed PLUS what the MLP contributed. Read the three " +
    "columns: the original input, block 0's total contribution, and the sum " +
    "which is block 1's input. The residual stream is a running total. Each " +
    "block reads the accumulated state, decides on a correction, and adds it. " +
    "That framing — blocks as incremental editors of a shared workspace rather " +
    "than as a chain of transformations — is the single most useful mental " +
    "model for a transformer, and it is the one that interpretability work is " +
    "built on.",
  build: function (ctx) {
    const delta = FL[0].resid2.map(function (r, i) {
      return r.map(function (v, j) { return v - F2.forward.x_in[i][j]; });

    ctx.x = am("original input x", F2.forward.x_in, "", 4);

    ctx.s = am("block 1's input", FL[1].stream_in, "= x + contribution", 4);

      frag(d("cols3", [

          s: "one channel of one token", cls: "activation" }]),
        NN.tiles([{ k: "stream width", v: DM + " channels",
          s: "unchanged through the whole stack", cls: "activation" }]),

      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("key", "Blocks are editors, not a pipeline",
          "Every sub-layer reads the current state of the workspace through a " +
          "LayerNorm, computes a correction, and adds it. Nothing is ever " +
          "destroyed, which is why you can ask what a particular layer " +
          "<em>contributed</em> — the question is well-posed precisely because " +
          "the contributions add."),
        NN.callout("why", "And it is why the width is constant",
          "A running total only works if every term has the same shape. That is " +

});

/* ---------------------------------------------- T23. block 1, attention */

/* ------------------------------------------- T24. block 1 MLP and the loss */

    "point about scalars again, because the backward half depends on it: a " +

    "Everything the model computed — " + (SQ * DM) + " outputs from " + NP2 +
    " parameters through two blocks — funnels into that single value, and the " +

      ]), "f-fade")

  }
});

/* ------------------------------------------------------ T25. the spine */
S({
  chapter: "Forward · the spine",

    "Hanging off it are " + (NL * 2) + " branches — " + NL + " blocks times " +
    "two sub-layers — and every branch has exactly the same anatomy: it READS " +
    "the stream through a LayerNorm, computes something, and WRITES back " +
    "through an addition. Read-through-a-norm, write-through-an-add. That is " +
    "the entire structure of a transformer. Two payoffs, one now and one in " +
    "ten slides. Now: it explains why the width is constant and why blocks " +
    "compose. In ten slides: because the write is an addition and addition has " +
    "derivative one, the gradient runs down that spine from the top of the " +
    "stack to the bottom without being multiplied by anything at all.",
  build: function (ctx) {

        fontFamily: MONO, fontSize: "13px", color: "var(--activation)" },

        " · never overwritten, only added to · " + (NL * 2) +
        " branches hang off it"), s]), "f-fade"),
      frag(d("cols3", [
        panel("a tight", [ph("the spine"),

/* the gradient as it travels down the spine, stage by stage */
function mag(M) { return Math.max.apply(null, mflat(M).map(Math.abs)); }
const SPINE = [
  { lab: "dL/dy · out of the loss",        v: F2.dOut },
  { lab: "block 1 · into residual 2",      v: bstep(1, "resid2").value },
  { lab: "block 1 · into residual 1",      v: AB[1].dA },
  { lab: "block 1 · leaving the block",    v: bstep(1, "ln1").value },
  { lab: "block 0 · into residual 2",      v: bstep(0, "resid2").value },
  { lab: "block 0 · into residual 1",      v: AB[0].dA },
  { lab: "block 0 · leaving the stack",    v: bstep(0, "ln1").value }
];
(function () {
  const e = Math.max(maxdiff2(bstep(0, "ln1").value, F2.dx_in),
                     maxdiff2(bstep(1, "ln1").value, bstep(0, "resid2").value));
  if (e > 1e-15) {
    console.warn("nn-internals slides: the TF2 residual spine does not join up, by " + e);
  }
})();

    "its own. Every number on the next twenty slides was checked against " +
    "central finite differences to " + f(GC2.max_abs_err, 1) + ".",
  build: function () {

        el("td", { style: { textAlign: "left" }, class: "muted" }, extra)
      ]);
    });
    return [
      kicker("Backward · the plan"),

          el("table", { class: "data" }, [
            el("thead", {}, el("tr", {}, [
              el("th", {}, "#"), el("th", {}, "block"),

              el("th", {}, "id"),

/* -------------------------------------------- B4. the gradient superhighway */
S({
  chapter: "Backward · the superhighway",
  plain: "The residual path never shrinks the gradient — measured, not asserted",
  notes: "Now the consequence, on real numbers. Follow the largest-magnitude " +
    "entry of the gradient as it travels down the spine of the whole model, " +
    "from the loss to the input. It goes " +
    SPINE.map(function (s) { return f(mag(s.v), 4); }).join(" → ") +
    ". It does not decay. The reason is structural: at every junction the skip " +
    "path hands the gradient on untouched, and the branch path ADDS its " +
    "contribution on top. So the gradient leaving a block is the gradient that " +
    "entered it PLUS a correction — it can only fail to survive if the branch " +
    "actively cancels it, which is a measure-zero accident rather than a " +
    "systematic decay. Contrast a plain stack, where every layer multiplies " +
    "the gradient by a weight matrix and a nonlinearity derivative, so the " +
    "magnitude is a product of " + CFG.layers + " factors: if they average " +
    "slightly below one you get vanishing gradients, slightly above one and " +
    "you get exploding ones, and there is no setting that is stable for " +
    "long. That single fact is why " + CFG.layers + "-layer stacks train.",
  build: function (ctx) {
    ctx.host = el("div", { style: { minHeight: "250px" } });

      title("Down " + (NL * 2) + " junctions, and nothing multiplied it", true),
      d("cols wide-l", [

        d("stack", [ctx.lab, ctx.tens])
      ]),
      d("rowflex", beats),
      frag(d("cols", [
        NN.callout("key", "Add, do not multiply",
          "A plain stack computes <span class='mono'>h ← f(h)</span>, so the " +
          "gradient is multiplied by <span class='mono'>f′</span> at every " +
          "layer and the magnitude is a product of " + CFG.layers + " factors. " +
          "A residual stack computes <span class='mono'>h ← h + f(h)</span>, so " +
          "the gradient is a <em>sum</em>: one term that passed through nothing, " +

/* --------------------------------------- B6. the naive answer is wrong */
S({
  chapter: "Backward L1 · LayerNorm (1/4)",
  plain: "The naive LayerNorm gradient is WRONG — and here is the number",
  notes: "Everybody's first answer to LayerNorm backward is dL/dx = " +

    "themselves functions of EVERY element of the row, so nudging x_j does " +
    "not only change xhat_j — it moves the mean and the variance, and " +
    "therefore moves every other xhat in the row as well. The naive answer " +
    "drops those paths entirely. TF2 ships both: for token 0 of block 1's " +
    "LayerNorm 2, the naive answer is " +
    bstep(1, "ln2").ln_detail[0].naive_dx.map(function (v) { return f(v, 5); }).join(", ") +
    " and the true answer is " +
    bstep(1, "ln2").ln_detail[0].dx.map(function (v) { return f(v, 5); }).join(", ") +
    ". Look at channel " + 2 + ": the naive answer is off by a factor of two " +
    "and the error is not a rounding error, it is a missing term.",
  build: function (ctx) {
    const D = bstep(1, "ln2").ln_detail[0];
    const rel = D.dx.map(function (v, j) { return D.naive_dx[j] - v; });
    return [
      kicker("Backward · LayerNorm · the trap"),
      title("<span class='mono'>dL/dx = dL/dy · g / σ</span> — plausible, and wrong", true),
      frag(d("panel crit", [ph("token 0 of block 1's LayerNorm 2 · " + DM + " channels"),
        d("stack", [
          gm("the naive answer · dL/dy · g · inv_std", [D.naive_dx], "WRONG", 6),
          gm("the true answer · TF2's dx", [D.dx], "correct", 6),

      ]), "f-fade"),
      frag(NN.callout("warn", "Why the naive derivation misses the point",
        "It treats <span class='mono'>μ</span> and " +
        "<span class='mono'>var</span> as constants. They are not: they are " +
        "functions of all " + DM + " elements of the row. Nudging " +
        "<span class='mono'>x₂</span> moves the mean, which moves " +

/* ------------------------------------------------- B7. the derivation */
S({
  chapter: "Backward L1 · LayerNorm (2/4)",
  plain: "The derivation: one main term and two corrections",
  notes: "Do the derivation symbolically. Start with dxhat_j = dL/dy_j · " +
    "g_j — the gradient with respect to the normalised value, which is easy " +
    "because the gain is elementwise. Now xhat_j = (x_j − μ)/σ " +
    "and BOTH μ and σ depend on every x. Carry all three " +
    "dependency paths through — the direct one, the one through the mean, and " +
    "the one through the variance — and everything collapses into a strikingly " +
    "compact result: dL/dx_j = inv_std × [ dxhat_j − mean_k(dxhat_k) − " +
    "xhat_j · mean_k(dxhat_k · xhat_k) ]. Read the three terms. The first is " +
    "the naive answer. The second subtracts the mean of the incoming gradient " +
    "— that is the mean's contribution, and it makes the output gradient " +
    "sum to zero over the row. The third subtracts the component of the " +
    "incoming gradient that is CORRELATED with xhat — that is the variance's " +
    "contribution, and it removes the part of the gradient that would only " +
    "rescale the row, which normalisation would undo anyway. Both terms vanish " +
    "only if the incoming gradient happens to be zero-mean and uncorrelated " +
    "with xhat, which in general it is not.",
  build: function (ctx) {
    const D = bstep(1, "ln2").ln_detail[0];
    return [
      kicker("Backward · LayerNorm · the derivation"),
      title("Three paths from <span class='mono'>x_j</span> to the loss", true),
      d("cols wide-l", [
        d("stack", [
          frag(NN.formula({ rule: "① the direct path",
            sub: "x_j → xhat_j → y_j",
            result: "dxhat_j · inv_std", cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "② through the MEAN",
            sub: "x_j → μ → every xhat_k → every y_k",
            result: "− inv_std · mean_k(dxhat_k)", cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "③ through the VARIANCE",
            sub: "x_j → var → inv_std → every xhat_k",
            result: "− inv_std · xhat_j · mean_k(dxhat_k · xhat_k)",
            cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "all together",
            sub: "dL/dx_j = inv_std · [ dxhat_j − mean(dxhat) − xhat_j · mean(dxhat·xhat) ]",
            cls: "gradient" }), "f-pop")
        ]),
        d("stack", [
          frag(d("panel g", [ph("the four ingredients, token 0, block 1 LN2"),
            d("stack", [
              gm("dxhat = dL/dy · g", [D.dxhat], "", 6),
              am("xhat · saved from forward", [D.xhat], "", 5),
              d("kv", [
                h("k", "inv_std"), h("", f(D.inv_std, 6)),
                h("k", "mean(dxhat)"), h("", f(D.mean_dxhat, 8)),
                h("k", "mean(dxhat·xhat)"), h("", f(D.mean_dxhat_xhat, 8))
              ])
            ])]), "f-right"),
          frag(NN.callout("key", "What the two corrections mean",
            "Term ② removes the <b>mean</b> of the incoming gradient: a " +
            "gradient that shifts the whole row uniformly cannot change the " +
            "output, because the mean is subtracted again. Term ③ removes the " +
            "part <b>correlated with xhat</b>: a gradient that rescales the row " +
            "uniformly cannot change the output either, because the variance " +
            "normalises it away."), "f-right"),
          frag(NN.callout("why", "So LayerNorm projects the gradient",
            "The two corrections are exactly a projection: they strip out the " +
            "two directions the layer is invariant to — shift and scale. " +
            "A LayerNorm hands back only the part of the gradient that could " +
            "actually have changed its output."), "f-right")
        ])
      ])
    ];
  }
});

/* ---------------------------------------- B8. corrections, one at a time */
S({
  chapter: "Backward L1 · LayerNorm (3/4)",
  plain: "Watch the two corrections land, one at a time, on real numbers",
  notes: "Now animate it. Start from the naive answer, subtract the mean term, " +
    "then subtract the variance term, and land exactly on TF2's dx. Do it for " +
    "each of the three tokens — press right to step the terms and again to " +
    "change token. The numbers matter: for token 0 the naive answer for " +
    "channel 2 is " +
    f(bstep(1, "ln2").ln_detail[0].naive_dx[2], 6) + " and the true value is " +
    f(bstep(1, "ln2").ln_detail[0].dx[2], 6) + ", so the corrections are not " +
    "small. Two more things to point at. First, watch the row SUM in the " +
    "footer: after the mean correction it is essentially zero, and it stays " +
    "zero — that is the algebraic signature of the shift-invariance. Second, " +
    "the corrections are per-token: each row gets its own mean and its own " +
    "correlation, because each row was normalised by its own statistics.",
  build: function (ctx) {
    const det = bstep(1, "ln2").ln_detail;
    ctx.det = det;
    ctx.row = gm("dL/dx · the row shown above", [det[0].naive_dx], "", 6);
    ctx.lab = h("phaselabel", "");
    ctx.foot = h("small muted", "");
    ctx.form = d("stack");
    const beats = [];
    det.forEach(function (_, t) {
      ["naive", "− mean", "− var"].forEach(function (s, k) {
        beats.push(frag(d("pill" + (k === 2 ? " hot" : ""),
          "t" + t + " · " + s), "f-pop"));
      });
    });
    return [
      kicker("Backward · LayerNorm · the corrections landing"),
      title("naive  →  − mean term  →  − variance term  =  the truth", true),
      d("cols wide-l", [
        d("stack", [
          d("panel g", [ctx.lab, ctx.row, ctx.foot]),
          ctx.form,
          NN.callout("key", "The row sum is the tell",
            "The naive answer has a non-zero row sum. The mean correction " +
            "drives it to zero and the variance correction leaves it there. " +
            "That is the shift-invariance of LayerNorm showing up in its " +
            "gradient — a uniform push on every channel cannot change the " +
            "output, so it must not appear in the input gradient either.")
        ]),
        d("stack", [
          (d("panel g tight", [ph("all " + SQ +
            " tokens · naive vs true, channel by channel"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", { style: { textAlign: "left" } }, "cell"),
                el("th", {}, "naive"), el("th", {}, "true"), el("th", {}, "Δ")])),
              el("tbody", {}, [].concat.apply([], det.map(function (D, t) {
                return D.dx.map(function (v, j) {
                  return el("tr", {}, [
                    el("td", { style: { textAlign: "left" }, class: "mono" },
                      "t" + t + "·c" + j),
                    el("td", { class: "n muted" }, f(D.naive_dx[j], 5)),
                    el("td", { class: "n v-gradient" }, f(v, 5)),
                    el("td", { class: "n" }, fS(v - D.naive_dx[j], 5))
                  ]);
                });
              })))
            ])]))
        ])
      ]),
      d("rowflex", beats)
    ];
  },
  render: function (n, ctx) {
    const per = 3;                       /* three stages per token */
    const idx = NN.clamp(n - 1, 0, ctx.det.length * per - 1);
    const t = Math.floor(idx / per);
    const st = idx - t * per;
    const D = ctx.det[t];
    const mean = D.dx.map(function (_, j) {
      return D.inv_std * (D.dxhat[j] - D.mean_dxhat);
    });
    const vals = st === 0 ? D.naive_dx : st === 1 ? mean : D.dx;
    const labs = [
      "① naive only · inv_std · dxhat",
      "② − mean(dxhat)  ·  the MEAN's correction",
      "③ − xhat · mean(dxhat·xhat)  ·  the VARIANCE's correction  =  dx"
    ];
    ctx.row.update([vals]);
    ctx.lab.textContent = tokRow(t) + " · " + labs[st];
    const s = vals.reduce(function (a, b) { return a + b; }, 0);
    ctx.foot.innerHTML = "row sum = <b>" + f(s, 1) + "</b>" +
      (st === 0 ? " — non-zero, because the mean term has not been applied yet"
                : " — zero, which is the algebraic signature of shift-invariance") +
      " &nbsp;·&nbsp; inv_std = " + f(D.inv_std, 5);
    ctx.form.innerHTML = "";
    ctx.form.appendChild(NN.formula({
      rule: "channel 0 of " + tokRow(t),
      sub: f(D.inv_std, 5) + " × [ " + f(D.dxhat[0], 6) +
           (st >= 1 ? " − " + f(D.mean_dxhat, 6) : "") +
           (st >= 2 ? " − " + f(D.xhat[0], 4) + "×" + f(D.mean_dxhat_xhat, 6) : "") + " ]",
      result: f(vals[0], 7), cls: "gradient" }));
  }
});

/* ------------------------------------- B9. gain, bias and what is saved */
S({
  chapter: "Backward L1 · LayerNorm (4/4)",
  plain: "dgain and dbias accumulate over tokens — and what forward must save",
  notes: "Two loose ends. First, the parameter gradients. The gain and bias " +
    "are shared across tokens: the same " + DM + " numbers are applied to " +
    "every row. So their gradients ACCUMULATE — dgain_j is the sum over all " +
    SQ + " tokens of dL/dy_j times xhat_j, and dbias_j is just the sum of " +
    "dL/dy_j. That is a general rule and not a LayerNorm quirk: whenever a " +
    "parameter is reused, its gradient is the sum over every use. Second, the " +
    "memory consequence, which is the reason this section belongs in this " +
    "deck. Look at what the backward formula actually needs: xhat and inv_std, " +
    "for every token. Neither is recoverable from the output. So a LayerNorm " +
    "cannot free them at the end of the forward pass — it holds them until " +
    "backward runs, which may be milliseconds and " + CFG.layers +
    " layers later.",
  build: function (ctx) {
    const det = bstep(1, "ln2").ln_detail;
    const dg = GR2["L1.ln2.g"], db = GR2["L1.ln2.b"];
    const contrib = det.map(function (D, t) {
      return D.dxhat.map(function (dxh, j) {
        return (dxh / PRM["L1.ln2.g"][j]) * D.xhat[j];
      });
    });
    return [
      kicker("Backward · LayerNorm · parameters and memory"),
      title("Shared parameters accumulate. Saved statistics cannot be freed.", true),
      frag(d("panel g", [ph("dgain_j = Σ over tokens of  dL/dy_j · xhat_j"),
        d("rowflex top", contrib.map(function (c, t) {
          return gm("token " + t + " · “" + TOK[t] + "”", [c], "", 6);
        }).concat([h("ar", "Σ ="), gm("dL/d(ln2.gain)", [dg], "", 6)]))]), "f-fade"),
      frag(d("rowflex top", [
        gm("dL/d(ln2.gain)", [dg], DM + " numbers", 6),
        gm("dL/d(ln2.bias)", [db], "= Σ dL/dy", 6)
      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("key", "Reused parameter ⇒ summed gradient",
          "The gain is applied to all " + SQ + " tokens, so it appears " + SQ +
          " times in the computation graph and its gradient is the sum of " +
          SQ + " contributions. Exactly the same rule makes a weight matrix's " +
          "gradient an outer product summed over the batch."),
        NN.callout("mem", "What LayerNorm holds from forward to backward",
          "<span class='mono'>xhat</span> (" + (SQ * DM) + " elements here) " +
          "and <span class='mono'>inv_std</span> (one per token). Frameworks " +
          "store <span class='mono'>μ</span> and " +
          "<span class='mono'>inv_std</span> — two floats a token — and " +
          "recompute <span class='mono'>xhat</span>. Either way, something " +
          "survives the forward pass. There are <span class='mono'>2 × " +
          CFG.layers + "</span> LayerNorms in " + CFG.name + ", each holding " +
          "that for every token in the batch.")
      ]), "f-fade")
    ];
  }
});

/* --------------------------------------------------- B10. W_o backward */
S({
  chapter: "Backward L1 · W_o",
  plain: "Output projection backward: dW_o = concatᵀ · dA",
  notes: "Out of the LayerNorm and into the attention sub-layer. The " +
    "gradient arriving at the attention branch is dA — which, note, is the " +
    "residual-1 split, so it is the same tensor that continues down the skip. " +
    "The output projection's backward is the standard linear-layer pair: the " +
    "weight gradient is the saved input transposed times the incoming " +
    "gradient, and the input gradient is the incoming gradient times the " +
    "weights transposed. The saved input here is the concatenated head " +
    "output, which is therefore on the list of things the forward pass could " +
    "not free. And dO is the tensor that gets cut back into per-head slices " +
    "on the next slide — the exact inverse of the concat.",
  build: function (ctx) {
    const B = AB[1];
    return [
      kicker("Backward · block 1 · output projection"),
      title("The two rules of a linear layer, one more time", true),
      frag(d("rowflex top", [
        gm("dL/dA · into the attention branch", B.dA, "", 5)
      ]), "f-fade"),
      frag(d("cols", [
        d("panel g", [ph("weight gradient · reads the SAVED concat"),
          d("rowflex top", [
            am("concatᵀ", mT(FL[1].concat), "saved", 3), h("ar", "×"),
            gm("dA", B.dA, "", 4), h("ar", "="),
            gm("dL/dW_o", B.dWo, "", 4)
          ])]),
        d("panel g", [ph("input gradient · reads the live weights"),
          d("rowflex top", [
            gm("dA", B.dA, "", 4), h("ar", "×"),
            wm("W_oᵀ", mT(PRM["L1.Wo"]), "", 3), h("ar", "="),
            gm("dL/dO", B.dO, "", 5)
          ])])
      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("key", "Weight-gradient reads the input; input-gradient reads the weights",
          "<span class='mono'>dW = inputᵀ · dOut</span> and " +
          "<span class='mono'>dInput = dOut · Wᵀ</span>. The first needs a " +
          "saved activation; the second needs a parameter you are keeping " +
          "anyway. That asymmetry is the entire reason activation memory " +
          "exists."),
        NN.callout("mem", "So the concat cannot be freed",
          (SQ * DM) + " elements per block here — " +
          ACT2.filter(function (a) { return a.name === "concat O"; })[0].elements +
          " across the model. In a real block it is " +
          "<span class='mono'>batch × seq × d</span>, which is why " +
          "activation memory follows your data and not your parameter count.")
      ]), "f-fade")
    ];
  }
});

/* ------------------------------------------- B11. dP and dV, per head */
S({
  chapter: "Backward L1 · attention (1/5)",
  plain: "Cut dO back into heads, then dP = dO·Vᵀ and dV = Pᵀ·dO",
  notes: "dO is cut back into per-head slices by the same column ranges the " +
    "forward split used — head 0 takes columns 0 to " + (DH - 1) + ", head 1 " +
    "the rest. Then each head differentiates its own O = P·V, which is a " +
    "matmul, so it is the same two rules again: dP is the incoming gradient " +
    "times V transposed, dV is P transposed times the incoming gradient. Both " +
    "re-read a saved tensor, and one of them is the seq² probability " +
    "matrix — which is precisely the tensor FlashAttention refuses to keep, " +
    "recomputing it from the softmax statistics instead. Read the shapes: dP " +
    "is " + SQ + "×" + SQ + " per head, dV is " + SQ + "×" + DH + ".",
  build: function (ctx) {
    const H = bstep(1, "attn").heads[0];
    const FH = FL[1].heads[0];
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 86,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i; }),
      caption: "head 0 · dL/dP" });
    return [
      kicker("Backward · block 1 · attention · dP and dV"),
      title("O = P·V, so the backward is two more matmuls", true),
      d("cols wide-r", [
        d("stack", [
          frag(d("rowflex top", [
            gm("dL/dO · head 0", mcols(AB[1].dO, 0, DH), "columns 0–" + (DH - 1), 5)
          ]), "f-fade"),
          frag(NN.formula({ rule: "dP = dO · Vᵀ",
            sub: "(" + SQ + "×" + DH + ")·(" + DH + "×" + SQ + ") — reads the SAVED V",
            result: SQ + "×" + SQ + " per head", cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "dV = Pᵀ · dO",
            sub: "(" + SQ + "×" + SQ + ")·(" + SQ + "×" + DH +
                 ") — reads the SAVED probability matrix",
            result: SQ + "×" + DH + " per head", cls: "gradient" }), "f-left"),
          frag(gm("dL/dV · head 0", H.dV, "", 5), "f-pop"),
          frag(NN.callout("mem", "This is the tensor FlashAttention refuses to keep",
            "<span class='mono'>dV = Pᵀ·dO</span> needs the whole " +
            "probability matrix, " + (NH * SQ * SQ) + " elements here and " +
            "<span class='mono'>heads × seq²</span> in general. " +
            "FlashAttention stores only per-row softmax statistics and " +
            "recomputes tiles of P during backward — the FLOPs stay, the " +
            "memory goes."), "f-left")
        ]),
        d("stack", [frag(d("panel g", [ctx.hm]), "f-right")])
      ])
    ];
  },
  render: function (n, ctx) {
    ctx.hm.paint(bstep(1, "attn").heads[0].dP, { color: "var(--gradient)", digits: 4 });
  }
});

/* ------------------------------- B12. the softmax Jacobian is dense */
S({
  chapter: "Backward L1 · attention (2/5)",
  plain: "The softmax Jacobian is DENSE — look at the off-diagonals",
  notes: "Here is the second thing everybody gets wrong. Softmax is not an " +
    "elementwise function. p_i = exp(s_i)/Σ exp(s_k), and that " +
    "denominator contains every s, so EVERY output depends on EVERY input. " +
    "The Jacobian is dp_i/ds_j = p_i(δ_ij − p_j) — a full " +
    "matrix. Show it as a heatmap for the last row of head 0, which is the " +
    "only row with all three keys visible. The diagonal entries are " +
    "p_i(1 − p_i), positive. The off-diagonals are −p_i·p_j, " +
    "strictly negative, and they are NOT small — for this row the largest " +
    "off-diagonal is " +
    f(Math.max.apply(null, mflat(softJac(FL[1].heads[0].P[SQ - 1])).map(function (v) {
      return v < 0 ? -v : 0; })), 5) + " against a largest diagonal of " +
    f(Math.max.apply(null, mflat(softJac(FL[1].heads[0].P[SQ - 1])).map(Math.abs)), 5) +
    ". Treat this matrix as diagonal and you get a gradient that is wrong in " +
    "both magnitude and direction. The intuition is competitive: pushing one " +
    "attention weight up necessarily pushes the others down, because they sum " +
    "to one.",
  build: function (ctx) {
    const p = FL[1].heads[0].P[SQ - 1];
    const J = softJac(p);
    ctx.J = J; ctx.p = p;
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 100,
      rowLab: TOK.map(function (t, i) { return "∂p" + i; }),
      colLab: TOK.map(function (t, i) { return "∂s" + i; }),
      caption: "head 0, row " + (SQ - 1) + " · the full Jacobian ∂pᵢ/∂sⱼ" });
    ctx.cap = h("phaselabel", "");
    return [
      kicker("Backward · block 1 · attention · the Jacobian"),
      title("<span class='mono'>∂pᵢ/∂sⱼ = pᵢ(δᵢⱼ − pⱼ)</span> — every entry is non-zero", true),
      d("cols wide-r", [
        d("stack", [
          frag(am("p · the row we are differentiating", [p],
            "sums to " + f(FL[1].heads[0].row_sums[SQ - 1], 6), 5), "f-fade"),
          frag(NN.formula({ rule: "diagonal · i = j",
            sub: "p₀(1 − p₀) = " + f(p[0], 4) + "(1 − " + f(p[0], 4) + ")",
            result: f(J[0][0], 7), cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "off-diagonal · i ≠ j",
            sub: "−p₀·p₁ = −" + f(p[0], 4) + " × " + f(p[1], 4),
            result: f(J[0][1], 7), cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "every ROW of the Jacobian sums to",
            sub: "pᵢ(1 − Σⱼ pⱼ) = pᵢ(1 − 1)",
            result: "0 — exactly", cls: "gradient" }), "f-left"),
          frag(NN.callout("key", "Softmax is competitive, so its gradient is too",
            "The outputs are constrained to sum to one. Pushing " +
            "<span class='mono'>p₀</span> up must push the others down — " +
            "there is no way to change one without changing the rest. The " +
            "negative off-diagonals are that constraint, written as calculus."), "f-left")
        ]),
        d("stack", [frag(d("panel g", [ctx.cap, ctx.hm]), "f-right")])
      ])
    ];
  },
  render: function (n, ctx) {
    if (n >= 3) {
      ctx.hm.paint(ctx.J, { color: "var(--gradient)", digits: 4,
        hot: function (i, j) { return i !== j; } });
      ctx.cap.textContent = "the off-diagonals are outlined — they are the whole point";
    } else {
      ctx.hm.paint(ctx.J, { color: "var(--gradient)", digits: 4 });
      ctx.cap.textContent = "∂pᵢ/∂sⱼ · " + (SQ * SQ) +
        " entries, none of them zero";
    }
  }
});

/* -------------------------------- B13. contracting with the Jacobian */
S({
  chapter: "Backward L1 · attention (3/5)",
  plain: "dL/dsᵢ = pᵢ(dL/dpᵢ − Σⱼ dL/dpⱼ pⱼ)",
  notes: "You never build that Jacobian in practice — you contract dL/dp with " +
    "it, and the result collapses into one line. dL/ds_i = p_i times " +
    "(dL/dp_i minus a scalar), where the scalar is the dot product of dL/dp " +
    "with p itself. That scalar is the SAME for every i in the row, which is " +
    "why the whole dense Jacobian costs one extra dot product rather than a " +
    "matrix multiply. TF2 records those scalars: for head 0 of block 1 they " +
    "are " + bstep(1, "attn").heads[0].softmax_dots.map(function (v) {
      return f(v, 6); }).join(", ") + ", one per row. Work row " + (SQ - 1) +
    " on screen. And notice the interpretation: you are subtracting the " +
    "AVERAGE incoming gradient, weighted by the attention probabilities. Only " +
    "the part of dL/dp that differs from that average survives — attention " +
    "cares about relative preference, not absolute level.",
  build: function (ctx) {
    const HB = bstep(1, "attn").heads[0];
    const i = SQ - 1;
    const p = FL[1].heads[0].P[i], dp = HB.dP[i], dot = HB.softmax_dots[i];
    return [
      kicker("Backward · block 1 · attention · the contraction"),
      title("The dense Jacobian collapses to one subtraction", true),
      d("cols wide-l", [
        d("stack", [
          frag(d("panel g", [ph("row " + i + " of head 0 · “" + TOK[i] + "”"),
            d("stack", [
              am("p", [p], "the attention weights", 5),
              gm("dL/dp", [dp], "arriving", 6),
              gm("dL/ds", [HB.dS[i]], "leaving", 6)
            ])]), "f-fade"),
          frag(NN.formula({ rule: "the shared scalar · Σⱼ dL/dpⱼ · pⱼ",
            sub: dp.map(function (v, j) { return f(v, 5) + "×" + f(p[j], 4); }).join(" + "),
            result: f(dot, 8), cls: "gradient" }), "f-pop"),
          frag(NN.formula({ rule: "dL/ds₀ = p₀ · (dL/dp₀ − dot)",
            sub: f(p[0], 5) + " × (" + f(dp[0], 6) + " − " + f(dot, 6) + ")",
            result: f(HB.dS[i][0], 9), cls: "gradient" }), "f-pop")
        ]),
        d("stack", [
          frag(d("panel g tight", [ph("the shared scalar, one per row · TF2 softmax_dots"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", { style: { textAlign: "left" } }, "row"),
                el("th", {}, "Σ dL/dp · p"), el("th", {}, "visible keys")])),
              el("tbody", {}, HB.softmax_dots.map(function (v, k) {
                return el("tr", {}, [
                  el("td", { style: { textAlign: "left" } }, tokRow(k)),
                  el("td", { class: "n v-gradient" }, f(v, 8)),
                  el("td", { class: "n" }, String(k + 1))
                ]);
              }))
            ])]), "f-right"),
          frag(NN.callout("key", "One dot product, not a matrix product",
            "Naively, contracting with a dense " + SQ + "×" + SQ +
            " Jacobian per row would cost <span class='mono'>seq²</span> " +
            "per row and <span class='mono'>seq³</span> per head. The " +
            "collapse makes it <span class='mono'>seq</span> per row. That " +
            "is why softmax backward is cheap despite being dense."), "f-right"),
          frag(NN.callout("why", "And read what the subtraction means",
            "<span class='mono'>Σ dL/dpⱼ pⱼ</span> is the " +
            "attention-weighted average of the incoming gradient. Subtracting " +
            "it leaves only the part that says “this key deserves more " +
            "than the others”. A uniform push on every attention weight " +
            "produces exactly zero score gradient."), "f-right")
        ])
      ])
    ];
  }
});

/* ---------------------------------- B14. every row of dS sums to zero */
S({
  chapter: "Backward L1 · attention (4/5)",
  plain: "Every row of dS sums to exactly zero — and that is not a coincidence",
  notes: "Check the consequence, on the shipped numbers. TF2 records the row " +
    "sums of dS: for head 0 of block 1 they are " +
    bstep(1, "attn").heads[0].row_sums_dS.map(function (v) { return f(v, 1); }).join(", ") +
    " — zero to the last bit. The proof is two lines. Σ_i dL/ds_i = " +
    "Σ_i p_i·dL/dp_i − (Σ_i p_i)·dot, and since Σ p_i = 1, the second term " +
    "is exactly the dot itself, which is Σ_i p_i·dL/dp_i. They cancel. So " +
    "the zero row sum is the algebraic shadow of the fact that softmax " +
    "outputs sum to one — the constraint on the forward pass shows up as a " +
    "constraint on the backward pass. It also has a practical meaning: a " +
    "constant shift of all the scores in a row changes nothing, so the " +
    "gradient must be blind to that direction, and a vector orthogonal to " +
    "the all-ones direction is exactly a vector that sums to zero.",
  build: function (ctx) {
    const rows = [];
    for (let Lx = NL - 1; Lx >= 0; Lx--) {
      bstep(Lx, "attn").heads.forEach(function (HB) {
        HB.row_sums_dS.forEach(function (v, k) {
          rows.push(el("tr", {}, [
            el("td", { class: "mono" }, "block " + Lx),
            el("td", { class: "mono" }, "head " + HB.head),
            el("td", { style: { textAlign: "left" } }, tokRow(k)),
            el("td", { class: "n v-gradient" }, f(v, 1)),
            el("td", { class: "n" }, Math.abs(v) === 0 ? "exactly 0" : f(Math.abs(v), 1))
          ]));
        });
      });
    }
    const HB = bstep(1, "attn").heads[0];
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 92,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i; }),
      caption: "head 0 · dL/dS · masked entries are structurally zero" });
    ctx.HB = HB;
    return [
      kicker("Backward · block 1 · attention · the invariant"),
      title("Σᵢ dL/dsᵢ = 0, on every row, in every head", true),
      d("cols wide-l", [
        d("stack", [
          frag(d("panel g", [ctx.hm]), "f-fade"),
          frag(NN.formula({ rule: "the proof, in one line",
            sub: "Σᵢ pᵢ(dL/dpᵢ − dot) = Σᵢ pᵢ dL/dpᵢ − dot · Σᵢ pᵢ",
            result: "= dot − dot · 1 = 0", cls: "gradient" }), "f-pop")
        ]),
        d("stack", [
          frag(d("panel g tight", [ph("TF2.backward_steps[].heads[].row_sums_dS · " +
            "all " + (NL * NH * SQ) + " rows"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", {}, "block"), el("th", {}, "head"),
                el("th", { style: { textAlign: "left" } }, "row"),
                el("th", {}, "Σ dS"), el("th", {}, "|Σ|")])),
              el("tbody", {}, rows)
            ])]), "f-right"),
          frag(NN.callout("key", "A forward constraint becomes a backward constraint",
            "Softmax outputs sum to 1 for every input, so the score direction " +
            "“add the same constant to every score” cannot change " +
            "the output. A direction the function ignores is a direction the " +
            "gradient must be orthogonal to — and orthogonal to all-ones " +
            "means summing to zero."), "f-right")
        ])
      ]),
      frag(NN.callout("why", "And the mask takes care of itself",
        "A masked position had <span class='mono'>p = 0</span>, and " +
        "<span class='mono'>dL/ds = p(dL/dp − dot)</span>, so its score " +
        "gradient is zero automatically. No special case is needed in the " +
        "backward kernel — the forward mask has already done the work."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    ctx.hm.paint(ctx.HB.dS, { color: "var(--gradient)", digits: 5 });
  }
});

/* --------------------------------------------- B15. dQ and dK from dS */
S({
  chapter: "Backward L1 · attention (5/5)",
  plain: "dQ = dS·K·scale and dK = dSᵀ·Q·scale — each reads the other",
  notes: "The last step inside attention. The forward operation was S = " +
    "(Q·Kᵀ)·scale, so its backward is the matmul pair with the scale " +
    "carried along: dQ is dS times K, dK is dS transposed times Q, both " +
    "multiplied by the same 1/√d_head. Point at the symmetry, because it " +
    "is the reason both Q and K have to be saved: computing the gradient for " +
    "Q requires K, and computing the gradient for K requires Q. Neither can " +
    "be freed after the forward pass. Then the per-head results are written " +
    "back into the same column ranges the heads were cut from, which " +
    "reassembles the full " + SQ + "×" + DM + " dQ, dK and dV.",
  build: function (ctx) {
    const HB = bstep(1, "attn").heads[0];
    const FH = FL[1].heads[0];
    return [
      kicker("Backward · block 1 · attention · scores to Q and K"),
      title("The two gradients cross over", true),
      frag(d("cols", [
        d("panel g", [ph("dQ needs K"),
          d("rowflex top", [
            gm("dS", HB.dS, "", 5), h("ar", "×"),
            am("K head 0", FH.K, "SAVED", 4), h("ar", "× " + f(SCL, 4) + " ="),
            gm("dQ head 0", HB.dQ, "", 6)
          ])]),
        d("panel g", [ph("dK needs Q"),
          d("rowflex top", [
            gm("dSᵀ", mT(HB.dS), "", 5), h("ar", "×"),
            am("Q head 0", FH.Q, "SAVED", 4), h("ar", "× " + f(SCL, 4) + " ="),
            gm("dK head 0", HB.dK, "", 6)
          ])])
      ]), "f-fade"),
      frag(d("rowflex top", [
        gm("dQ · reassembled", QB[1].dQ, SQ + "×" + DM, 6),
        gm("dK · reassembled", QB[1].dK, SQ + "×" + DM, 6),
        gm("dV · reassembled", QB[1].dV, SQ + "×" + DM, 6)
      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("mem", "Q and K are mutually hostage",
          "<span class='mono'>dQ</span> reads <span class='mono'>K</span>; " +

    "sequence, an order of magnitude more than the linear term. Double the " +
    "sequence and it quadruples. FlashAttention removes it from memory " +
    "entirely — it never writes the score matrix to HBM, keeping only " +
    "per-row softmax statistics, and recomputes tiles in the backward pass. " +
    "The FLOPs do not go away; the memory does.",
  build: function () {

/* Scenario choices — not facts about the model or the hardware, so they are

/* --------------------------------------------- B3. inference vs training */

  chapter: "Scale · inference vs training", plain: "Inference needs " +

    GPUD.name + " cards, and people do it on two. To TRAIN it you additionally " +
    "need a gradient per parameter, an fp32 master copy, and two Adam moments " +
    "— " + BY(CFG.stateB) + ", " + GPUS + " cards, before activations. The " +
    "asymmetry has a cause worth stating: inference is a pure function of the " +
    "weights, so nothing has to be remembered between tokens except the KV " +

      ]), "f-pop"),
      frag(d("cols", [

    " with FlashAttention on, or " + BY(CFG.actFullSeq) + " if the score " +

    "between fitting and not. Crucially this is PER SEQUENCE: batch 8 is " +
    BY(CFG.actPerSeq * 8) + ", which on its own exceeds the " + BY(CFG.gradB) +
    " of gradients and is comparable to the whole persistent bill. That is " +
    "why the peak in a real transformer is at the forward/backward boundary " +
    "and not, as in our toy model, at the end of backward. Two levers: " +
    "activation checkpointing, which trades roughly 30% more compute for " +

const PA = window.PARALLEL || null;

                "Run `python3 code/parallel_toy.py` to regenerate it.");

const PMOD  = PA.model;
const STRAT = PA.strategies;
const COLL  = PA.collectives;
const SUB   = ["₀", "₁", "₂", "₃", "₄", "₅", "₆", "₇"];
const SUP   = ["⁰", "¹", "²", "³", "⁴", "⁵", "⁶", "⁷"];
const byOp  = function (op) {
