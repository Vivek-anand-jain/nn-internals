        " times over, with a few million numbers in each — and not one new idea."))
    ];
  }
});

/* ------------------------------------------------- 5. a weight is a float */
S({
  chapter: "Memory · what a weight is", plain: "A weight is a float: " + FP32B + " bytes",
  notes: "Zoom all the way in on one parameter. W1[0][0] = 0.5 is a 32-bit " +
    "IEEE-754 float: one sign bit, eight exponent bits, twenty-three mantissa " +
    "bits. The tensor is not a grid in memory — it is one flat run of bytes, " +
    "and the row/column structure is entirely a matter of strides.",
  build: function () {
    const bv = T.bitviews[0];
    const rows = T.layout.cells.map(function (c) {
      return el("tr", {}, [
        el("td", {}, "W1[" + c.row + "][" + c.col + "]"),
        el("td", { class: "n" }, String(c.flat_index)),
        el("td", { class: "n" }, "+" + c.byte_offset),
        el("td", { class: "n v-weight" }, f(c.value, 2))
      ]);
    });
    return [
      kicker("What a weight actually is"),
      title("One parameter · <span class='mono'>" + bv.label + " = " +
            W(bv.value, 2) + "</span>", true),
      d("cols wide-l", [
        d("stack", [
          frag(panel("w", [ph("its " + bv.fp32.bytes + " bytes, as bits (fp32)"),
            NN.bitribbon(bv.fp32),
            h("small muted",
              "sign <span class='mono'>" + bv.fp32.sign + "</span> · exponent <span class='mono'>" +
              bv.fp32.exponent + "</span> · mantissa <span class='mono'>" +
              bv.fp32.mantissa + "</span>")]), "f-left"),
          frag(NN.callout("key", "There is no “weight” object",
            "A parameter is " + bv.fp32.bytes + " bytes at an address. The name " +
            "<span class='mono'>W1[0][0]</span> is bookkeeping the framework " +
            "does on your behalf."), "f-left")
        ]),
        frag(panel("acc", [
          ph("W1 in memory · " + T.layout.order),
          el("table", { class: "data" }, [
            el("thead", {}, el("tr", {}, [
              el("th", {}, "cell"), el("th", {}, "flat"),
              el("th", {}, "byte"), el("th", {}, "value")])),
            el("tbody", {}, rows)
          ]),
          h("small muted", "strides " + T.layout.strides_elements.join(", ") +
            " elements = " + T.layout.strides_bytes_fp32.join(", ") + " bytes")
        ]), "f-right")
      ])
    ];
  }
});

/* ------------------------------------------------------ 6. not exact */
S({
  chapter: "Memory · what a weight is", plain: "Most weights are not the number you typed",
  notes: "W1[0][1] is written as -0.2 but the float that lands in memory is " +
    "not -0.2. Binary fractions cannot represent one fifth, exactly as decimal " +
    "cannot represent one third. This is not a bug and you should not chase it " +
    "— but it is the reason gradient checks compare with a tolerance rather " +
    "than for equality.",
  build: function () {
    const bv = T.bitviews[1];
    return [
      kicker("Precision"),
      title("You wrote <span class='mono v-weight'>" + f(bv.value, 2) +
            "</span>. Memory holds <span class='mono v-weight'>" +
            bv.fp32.exact + "</span>.", true),
      frag(panel("w", [ph(bv.label + " · fp32 · " + bv.fp32.bytes + " bytes"),
        NN.bitribbon(bv.fp32)]), "f-fade"),
      frag(d("cols", [
        NN.formula({ rule: "stored value", sub: "sign × 2^exponent × 1.mantissa",
                     result: String(bv.fp32.exact), cls: "weight" }),
        NN.formula({ rule: "error", sub: f(bv.fp32.exact, 12) + " − (" + bv.value + ")",
                     result: (bv.fp32.exact - bv.value).toExponential(2), cls: "weight" })
      ])),
      frag(NN.callout("why", "Why this matters later",
        "Every float you meet is an approximation with a fixed number of " +
        "significant digits. When we drop to " + BF16B * 8 + "-bit weights on the " +
        "next slide, we keep the exponent — the range — and throw away digits. " +
        "That trade is the whole of mixed-precision training. The gradient " +
        "check for this model passes to " + f(T.gradcheck.max_abs_error, 1) +
        ", which is float noise, not error."))
    ];
  }
});

/* ------------------------------------------------------- 7. bf16 vs fp32 */
S({
  chapter: "Memory · dtypes", plain: "bf16: same range, fewer digits, half the bytes",
  notes: "bf16 keeps all eight exponent bits and truncates the mantissa from " +
    "twenty-three bits to seven. Same dynamic range as fp32 — so no overflow " +
    "surprises — but roughly three significant decimal digits. Halving the " +
    "bytes halves weight memory, halves gradient traffic on the wire, and " +
    "doubles the arithmetic throughput on tensor cores. Note the exact value " +
    "changes: bf16 is a lossy container.",
  build: function () {
    const bv = T.bitviews[1];
    const mantKeep = 1 + bv.fp32.exponent.length + bv.bf16.mantissa.length;
    return [
      kicker("Dtypes"),
      title("bf16 keeps the exponent and throws away the digits", true),
      frag(panel("w", [
        ph("fp32 · " + bv.fp32.bytes + " bytes · exact " + bv.fp32.exact),
        NN.bitribbon(bv.fp32)]), "f-left"),
      frag(panel("w", [
        ph("bf16 · " + bv.bf16.bytes + " bytes · exact " + bv.bf16.exact +
           " · the greyed bits are simply gone"),
        NN.bitribbon(bv.fp32, mantKeep)]), "f-left"),
      frag(d("cols3", [
        NN.tiles([{ k: "exponent bits", v: bv.fp32.exponent.length + " → " + bv.bf16.exponent.length,
                    s: "identical range", cls: "weight" }]),
        NN.tiles([{ k: "mantissa bits", v: bv.fp32.mantissa.length + " → " + bv.bf16.mantissa.length,
                    s: "≈3 decimal digits", cls: "weight" }]),
        NN.tiles([{ k: NPARAM + " params", v: BY(NPARAM * FP32B) + " → " + BY(NPARAM * BF16B),
                    s: "×0.5 on every layer", cls: "weight" }])
      ]), "f-fade"),
      frag(NN.callout("mem", "The reason every large model trains in bf16",
        "At " + bn(CFG.params) + " parameters (" + MODEL.name +
        "), fp32 weights alone are " +
        BY(CFG.params * FP32B) + ". In bf16 they are " + BY(CFG.params * BF16B) +
        ". You still keep an fp32 master copy for the optimizer — we get to " +
        "that arithmetic later — but every matmul and every all-reduce moves " +
        "half as many bytes."))
    ];
  }
});

SEP("forward");

/* ------------------------------------------------- 8. forward overview */
S({
  chapter: "Forward pass", plain: "The forward pass, end to end",
  notes: "Set up the next few slides. The forward pass is four operations: a " +
    "matrix-vector product, a ReLU, another matrix-vector product, and a loss. " +
    "Every arrow produces a tensor that has to be written down somewhere, and " +
    "some of those tensors cannot be freed when the arrow finishes — which is " +
    "the point we will keep returning to.",
  build: function () {
    const step = function (lab, val, note) {
      return panel("a", [ph(lab), h("midnum v-activation", val),
                         note ? h("small muted", note) : null]);
    };
    return [
      kicker("Forward pass"),
      title("Four operations, four tensors"),
      frag(d("arrowline", [
        step("x", "[" + T.forward.x.map(function (v) { return f(v, 1); }).join(", ") + "]",
             "the input"),
        h("ar", "→"),
        frag(step("z1 = W1·x + b1",
             "[" + T.forward.z1.map(function (v) { return f(v, 2); }).join(", ") + "]",
             "pre-activation"), "f-pop"),
        h("ar", "→"),
        frag(step("a1 = relu(z1)",
             "[" + T.forward.a1.map(function (v) { return f(v, 2); }).join(", ") + "]",
             "one unit is dead"), "f-pop"),
        h("ar", "→"),
        frag(step("ŷ = W2·a1 + b2", f(T.forward.yhat, 2), "the prediction"), "f-pop")
      ]), "f-fade"),
      frag(netSVG({ height: 250, values: true, dead: true }), "f-fade"),
      frag(NN.callout("key", "Watch what has to survive",
        "<span class='mono'>x</span>, <span class='mono'>a1</span> and the ReLU " +
        "mask are all still needed <em>after</em> the forward pass is finished. " +
        "Nothing tells you that yet — the backward pass will."))
    ];
  }
});

/* --------------------------------------- 9-11. one hidden unit at a time */
function z1Slide(i) {
  const wk = T.forward.z1_work[i];
  const dead = wk.out < 0;
  return {
    chapter: "Forward · hidden unit " + (i + 1),
    plain: "z1[" + i + "] = " + f(wk.out, 2) + (dead ? "  (negative)" : ""),
    notes: "Hidden unit " + (i + 1) + ". Two multiplies, one add, one bias. " +
      "This is a matrix-vector product done by hand: row " + i + " of W1 against " +
      "x. " + (dead
        ? "This one comes out negative — " + f(wk.out, 2) + " — and that single " +
          "fact will echo through the entire rest of the deck."
        : "Nothing exotic; the only reason to show it is so that nobody thinks " +
          "there is anything hidden inside a matmul."),
    build: function (ctx) {
      ctx.W1 = tn({ name: "W1", shape: [3, 2], values: T.init.W1, cls: "weight", digits: 2 });
      ctx.x  = tn({ name: "x", shape: [2], values: T.forward.x, cls: "activation", digits: 2 });
      ctx.b1 = tn({ name: "b1", shape: [3], values: T.init.b1, cls: "weight", digits: 2 });
      ctx.acc = h("bignum v-activation", "0");
      ctx.accLabel = h("small muted", "accumulator");
      ctx.wk = wk;
      const prods = wk.products.map(function (p, k) {
        return frag(NN.formula({
          rule: "W1[" + i + "][" + k + "] × x[" + k + "]",
          sub: W(p.w, 2) + " × " + A(p.x, 2),
          result: f(p.prod, 4), cls: "activation"
        }), "f-right");
      });
      return [
        kicker("Forward · multiply, accumulate"),
        title("z1[" + i + "] &nbsp;=&nbsp; W1[" + i + "] · x + b1[" + i + "]", true),
        d("cols wide-r", [
          d("stack", [
            d("rowflex top", [ctx.W1, ctx.x, ctx.b1]),
            panel("a tight", [ctx.accLabel, ctx.acc])
          ]),
          d("stack", prods.concat([
            frag(NN.formula({ rule: "sum of products",
              sub: wk.products.map(function (p) { return f(p.prod, 2); }).join(" + "),
              result: f(wk.sum_of_products, 4), cls: "activation" }), "f-right"),
            frag(NN.formula({ rule: "+ bias b1[" + i + "]",
              sub: f(wk.sum_of_products, 4) + " + " + W(wk.bias, 2),
              result: f(wk.out, 4), cls: "activation" }), "f-right"),
            frag(dead
              ? h("deadflag", "z1[" + i + "] = " + f(wk.out, 2) + " — negative. " +
                  "Remember this number.")
              : h("pill", "z1[" + i + "] = " + f(wk.out, 2)), "f-pop")
          ]))
        ])
      ];
    },
    render: function (n, ctx) {
      const hot = [];
      for (let k = 0; k < Math.min(n, 2); k++) hot.push([i, k]);
      ctx.W1.highlight(hot.length ? hot : null, hot.length > 0);
      ctx.x.highlight(hot.length ? hot.map(function (p) { return [p[1], 0]; }) : null,
                      hot.length > 0);
      ctx.b1.highlight(n >= 4 ? [[i, 0]] : null, n >= 4);
      let v = 0, lab = "accumulator";
      if (n >= 1) v = ctx.wk.products[0].prod;
      if (n >= 2) v = ctx.wk.products[0].prod + ctx.wk.products[1].prod;
      if (n >= 3) { v = ctx.wk.sum_of_products; lab = "sum of products"; }
      if (n >= 4) { v = ctx.wk.out; lab = "z1[" + i + "] — pre-activation"; }
      ctx.acc.textContent = f(v, 4);
      ctx.accLabel.textContent = lab;
    }
  };
}
S(z1Slide(0)); S(z1Slide(1)); S(z1Slide(2));

/* ------------------------------------------------------------ 12. ReLU */
S({
  chapter: "Forward · ReLU", plain: "ReLU kills unit 3 — the dead unit",
  notes: "ReLU is max(0, z), applied elementwise. Units one and two pass " +
    "through untouched. Unit three had a pre-activation of " +
    f(T.forward.z1[2], 2) + ", so it becomes exactly zero. Two consequences, " +
    "both of which we will cash in later: it contributes nothing to the " +
    "prediction, and it will receive exactly zero gradient. Also point at the " +
    "mask — one bit per unit — which the framework has to keep.",
  build: function (ctx) {
    ctx.z1 = tn({ name: "z1", shape: [3], values: T.forward.z1, cls: "activation",
                  digits: 2, note: "pre-activation" });
    ctx.a1 = tn({ name: "a1", shape: [3], values: T.forward.a1, cls: "activation",
                  digits: 2, note: "post-activation" });
    ctx.mk = tn({ name: "relu_mask", shape: [3], values: T.forward.relu_mask,
                  cls: "activation", digits: 0, note: "1 = alive" });
    return [
      kicker("Forward · the nonlinearity"),
      title("<span class='mono'>a1 = max(0, z1)</span>", true),
      d("cols wide-l", [
        frag(d("rowflex top", [ctx.z1, h("ar", "→"), ctx.a1, ctx.mk]), "f-fade"),
        d("stack", [
          frag(NN.formula({ rule: "relu(z1[2])", sub: "max(0, " + f(T.forward.z1[2], 2) + ")",
                            result: f(T.forward.a1[2], 0), cls: "activation" }), "f-right"),
          frag(h("deadflag", "Unit 3 is dead for this input."), "f-pop")
        ])
      ]),
      frag(d("cols", [
        NN.callout("why", "It cannot affect the prediction",
          "a1[2] = " + A(T.forward.a1[2], 0) + ", so whatever W2[0][2] = " +
          W(T.init.W2[0][2], 2) + " happens to be, that path contributes " +
          f(T.init.W2[0][2] * T.forward.a1[2], 0) + " to the output."),
        NN.callout("mem", "The mask is not free",
          "Backward needs to know <em>which</em> units were alive. That is " +
          T.forward.relu_mask.length + " more values here; in a transformer it is " +
          "one byte or one bit per activation element, kept from forward until " +
          "backward.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    ctx.z1.highlight(n >= 1 ? [[2, 0]] : null, false);
    ctx.a1.highlight(n >= 1 ? [[2, 0]] : null, false);
    ctx.mk.highlight(n >= 1 ? [[2, 0]] : null, false);
  }
});

/* -------------------------------------------------------- 13. output layer */
S({
  chapter: "Forward · output", plain: "ŷ = W2·a1 + b2 = " + f(T.forward.yhat, 2),
  notes: "The output layer is one more dot product. Land hard on the third " +
    "term: W2[0][2] times a1[2] is " + f(T.init.W2[0][2], 2) + " times zero, " +
    "which is zero. The dead unit is not merely small — it is arithmetically " +
    "absent. And there is no activation function on the output, because we are " +
    "predicting an unbounded real number.",
  build: function (ctx) {
    const wk = T.forward.z2_work[0];
    ctx.W2 = tn({ name: "W2", shape: [1, 3], values: T.init.W2, cls: "weight", digits: 2 });
    ctx.a1 = tn({ name: "a1", shape: [3], values: T.forward.a1, cls: "activation", digits: 2 });
    const prods = wk.products.map(function (p, k) {
      const zero = p.prod === 0;
      return frag(NN.formula({
        rule: "W2[0][" + k + "] × a1[" + k + "]" + (zero ? "   ← the dead unit" : ""),
        sub: W(p.w, 2) + " × " + A(p.x, 2),
        result: f(p.prod, 4), cls: zero ? "gradient" : "activation"
      }), "f-right");
    });
    return [
      kicker("Forward · output layer"),
      title("ŷ &nbsp;=&nbsp; W2 · a1 + b2", true),
      d("cols wide-r", [
        d("stack", [
          frag(d("rowflex top", [ctx.W2, ctx.a1]), "f-fade"),
          frag(h("deadflag", f(wk.products[2].w, 2) + " × " + f(wk.products[2].x, 1) + " = " +
            f(wk.products[2].prod, 0) + " — the third path is arithmetically absent"), "f-pop")
        ]),
        d("stack", prods.concat([
          frag(NN.formula({ rule: "sum + b2",
            sub: f(wk.sum_of_products, 4) + " + " + W(wk.bias, 2),
            result: f(wk.out, 4), cls: "activation" }), "f-right")
        ]))
      ])
    ];
  },
  render: function (n, ctx) {
    const k = Math.min(n, 3);
    const hot = []; for (let i = 0; i < k; i++) hot.push([0, i]);
    ctx.W2.highlight(hot.length ? hot : null, hot.length > 0);
    ctx.a1.highlight(hot.length ? hot.map(function (p) { return [p[1], 0]; }) : null,
                     hot.length > 0);
  }
});

/* ------------------------------------------------------- 14. prediction */
S({
  chapter: "Forward · prediction", plain: "The prediction is wrong: " + f(T.forward.yhat, 2) + " vs " + f(T.forward.y, 1),
  notes: "Here is the whole point of the forward pass: a number to be wrong " +
    "about. We predicted " + f(T.forward.yhat, 2) + " hundred thousand dollars " +
    "against a true price of " + f(T.forward.y, 1) + ". The error is " +
    f(T.forward.error, 2) + " — and crucially it is signed. The sign says " +
    "which direction to move; the magnitude says how far.",
  build: function () {
    return [
      kicker("Forward · the result"),
      title("A prediction, and how wrong it is"),
      frag(d("cols3", [
        panel("a", [ph("prediction ŷ"), h("bignum v-activation", f(T.forward.yhat, 2))]),
        panel("acc", [ph("truth y"), h("bignum", f(T.forward.y, 2))]),
        panel("g", [ph("error  ŷ − y"), h("bignum v-gradient", fS(T.forward.error, 2))])
      ]), "f-pop"),
      frag(say("The model predicted a <b>negative</b> price. That is what an " +
        "untrained network does: the weights were chosen without ever having " +
        "seen a house."), "f-fade"),
      frag(NN.callout("key", "The sign is the useful part",
        "An error of " + G(T.forward.error, 2) + " says: the prediction is too " +
        "low, by a lot. Backpropagation is the machinery for splitting that one " +
        "signed number across all " + NPARAM + " parameters, in proportion to " +
        "how much each of them contributed."))
    ];
  }
});

/* ------------------------------------------------------------- 15. loss */
S({
  chapter: "Loss", plain: "Loss = (ŷ − y)² = " + f(T.forward.loss, 4),
  notes: "Squaring does two jobs: it makes the error positive so that errors " +
    "in both directions count as bad, and it punishes big misses more than " +
    "small ones. The parabola on the right is the loss as a function of the " +
    "prediction; we are sitting on the left arm of it, far from the bottom. " +
    "Training is the process of sliding down that curve — except in " + NPARAM +
    " dimensions instead of one.",
  build: function () {
    const pts = [];
    for (let v = -2.2; v <= 3.3; v += 0.11) pts.push([v, (v - T.forward.y) * (v - T.forward.y)]);
    const chart = NN.chart.line({
      series: [
        { name: "(ŷ − y)²", color: "var(--accent)", points: pts, dots: false },
        { name: "we are here", color: "var(--activation)",
          points: [[T.forward.yhat, T.forward.loss]] }
      ],
      width: 560, height: 250, xlabel: "prediction ŷ", ylabel: "loss"
    });
    return [
      kicker("Loss"),
      title("One number that says how bad the whole thing is", true),
      d("cols", [
        d("stack", [
          frag(NN.formula({ rule: "L = (ŷ − y)²",
            sub: "(" + f(T.forward.yhat, 2) + " − " + f(T.forward.y, 1) + ")²",
            result: f(T.forward.loss, 4), cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "= error²",
            sub: "(" + f(T.forward.error, 2) + ")²",
            result: f(T.forward.loss, 4), cls: "gradient" }), "f-left"),
          frag(NN.callout("why", "Why square it",
            "Squaring makes both directions of error costly, and makes big " +
            "misses hurt disproportionately. It also has a very convenient " +
            "derivative — <span class='mono'>2(ŷ − y)</span> — which is the " +
            "first thing the backward pass computes."), "f-left")
        ]),
        frag(d("panel g", [ph("the loss surface, in one dimension"), chart,
          chartKey([{ name: "(ŷ − y)² for any prediction", color: "var(--accent)" },
                    { name: "our ŷ = " + f(T.forward.yhat, 2), color: "var(--activation)" }])]), "f-right")
      ])
    ];
  }
});

/* -------------------------------------------------- 16. why one scalar */
S({
  chapter: "Loss", plain: "Why the loss must be a single scalar",
  notes: "This is a question people rarely ask and always benefit from. A " +
    "derivative dL/dθ only makes sense if L is one number: 'if I nudge this " +
    "one parameter, how much does that one number change?' If the loss were a " +
    "vector you would get a Jacobian per parameter and no way to rank two " +
    "candidate updates. The whole of training is: collapse everything to one " +
    "scalar, then take " + NPARAM + " partial derivatives of it.",
  build: function () {
    return [
      kicker("Loss"),
      title("Everything funnels through one number"),
      frag(d("arrowline", [
        panel("a tight", [ph(NPARAM + " parameters"), h("midnum v-weight", String(NPARAM))]),
        h("ar", "→"),
        panel("a tight", [ph("one prediction"), h("midnum v-activation", f(T.forward.yhat, 2))]),
        h("ar", "→"),
        panel("g tight", [ph("one scalar loss"), h("midnum v-gradient", f(T.forward.loss, 4))]),
        h("ar", "⇢"),
        frag(panel("g tight", [ph("back out: " + NPARAM + " partials"),
          h("midnum v-gradient", "∂L/∂θᵢ")]), "f-pop")
      ]), "f-fade"),
      frag(NN.callout("key", "A derivative needs a scalar",
        "<span class='mono'>∂L/∂θᵢ</span> asks: if I nudge parameter i, how much " +
        "does L change? That question only has a single answer when L is a " +
        "single number. Multi-objective training does exist — it just weights " +
        "the objectives into one scalar first."), "f-fade"),
      frag(d("cols", [
        NN.tiles([{ k: "loss", v: f(T.forward.loss, 4), s: "one scalar", cls: "gradient" }]),
        NN.tiles([{ k: "gradients to compute", v: String(NPARAM),
                    s: "one per parameter", cls: "gradient" }])
      ]))
    ];
  }
});

SEP("backward");

/* ============================================== backward pass machinery */
/* Everything in the backward run is generated from these. NHID, NINP and the
   index of the dead unit are read out of the trace rather than typed, so the
   section survives a change to the model shape. */
const STEPS = T.backward.steps;
const NSTEP = STEPS.length;
const SAVED_KEYS = Object.keys(T.forward.saved_for_backward);
const BWD   = T.backward;
const FWD   = T.forward;
const NHID  = FWD.z1.length;                /* hidden width */
const NINP  = FWD.x.length;                 /* input width  */
const DEADU = FWD.relu_mask.indexOf(0);     /* the unit ReLU clamped */
const STEP_IX = {};
STEPS.forEach(function (s, i) { STEP_IX[s.id] = i; });

const READ_SRC = {
  x:         { values: T.forward.x,          cls: "activation", shape: [2],
               why: "the layer input, saved during the forward pass" },
  a1:        { values: T.forward.a1,         cls: "activation", shape: [3],
               why: "the hidden activation, saved during the forward pass" },
  relu_mask: { values: T.forward.relu_mask,  cls: "activation", shape: [3],
               why: "which units were alive, saved during the forward pass" },
  W2:        { values: T.init.W2,            cls: "weight",     shape: [1, 3],
               why: "a live parameter — nothing had to be saved for this one" }
};
function isSaved(name) { return SAVED_KEYS.indexOf(name) >= 0; }

/* ------------------------------------------------- formatting helpers */
function vecTxt(a, dig, signed) {
  return "[" + a.map(function (v) {
    return signed ? fS(v, dig) : f(v, dig);
  }).join(", ") + "]";
}

/* ============================================== equation typesetting ====
   The defect this answers: a chain-rule step written as one run-on line is
   unreadable. So every equation in this run is set as a PRODUCT — a left
   hand side, then one card per factor with the operator between them, and
   under each card a label saying what that factor is: the UPSTREAM gradient
   handed in from the right, or the LOCAL derivative of a single operation,
   plus the defining equation it was read off. Each card is tinted by the
   tensor class its value belongs to, and that is the same hue the quantity
   carries in the network diagram beside it. */
function eqfac(o) {
  return d("eqfac " + (o.zero ? "zero" : (o.cls ? "is-" + o.cls : "")), [
    h("fsym", o.sym),
    o.val !== undefined ? h("fval", o.val) : null,
    h("frole", o.role || ""),
    o.rule ? h("frule", o.rule) : null
  ]);
}
function eqline(lhs, parts, small) {
  const kids = [el("div", { class: "eqlhs" + (small ? " sm" : ""), html: lhs }),
                h("eqop", "=")];
  parts.forEach(function (p, i) {
    if (i) kids.push(h("eqop", p.op || "·"));
    kids.push(eqfac(p));
  });
  return d("eqline", kids);
}
/* one line of algebra, with the reason it is legal in the right gutter */
function drow(math, why, final) {
  return d("drow" + (final ? " final" : ""), [h("dmath", math), h("dwhy", why || "")]);
}
function derivPanel(hdr, rows, cls) {
  return d("panel " + (cls || "a"), [ph(hdr)].concat(rows));
}
function vbox(ok, html) {
  return d("vbox" + (ok ? "" : " bad"), [h("mark", ok ? "✓" : "✗"), el("div", { html: html })]);
}

/* ============================================ the chain, factor by factor
   Every local derivative on the path from W1 to L, derived rather than
   asserted — including dŷ/dz2, which is recovered as the ratio the trace
   itself leaves behind rather than typed as "1". */
const D_ID = BWD.dL_dz2 / BWD.dL_dyhat;

function chainFactors(i, j) {
  return [
    { sym: "dL/dŷ", role: "loss derivative", rule: "from L = (ŷ − y)²",
      cls: "gradient", num: BWD.dL_dyhat },
    { sym: "dŷ/dz2", role: "identity output", rule: "from ŷ = z2",
      cls: null, num: D_ID },
    { sym: "dz2/da1[" + i + "]", role: "a weight", rule: "from z2 = W2·a1 + b2",
      cls: "weight", num: T.init.W2[0][i] },
    { sym: "da1[" + i + "]/dz1[" + i + "]", role: "the ReLU gate",
      rule: "from a1 = relu(z1)", cls: "activation", num: FWD.relu_mask[i] },
    { sym: "dz1[" + i + "]/dW1[" + i + "][" + j + "]", role: "the saved input",
      rule: "from z1 = W1·x + b1", cls: "activation", num: FWD.x[j] }
  ];
}
function chainProduct(i, j) {
  return chainFactors(i, j).reduce(function (a, fc) { return a * fc.num; }, 1);
}
const IX_W100 = T.param_names.indexOf("W1[0][0]");

/* ==================================== the live backward network diagram ==
   The picture the complaint asked for: an SVG of the 2→3→1 network that
   sits beside the maths on every equation slide in this run and answers
   "where are we?".

     · the path the gradient has ALREADY travelled is drawn faint, right to
       left, so you can see how far backward has got;
     · the link being differentiated right now animates;
     · the tensor the step READS (x, a1, relu_mask, W2) pulses;
     · the variable under inspection is named on the picture, in the colour
       it carries in the equation.

   Colour grammar is the deck's and nothing here adds a fifth hue:
   gradients orange, activations green, weights blue, and --critical only
   for the dead unit, which is not a tensor class. */
const GN = {
  W: 520, H: 372,
  IN:  [{ x: 58, y: 150 }, { x: 58, y: 232 }],
  HID: [{ x: 208, y: 92 }, { x: 208, y: 186 }, { x: 208, y: 280 }],
  OUT: { x: 352, y: 186 },
  LOSS: { x: 458, y: 186 },
  rI: 17, rH: 23, rO: 23, rL: 17
};

function gradNet(o) {
  o = o || {};
  const cur   = (o.step === undefined) ? -1 : o.step;
  const id    = cur >= 0 ? STEPS[cur].id : null;
  const reads = cur >= 0 ? STEPS[cur].reads : (o.reads || []);
  const seen  = {};
  for (let k = 0; k <= cur; k++) seen[STEPS[k].id] = true;

  const root = SV("svg", {
    viewBox: "0 0 " + GN.W + " " + GN.H, class: "gnet", role: "img",
    "aria-label": "The " + T.meta.architecture + " network. Gradients travel " +
      "right to left, from the loss back to the weights." +
      (id ? " The step shown is " + id + "." : "")
  });
  const gBase = SV("g", {}), gFlow = SV("g", {}), gNode = SV("g", {}),
        gHalo = SV("g", {}), gText = SV("g", {});

  function txt(x, y, s, cls, anchor) {
    const t = SV("text", { x: x, y: y, "text-anchor": anchor || "middle",
                           class: cls || null });
    t.textContent = s; gText.appendChild(t); return t;
  }
  /* An edge carries two flow paths over the same geometry: `flow` is drawn
     right-to-left so its dashes travel the way a gradient does, `fwd` is
     drawn left-to-right for the slides that trace the FORWARD dependency
     path before the backward walk starts. */
  function edge(a, b, ra, rb) {
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    const ux = dx / L, uy = dy / L;
    const p1 = { x: a.x + ux * ra, y: a.y + uy * ra };
    const p2 = { x: b.x - ux * rb, y: b.y - uy * rb };
    gBase.appendChild(SV("line", { class: "ebase", x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }));
    const D = function (q, r) {
      return "M " + q.x.toFixed(1) + " " + q.y.toFixed(1) +
             " L " + r.x.toFixed(1) + " " + r.y.toFixed(1);
    };
    const flow = SV("path", { class: "gflow", d: D(p2, p1) });
    const fwd  = SV("path", { class: "gflow", d: D(p1, p2) });
    gFlow.appendChild(flow); gFlow.appendChild(fwd);
    return { flow: flow, fwd: fwd, mid: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 },
             p1: p1, p2: p2 };
  }
  function node(p, r, cls) {
    const c = SV("circle", { class: "nb " + (cls || ""), cx: p.x, cy: p.y, r: r });
    gNode.appendChild(c); return c;
  }
  function halo(p, r, cls) {
    const c = SV("circle", { class: "halo " + (cls || ""), cx: p.x, cy: p.y, r: r });
    gHalo.appendChild(c); return c;
  }

  /* ---- wires ---------------------------------------------------------- */
  const w1e = [], w2e = [];
  for (let i = 0; i < NHID; i++) {
    w1e.push([]);
    for (let j = 0; j < NINP; j++) w1e[i].push(edge(GN.IN[j], GN.HID[i], GN.rI, GN.rH));
  }
  for (let i = 0; i < NHID; i++) w2e.push(edge(GN.HID[i], GN.OUT, GN.rH, GN.rO));
  const le = edge(GN.OUT, GN.LOSS, GN.rO, GN.rL);

  /* ---- nodes ---------------------------------------------------------- */
  const inC = GN.IN.map(function (p, j) {
    const c = node(p, GN.rI, "act");
    txt(p.x, p.y + 4, "x[" + j + "]", "nname");
    txt(p.x, p.y + GN.rI + 13, f(FWD.x[j], 1), "nval");
    return c;
  });
  const hidC = [], hidDa = [], hidDz = [], mBadge = [];
  GN.HID.forEach(function (p, i) {
    const dead = FWD.relu_mask[i] === 0;
    const c = node(p, GN.rH, dead ? "dead" : "act");
    hidC.push(c);
    txt(p.x, p.y - 3, "a1[" + i + "]", "nname");
    txt(p.x, p.y + 11, f(FWD.a1[i], 2), "nval");
    txt(p.x - 4, p.y - GN.rH - 5, "z1 " + f(FWD.z1[i], 2), "cap", "end");
    hidDa.push(txt(p.x, p.y + GN.rH + 13, "dL/da1 " + fS(BWD.dL_da1[i], 3), "gval"));
    hidDz.push(txt(p.x, p.y + GN.rH + 25, "dL/dz1 " + fS(BWD.dL_dz1[i], 3), "gval"));
    /* the ReLU mask, as a badge you can point at — it is a saved tensor.
       It sits just above the unit, beside its pre-activation and clear of
       both the W1 and the W2 wire labels. */
    const bx = p.x + 6, by = p.y - GN.rH - 18;
    const r = SV("rect", { x: bx, y: by, width: 36, height: 18, rx: 5,
      fill: "var(--surface-2)",
      stroke: dead ? "var(--critical)" : "var(--activation)" });
    gText.appendChild(r);
    const t = SV("text", { x: bx + 18, y: by + 13, "text-anchor": "middle",
                           class: "mlab" + (dead ? " off" : "") });
    t.textContent = "m " + f(FWD.relu_mask[i], 0); gText.appendChild(t);
    mBadge.push(SV("rect", { class: "halo", x: bx - 4, y: by - 4, width: 44,
                             height: 26, rx: 8 }));
  });
  mBadge.forEach(function (r) { gHalo.appendChild(r); });

  const outC  = node(GN.OUT, GN.rO, "act");
  txt(GN.OUT.x, GN.OUT.y - 3, "ŷ = z2", "nname");
  txt(GN.OUT.x, GN.OUT.y + 11, f(FWD.yhat, 2), "nval");
  const outDy = txt(GN.OUT.x, GN.OUT.y + GN.rO + 13, "dL/dŷ " + fS(BWD.dL_dyhat, 3), "gval");
  const outDz = txt(GN.OUT.x, GN.OUT.y + GN.rO + 25, "dL/dz2 " + fS(BWD.dL_dz2, 3), "gval");
  const outDb = txt(GN.OUT.x, GN.OUT.y + GN.rO + 37, "dL/db2 " + fS(BWD.dL_db2[0], 3), "gval");

  const lossC = node(GN.LOSS, GN.rL, "");
  txt(GN.LOSS.x, GN.LOSS.y + 4, "L", "nname");
  txt(GN.LOSS.x, GN.LOSS.y + GN.rL + 13, f(FWD.loss, 3), "cap");
  txt(GN.LOSS.x, GN.LOSS.y - GN.rL - 8, "y " + f(FWD.y, 1), "cap");

  /* ---- W2 wire labels: the weight, and its gradient once it exists ----- */
  const w2g = w2e.map(function (e, i) {
    const lx = e.p1.x + (e.p2.x - e.p1.x) * 0.5;
    const ly = e.p1.y + (e.p2.y - e.p1.y) * 0.5;
    txt(lx, ly - 6, "w " + f(T.init.W2[0][i], 2), "wlab");
    return txt(lx, ly + 7, "∇ " + fS(BWD.dL_dW2[0][i], 2), "gval");
  });
  /* Six W1 wires converge on three nodes, so only the step that actually
     produces dL/dW1 labels them, and then only with the gradient — the two
     input columns are staggered along the wire so the labels do not touch. */
  const w1g = [];
  for (let i = 0; i < NHID; i++) {
    w1g.push([]);
    for (let j = 0; j < NINP; j++) {
      const e = w1e[i][j];
      const t = j === 0 ? 0.28 : 0.72;
      const px = e.p1.x + (e.p2.x - e.p1.x) * t, py = e.p1.y + (e.p2.y - e.p1.y) * t;
      w1g[i].push(o.w1labels
        ? txt(px, py - 4, "∇ " + fS(BWD.dL_dW1[i][j], 2), "gval") : null);
    }
  }

  /* ---- read halos: one group per tensor the backward pass can read ----- */
  const HALOS = {
    x:         inC.map(function (c, j) { return halo(GN.IN[j], GN.rI + 6); }),
    a1:        hidC.map(function (c, i) { return halo(GN.HID[i], GN.rH + 6); }),
    relu_mask: mBadge,
    W2:        w2e.map(function (e) {
                 const p = SV("path", { class: "halo w", d: e.flow.getAttribute("d"),
                                        "stroke-width": 7 });
                 gHalo.appendChild(p); return p;
               })
  };

  /* ---- captions ------------------------------------------------------- */
  txt(GN.W / 2, 16, "gradient travels ← right to left", "cap");
  const focusT = txt(GN.W / 2, GN.H - 6, o.focus || "", "focus");

  root.appendChild(gBase); root.appendChild(gFlow);
  root.appendChild(gNode); root.appendChild(gHalo); root.appendChild(gText);

  /* ---- how far the gradient has already travelled --------------------- */
  if (cur >= STEP_IX.dL_dyhat) le.flow.classList.add("trav");
  if (cur >= STEP_IX.dL_da1) w2e.forEach(function (e) { e.flow.classList.add("trav"); });
  if (cur >= STEP_IX.dL_dW1) {
    w1e.forEach(function (r) { r.forEach(function (e) { e.flow.classList.add("trav"); }); });
  }

  /* ---- which gradient values are known by now ------------------------- */
  outDy.classList.toggle("on", !!seen.dL_dyhat);
  outDz.classList.toggle("on", !!seen.dL_dz2);
  outDb.classList.toggle("on", !!seen.dL_db2);
  w2g.forEach(function (t) { t.classList.toggle("on", !!seen.dL_dW2); });
  hidDa.forEach(function (t) { t.classList.toggle("on", !!seen.dL_da1); });
  hidDz.forEach(function (t) { t.classList.toggle("on", !!seen.dL_dz1); });
  w1g.forEach(function (r) {
    r.forEach(function (t) { if (t) t.classList.toggle("on", !!seen.dL_dW1); });
  });

  /* ---- what is moving right now --------------------------------------- */
  const litAlive = function () {
    hidC.forEach(function (c, k) { if (FWD.relu_mask[k]) c.classList.add("lit"); });
  };
  const ACT = {
    dL_dyhat: function () { le.flow.classList.add("on"); lossC.classList.add("lit"); outC.classList.add("lit"); },
    dL_dz2:   function () { outC.classList.add("lit"); },
    dL_dW2:   function () {
      outC.classList.add("lit");
      w2e.forEach(function (e, k) {
        if (BWD.dL_dW2[0][k] === 0) e.flow.classList.add("zero");
        e.flow.classList.add("on");
      });
    },
    dL_db2:   function () { outC.classList.add("lit"); },
    dL_da1:   function () {
      outC.classList.add("lit");
      w2e.forEach(function (e) { e.flow.classList.add("on"); });
      hidC.forEach(function (c) { c.classList.add("lit"); });
    },
    dL_dz1:   litAlive,
    dL_dW1:   function () {
      litAlive();
      w1e.forEach(function (r, k) {
        r.forEach(function (e) {
          if (BWD.dL_dz1[k] === 0) e.flow.classList.add("zero");
          e.flow.classList.add("on");
        });
      });
    },
    dL_db1:   litAlive
  };
  if (id && ACT[id]) ACT[id]();

  /* ---- API ------------------------------------------------------------ */
  const api = {
    el: root,
    /** Pulse the tensors this step reads. Gated on a fragment so the read
        happens visibly at the moment the local derivative is evaluated. */
    setReading: function (on) {
      Object.keys(HALOS).forEach(function (k) {
        const hot = !!on && reads.indexOf(k) >= 0;
        HALOS[k].forEach(function (e) { e.classList.toggle("rd", hot); });
      });
    },
    /** Light the first n links of the forward path W1[i][j] → … → L.
        Used by the chain-rule slides, before the backward walk begins. */
    setPath: function (n, i, j) {
      w1e.forEach(function (r) { r.forEach(function (e) { e.fwd.classList.remove("on"); }); });
      w2e.forEach(function (e) { e.fwd.classList.remove("on"); });
      le.fwd.classList.remove("on");
      hidC.forEach(function (c) { c.classList.remove("lit"); });
      outC.classList.remove("lit"); lossC.classList.remove("lit");
      if (n >= 1) w1e[i][j].fwd.classList.add("on");
      if (n >= 2) hidC[i].classList.add("lit");
      if (n >= 3) w2e[i].fwd.classList.add("on");
      if (n >= 4) outC.classList.add("lit");
      if (n >= 5) { le.fwd.classList.add("on"); lossC.classList.add("lit"); }
    },
    setFocus: function (s) { focusT.textContent = s; }
  };
  api.setReading(true);
  return api;
}

/* ======================================================================= */
/*  THE CHAIN RULE — derived before anything is walked                     */
/* ======================================================================= */

/* ------------------------------------------- C1. L depends on W1 how? */
S({
  chapter: "Chain rule · the path",
  plain: "L depends on W1[0][0] only through a path",
  notes: "Do not assume the room knows the chain rule applies here — show " +
    "that it has to. Ask the question literally: if I increase W1[0][0], how " +
    "does the loss change? The honest answer is that the loss has no idea " +
    "W1[0][0] exists. L is a function of ŷ. ŷ is a function of z2. z2 is a " +
    "function of a1. a1 is a function of z1. Only z1 has ever seen W1[0][0]. " +
    "So there is exactly one route from that parameter to the loss, five " +
    "links long, and every link is a function we already wrote down during " +
    "the forward pass. Advance the fragments one at a time and let the path " +

      ["z1[0]", "a1[0]", "a1 = relu(z1)"],

              ])
            ]), "f-left");
          }))
        ]),
        d("stack", [ctx.gn.el, frag(NN.callout("key", "One path, five links",
          "There is no second route. <span class='mono v-weight'>W1[0][0]</span> " +

    ];
  },

/* ------------------------------------------- C2. why derivatives multiply */
S({
  chapter: "Chain rule · why it is a product",
  plain: "Why the derivatives along the path multiply",
  notes: "This is the derivation people never get shown. Nudge W1[0][0] by a " +
    "tiny ε and follow the nudge forward, link by link, using nothing but the " +
    "forward equations. Each link multiplies the nudge by its own local " +
    "sensitivity. By the time the disturbance reaches the loss it has been " +
    "multiplied by all five, so the ratio ΔL / ε is the product of the five " +
    "local derivatives — and that ratio, in the limit, IS dL/dW1[0][0]. The " +
    "punchline is on the last line: the cascade lands on exactly the number " +
    "the trace's finite-difference check reports for the same parameter, " +
    "which is a completely independent calculation.",
  build: function () {
    const EPS = 1e-3;
    const nz1 = FWD.x[0] * EPS;
    const na1 = nz1 * FWD.relu_mask[0];
    const nz2 = T.init.W2[0][0] * na1;
    const nyh = D_ID * nz2;
    const nL  = BWD.dL_dyhat * nyh;
    const ratio = nL / EPS;
    const num = T.gradcheck.numerical[IX_W100];
    return [
      kicker("Chain rule · <b>the derivation</b>"),
      title("Push a nudge through the path and watch it get rescaled", true),
      d("cols wide-l", [

/* --------------------------------------------- C3. the rule, stated */
S({
  chapter: "Chain rule · stated",
  plain: "Upstream × local, at every node",
  notes: "Now name the two halves, because every one of the next " + NSTEP +
    " slides is built out of them. The upstream gradient is what arrived " +
    "from the right — the derivative of the loss with respect to this node's " +
    "output. The local derivative is the derivative of ONE operation with " +
    "respect to one of its inputs, and it comes from that operation's " +
    "defining equation and nothing else. Multiply them and you have the " +
    "gradient to hand to the node on your left. That is the whole algorithm; " +
    "everything after this is bookkeeping.",
  build: function () {
    return [
      kicker("Chain rule · <b>the shape of every step</b>"),
      title("Every step is the same two factors"),
      frag(eqline("dL/d<span class='v-weight'>W</span>", [
        { sym: "dL/dz", role: "upstream", rule: "arrived from the right",
          cls: "gradient" },

          cls: "activation", op: "·" }
      ]), "f-pop"),
      gap(6),
      frag(d("cols", [
        panel("g", [ph("the upstream gradient"),

          h("say", "How much <span class='mono'>z</span> moves when " +

  }
});

/* ------------------------------- C5. local derivative: a linear layer */

    "the derivative is a1[j]. a1[j] appears in exactly one term, multiplied " +
    "by W2[0][j], so that derivative is W2[0][j]. b2 appears once with a " +
    "coefficient of one. Make the contrast explicit: the WEIGHT gradient " +
    "needs the activation, the ACTIVATION gradient needs the weight. That " +
    "asymmetry is the reason the forward pass cannot free its outputs.",
  build: function () {
    const terms = T.init.W2[0].map(function (w, j) {
      return "<span class='v-weight'>W2[0][" + j + "]</span>·" +

            "<span class='v-activation'>a1[j]</span></span>"),

      frag(NN.callout("key", "The asymmetry to remember",

/* ------------------------------- C6. local derivative: ReLU */
S({
  chapter: "Chain rule · local derivative 3 of 4",
  plain: "The ReLU gate: da1/dz1 = 1 if z1 > 0 else 0",
  notes: "ReLU is defined piecewise, so differentiate it piecewise. On the " +
    "positive side it is the identity, whose slope is one. On the negative " +
    "side it is the constant zero, whose slope is zero. So the derivative is " +
    "a gate: it either passes the gradient through untouched or it deletes " +
    "it. Crucially, which side you are on depends on the sign of z1 — a " +
    "forward-pass quantity — so the backward pass has to be told. That is " +
    "the whole reason the mask is a saved tensor. Our z1 was " +
    vecTxt(FWD.z1, 2) + ", so the mask is " + vecTxt(FWD.relu_mask, 0) + ".",
  build: function (ctx) {
    const pts = [];
    for (let v = -2; v <= 2.001; v += 0.05) pts.push([v, Math.max(0, v)]);
    const dpts = [];
    for (let v = -2; v <= -0.001; v += 0.05) dpts.push([v, 0]);
    const dpts2 = [];
    for (let v = 0.001; v <= 2.001; v += 0.05) dpts2.push([v, 1]);
    return [
      kicker("Chain rule · <b>local derivative 3</b> · the nonlinearity"),
      title("<span class='mono'>a1 = relu(z1) = max(0, z1)</span>", true),
      d("cols", [
        d("stack", [
          derivPanel("it is defined piecewise, so differentiate it piecewise", [
            frag(drow("relu(z) &nbsp;=&nbsp; z &nbsp;&nbsp;&nbsp;&nbsp;when z &gt; 0",
                      "the identity — slope 1"), "f-left"),
            frag(drow("relu(z) &nbsp;=&nbsp; 0 &nbsp;&nbsp;&nbsp;&nbsp;when z &lt; 0",
                      "a constant — slope 0"), "f-left"),
            frag(drow("d relu/dz &nbsp;=&nbsp; <span class='v-activation'>1[z &gt; 0]</span>",
                      "one number per unit, 1 or 0", true), "f-pop")
          ], "a"),
          frag(d("panel a tight", [ph("our z1, and the mask it produced"),
            d("rowflex", [
              tn({ name: "z1", shape: [NHID], values: FWD.z1, cls: "activation", digits: 2 }),
              h("ar", "→"),
              tn({ name: "relu_mask", shape: [NHID], values: FWD.relu_mask,
                   cls: "activation", digits: 0, note: "saved for backward" })
            ])]), "f-left")
        ]),
        d("stack", [
          frag(d("panel a", [ph("relu, and its slope"),
            NN.chart.line({
              series: [
                { name: "relu(z)", color: "var(--activation)", points: pts, dots: false },
                { name: "slope, z < 0", color: "var(--critical)", points: dpts, dots: false },
                { name: "slope, z > 0", color: "var(--gradient)", points: dpts2, dots: false }
              ], width: 480, height: 210, xlabel: "z", ylabel: "" }),
            chartKey([{ name: "relu(z) = max(0, z)", color: "var(--activation)" },
                      { name: "derivative = 1 where z > 0", color: "var(--gradient)" },
                      { name: "derivative = 0 where z < 0", color: "var(--critical)" }])]), "f-right"),
          frag(NN.callout("mem", "This is why a mask has to be saved",
            "The derivative depends on the <em>sign of z1</em>, which is a " +
            "forward-pass fact. Backward cannot recover it from the gradient " +
            "flowing in. So the forward pass writes down " +
            "<span class='mono v-activation'>relu_mask</span> = " +
            vecTxt(FWD.relu_mask, 0) + " and keeps it. One bit per unit of real " +
            "information — the cheapest thing backward reads, and the one most " +
            "worth compressing at scale."), "f-right")
        ])
      ])
    ];
  }
});

/* ------------------------------- C7. the full product, one parameter */

/* ------------------------------- C8. one zero kills the path */

    "blame. We come back to what that does to training in two slides.",
  build: function (ctx) {

/* ------------------------------- C9. why not 13 chains */
S({
  chapter: "Chain rule · the shared prefix",
  plain: "Why backprop is one pass, not 13 chains",
  notes: "The last framing slide before the walk. You could evaluate the " +
    "five-factor product separately for each of the " + NPARAM +
    " parameters, and you would get the right answer — but look at the " +
    "products: they share their leading factors. Every parameter in the " +
    "first layer starts with the same dL/dŷ, dŷ/dz2 prefix, and every " +
    "parameter feeding hidden unit i shares the prefix all the way down to " +
    "dL/dz1[i]. Backpropagation computes each shared prefix ONCE, left to " +
    "right in the products but right to left in the network, and reuses it. " +
    "That is the entire reason one backward pass costs about what one " +
    "forward pass costs instead of one forward pass per parameter.",
  build: function () {
    const rows = [[0, 0], [0, 1], [1, 0], [DEADU, 0]].map(function (p) {
      const FCS = chainFactors(p[0], p[1]);
      return el("tr", {}, [
        el("td", { class: "mono" }, "W1[" + p[0] + "][" + p[1] + "]"),
        el("td", { class: "n v-gradient" }, f(FCS[0].num, 3)),
        el("td", { class: "n" }, f(FCS[1].num, 0)),
        el("td", { class: "n v-weight" }, f(FCS[2].num, 2)),
        el("td", { class: "n v-activation" }, f(FCS[3].num, 0)),
        el("td", { class: "n v-activation" }, f(FCS[4].num, 1)),
        el("td", { class: "n v-gradient" }, f(chainProduct(p[0], p[1]), 4))
      ]);
    });
    return [
      kicker("Chain rule · <b>why it is cheap</b>"),
      title("The products share their front halves"),
      frag(d("panel g", [ph("the five factors, for four different parameters"),
        el("table", { class: "data" }, [
          el("thead", {}, el("tr", {}, [
            el("th", { style: { textAlign: "left" } }, "parameter"),
            el("th", {}, "dL/dŷ"), el("th", {}, "dŷ/dz2"),
            el("th", {}, "dz2/da1"), el("th", {}, "da1/dz1"),
            el("th", {}, "dz1/dW1"), el("th", {}, "product")])),
          el("tbody", {}, rows)]),
        h("small muted", "The first two columns are identical for every " +
          "parameter in the model. The first four are identical for every " +
          "parameter feeding the same hidden unit. Only the last column " +
          "changes within a row of W1.")]), "f-fade"),
      frag(d("cols", [
        NN.tiles([
          { k: "if you evaluated each chain separately", v: String(NPARAM),
            s: "independent products", cls: "gradient" },
          { k: "shared prefixes computed once", v: String(NSTEP),
            s: "the " + NSTEP + " steps of the backward pass", cls: "gradient" }
        ]),
        NN.callout("key", "That is what backpropagation IS",
          "Backprop is not a different rule from the chain rule. It is the " +
          "chain rule evaluated with the common subexpressions factored out — " +
          "dynamic programming over the computation graph. It walks right to " +
          "left because that is the direction in which the prefixes are " +
          "shared, and it stores one intermediate gradient per node instead " +
          "of one product per parameter.")
      ]), "f-fade")
    ];
  }
});

/* -------------------------------------------------- the plan for the walk */
S({
  chapter: "Backward pass", plain: "The plan: " + NSTEP + " steps, right to left",
  notes: "Before we walk it, the shape of the thing. Backpropagation is the " +
    "chain rule applied " + NSTEP + " times, from the loss backwards to the " +
    "first weight matrix. Each step takes the gradient that arrived from its " +
    "right and produces the gradient to pass further left, plus — if it owns " +
    "parameters — the gradient for those. Keep an eye on the READS line on " +
    "each of the next " + NSTEP + " slides; that is the whole argument of this deck.",
  build: function (ctx) {
    const chain = STEPS.map(function (s, i) {
      return frag(d("pill" + (s.reads.some(isSaved) ? " hot" : ""),
        (i + 1) + ". " + s.label + (s.reads.length ? "  ← " + s.reads.join(", ") : "")), "f-pop");
    });
    ctx.gn = gradNet({ focus: "eight steps, from L back to W1", height: 300 });
    ctx.gn.setPath(0, 0, 0);
    return [
      kicker("Backward pass"),
      title("The chain rule, " + NSTEP + " times, in reverse order"),
      d("cols wide-r", [
        d("stack", [
          frag(say("Each step multiplies the gradient handed to it by one " +
            "local derivative and hands the result further left. Steps that " +
            "own parameters also emit a parameter gradient and stop."), "f-left"),
          frag(NN.callout("key", "Read the arrows on the left of each step",
            "Some steps need nothing but the gradient flowing in. Others must " +
            "re-read a tensor that the <em>forward</em> pass produced. Those are " +
            "the reason activation memory exists, and the reason it scales with " +
            "batch size and sequence length."), "f-left")
        ]),
        ctx.gn.el
      ]),
      d("rowflex", chain)
    ];
  }
});

/* ============================= the walk: one slide per chain-rule step ===
   Each of the NSTEP slides does the same four things: the symbolic rule
   typeset as a labelled product, the local derivative DERIVED from the
   operation's defining equation, the substitution with real numbers and the
   result, and — beside all of it — the live network diagram with the node
   or wire under inspection highlighted and the saved tensor pulsing. */

/* Presenter framing per step, keyed by the id in the trace. The factual
   note always comes from T.backward.steps[i].note. */
const STEP_SAY = {
  dL_dyhat: "Where every gradient in the network comes from. The derivative of " +
    "a square is two times the thing, and the thing is the signed error. Note " +
    "it is bigger than the error itself — the 2 is real and it propagates.",
  dL_dz2: "A free step, and worth saying so. The output has no activation " +
    "function, so the gradient passes through untouched. In a network with a " +
    "sigmoid or softmax head this is where that derivative would appear.",
  dL_dW2: "The first weight gradient, and the first time backward has to look " +
    "backwards in time. Say the sentence explicitly: to know how much a weight " +
    "is to blame, you have to know what it was multiplied by.",
  dL_db2: "Biases are the easy case. A bias adds itself in with a coefficient " +
    "of one, so its derivative is one, so it simply receives whatever arrived. " +
    "No saved tensor needed — which is why bias gradients are never the " +
    "memory problem.",
  dL_da1: "The gradient crosses a layer boundary. This one reads the weights, " +
    "not an activation — and the weights are live parameters we are keeping " +
    "anyway. Contrast the two rules: input-gradient uses the weights, " +
    "weight-gradient uses the input.",
  dL_dz1: "The ReLU derivative is a gate: one where the unit was alive, zero " +
    "where it was clamped. That means backward must know which units were " +
    "alive, which means the mask had to be saved. And here is where the dead " +
    "unit's gradient becomes exactly zero.",
  dL_dW1: "The same rule as dL/dW2, one layer down, and the same dependency on " +
    "a saved tensor — this time the network input itself. Point at the third " +
    "row while you say it: two zeros, because the incoming gradient for that " +
    "unit was zero.",
  dL_db1: "The last step, and the cheapest. Every bias gradient in the network " +
    "is just the gradient of its own pre-activation. We now have all " +
    NPARAM + " numbers and the backward pass is finished."
};

/* The three tiers, per step: the symbolic product with each factor labelled,
   the local derivative read off its defining equation, and the substitution.
   `factors` is what gets typeset; `deriv` is the algebra behind the LOCAL
   factor; `focus` names the variable under inspection on the diagram. */
const STEP_EQ = {
  dL_dyhat: {
    factors: [{ sym: "2(ŷ − y)", role: "local · the only factor",
                rule: "from L = (ŷ − y)²", cls: "gradient" }],
    vals: [fS(BWD.dL_dyhat, 3)],
    deriv: [["L = (ŷ − y)² = ŷ² − 2yŷ + y²", "expand"],
            ["dL/dŷ = 2ŷ − 2y = 2(ŷ − y)", "differentiate; y is constant", true]],
    from: "L = (ŷ − y)²",
    focus: "dL/dŷ · at the output node"
  },
  dL_dz2: {
    factors: [{ sym: "dL/dŷ", role: "upstream", rule: "step 1", cls: "gradient" },
              { sym: "dŷ/dz2", role: "local", rule: "from ŷ = z2", cls: null, op: "·" }],
    vals: [fS(BWD.dL_dyhat, 3), f(D_ID, 0)],
    deriv: [["ŷ = z2", "the output layer has no activation function"],
            ["dŷ/dz2 = 1", "the derivative of the identity", true]],
    from: "ŷ = z2",
    focus: "dL/dz2 · at the output node"
  },
  dL_dW2: {
    factors: [{ sym: "dL/dz2", role: "upstream", rule: "step 2", cls: "gradient" },
              { sym: "a1ᵀ", role: "local · saved activation",
                rule: "from z2 = W2·a1 + b2", cls: "activation", op: "⊗" }],
    vals: [fS(BWD.dL_dz2, 3), vecTxt(FWD.a1, 2)],
    deriv: [["z2 = W2[0][0]·a1[0] + W2[0][1]·a1[1] + W2[0][2]·a1[2] + b2", "the definition"],
            ["∂z2/∂W2[0][j] = a1[j]", "W2[0][j] appears once, multiplied by a1[j]", true]],
    from: "z2 = W2·a1 + b2",
    focus: "dL/dW2 · the three output wires"
  },
  dL_db2: {
    factors: [{ sym: "dL/dz2", role: "upstream", rule: "step 2", cls: "gradient" },
              { sym: "dz2/db2", role: "local", rule: "from z2 = W2·a1 + b2",
                cls: null, op: "·" }],
    vals: [fS(BWD.dL_dz2, 3), "1"],
    deriv: [["z2 = … + b2", "b2 is added in once"],
            ["∂z2/∂b2 = 1", "coefficient one, so the gradient passes through", true]],
    from: "z2 = W2·a1 + b2",
    focus: "dL/db2 · at the output node"
  },
  dL_da1: {
    factors: [{ sym: "W2ᵀ", role: "local · live parameter",
                rule: "from z2 = W2·a1 + b2", cls: "weight" },
              { sym: "dL/dz2", role: "upstream", rule: "step 2", cls: "gradient", op: "·" }],
    vals: [vecTxt(T.init.W2[0], 2), fS(BWD.dL_dz2, 3)],
    deriv: [["z2 = W2[0][0]·a1[0] + W2[0][1]·a1[1] + W2[0][2]·a1[2] + b2", "the same definition"],
            ["∂z2/∂a1[j] = W2[0][j]", "a1[j] appears once, multiplied by W2[0][j]", true]],
    from: "z2 = W2·a1 + b2",
    focus: "dL/da1 · crossing the layer boundary"
  },
  dL_dz1: {
    factors: [{ sym: "dL/da1", role: "upstream", rule: "step 5", cls: "gradient" },
              { sym: "1[z1 > 0]", role: "local · saved mask",
                rule: "from a1 = relu(z1)", cls: "activation", op: "⊙" }],
    vals: [vecTxt(BWD.dL_da1, 3, true), vecTxt(FWD.relu_mask, 0)],
    deriv: [["relu(z) = z when z > 0, else 0", "the definition, piecewise"],
            ["d relu/dz = 1[z > 0]", "slope 1 on one side, slope 0 on the other", true]],
    from: "a1 = relu(z1)",
    focus: "dL/dz1 · through the ReLU gate"
  },
  dL_dW1: {
    factors: [{ sym: "dL/dz1", role: "upstream", rule: "step 6", cls: "gradient" },
              { sym: "xᵀ", role: "local · saved input", rule: "from z1 = W1·x + b1",
                cls: "activation", op: "⊗" }],
    vals: [vecTxt(BWD.dL_dz1, 3, true), vecTxt(FWD.x, 1)],
    deriv: [["z1[i] = W1[i][0]·x[0] + W1[i][1]·x[1] + b1[i]", "the definition"],
            ["∂z1[i]/∂W1[i][j] = x[j]", "same algebra as W2, one layer down", true]],
    from: "z1 = W1·x + b1",
    focus: "dL/dW1 · the six input wires"
  },
  dL_db1: {
    factors: [{ sym: "dL/dz1", role: "upstream", rule: "step 6", cls: "gradient" },
              { sym: "dz1/db1", role: "local", rule: "from z1 = W1·x + b1",
                cls: null, op: "·" }],
    vals: [vecTxt(BWD.dL_dz1, 3, true), "1"],
    deriv: [["z1[i] = … + b1[i]", "b1[i] is added in once"],
            ["∂z1[i]/∂b1[i] = 1", "coefficient one, again", true]],
    from: "z1 = W1·x + b1",
    focus: "dL/db1 · at the hidden units"
  }
};

STEPS.forEach(function (st, si) {
  const arr = Array.isArray(st.value);
  const flat = arr ? [].concat.apply([], st.value) : [st.value];
  const readsSaved = st.reads.some(isSaved);
  const EQ = STEP_EQ[st.id];
  S({
    chapter: "Backward · step " + (si + 1) + " of " + NSTEP,
    plain: st.label + " = " + (arr
      ? "[" + flat.map(function (v) { return f(v, 2); }).join(", ") + "]"
      : fS(st.value, 3)),
    notes: st.note + "  ——  " + STEP_SAY[st.id] + (readsSaved
      ? "  ——  Stop here. This step cannot be computed from the incoming " +
        "gradient alone: it re-reads " + st.reads.join(" and ") + ", a tensor " +
        "the forward pass produced and the framework has been holding in " +
        "memory ever since."
      : "") + "  ——  The three tiers on the left are the same every time: the " +
      "symbolic rule, the local derivative read off " + EQ.from + ", then the " +
      "numbers. The diagram on the right shows how far the gradient has " +
      "travelled and pulses whatever this step reads.",
    build: function (ctx) {
      ctx.gn = gradNet({ step: si, focus: EQ.focus,
                         w1labels: st.id === "dL_dW1" });
      ctx.gn.setReading(false);

      const valNode = arr
        ? tn({ name: st.label, values: st.value, cls: "gradient", digits: 4, signed: true })
        : h("midnum v-gradient", fS(st.value, 4));

      const readNodes = st.reads.length
        ? st.reads.map(function (r) {
            const src = READ_SRC[r];
            return d("readbox" + (isSaved(r) ? "" : " wgt"), [
              h("rt", isSaved(r)
                ? "READS SAVED ACTIVATION · " + r
                : "READS LIVE PARAMETER · " + r),
              d("rowflex", [
                tn({ name: r, shape: src.shape, cls: src.cls, digits: 2,
                     values: src.shape.length === 1 ? [src.values] : src.values }),
                h("small muted", src.why)
              ])
            ]);
          })
        : [d("readbox none", [h("rt", "READS NOTHING SAVED"),
            h("small muted", "Only the gradient flowing in from the right.")])];

      return [
        kicker("Backward · step <b>" + (si + 1) + " / " + NSTEP + "</b> · " +
               "<span class='mono'>" + st.id + "</span>"),
        title("<span class='mono v-gradient'>" + st.label + "</span>" +
              " &nbsp;<span style='font-size:22px;color:var(--ink-muted)'>" +
              "— " + EQ.focus.split(" · ")[1] + "</span>", true),
        d("cols wide-l", [
          d("stack", [
            /* TIER 1 — the symbolic rule, factor by factor */
            frag(eqline(st.label, EQ.factors), "f-left"),
            /* TIER 2 — where the local derivative comes from */
            frag(derivPanel("the local derivative, read off " + EQ.from,
              EQ.deriv.map(function (r) { return drow(r[0], r[1], r[2]); })), "f-left"),
            /* TIER 3 — the same product with the real numbers in it */
            frag(eqline("&nbsp;", EQ.factors.map(function (fc, k) {
              return { sym: EQ.vals[k], role: fc.role, cls: fc.cls, op: fc.op };
            }), true), "f-left"),
            frag(d("panel g tight", [ph("result · " + st.label), valNode,
              h("small muted", "<span class='mono'>T.backward.steps[" + si +
                "].substitution</span> &nbsp;=&nbsp; <span class='mono'>" +
                st.substitution + "</span>")]), "f-pop")
          ]),
          d("stack", [ctx.gn.el].concat(readNodes.map(function (rn) {
            return frag(rn, "f-right");
          })))
        ]),
        frag(h("small muted", "<span class='mono'>T.backward.steps[" + si +
          "].formula</span> — " + st.formula + " &nbsp;·&nbsp; " + st.note), "f-fade")
      ];
    },
    /* The read pulses the moment the local derivative is evaluated. */
    render: function (n, ctx) { if (ctx.gn) ctx.gn.setReading(n >= 2); }
  });
});

/* --------------------------------------------- the finished gradient board */
S({
  chapter: "Backward · the result",
  plain: "All " + NPARAM + " gradients, produced by one pass",
  notes: "The walk is over. " + NSTEP + " steps produced " + NPARAM +
    " numbers, one per parameter, plus four transient node gradients that " +
    "have already been freed. Read the board left to right and notice the " +
    "structure: dL/db1 and dL/db2 are literally copies of the node gradients " +
    "above them, and each weight gradient is an outer product of a node " +
    "gradient with a saved input. Nothing here was estimated — every number " +
    "is the exact analytic derivative, and the finite-difference check three " +
    "slides on agrees to " + T.gradcheck.max_abs_error.toExponential(2) + ".",
  build: function () {
    const nodeGrads = [
      ["dL/dŷ", fS(BWD.dL_dyhat, 3)], ["dL/dz2", fS(BWD.dL_dz2, 3)],
      ["dL/da1", vecTxt(BWD.dL_da1, 3, true)], ["dL/dz1", vecTxt(BWD.dL_dz1, 3, true)]
    ];
    return [
      kicker("Backward · <b>the finished board</b>"),
      title("One pass. <span class='v-gradient'>" + NPARAM + "</span> gradients."),
      frag(d("rowflex top", [
        tn({ name: "dL/dW1", shape: [3, 2], values: BWD.dL_dW1, cls: "gradient",
             digits: 3, signed: true, note: "6" }),
        tn({ name: "dL/db1", shape: [3], values: BWD.dL_db1, cls: "gradient",
             digits: 3, signed: true, note: "3" }),
        tn({ name: "dL/dW2", shape: [1, 3], values: BWD.dL_dW2, cls: "gradient",
             digits: 3, signed: true, note: "3" }),
        tn({ name: "dL/db2", shape: [1], values: BWD.dL_db2, cls: "gradient",
             digits: 3, signed: true, note: "1" })
      ]), "f-pop"),
      frag(d("panel g tight", [ph("the transient node gradients — already freed"),
        d("rowflex", nodeGrads.map(function (g) {
          return h("pill", "<span class='mono'>" + g[0] + "</span> = " + g[1]);
        }))]), "f-fade"),
      frag(d("cols", [
        NN.tiles([
          { k: "chain-rule steps", v: String(NSTEP), s: "T.backward.steps", cls: "gradient" },
          { k: "parameter gradients", v: String(NPARAM), s: "one per parameter", cls: "gradient" },
          { k: "exactly zero", v: String(T.gradcheck.analytic.filter(function (g) { return g === 0; }).length),
            s: "all from the dead unit", cls: "gradient" }
        ]),
        NN.callout("key", "Two patterns, and that is all there is",
          "Every <b>bias</b> gradient is a copy of the node gradient above it. " +
          "Every <b>weight</b> gradient is a node gradient times the layer's " +
          "saved input. Those two patterns generate all " + NPARAM +
          " numbers here, and they generate every gradient in a 70B " +
          "transformer too — there is no third rule waiting further up.")
      ]), "f-fade")
    ];
  }
});

/* ---------------------------------------- why a weight gradient is an outer product */
S({
  chapter: "Backward · outer product",
  plain: "dL/dW = δ ⊗ inputᵀ — cell by cell",
  notes: "Slow down on the shape. dL/dz1 has one number per output unit. x " +
    "has one number per input. The weight matrix has one entry per " +
    "(output, input) PAIR, so its gradient must too — and the only way to " +
    "build a matrix out of two vectors like that is the outer product: entry " +
    "[i][j] is delta[i] times input[j]. Walk two or three cells out loud " +
    "from the grid. Then make the consequence explicit: every cell of that " +
    "grid contains a factor of the input, so there is no way to fill the " +
    "grid in without the input still being in memory.",
  build: function () {
    const dz = BWD.dL_dz1, xx = FWD.x;
    /* one revealed row per hidden unit, so the grid on screen has exactly
       the shape of W1 — the dead unit's row lands last, all zeros */
    const gridRows = [];
    for (let i = 0; i < NHID; i++) {
      const row = [];
      for (let j = 0; j < NINP; j++) {
        row.push(d("panel " + (dz[i] === 0 ? "crit" : "g") + " tight", [
          h("small muted", "<span class='mono'>dL/dW1[" + i + "][" + j + "]</span>"),
          h("dmath", "<span class='mono' style='font-size:16px'>" +
            "<span class='v-gradient'>" + fS(dz[i], 3) + "</span> × " +
            "<span class='v-activation'>" + f(xx[j], 1) + "</span></span>"),
          h("midnum v-gradient", fS(BWD.dL_dW1[i][j], 3))
        ]));
      }
      gridRows.push(frag(d("cols", row), "f-fade"));
    }
    return [
      kicker("Backward · <b>the shape of a weight gradient</b>"),
      title("A vector and a vector make a matrix", true),
      frag(eqline("dL/dW1", [
        { sym: "dL/dz1", role: "upstream · one per OUTPUT unit",
          rule: vecTxt(BWD.dL_dz1, 3, true), cls: "gradient" },
        { sym: "xᵀ", role: "local · one per INPUT", rule: vecTxt(FWD.x, 1),
          cls: "activation", op: "⊗" }
      ]), "f-pop"),
      d("stack", gridRows),
      frag(NN.callout("mem", "Every cell contains a copy of the input",
        "W1 has one entry per (output, input) pair, so its gradient does too, " +
        "and entry <span class='mono'>[i][j]</span> is " +
        "<span class='mono v-gradient'>δ[i]</span> × " +
        "<span class='mono v-activation'>x[j]</span>. There is no arrangement " +
        "of the incoming gradient alone that produces this grid. The layer's " +
        "input is a required operand — which is exactly why the forward pass " +
        "is not allowed to free it."), "f-fade")
    ];
  }
});

/* ------------------------------------------------- the thesis slide */
S({
  chapter: "Backward pass · the thesis", plain: "Backward reads forward. That is why activations are stored.",
  notes: "This is the single most important slide in the deck. Of the " + NSTEP +
    " backward steps, " + STEPS.filter(function (s) { return s.reads.some(isSaved); }).length +
    " re-read a tensor produced during the forward pass. A weight gradient is " +
    "always the incoming gradient times the saved input. So the framework " +
    "cannot free x, a1 or the ReLU mask when the forward pass ends — it has to " +
    "hold them until backward consumes them. That is activation memory, and " +
    "unlike weight memory it scales with batch size and sequence length.",
  build: function () {
    const rows = STEPS.map(function (s) {
      const saved = s.reads.some(isSaved);
      return el("tr", {}, [
        el("td", {}, s.label),
        el("td", { style: { textAlign: "left" }, html: s.reads.length
          ? s.reads.map(function (r) {
              return "<span class='mono " + (isSaved(r) ? "v-activation" : "v-weight") +
                     "'>" + r + "</span>";
            }).join(", ")
          : "<span class='muted'>—</span>" }),
        el("td", { style: { textAlign: "left" }, html: saved
          ? "<span class='v-activation'>saved from forward</span>"
          : (s.reads.length ? "<span class='v-weight'>live parameter</span>"
                            : "<span class='muted'>incoming gradient only</span>") })
      ]);
    });
    const nSaved = STEPS.filter(function (s) { return s.reads.some(isSaved); }).length;
    return [
      kicker("The thesis"),
      el("h2", { class: "stitle", html:
        "The backward pass <span class='v-activation'>re-reads</span> the forward pass." }),
      d("cols wide-l", [
        frag(d("panel a", [
          ph("what each of the " + NSTEP + " steps had to read"),
          el("table", { class: "data" }, [
            el("thead", {}, el("tr", {}, [
              el("th", {}, "step"), el("th", { style: { textAlign: "left" } }, "reads"),
              el("th", { style: { textAlign: "left" } }, "kind")])),
            el("tbody", {}, rows)
          ])
        ]), "f-left"),
        d("stack", [
          frag(NN.tiles([
            { k: "steps", v: String(NSTEP), s: "chain-rule links" },
            { k: "read a saved activation", v: String(nSaved),
              s: SAVED_KEYS.join(", "), cls: "activation" }
          ]), "f-right"),
          frag(NN.callout("mem", "This is the whole argument",
            "A weight gradient is <em>always</em> the incoming gradient times " +
            "the saved input: <span class='mono'>dL/dW = dL/dz ⊗ inputᵀ</span>. " +
            "So the input has to still be there. The forward pass cannot free " +
            "its outputs — it has to hand them to the backward pass, which may " +
            "not run for milliseconds."), "f-right"),
          frag(NN.callout("warn", "And it scales with the batch, not the model",
            "Weights are fixed by the architecture. Activations are " +
            "<span class='mono'>batch × sequence × hidden</span> per layer. " +
            "Double the batch and weight memory does not move — activation " +
            "memory doubles."), "f-right")
        ])
      ])
    ];
  }
});

/* ------------------------------- the dead unit, beat 1: the gradient arrives */
S({
  chapter: "Backward · the dead unit (1 of 2)",
  plain: "A real gradient DOES arrive at the dead unit",
  notes: "Two beats, and people usually miss the first one. Before the mask " +
    "is applied, unit " + DEADU + " receives dL/da1[" + DEADU + "] = " +
    f(BWD.dL_da1[DEADU], 4) + " — not zero, and in fact the LARGEST incoming " +
    "gradient of the three hidden units, because its outgoing weight " +
    "W2[0][" + DEADU + "] = " + f(T.init.W2[0][DEADU], 2) + " is the biggest " +
    "in the output layer. The loss genuinely wants that unit's activation to " +
    "change. The message was delivered. Hold that thought — the next slide " +
    "is what happens to it one multiply later.",
  build: function (ctx) {
    ctx.gn = gradNet({ step: STEP_IX.dL_da1,
      focus: "dL/da1[" + DEADU + "] = " + fS(BWD.dL_da1[DEADU], 3) + " — it arrived" });
    ctx.da = tn({ name: "dL/da1", shape: [NHID], values: BWD.dL_da1,
                  cls: "gradient", digits: 3, signed: true });
    /* "largest" is checked against the trace, not asserted from memory */
    const mags = BWD.dL_da1.map(Math.abs);
    const rank = mags.indexOf(Math.max.apply(null, mags)) === DEADU
      ? "the <b>largest</b> of the " + NHID + " in magnitude"
      : "a perfectly ordinary non-zero gradient";
    return [
      kicker("The dead unit · <b>beat 1</b> · the gradient arrives"),

        d("stack", [
          frag(eqline("dL/da1[" + DEADU + "]", [
            { sym: "W2[0][" + DEADU + "]", role: "local · a live weight",

            ", because <span class='mono v-weight'>W2[0][" + DEADU + "] = " +

            "output layer. Nothing about this step knows the unit is dead: " +

/* ----------------------------------------------- the dead unit's gradient */
S({
  chapter: "Backward · the dead unit (2 of 2)",
  plain: "…and one multiply later the mask annihilates it",
  notes: "Beat two. The gradient " + fS(BWD.dL_da1[DEADU], 3) + " that arrived " +
    "on the last slide is now multiplied by the saved mask entry, which is " +
    f(FWD.relu_mask[DEADU], 0) + ", and it is gone. Say the two beats out " +
    "loud as a pair: the gradient WAS delivered, and then it was annihilated " +
    "one multiply later. Unit " + DEADU + " had a pre-activation of " +
    f(T.forward.z1[DEADU], 2) + ", ReLU clamped it to zero, so the mask entry " +
    "is zero, so dL/dz1[" + DEADU + "] is zero, so the entire row of dL/dW1 " +
    "for that unit is zero — not small, exactly zero. It contributed nothing " +
    "to the prediction, so it takes none of the blame. And because SGD " +
    "multiplies the gradient by the learning rate, those weights will not move " +
    "this step. If the unit stays negative for every input, it never moves again.",
  build: function (ctx) {
    ctx.dW1 = tn({ name: "dL/dW1", shape: [3, 2], values: T.backward.dL_dW1,
                   cls: "gradient", digits: 3, signed: true });
    ctx.db1 = tn({ name: "dL/db1", shape: [3], values: T.backward.dL_db1,
                   cls: "gradient", digits: 3, signed: true });
    ctx.mk  = tn({ name: "relu_mask", shape: [3], values: T.forward.relu_mask,
                   cls: "activation", digits: 0 });
    return [
      kicker("The dead unit"),
      title("Row 2 of <span class='mono'>dL/dW1</span> is <span class='v-gradient'>[0, 0]</span>", true),
      d("cols wide-l", [
        frag(d("rowflex top", [ctx.dW1, ctx.db1, ctx.mk]), "f-fade"),
        d("stack", [
          frag(NN.formula({ rule: "dL/dz1[2] = dL/da1[2] × mask[2]",
            sub: fS(T.backward.dL_da1[2], 3) + " × " + f(T.forward.relu_mask[2], 0),
            result: f(T.backward.dL_dz1[2], 0), cls: "gradient" }), "f-right"),
          frag(NN.formula({ rule: "dL/dW1[2] = dL/dz1[2] ⊗ xᵀ",
            sub: f(T.backward.dL_dz1[2], 0) + " × [" +
                 T.forward.x.map(function (v) { return f(v, 1); }).join(", ") + "]",
            result: "[" + T.backward.dL_dW1[2].map(function (v) { return f(v, 0); }).join(", ") + "]",
            cls: "gradient" }), "f-right"),
          frag(h("deadflag", "Exactly zero — not merely small"), "f-pop")
        ])
      ]),
      frag(NN.callout("warn", "A dying ReLU",
        "The update is <span class='mono'>θ − lr × 0 = θ</span>: these three " +
        "weights do not move this step. If unit 3 is negative for every input " +
        "in the dataset, it receives zero gradient forever and is permanently " +
        "dead capacity — memory and FLOPs spent on a unit that can never learn. " +
        "This is why leaky ReLU, GELU and SiLU exist."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const on = n >= 1;
    ctx.dW1.highlight(on ? [[2, 0], [2, 1]] : null, on);
    ctx.db1.highlight(on ? [[2, 0]] : null, on);

});

/* --------------------------------------------- gradcheck: the method */
S({
  chapter: "Backward · verification",
  plain: "How you prove a hand-derived gradient is right",
  notes: "Everything in this run was differentiated by hand and then " +
    "implemented, and both are places to make a mistake. A wrong gradient " +
    "does not crash — it trains badly in a way that looks exactly like a bad " +
    "learning rate, which is why people lose weeks to it. So you check it " +
    "numerically: nudge one parameter by a tiny epsilon in each direction, " +
    "re-run the forward pass, and divide the change in loss by 2 epsilon. " +
    "That is the definition of a derivative, evaluated arithmetically. It " +
    "costs two forward passes per parameter — " + (2 * NPARAM) + " here, and " +
    bn(2 * CFG.params) + " for " + MODEL.name + " — which is why it is a " +
    "correctness test and never a training method.",
  build: function () {
    return [
      kicker("Backward · <b>verification</b>"),
      title("Do not trust a derivative you worked out by hand", true),
      d("cols wide-l", [
        d("stack", [
          frag(NN.formula({
            rule: "dL/dθᵢ &nbsp;≈&nbsp; ( L(θ + ε·eᵢ) − L(θ − ε·eᵢ) ) / 2ε",
            cls: "gradient" }), "f-left"),
          frag(derivPanel("what that costs", [
            drow("2 forward passes &nbsp;×&nbsp; " + NPARAM + " parameters &nbsp;=&nbsp; " +
                 (2 * NPARAM), "for this model"),
            drow("2 forward passes &nbsp;×&nbsp; " + bn(CFG.params) + " parameters",
                 "for " + MODEL.name),
            drow("backpropagation: <span class='v-gradient'>1</span> backward pass, " +
                 "all " + NPARAM + " at once", "which is the entire point", true)
          ], "g"), "f-left")
        ]),
        d("stack", [
          frag(NN.callout("key", "A wrong gradient does not announce itself",
            "It does not throw. The loss still goes down, just more slowly and " +
            "to a worse place, and it looks identical to a badly-chosen " +
            "learning rate. This is why <span class='mono'>torch.autograd." +
            "gradcheck</span> exists and why it is standard practice to run it " +
            "on any custom <span class='mono'>autograd.Function</span> before " +
            "trusting it."), "f-right"),
          frag(NN.callout("warn", "Two rules that carry over",
            "Run it in <b>float64</b> — in float32 the finite-difference noise " +
            "swamps the signal and everything looks broken. And be suspicious " +
            "of exact zeros on both sides, because a bug that returns zero and " +
            "a genuinely-zero gradient are indistinguishable in this test. " +
            "Here the zeros were explained independently — they are the ReLU " +

      ])
