/* Ring cost factor. The generator now publishes the number per world size on
   every collective, so nothing here parses the formula string; the string is
   only ever displayed. */
function ringFactor(op, N) {
  const c = typeof op === "string" ? byOp(op) : op;
  if (!c) { console.warn("nn-internals slides: unknown collective"); return 1; }
  const at = c.ring_factor_at_world && c.ring_factor_at_world[String(N)];
  return at === undefined ? c.ring_factor_numeric : at;
}
/* self-check: the published factors, the ring table and the DDP schedule
   payload all have to agree, or one of the three has drifted. */
(function () {
  const rt = PA.ring.table.filter(function (r) { return r.world === WORLD; })[0];
  if (rt) {
    if (Math.abs(ringFactor("all_reduce", WORLD) - rt.all_reduce) > 1e-9 ||
        Math.abs(ringFactor("all_gather", WORLD) - rt.all_gather) > 1e-9) {
      console.warn("nn-internals slides: ring_factor_at_world disagrees with PARALLEL.ring.table");
    }
  }
  const ddpSent = STRAT.ddp.schedule[0].sent_per_gpu_elements;
  if (Math.abs(ddpSent - ringFactor("all_reduce", WORLD) * NPAR) > 1e-6) {
    console.warn("nn-internals slides: DDP schedule payload disagrees with the ring factor");
  }
})();

/* --------------------------------------------------------- the wires */
/* PARALLEL.interconnects quotes vendor bandwidths (NVLink figures are
   BIDIRECTIONAL in marketing, so always read per_dir_GBps), and
   PARALLEL.cost_model is a labelled MODEL, not a measurement. Every slide
   that turns bytes into seconds says so on the slide itself. */
const ICON = PA.interconnects;
const CM   = PA.cost_model;
const linkNamed = function (frag) {
  return ICON.links.filter(function (l) { return l.name.indexOf(frag) >= 0; })[0];
};
const NVL = linkNamed("NVLink " + GPUD.nvlink_gen) || linkNamed("NVLink");
const IBL = linkNamed("InfiniBand NDR") || linkNamed("InfiniBand");
/** seconds to move `bytes` per GPU over a link, at the model's achieved fraction */
function wireSeconds(bytes, l) {
  return bytes / (l.per_dir_GBps * 1e9 * CM.achieved_fraction);
}
const MODEL_CAVEAT =
  "<b>" + CM._status + "</b> Bandwidth is taken at " +
  f(CM.achieved_fraction * 100, 0) + "% of nominal (" + CM.achieved_note +
  ") and the model ignores " + CM.ignores.slice(0, 3).join(", ") + ".";

/**
 * A shard bar that can own SEVERAL slices, which NN.gpu.shard cannot express.
 * Same markup and the same CSS classes, so a replicated tensor and a sharded
 * one are drawn by the same grammar: filled = held here, hollow = elsewhere.
 */
function shardBar(o) {
  const n = o.parts, own = o.own;
  const bar = el("div", { class: "shardbar" });
  for (let i = 0; i < n; i++) {
    const mine = own === "all" || (!!own && own.indexOf(i) >= 0);
    bar.appendChild(el("div", {
      class: "shardseg" + (mine ? " mine" : ""),
      style: { background: mine ? (o.color || "var(--weight)") : "var(--surface-3)" },
      title: o.name + " shard " + i + (mine ? " — held on this GPU" : " — held elsewhere")
    }));
  }
  return el("div", { class: "shardrow" }, [
    el("span", { class: "shardname" }, o.name), bar
  ]);
}

/* ---------------------------------------------------------------------- */
/*  The collective visualiser: four GPU boxes, labelled chunks, real moves. */
/* ---------------------------------------------------------------------- */
/**
 * spec = {
 *   world, slots, color,
 *   states: [ grid ],            grid[gpu][slot] = label | null
 *   moves:  [ [[src,dst,label], ...] ],   parallel to states
 *   caps:   [ caption ]
 * }
 * Returns an <svg> with .step(k).
 */
let _collUID = 0;
function collSVG(spec) {
  const N = spec.world, SL = spec.slots;
  const BW = 218, BH = 34 + SL * 30, GAPX = 26, X0 = 30, YB = 104;
  const Wd = X0 * 2 + N * BW + (N - 1) * GAPX;
  const Ht = YB + BH + 14;
  const uid = "collhead" + (_collUID++);
  const s = SV("svg", { viewBox: "0 0 " + Wd + " " + Ht, width: "100%",
                        height: Ht, class: "collsvg", role: "img" });

  const defs = SV("defs", {});
  const mk = SV("marker", { id: uid, viewBox: "0 0 8 8", refX: 7, refY: 4,
                            markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
  mk.appendChild(SV("path", { d: "M0 0 L8 4 L0 8 z", fill: spec.color }));
  defs.appendChild(mk); s.appendChild(defs);

  const bx = function (g) { return X0 + g * (BW + GAPX); };
  const rects = [], texts = [];
  for (let g = 0; g < N; g++) {
    const x = bx(g);
    s.appendChild(SV("rect", { x: x, y: YB, width: BW, height: BH, rx: 10,
      fill: "var(--surface-2)", stroke: "var(--hairline)", "stroke-width": 1.5 }));
    const hd = SV("text", { x: x + BW / 2, y: YB + 20, "text-anchor": "middle",
      "font-size": 13, "font-family": "var(--mono)", fill: "var(--ink-muted)" });
    hd.textContent = "GPU " + g;
    s.appendChild(hd);
    rects.push([]); texts.push([]);
    for (let k = 0; k < SL; k++) {
      const y = YB + 30 + k * 30;
      const r = SV("rect", { x: x + 13, y: y, width: BW - 26, height: 25, rx: 5,
        class: "cslot", fill: "var(--surface-3)", stroke: "var(--hairline-2)" });
      const t = SV("text", { x: x + BW / 2, y: y + 17, "text-anchor": "middle",
        "font-size": 13, "font-family": "var(--mono)", class: "cslottext",
        fill: "var(--ink-2)" });
      s.appendChild(r); s.appendChild(t);
      rects[g].push(r); texts[g].push(t);
    }
  }
  const flow = SV("g", { class: "flows" });
  s.appendChild(flow);

  let last = null;
  s.step = function (k) {
    const idx = NN.clamp(k, 0, spec.states.length - 1);
    const st = spec.states[idx];
    const prev = spec.states[idx - 1] || null;
    for (let g = 0; g < N; g++) for (let j = 0; j < SL; j++) {
      const v = st[g][j];
      const changed = prev && prev[g][j] !== v && v !== null;
      texts[g][j].textContent = v === null ? "" : v;
      rects[g][j].setAttribute("fill", v === null ? "var(--surface-3)"
        : "color-mix(in srgb, " + spec.color + " 26%, var(--surface-3))");
      rects[g][j].setAttribute("stroke", v === null ? "var(--hairline-2)" : spec.color);
      rects[g][j].setAttribute("class", "cslot" + (changed && idx !== last ? " fresh" : ""));
    }
    while (flow.firstChild) flow.removeChild(flow.firstChild);
    (spec.moves[idx] || []).forEach(function (mv) {
      const a = bx(mv[0]) + BW / 2, b = bx(mv[1]) + BW / 2;
      const dist = Math.abs(mv[1] - mv[0]);
      const lift = 26 + 24 * dist;
      const p = SV("path", {
        d: "M" + a + " " + (YB - 3) + " Q" + ((a + b) / 2) + " " + (YB - 3 - lift) +
           " " + b + " " + (YB - 3),
        fill: "none", stroke: spec.color, "stroke-width": 2.2, class: "flowline",
        "marker-end": "url(#" + uid + ")"
      });
      flow.appendChild(p);
      if (mv[2]) {
        const lt = SV("text", { x: (a + b) / 2, y: YB - 8 - lift * 0.52,
          "text-anchor": "middle", "font-size": 12, "font-family": "var(--mono)",
          fill: spec.color });
        lt.textContent = mv[2];
        flow.appendChild(lt);
      }
    });
    last = idx;
  };
  s.step(0);
  return s;
}

/* Build the state machine for one collective, at the deck's world size. */
function collSpec(op) {
  const N = WORLD, SL = WORLD;
  const empty = function () {
    const g = [];
    for (let i = 0; i < N; i++) { g.push([]); for (let j = 0; j < SL; j++) g[i].push(null); }
    return g;
  };
  const full = function (fn) {
    const g = empty();
    for (let i = 0; i < N; i++) for (let j = 0; j < SL; j++) g[i][j] = fn(i, j);
    return g;
  };
  const chunk = function (j) { return "x" + SUB[j]; };
  const part  = function (i, j) { return "g" + SUP[i] + SUB[j]; };
  const total = function (j) { return "Σ" + SUB[j]; };
  const wgt   = function (j) { return "w" + SUB[j]; };
  const cell  = function (i, j) { return "c" + SUP[i] + SUB[j]; };
  const onlyMine = function (fn) {
    const g = empty();
    for (let i = 0; i < N; i++) g[i][i] = fn(i);
    return g;
  };
  const ringMoves = function (labFn) {
    const mv = [];
    for (let i = 0; i < N; i++) mv.push([i, (i + 1) % N, labFn ? labFn(i) : null]);
    return mv;
  };
  const toRoot = function (labFn) {
    const mv = [];
    for (let i = 1; i < N; i++) mv.push([i, 0, labFn ? labFn(i) : null]);
    return mv;
  };
  const fromRoot = function (labFn) {
    const mv = [];
    for (let i = 1; i < N; i++) mv.push([0, i, labFn ? labFn(i) : null]);
    return mv;
  };

  switch (op) {
    case "broadcast": {
      const a = empty();
      for (let j = 0; j < SL; j++) a[0][j] = wgt(j);
      const c = full(function (i, j) { return wgt(j); });
      return { color: "var(--weight)", states: [a, a, c],
        moves: [[], fromRoot(function () { return "whole buffer"; }), []],
        caps: ["GPU 0 holds the buffer. Nobody else has anything.",
               "One → all. Every other rank receives the whole thing.",
               "Every rank now holds an identical copy."] };
    }
    case "scatter": {
      const a = empty();
      for (let j = 0; j < SL; j++) a[0][j] = chunk(j);
      const c = onlyMine(function (i) { return chunk(i); });
      return { color: "var(--activation)", states: [a, a, c],
        moves: [[], fromRoot(function (i) { return chunk(i); }), []],
        caps: ["GPU 0 holds a buffer cut into " + N + " pieces.",
               "One → all, but split: rank i is sent piece i and nothing else.",
               "Each rank holds exactly its own piece. This is how a batch is handed out."] };
    }
    case "gather": {
      const a = onlyMine(function (i) { return chunk(i); });
      const c = empty();
      for (let j = 0; j < SL; j++) c[0][j] = chunk(j);
      for (let i = 1; i < N; i++) c[i][i] = chunk(i);
      return { color: "var(--activation)", states: [a, a, c],
        moves: [[], toRoot(function (i) { return chunk(i); }), []],
        caps: ["Every rank holds one piece.",
               "All → one. Every piece is sent to the root and concatenated in rank order.",
               "GPU 0 holds the whole tensor. This is checkpointing and logging."] };
    }
    case "all_gather": {
      const a = onlyMine(function (i) { return chunk(i); });
      const b = onlyMine(function (i) { return chunk(i); });
      for (let i = 0; i < N; i++) b[i][(i + N - 1) % N] = chunk((i + N - 1) % N);
      const c = full(function (i, j) { return chunk(j); });
      return { color: "var(--weight)", states: [a, b, c],
        moves: [[], ringMoves(function (i) { return chunk(i); }), []],
        caps: ["Every rank holds one piece — this is what a sharded weight looks like.",
               "Round 1 of " + (N - 1) + ": each rank forwards its piece to its right neighbour.",
               "After " + (N - 1) + " rounds every rank holds all " + N +
               " pieces. This is FSDP re-materialising a layer."] };
    }
    case "reduce": {
      const a = full(part);
      const c = full(part);
      for (let j = 0; j < SL; j++) c[0][j] = total(j);
      return { color: "var(--gradient)", states: [a, a, c],
        moves: [[], toRoot(function (i) { return "g" + SUP[i]; }), []],
        caps: ["Every rank holds its own full vector — four different answers.",
               "All → one, summing on the way in.",
               "GPU 0 holds the elementwise sum. Nobody else learned anything."] };
    }
    case "reduce_scatter": {
      const a = full(part);
      const c = onlyMine(total);
      return { color: "var(--gradient)", states: [a, a, c],
        moves: [[], ringMoves(function (i) { return "g" + SUP[i] + " chunks"; }), []],
        caps: ["Every rank holds a full vector of partial results.",
               "Sum and split in one pass: chunk j is accumulated as it travels to rank j.",
               "Rank i holds the fully-summed chunk i — and only that. " +
               "No rank ever held a full reduced buffer."] };
    }
    case "all_reduce": {
      const a = full(part);
      const c = full(function (i, j) { return total(j); });
      return { color: "var(--gradient)", states: [a, a, c],
        moves: [[], ringMoves(function (i) { return "g" + SUP[i]; }), []],
        caps: ["Every rank holds its own full vector — four different gradients.",
               "Every chunk travels the ring twice: once accumulating, once distributing.",
               "Every rank holds the identical sum. This is the DDP gradient step."] };
    }
    case "all_to_all": {
      const a = full(cell);
      const c = full(function (i, j) { return cell(j, i); });
      const mv = [];
      for (let j = 1; j < N; j++) mv.push([0, j, cell(0, j)]);
      return { color: "var(--activation)", states: [a, a, c],
        moves: [[], mv, []],
        caps: ["Rank i holds " + N + " chunks, one destined for each rank.",
               "Rank i sends its j-th chunk to rank j. Only GPU 0's sends are drawn — " +
               "every other rank does exactly the same thing at the same time.",
               "A distributed transpose: rank j now holds the j-th chunk of everyone. " +
               "This is how MoE routing moves tokens to experts."] };
    }
  }
  return null;
}

/** One slide per collective, built from PARALLEL.collectives. */
function collectiveSlide(op, extraNote) {
  const c = byOp(op), spec = collSpec(op);
  const fac = ringFactor(c, WORLD);
  return {
    chapter: "Collectives · " + op,
    plain: op + " · " + c.sig,
    notes: c.what + "  ——  Used for: " + c.used_for + "  ——  Cost: a ring " +
      "implementation makes every GPU send " + c.ring_factor + ", which at " +
      "world " + WORLD + " and the toy model's " + NPAR + " gradient elements " +
      "is " + f(fac * NPAR, 2) + " elements per GPU. Its inverse is " +
      c.inverse + ". " + (extraNote || "") + "  ——  Walk the three build steps " +
      "and read the chunk labels out loud; the point of these eight slides is " +
      "that every distributed strategy later in the deck is one of these " +
      "operations applied to one of our four tensor classes.",
    build: function (ctx) {
      ctx.viz = collSVG({ world: WORLD, slots: WORLD, color: spec.color,
                          states: spec.states, moves: spec.moves });
      ctx.cap = h("phaselabel", spec.caps[0]);
      ctx.spec = spec;
      return [
        kicker("Collectives · <b>" + op + "</b> · " + c.sig),
        title("<span class='mono'>" + op + "</span> — " + c.what, true),
        frag(d("panel acc", [ctx.viz, ctx.cap]), "f-fade"),
        frag(d("cols3", [
          panel("acc tight", [ph("what it is for"), h("small", c.used_for)]),
          panel("acc tight", [ph("bytes each GPU sends · ring"),
            h("small", "<span class='mono'>" + c.ring_factor + "</span> — at N = " +
              WORLD + " and S = " + NPAR + " elements, " + f(fac * NPAR, 2) +
              " elements per GPU")]),
          panel("acc tight", [ph("its inverse"),
            h("small", "<span class='mono'>" + c.inverse + "</span>" +
              (c.inverse === "itself" ? " — it is its own inverse" : ""))])
        ]), "f-fade")
      ];
    },
    render: function (n, ctx) {
      const k = NN.clamp(n, 0, ctx.spec.states.length - 1);
      ctx.viz.step(k);
      ctx.cap.textContent = ctx.spec.caps[k];
    }
  };
}

S({
  chapter: "Collectives · the decomposition", plain: "all_reduce IS reduce_scatter followed by all_gather",
  notes: "This is the most useful single fact in the whole of distributed " +
    "training and it takes thirty seconds to state. An all-reduce is not a " +
    "primitive. It is literally implemented as a reduce-scatter — which leaves " +
    "each rank owning the fully-summed shard it is responsible for — followed " +
    "by an all-gather that hands everyone a copy of everyone else's shard. Look " +
    "at the ring factors: reduce_scatter is " + byOp("reduce_scatter").ring_factor +
    ", all_gather is " + byOp("all_gather").ring_factor + ", and their sum is " +
    byOp("all_reduce").ring_factor + ". Exactly. Now hold the thought that will " +
    "come back when we get to ZeRO: if a rank only ever needs its own shard, the " +
    "second half is pure waste. Skipping it costs nothing and saves half the " +
    "traffic — and it is the whole of ZeRO stage 2.",
  build: function (ctx) {
    const N = WORLD, SL = WORLD;
    const part = function (i, j) { return "g" + SUP[i] + SUB[j]; };
    const total = function (j) { return "Σ" + SUB[j]; };
    const gridOf = function (fn) {
      const g = [];
      for (let i = 0; i < N; i++) { g.push([]); for (let j = 0; j < SL; j++) g[i].push(fn(i, j)); }
      return g;
    };
    const a = gridOf(part);
    const mid = gridOf(function (i, j) { return i === j ? total(j) : null; });
    const z = gridOf(function (i, j) { return total(j); });
    const ring = [];
    for (let i = 0; i < N; i++) ring.push([i, (i + 1) % N, null]);
    ctx.viz = collSVG({ world: N, slots: SL, color: "var(--gradient)",
      states: [a, a, mid, mid, z],
      moves: [[], ring, [], ring, []] });
    ctx.caps = [
      "Start: four ranks, four different partial gradients.",
      "① reduce-scatter — sum as it travels, each chunk landing on its owner.",
      "Halfway: rank i holds the finished chunk i. " +
        "<b>If that is all rank i needs, stop here.</b>",
      "② all-gather — every owner broadcasts its finished chunk back around.",
      "Done: every rank holds the identical, fully-reduced vector."
    ];
    ctx.cap = h("phaselabel", ctx.caps[0]);
    const rsF = ringFactor("reduce_scatter", WORLD);
    const agF = ringFactor("all_gather", WORLD);
    const arF = ringFactor("all_reduce", WORLD);
    return [
      kicker("Collectives · the decomposition that matters"),
      title("<span class='mono'>all_reduce</span> is not a primitive", true),
      frag(d("panel g", [ctx.viz, ctx.cap]), "f-fade"),
      d("rowflex", [
        frag(d("pill", "① reduce_scatter"), "f-pop"),
        frag(d("pill hot", "each rank owns one finished shard"), "f-pop"),
        frag(d("pill", "② all_gather"), "f-pop"),
        frag(d("pill", "everyone holds everything"), "f-pop")
      ]),
      frag(d("cols3", [
        NN.formula({ rule: "reduce_scatter", sub: byOp("reduce_scatter").ring_factor,
          result: f(rsF, 3) + " × S", cls: "gradient" }),
        NN.formula({ rule: "+ all_gather", sub: byOp("all_gather").ring_factor,
          result: f(agF, 3) + " × S", cls: "weight" }),
        NN.formula({ rule: "= all_reduce", sub: byOp("all_reduce").ring_factor,
          result: f(arF, 3) + " × S", cls: "gradient" })
      ]), "f-fade"),
      frag(NN.callout("key", "Remember the halfway point",
        "After the reduce-scatter, rank i already holds the completely-summed " +
        "shard i. The all-gather exists only to give every rank a copy of every " +
        "other shard. If a rank is only ever going to update its own shard of " +
        "the parameters, that second half is " +

  render: function (n, ctx) {

/* ---------------------------------------------------------- C11. the ring */
function ringPhases(N) {
  const out = [];
  for (let p = 0; p < N - 1; p++) {
    const send = [];
    for (let i = 0; i < N; i++) send.push(((i - p) % N + N) % N);
    out.push({ kind: "reduce-scatter", round: p + 1, send: send });
  }
  for (let p = 0; p < N - 1; p++) {
    const send = [];
    for (let i = 0; i < N; i++) send.push(((i + 1 - p) % N + N) % N);
    out.push({ kind: "all-gather", round: p + 1, send: send });
  }
  return out;
}

S({
  chapter: "Collectives · the ring", plain: "The ring algorithm, all " +
    (2 * (WORLD - 1)) + " phases",
  notes: "How is an all-reduce actually implemented? Not by everyone shouting " +
    "at everyone. Arrange the GPUs in a ring; each one only ever sends to its " +
    "right-hand neighbour and receives from its left. Cut the buffer into N " +
    "chunks. For N−1 rounds each GPU forwards a chunk and adds what it " +
    "receives — after those rounds each GPU owns exactly one fully-summed " +
    "chunk. Then for another N−1 rounds those finished chunks travel the same " +
    "way without accumulation until everyone has all of them. That is " +
    (2 * (WORLD - 1)) + " phases at world " + WORLD + ", each moving one Nth " +
    "of the buffer. Step through them and watch which chunk each GPU is " +
    "sending. The payoff is the next slide, and it is the reason this " +
    "algorithm won.",
  build: function (ctx) {
    ctx.phases = ringPhases(WORLD);

      d("cols wide-r", [

S({
  chapter: "Data parallel · overlap", plain: "Bucketing: the all-reduce hides inside the backward pass",

    "does not do that. Gradients are produced in reverse layer order, so the " +
    "last layer's gradient is ready long before the first layer's. Group them " +
    "into buckets of a few tens of megabytes and fire each bucket's all-reduce " +
    "the moment it is complete. By the time backward finishes, most of the " +
    "traffic has already happened. This is the single reason DDP is fast in " +
    "practice, and it is also why bucket size is a tuning knob: too small and " +

const Z1 = STRAT.zero1, Z2 = STRAT.zero2, Z3 = STRAT.zero3;
const memTot = function (s) {

S({

SEP("tp");

/* ======================================================================== */
/*  PART F · TENSOR PARALLEL                                                */
/* ======================================================================== */
const TP = STRAT.tp;

/* The generator now ships the per-GPU partials on every block
   (per_gpu_hidden, per_gpu_partial_out, summed_before_bias, after_bias) and
   the slides RENDER those. We still re-run the Megatron forward here and
   compare, because two independent implementations agreeing is a stronger
   statement than either one alone — and a silent divergence between the
   generator and the deck is exactly the failure this project exists to avoid. */
const tpCalc = (function () {
  const Ws = PMOD.Ws, bs = PMOD.bs, X = PMOD.X;
  function mm(A, B) {           /* A (m x k) · B (k x n) */
    const m = A.length, k = B.length, n = B[0].length, out = [];
    for (let i = 0; i < m; i++) {
      out.push([]);
      for (let j = 0; j < n; j++) {
        let s = 0;
        for (let t = 0; t < k; t++) s += A[i][t] * B[t][j];
        out[i].push(s);
      }
    }
    return out;
  }
  function tr(A) {
    const out = [];
    for (let j = 0; j < A[0].length; j++) {
      out.push([]);
      for (let i = 0; i < A.length; i++) out[j].push(A[i][j]);
    }
    return out;
  }
  const blocks = [];
  let hFull = X;
  TP.blocks.forEach(function (blk) {
    const Lc = blk.col_layer, Lr = blk.row_layer, per = blk.units_per_gpu;
    const shardsA = [], partials = [];
    for (let g = 0; g < WORLD; g++) {
      const Wg = Ws[Lc].slice(g * per, (g + 1) * per);
      const bg = bs[Lc].slice(g * per, (g + 1) * per);
      const zg = mm(hFull, tr(Wg)).map(function (row) {
        return row.map(function (v, j) { return v + bg[j]; });
      });
      shardsA.push(zg.map(function (row) {
        return row.map(function (v) { return v > 0 ? v : 0; });
      }));
    }
    for (let g = 0; g < WORLD; g++) {
      const Wg = Ws[Lr].map(function (row) { return row.slice(g * per, (g + 1) * per); });
      partials.push(mm(shardsA[g], tr(Wg)));
    }
    const summed = partials[0].map(function (row, i) {
      return row.map(function (v, j) {
        let s = 0;
        for (let g = 0; g < WORLD; g++) s += partials[g][i][j];
        return s;
      });
    });
    const z = summed.map(function (row) {
      return row.map(function (v, j) { return v + bs[Lr][j]; });
    });
    const isLast = Lr === PM.n_layers - 1;
    hFull = isLast ? z : z.map(function (row) {
      return row.map(function (v) { return v > 0 ? v : 0; });
    });
    blocks.push({ blk: blk, shardsA: shardsA, partials: partials,
                  summed: summed, out: z });
  });
  let err = 0;
  hFull.forEach(function (row, i) {
    row.forEach(function (v, j) { err = Math.max(err, Math.abs(v - PMOD.yhat[i][j])); });
  });
  if (err > 1e-9) {
    console.warn("nn-internals slides: TP recomputation disagrees with PARALLEL.model.yhat " +
                 "by " + err);
  }
  /* cross-check every stored partial against the local re-run */
  let xerr = 0;
  TP.blocks.forEach(function (blk, bi) {
    const mine = blocks[bi];
    (blk.per_gpu_partial_out || []).forEach(function (p, g) {
      p.forEach(function (row, i) {
        row.forEach(function (v, j) {
          xerr = Math.max(xerr, Math.abs(v - mine.partials[g][i][j]));
        });
      });
    });
    (blk.summed_before_bias || []).forEach(function (row, i) {
      row.forEach(function (v, j) {
        xerr = Math.max(xerr, Math.abs(v - mine.summed[i][j]));
      });
    });
  });
  if (xerr > 1e-12) {
    console.warn("nn-internals slides: stored TP partials disagree with the " +
                 "local re-run by " + xerr);
  }
  return { blocks: blocks, yhat: hFull, err: err, crosscheck: xerr };
})();

/* the block ending in yhat — rendered from the SHIPPED partials */
const TPBLK = TP.blocks[TP.blocks.length - 1];
const TPB = {
  blk:      TPBLK,
  partials: TPBLK.per_gpu_partial_out,
  summed:   TPBLK.summed_before_bias,
  out:      TPBLK.after_bias,
  hidden:   TPBLK.per_gpu_hidden
};

S({

S({

SEP("seqpar");

const SPD = window.SEQPAR || null;

const SPT    = SPM.tp;                    /* tensor-parallel degree, 2      */
const SPSEQ  = SPM.seq, SPDM = SPM.d_model, SPFF = SPM.d_ff;
const SPTOK  = SPM.tokens;
const SPBASE = SPD.baseline;
const SPTPO  = SPD.tp_only;
const SPSP   = SPD.tp_plus_sp;
const SPEQV  = SPD.equivalence;
const SPMEM  = SPD.memory;
const SPCOMM = SPD.communication;
const SPSCL  = SPD.at_scale;
const SPPER  = SPSEQ / SPT;               /* sequence rows per rank         */
const SPFPR  = SPFF / SPT;                /* MLP neurons per rank           */

function spTokRow(i) { return "t" + i + " “" + SPTOK[i] + "”"; }
function spStream() {
  return SPTOK.map(function (t) { return "“" + t + "”"; }).join(" · ");
}
function spOwner(i)  { return Math.floor(i / SPPER); }

/* Which slide established all_reduce = reduce_scatter + all_gather is looked
   up with the deck-wide helper, so the link survives slides being inserted. */
const SEC_COLL = SECTIONS.filter(function (x) { return x.id === "collectives"; })[0];

/* ---- LayerNorm statistics, derived from what SEQPAR ships --------------
   The payload carries X, the gain, the bias and the LayerNorm output, but
   not epsilon and not the per-row statistics. The mean and the variance
   follow from X alone; 1/sqrt(var+eps) is recovered from the shipped output
   by inverting y = g*(x-mu)*inv + b on the channel furthest from the mean.
   The whole LayerNorm is then recomputed from those three numbers and
   checked against the shipped tensor, so nothing here is asserted. */
const SPLN = (function () {
  const X = SPD.input.X, g = SPD.input.gain, b = SPD.input.bias;
  const rows = [];
  for (let t = 0; t < SPSEQ; t++) {
    const mu = sum(X[t]) / SPDM;
    const va = sum(X[t].map(function (v) { return (v - mu) * (v - mu); })) / SPDM;
    let best = 0;
    for (let j = 1; j < SPDM; j++) {
      if (Math.abs(X[t][j] - mu) > Math.abs(X[t][best] - mu)) best = j;
    }
    const inv = (SPBASE.ln[t][best] - b[best]) / (g[best] * (X[t][best] - mu));
    rows.push({ mu: mu, var: va, inv: inv,
      xhat: X[t].map(function (v) { return (v - mu) * inv; }) });
  }
  const rebuilt = rows.map(function (r) {
    return r.xhat.map(function (v, j) { return g[j] * v + b[j]; });
  });
  const err = maxdiff2(rebuilt, SPBASE.ln);
  if (err > 1e-9) {
    console.warn("nn-internals slides: the deck's LayerNorm re-derivation " +
                 "disagrees with SEQPAR.baseline.ln by " + err);
  }
  return { rows: rows, err: err };
})();

/* ---- Korthikanti coefficients, as SEQPAR ships them ---------------------
   A is the flat replicated floor, B the part TP divides, C the TP+SP term,
   and C = A + B is the structural fact that makes the two schemes agree at
   t = 1. They are quoted from the paper, not derived here -- so the deck
   checks that they reproduce every row of the shipped table, checks the
   identity, and surfaces the source on the slide. */
const SPCF = SPSCL.coefficients;
const SPA  = SPCF.tp_only_floor_A;
const SPB  = SPCF.tp_only_divisible_B;
const SPC  = SPCF.tp_sp_C;
const SPCERR = (function () {
  let e = 0;
  SPSCL.table.forEach(function (r) {
    e = Math.max(e,
      Math.abs(SPA + SPB / r.tp - r.coeff_tp_only),
      Math.abs(SPC / r.tp - r.coeff_tp_sp));
  });
  if (e > 1e-3) {
    console.warn("nn-internals slides: SEQPAR.at_scale.coefficients do not " +
                 "reproduce SEQPAR.at_scale.table, by " + e);
  }
  if (SPC !== SPA + SPB) {
    console.warn("nn-internals slides: SEQPAR.at_scale.coefficients break " +
                 "C = A + B, which is what makes the two schemes agree at t=1");
  }
  return e;
})();
const SP_T1 = SPSCL.table.filter(function (r) { return r.tp === 1; })[0];
const SP_T8 = SPSCL.table.filter(function (r) { return r.tp === 8; })[0] ||

/* the per-rank inventory of the toy region, as a function of TP degree —
   the same algebra the traced TP=2 case exhibits, extended */
function spReplicated() { return 2 * SPSEQ * SPDM; }
function spSharded(t)   { return SPSEQ * SPFF / t; }
const SPTVALS = (function () {
  const out = [];
  for (let t = 1; t <= SPFF; t *= 2) if (SPFF % t === 0) out.push(t);
  return out;
})();
/* self-check: the algebra must reproduce the traced numbers exactly */
(function () {
  if (spReplicated() !== SPTPO.replicated_elements ||
      spSharded(SPT) !== SPTPO.sharded_elements ||
      spReplicated() + spSharded(SPT) !== SPTPO.activation_elements_per_rank) {
    console.warn("nn-internals slides: the deck's per-rank SP algebra " +
                 "disagrees with SEQPAR.tp_only");
  }
})();

/* one rank's resident inventory, drawn with the shard grammar the rest of
   Part III uses: filled = held here, hollow = held elsewhere. Every bar also
   carries the word REPLICATED or the axis it is sharded on. */
function spInventory(list, rank) {
  return list.map(function (t) {
    const repl = t.status.indexOf("REPLIC") >= 0;
    const bySeq = t.status.indexOf("SEQ") >= 0;
    return d("stack", [
      shardBar({ name: t.name + " · " + t.shape.join("×"),
                 parts: SPT, own: repl ? "all" : [rank],
                 color: "var(--activation)" }),
      h("small muted", (repl ? "REPLICATED — " : t.status + " — ") + t.why +
        "  ·  " + t.elements + " elements")
    ]);
  });
}

/* ------------------------------------ SP3. why LayerNorm resists hidden-sharding */
S({
  chapter: "Sequence parallel · why LayerNorm resists",
  plain: "A mean needs the whole vector — so LayerNorm cannot be hidden-sharded",
  notes: "First half of the asymmetry, and it is the reason tensor parallelism " +
    "left these tensors alone in the first place. LayerNorm normalises across " +
    "channels: for token 0 the mean is the sum of all " + SPDM +
    " channels divided by " + SPDM + ", which is " +
    f(SPLN.rows[0].mu, 6) + ", and the variance needs the same " + SPDM +
    " numbers again. Now suppose you shard the hidden dimension the way " +
    "tensor parallelism shards everything else: rank 0 holds channels 0 to " +
    (SPDM / SPT - 1) + " and rank 1 holds the rest. Rank 0 can compute a " +
    "partial sum, " + f(sum(SPD.input.X[0].slice(0, SPDM / SPT)), 6) +
    ", and that is not a mean of anything. To finish it you would need an " +
    "all-reduce across the hidden dimension, for every token, at every " +
    "LayerNorm — two per block, plus the final norm. That is far more " +
    "communication than tensor parallelism spends on the entire MLP, which is " +
    "why Megatron simply replicates the norm and moves on. Note the deck " +
    "derives these statistics from the shipped input and checks them against " +
    "the shipped LayerNorm output to " + f(SPLN.err, 1) + ".",
  build: function (ctx) {
    const X = SPD.input.X;
    ctx.x = am("X · the region's input", X, spStream(), 4);
    const half = SPDM / SPT;
    return [
      kicker("Distributed · sequence parallel · the obstacle"),
      title("The statistics are <em>along the row</em>. Every channel is needed.", true),
      d("cols wide-l", [
        d("stack", [
          d("panel a", [ph("token 0's " + SPDM + " channels — all of them go " +
            "into one mean"), ctx.x]),
          frag(d("cols", [
            NN.formula({ rule: "μ = (1/d) Σⱼ xⱼ",
              sub: "(" + X[0].map(function (v) { return f(v, 3); }).join(" + ") +
                   ") ÷ " + SPDM,
              result: f(SPLN.rows[0].mu, 6), cls: "activation" }),
            NN.formula({ rule: "var = (1/d) Σⱼ (xⱼ − μ)²",
              sub: "needs μ first, so needs every channel twice",
              result: f(SPLN.rows[0].var, 6), cls: "activation" })
          ]), "f-fade")
        ]),
        d("stack", [
          frag(d("panel crit", [ph("the thought experiment: shard the hidden " +
            "dimension across " + SPT + " ranks"),
            h("small", "rank 0 would hold channels 0–" + (half - 1) +
              ", rank 1 channels " + half + "–" + (SPDM - 1) + "."),
            h("gap8", ""),
            NN.formula({ rule: "rank 0's partial sum",
              sub: X[0].slice(0, half).map(function (v) {
                return f(v, 3); }).join(" + "),
              result: f(sum(X[0].slice(0, half)), 6) + "  — not a mean",
              cls: "activation" })]), "f-right"),
          frag(NN.callout("warn", "The price of doing it anyway",
            "One all-reduce over the hidden dimension per token, per " +
            "LayerNorm. A block has two norms, so that is two collectives " +
            "before either matmul has started — on top of the two " +
            "tensor parallelism already pays at the end of each sub-layer. " +
            "Nobody does this."), "f-right"),
          frag(NN.callout("why", "Which is why TP replicates it",
            "Megatron's answer is the pragmatic one: leave the norm " +
            "replicated, pay the memory, keep the communication to one " +
            "all-reduce per sub-layer. The previous run's inventory is the " +
            "consequence — " + SPTPO.replicated_elements + " of " +
            SPTPO.activation_elements_per_rank + " elements duplicated."), "f-right")
        ])
      ])
    ];
  }
});

/* ----------------------------------------------- SP6. the zipper, animated */
S({
  chapter: "Sequence parallel · the zipper",
  plain: "The zipper: shard by seq → all-gather → shard by hidden → " +
         "reduce-scatter → shard by seq",
  notes: "Step through it. Stage one, the SP region: rank r normalises only " +
    "its own tokens. The generator records the op as “" +
    SPSP.schedule[0].op + "” — no communication at all — and the reason: " +
    SPSP.schedule[0].why + " Stage two, entering the TP region: an all-gather " +
    "along the sequence, " + SPSP.schedule[1].elements + " elements, because " +
    SPSP.schedule[1].why + " Stage three, the TP region itself, which is " +
    "unchanged from before — column-parallel W_in, GELU on the shard, " +
    "row-parallel W_out, and each rank ends holding a partial sum over its " +
    "slice of the contraction. Stage four, leaving: a reduce-scatter, " +
    SPSP.schedule[2].elements + " elements, because " + SPSP.schedule[2].why +
    " And that is the zipper: the sequence axis opens on the way in and closes " +
    "on the way out, and in between the hidden axis is the one that is split. " +
    "Only rank 0's sends are drawn; every rank does the same thing at the same " +
    "time.",
  build: function (ctx) {
    const N = SPT, SL = SPSEQ;
    const empty = function () {
      const g = [];
      for (let i = 0; i < N; i++) { g.push([]); for (let j = 0; j < SL; j++) g[i].push(null); }
      return g;
    };
    const shardState = function () {
      const g = empty();
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < SL; j++) if (spOwner(j) === i) g[i][j] = SPTOK[j];
      }
      return g;
    };
    /* in the TP region every rank has every token, but only its own slice of
       the hidden dimension — so the slot says which neurons it holds */
    const fullState = function (hidden) {
      const g = empty();
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < SL; j++) {
          g[i][j] = SPTOK[j] + (hidden
            ? " ⟨" + (i * SPFPR) + "–" + (i * SPFPR + SPFPR - 1) + "⟩" : "");
        }
      }
      return g;
    };
    const a = shardState();
    const b = fullState(false);
    const c = fullState(true);
    const z = shardState();
    const ag = [[0, 1, "all_gather · " + SPSP.schedule[1].elements + " elems"]];
    const rs = [[1, 0, "reduce_scatter · " + SPSP.schedule[2].elements + " elems"]];
    ctx.viz = collSVG({ world: N, slots: SL, color: "var(--activation)",
      states: [a, b, c, c, z],
      moves: [ag, [], [], rs, []] });
    ctx.caps = [
      "① <b>SP region · " + SPPER + " tokens per rank.</b> " +
        SPSP.schedule[0].why + " The arrow is the all-gather about to run.",
      "② <b>all_gather along the sequence</b> — " + SPSP.schedule[1].why,
      "③ <b>TP region</b> — every rank now has the full sequence and " +
        SPFPR + " of " + SPFF + " neurons: column-parallel W_in, GELU on the " +
        "shard, row-parallel W_out. Each rank ends holding a partial sum.",
      "④ <b>reduce_scatter along the sequence</b> — " + SPSP.schedule[2].why,
      "⑤ back to <b>" + SPPER + " tokens per rank</b>. " + SPSP.note
    ];
    ctx.cap = el("div", { class: "small",
      style: { minHeight: "56px", lineHeight: "1.5", marginTop: "8px" } });
    const chips = SPSP.schedule.map(function (s) {
      return frag(d("pill" + (s.op === "none" ? "" : " hot"),
        "step " + s.step + " · " + s.region + " · " + s.op +
        (s.elements ? " · " + s.elements + " elems" : "")), "f-pop");
    });
    return [
      kicker("Distributed · sequence parallel · the schedule"),
      title("The sequence axis opens on the way in and closes on the way out", true),
      d("panel a", [ctx.viz, ctx.cap]),
      d("rowflex", chips),
      frag(NN.callout("key", "Two collectives where TP had one — " +
        "and the same bytes",
        "That is the claim the next slide proves. The all-gather and the " +
        "reduce-scatter are not additional traffic: they are the two halves of " +
        "the all-reduce tensor parallelism was already running at the end of " +
        "the region, with useful sharding done in the gap between them."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const k = NN.clamp(n, 0, ctx.caps.length - 1);
    ctx.viz.step(k);
    ctx.cap.innerHTML = "<span>" + ctx.caps[k] + "</span>";
  }
});

/* ----------------------------------------------------- SP12. at scale, the table */
/* The paper's coefficient is bytes per token per layer PER HIDDEN DIMENSION —
   its formula is s·b·h·(A + B/t), so h is a factor and must not be dropped.
   Every "one sequence, per rank" figure on this slide goes through here, and
   the t = 1 row is checked against the activation figure the cost run quoted
   for the same model, which is the same accounting arrived at independently. */
function spSeqBytes(bytesPerTokenPerLayer) {
  return bytesPerTokenPerLayer * CFG.seq * CFG.layers * CFG.d;
}
const SP_T1_CROSS = Math.abs(spSeqBytes(SP_T1.coeff_tp_only) -
                             CFG.actFlashSeq) / CFG.actFlashSeq;
if (SP_T1_CROSS > 0.01) {
  console.warn("nn-internals slides: Korthikanti at t=1 disagrees with the deck's " +
               "own activation accounting by " + (SP_T1_CROSS * 100) + "%");
}
const SP_DIFF_T8 = spSeqBytes(SP_T8.coeff_tp_only -
                              SP_T8.coeff_tp_sp);

/* --------------------------------------------------- SP13. what SP is NOT */
S({
  chapter: "Sequence parallel · what it is not",
  plain: "Not context parallelism, not weight sharding, not a replacement for TP",
  notes: "Close the run by ruling out the three things people assume. First, " +
    "this is not context or ring parallelism. Those also shard the sequence, " +
    "but they shard it for ATTENTION itself, where tokens genuinely do read " +
    "each other, so they need a ring exchange of keys and values between ranks " +
    "and the attention computation has to be restructured around it. Sequence " +
    "parallelism deliberately shards only the regions where no token reads " +
    "another — the norms, the dropout, the residual — which is why it needs no " +
    "new collective at all. Second, it does not shard weights. Look back at " +

/*  PART G · PIPELINE PARALLEL                                              */
/* ======================================================================== */
const PP = STRAT.pp;
const SCHED_G = PP.schedules.gpipe;      /* all forwards, then all backwards */
const SCHED_1 = PP.schedules["1f1b"];    /* warm up, alternate, drain        */
const PGRID = SCHED_G.grid;
const PSLOTS = PGRID[0].length;

/* Rebuild the generator's occupancy grid here so a naive (M = 1) schedule
   can be drawn with the same rule. Checked against PARALLEL's own grid. */
function pipeGrid(P, M) {
  const total = 2 * M + 2 * (P - 1);
  const g = [];
  for (let s = 0; s < P; s++) {
    const row = [];
    for (let t = 0; t < total; t++) row.push(null);
    g.push(row);
  }
  for (let m = 0; m < M; m++) for (let s = 0; s < P; s++) g[s][s + m] = "F" + m;
  const base = M + P - 1;
  for (let m = 0; m < M; m++) for (let s = P - 1; s >= 0; s--) {
    const t = base + m + (P - 1 - s);
    if (t < total) g[s][t] = "B" + m;
  }
  return g;
}
function bubbleOf(grid) {
  let idle = 0, tot = 0;
  grid.forEach(function (r) { r.forEach(function (v) { tot++; if (!v) idle++; }); });
  return idle / tot;
}
(function () {
  const mine = pipeGrid(WORLD, PP.n_micro);
  if (JSON.stringify(mine) !== JSON.stringify(SCHED_G.grid)) {
    console.warn("nn-internals slides: local GPipe grid disagrees with PARALLEL");
  }
  [SCHED_G, SCHED_1].forEach(function (sc) {
    if (Math.abs(bubbleOf(sc.grid) - sc.stats.bubble_measured) > 1e-5) {
      console.warn("nn-internals slides: counted bubble disagrees with stats for " +
                   sc.what);
    }
  });
})();
/* The M = 1 case is a slider-style derivation, not shipped data: the same
   rule the generator uses, run with one micro-batch. */
const NAIVE = pipeGrid(WORLD, 1);

/* ---------------------------- the per-matrix cut factory ---------------- */
function hlCols(nr, a, b) {
  const out = [];
  for (let i = 0; i < nr; i++) for (let j = a; j < b; j++) out.push([i, j]);
  return out;
}
function hlRows(nc, a, b) {
  const out = [];
  for (let i = a; i < b; i++) for (let j = 0; j < nc; j++) out.push([i, j]);
  return out;
}
function cutSlide(o) {
  const P = partOf(o.key);
  const M = PRM[o.key];
  const nr = M.length, nc = M[0].length;
  const isCol = P.tp.mode === "column";
  const slices = P.tp.slices.map(function (s) {
    return isCol ? mcols(M, s.cols[0], s.cols[1]) : M.slice(s.rows[0], s.rows[1]);
  });
  return {
    chapter: o.chapter,
    plain: o.plain,
    notes: o.notes,
    build: function (ctx) {
      ctx.full = wm(o.disp + "  ·  " + P.shape.join("×"), M, "the whole matrix", 3);
      ctx.cap = h("phaselabel", "");
      ctx.isCol = isCol;
      ctx.P = P;
      const cards = NN.gpu.grid({ count: TW, render: function (g) {
        const s = P.tp.slices[g];
        return [
          wm(o.disp + " shard " + g, slices[g],
            isCol ? "columns " + s.cols[0] + "–" + (s.cols[1] - 1)
                  : "rows " + s.rows[0] + "–" + (s.rows[1] - 1), 3),
          el("div", { class: "gpu-line" },
            P.tp.per_gpu_shape.join(" × ") + " = " + P.tp.per_gpu_elements +
            " of " + P.elements + " elements"),
          el("div", { class: "gpu-line",
            style: { color: isCol ? "var(--activation)" : "var(--gradient)" } },
            isCol ? "→ a FINAL shard of the output"
                  : "→ a PARTIAL sum over every output")
        ];
      } });
      return [
        kicker(o.kicker),
        title(o.title, true),
        frag(d("panel w", [ctx.cap, ctx.full]), "f-fade"),
        frag(cards, "f-pop"),
        frag(d("cols3", [
          NN.formula({ rule: "TP mode", sub: P.tp.mode,
            result: P.shape.join("×") + "  →  " + TW + " × " +
                    P.tp.per_gpu_shape.join("×"),
            cls: isCol ? "weight" : "gradient" }),
          NN.formula({ rule: "elements per GPU",
            sub: P.elements + " ÷ " + TW,
            result: String(P.tp.per_gpu_elements), cls: "weight" }),
          NN.formula({ rule: "communication this matrix forces",
            sub: isCol ? "none — the shard is final" : "all_reduce of the output",
            result: isCol ? "0 bytes" : SQ + " × " + DM + " elements",
            cls: isCol ? "activation" : "gradient" })
        ]), "f-fade")
      ].concat((o.extras || function () { return []; })());
    },
    render: function (n, ctx) {
      const P = ctx.P;
      const s0 = P.tp.slices[0], s1 = P.tp.slices[1];
      if (n >= 2) {
        ctx.full.highlight(ctx.isCol
          ? hlCols(nr, s0.cols[0], s0.cols[1]).concat(hlCols(nr, s1.cols[0], s1.cols[1]))
          : hlRows(nc, s0.rows[0], s0.rows[1]).concat(hlRows(nc, s1.rows[0], s1.rows[1])),
          false);
        ctx.cap.textContent = "cut into " + TW + " shards · GPU 0 keeps the first, " +
          "GPU 1 the second, and neither ever sees the other";
      } else if (n >= 1) {
        ctx.full.highlight(ctx.isCol
          ? hlCols(nr, s0.cols[0], s0.cols[1])
          : hlRows(nc, s0.rows[0], s0.rows[1]), true);
        ctx.cap.textContent = ctx.isCol
          ? "GPU 0 takes columns " + s0.cols[0] + "–" + (s0.cols[1] - 1)
          : "GPU 0 takes rows " + s0.rows[0] + "–" + (s0.rows[1] - 1);
      } else {
        ctx.full.highlight(null, false);
        ctx.cap.textContent = P.display + " on one GPU · " + P.elements + " elements";
      }
    }
  };
}

/* -------------------------------------------- C9. partial sums, all-reduce */
S({
  chapter: "TP · the all-reduce",
  plain: "Two partial sums, individually meaningless, summed to the truth",
  notes: "Compute the row-parallel product on the real numbers. GPU 0 takes " +
    "the concat columns it owns and multiplies by its rows of W_o; GPU 1 does " +
    "the same with the other half. Both produce a " + SQ + "×" + DM +
    " tensor of the right shape and entirely the wrong values: GPU 0 thinks " +
    "output [0][0] is " + f(mmul(mcols(FL[0].concat, 0, DM / TW),
      PRM["L0.Wo"].slice(0, DM / TW))[0][0], 6) + ", GPU 1 thinks it is " +
    f(mmul(mcols(FL[0].concat, DM / TW, DM),
      PRM["L0.Wo"].slice(DM / TW, DM))[0][0], 6) + ", and the truth is " +
    f(FL[0].attn_out[0][0], 6) + ". Neither is an estimate of anything. This " +
    "is the important difference between tensor parallelism and everything " +
    "else in this deck: in DDP a GPU's gradient is a legitimate stochastic " +
    "estimate and averaging improves it; here a GPU's output is a fragment of " +
    "an arithmetic expression, and the all-reduce is inside the definition of " +
    "the matrix product, not around it.",
  build: function (ctx) {
    const per = DM / TW;
    const parts = [];
    for (let g = 0; g < TW; g++) {
      parts.push(mmul(mcols(FL[0].concat, g * per, (g + 1) * per),
                      PRM["L0.Wo"].slice(g * per, (g + 1) * per)));
    }
    const summed = parts.reduce(function (a, b) { return madd(a, b); });
    if (maxdiff2(summed, FL[0].attn_out) > 1e-12) {
      console.warn("nn-internals slides: row-parallel W_o recomposition disagrees " +
                   "with TF2 by " + maxdiff2(summed, FL[0].attn_out));
    }
    ctx.err = maxdiff2(summed, FL[0].attn_out);
    return [
      kicker("Tensor parallel · W_o · reassembly"),
      title("Right shape, wrong numbers — until the all-reduce", true),
      frag(d("rowflex top", parts.map(function (p, g) {
        return d("panel g tight", [ph("GPU " + g + " · partial"),
          gm("partial", p, SQ + "×" + DM, 5)]);
      })), "f-pop"),
      frag(d("rowflex top", [
        gm("Σ · after all_reduce", summed, "", 5),
        h("ar", "vs"),
        am("TF2's Attn out", FL[0].attn_out, "single-device", 5)
      ]), "f-fade"),
      frag(d("cols3", [
        NN.formula({ rule: "GPU 0 thinks [0][0] is",
          sub: "half the contraction",
          result: f(parts[0][0][0], 7), cls: "gradient" }),
        NN.formula({ rule: "GPU 1 thinks [0][0] is",
          sub: "the other half",
          result: f(parts[1][0][0], 7), cls: "gradient" }),
        NN.formula({ rule: "their sum, and the truth",
          sub: f(parts[0][0][0], 5) + " + " + f(parts[1][0][0], 5),
          result: f(FL[0].attn_out[0][0], 7), cls: "activation" })
      ]), "f-fade"),
      frag(d("cols", [
        NN.tiles([
          { k: "max |Δ| vs the single-device answer", v: f(ctx.err, 1),
            s: "recomposed in the browser, from TF2's own weights",
            cls: "activation" },
          { k: "all_reduce payload", v: (SQ * DM) + " elements",
            s: "batch × seq × d in general", cls: "gradient" },
          { k: "sent per GPU · ring, N = " + TW,
            v: f(ringFactor("all_reduce", TW) * SQ * DM, 1) + " elems",
            s: byOp("all_reduce").ring_factor, cls: "gradient" }
        ]),
        NN.callout("warn", "This collective is not optional and not overlappable",
          "In DDP the gradient all-reduce hides behind the backward pass. This " +
          "one sits between two matmuls that depend on it — nothing can " +
          "proceed until it finishes. That is the entire reason tensor " +
          "parallelism has a hardware requirement and the other strategies " +
          "mostly do not.")
      ]), "f-fade")
    ];
  }
});

/* The most interesting shard in the whole table, chosen by the data rather
   than by hand: the one that slices the most tensors mid-matrix, tie-broken
   by how many tensors it spans in total. */
const STRAD = (function () {
  let best = null;
  FWORLDS.forEach(function (w) {
    FSBY[String(w)].shards.forEach(function (sh) {
      const score = sh.cut_through.length * 100 + sh.n_tensors_spanned;
      if (!best || score > best.score) best = { world: w, sh: sh, score: score };
    });
  });
  return best;
})();
const STRAD_LAYERS = (function () {
  const ls = {};
  STRAD.sh.spans_tensors.forEach(function (k) { ls[k.split(".")[0]] = 1; });
  return Object.keys(ls);
})();

S({
  chapter: "ZeRO-3 · the straddle",

      frag(d("cols", [
        NN.callout("warn", "One shard, " + STRAD_LAYERS.length + " blocks, " +

/* The recipe below is a SCENARIO, not a fact about the model — it is stated
   as such on the slide. Every number in it is derived from CFG and R_MIX. */
const REC = { tp: 8, pp: 2, dp: 4 };
REC.gpus     = REC.tp * REC.pp * REC.dp;
REC.shardTPP = REC.tp * REC.pp;
REC.wB       = CFG.params * R_W / REC.shardTPP;
REC.gB       = CFG.params * R_G / REC.shardTPP;
REC.oB       = CFG.params * OPTB / REC.shardTPP / REC.dp;   /* + ZeRO-1 over DP */
REC.stateB   = REC.wB + REC.gB + REC.oB;
REC.layersPerStage = CFG.layers / REC.pp;

          el("tbody", {}, rows)
        ])
      ]), "f-fade"),
      frag(NN.legend(), "f-fade"),
      frag(NN.callout("key", "Choose by what is scarce",
        "Short of memory for persistent state: ZeRO, as high a stage as your " +
        "fabric hides. Short of memory for one layer's activations: tensor " +
        "parallelism, inside a node. Short of memory for the depth of the " +
        "model: pipeline parallelism, across nodes. Short of throughput and " +
        "nothing else: plain data parallelism. In production you use all of " +
        "them at once, and the recipe two slides back is what that looks " +
        "like."), "f-fade")
    ];
  }
});

S({
  chapter: "Close · what is left", plain: "Activations are what is left",
  notes: "One honest loose end. Three of the four classes have clean answers: " +
    "weights, gradients and optimizer state can all be divided by the world " +
    "size, exactly, with a well-understood communication cost. Activations are " +
    "different. They are not a fixed quantity you can shard once — they are " +
    "regenerated on every step, they scale with batch and sequence rather than " +
    "with the model, and the seq² term inside attention scales worse than " +
    "that. Data parallelism divides them by the world size, tensor parallelism " +
    "divides them by the TP degree, but neither makes them small; they make " +
    "them proportional. So the remaining levers are different in kind: " +
    "recompute instead of remember, never materialise the score matrix, shard " +
    "the sequence dimension itself. That is where the current work is, and it " +
    "is why every new attention variant you read about is fundamentally a " +
    "memory paper.",
  build: function () {
    return [
      kicker("Close · the open problem"),
      title("Three classes divide cleanly. One does not."),
      frag(d("cols4", [
        panel("w", [NN.chip("weight"), h("gap8", ""),
          h("say", "Fixed by the architecture. Shard it once, gather it when " +
            "you need it. Solved.")]),
        panel("g", [NN.chip("gradient"), h("gap8", ""),
          h("say", "One per parameter, exactly. Reduce-scatter it and each " +
            "rank keeps its share. Solved.")]),
        panel("o", [NN.chip("optimizer"), h("gap8", ""),
          h("say", "Elementwise in the parameters, so it shards perfectly " +
            "along with them. Solved.")]),
        panel("a", [NN.chip("activation"), h("gap8", ""),
          h("say", "Regenerated every step. Scales with " +
            "<span class='mono'>batch × seq</span>, and with " +
            "<span class='mono'>seq²</span> inside attention. <b>Not " +
            "solved.</b>")])
      ]), "f-pop"),
      frag(d("cols3", [
        panel("a tight", [ph("recompute instead of remember"),
          h("small", "Activation checkpointing: keep block inputs, re-run the " +
            "forward during backward. " + f(CKPT_OVERHEAD * 100, 0) + "% more compute for a large " +
            "constant-factor saving.")]),
        panel("a tight", [ph("never materialise it"),
          h("small", "FlashAttention keeps per-row softmax statistics instead " +
            "of the " + (ACTC ? "seq² score matrix" : "score matrix") +
            " — here " + BY(CFG.actFullSeq) + " becomes " + BY(CFG.actFlashSeq) +
            " per sequence.")]),
        panel("a tight", [ph("shard the sequence itself"),
          h("small", "Sequence and context parallelism split the token " +
            "dimension across GPUs, which is the only lever that attacks the " +
            "seq² term structurally rather than by recomputation.")])
      ]), "f-fade"),
      frag(NN.callout("key", "Why this is the frontier",
        "Weights, gradients and optimizer state are all proportional to the " +
        "parameter count, which is a number you chose. Activations are " +
        "proportional to the data you push through, which is the thing you " +
        "want to increase. That asymmetry is why long context is hard, and " +
        "why almost every new attention mechanism turns out, on inspection, " +
        "to be a memory result."), "f-fade")
    ];
  }
});

}  /* end if (PA) — the distributed-training half */

/* --------------------------------------------------------------- close */
S({
  chapter: "Close", plain: "Four things to remember",
  notes: "Close on the four claims the deck actually proved, each on a model " +
    "small enough to verify by hand. Then point people at the interactive " +
    "pages, where they can step through the same trace themselves and poke at " +
    "NN.T, NN.P and window.TFORMER in the console. Take questions on the " +
    "memory curve slide or the ZeRO ladder — press G and jump back to either.",
  build: function () {
    const links = NN.PAGES.map(function (p) {
      return el("a", { class: "pill", href: "../site/" + p.file, title: p.blurb },
                p.n + " · " + p.title);
    });
    return [
      kicker("Close"),
      title("Four things to remember"),
      frag(d("cols4", [
        panel("w", [ph("one"), h("say",
          "A parameter is <b>" + FP32B + " bytes</b> at an address. A model is " +
          "nothing but a large number of them — " + NPARAM + " here, " +
          bn(CFG.params) + " there.")]),
        panel("a", [ph("two"), h("say",
          "The backward pass <b>re-reads what the forward pass wrote</b>. That " +
          "is why activations must be kept, and why memory scales with batch " +
          "and sequence, not just with the model.")]),
        panel("o", [ph("three"), h("say",
          "Weights are the <b>small part of the bill</b>: " + R_W + " of " +
          BPP_MIXED + " bytes per parameter. Gradients and optimizer state are " +
          "the rest.")]),
        panel("g", [ph("four"), h("say",
          "Every parallelism strategy is a decision about <b>which of the four " +
          "classes to stop replicating</b> — and the price is always a " +
          "collective.")])
      ]), "f-pop"),
      frag(d("stack", [
        h("small muted", "Work through the same trace interactively:"),
        d("rowflex", links)
      ]), "f-fade"),
      frag(h("small muted",
        "Every number in this deck came from <span class='mono'>NN.T</span> " +
        "(<span class='mono'>code/ground_truth.py</span>), " +
        "<span class='mono'>window.TFORMER</span> " +
        "(<span class='mono'>code/transformer_block.py</span>) and " +
        "<span class='mono'>window.PARALLEL</span> " +
        "(<span class='mono'>code/parallel_toy.py</span>). Gradients agree " +
        "with finite differences to " + f(T.gradcheck.max_abs_error, 1) +
        (PA ? "; data parallelism reproduces the full-batch gradient to " +
              f(PA.strategies.ddp.verify.grad_max_err, 1) +
              " and tensor parallelism the forward pass to " +
              f(PA.strategies.tp.verify.forward_max_err, 1) : "") +
        ". Open the console and type <span class='mono'>NN.T</span>."), "f-fade")
    ];
  }
});


/* The separators quote their own slide ranges, so they can only be filled
   in once every slide has been pushed. */
SEP_END = SLIDES.length;
finishSections();

/* ====================================================== build the deck */
const deck   = document.getElementById("deck");
const nodes  = [];

SLIDES.forEach(function (def, idx) {
  const sec   = d("slide");
  sec.setAttribute("aria-hidden", "true");
  const stage = d("stage");
  const inner = d("inner");
  const fit   = d("fit");
  const ctx   = {};
  const kids  = def.build ? def.build(ctx) : [];
  (Array.isArray(kids) ? kids : [kids]).forEach(function (k, i) {
    if (!k) return;
    k.style.setProperty("--i", i);
    fit.appendChild(k);
  });
  inner.appendChild(fit); stage.appendChild(inner); sec.appendChild(stage);
  deck.appendChild(sec);
  sec._frags = NN.$$(".fragment", fit);
  sec._ctx   = ctx;
  sec._def   = def;
  sec._fit   = fit;
  /* Render every slide once, fully, so that slides which draw their content
     in render() have something in them before they are first visited — the
     overview thumbnails and the fit-to-box measurement both need it. */
  if (def.render) def.render(sec._frags.length, ctx);
  nodes.push(sec);
});

const COUNT = nodes.length;
document.getElementById("cTot").textContent = String(COUNT);

/* ======================================================= layout / fit */
let _fitRaf = null;
function relayout() {
  const bottom = 52 + (notesOpen ? 176 : 0);
  document.documentElement.style.setProperty("--deckbottom", bottom + "px");
  const availH = window.innerHeight - 49 - bottom - 22;
  const k = Math.min((window.innerWidth - 56) / 1280, availH / 720);
  document.documentElement.style.setProperty("--k", Math.max(0.25, k));
  if (_fitRaf) cancelAnimationFrame(_fitRaf);
  _fitRaf = requestAnimationFrame(function () {
    nodes.forEach(function (s) {
      const hgt = s._fit.offsetHeight;
      s._fit.style.setProperty("--fit", hgt > 686 ? (686 / hgt).toFixed(4) : "1");
    });
  });
}
window.addEventListener("resize", relayout);

/* ============================================================== state */
let cur = 0, fragN = 0, notesOpen = false, gridOpen = false,
    helpOpen = false, blacked = false, hashLock = false, pending = null;

const pbar     = document.getElementById("pbar");
const cNum     = document.getElementById("cNum");
const chapEl   = document.getElementById("chap");
const dotsEl   = document.getElementById("fragdots");
const notesEl  = document.getElementById("notes");
const nHead    = document.getElementById("notesHead");
const nBody    = document.getElementById("notesBody");
const nNext    = document.getElementById("notesNext");
const btnPrev  = document.getElementById("btnPrev");
const btnNext  = document.getElementById("btnNext");

function totalFrags(i) { return nodes[i]._frags.length; }

function paintFrags() {
  const s = nodes[cur];
  s._frags.forEach(function (e, i) { e.classList.toggle("on", i < fragN); });
  dotsEl.innerHTML = "";
  for (let i = 0; i < s._frags.length; i++) {
    dotsEl.appendChild(el("i", { class: i < fragN ? "on" : "" }));
  }
  if (s._def.render) s._def.render(fragN, s._ctx);
  btnPrev.disabled = (cur === 0 && fragN === 0);
  btnNext.disabled = (cur === COUNT - 1 && fragN === totalFrags(cur));
}

function paintSlide() {
  nodes.forEach(function (s, i) {
    s.classList.toggle("current", i === cur);
    s.classList.toggle("past", i < cur);
    s.setAttribute("aria-hidden", i === cur ? "false" : "true");
  });
  const def = nodes[cur]._def;
  cNum.textContent = String(cur + 1);
  chapEl.textContent = def.chapter || "";
  pbar.style.width = (COUNT === 1 ? 100 : (cur / (COUNT - 1)) * 100) + "%";
  nHead.textContent = "Slide " + (cur + 1) + " — " + (def.plain || "notes");
  nBody.innerHTML = def.notes || "<em class='muted'>No notes.</em>";
  nNext.textContent = cur < COUNT - 1
    ? "Next up: " + (nodes[cur + 1]._def.plain || "") +
      "   ·   " + totalFrags(cur) + " build step" + (totalFrags(cur) === 1 ? "" : "s") + " on this slide"
    : "Last slide.";
  NN.$$(".thumb", thumbsEl).forEach(function (t, i) {
    t.classList.toggle("current", i === cur);
  });
  relayout();
}

function go(i, frag) {
  const t = NN.clamp(i, 0, COUNT - 1);
  const nf = frag === "all" ? totalFrags(t) : NN.clamp(frag || 0, 0, totalFrags(t));
  if (t !== cur) { cur = t; fragN = nf; paintSlide(); paintFrags(); }
  else { fragN = nf; paintFrags(); }
  writeHash();
}
function writeHash() {
  const want = "#" + (cur + 1);
  if (location.hash !== want) { hashLock = true; location.hash = want; }
}
function next() {
  if (fragN < totalFrags(cur)) { fragN++; paintFrags(); return; }
  if (cur < COUNT - 1) { pending = 0; go(cur + 1, 0); }
}
function prev() {
  if (fragN > 0) { fragN--; paintFrags(); return; }
  if (cur > 0) { pending = "all"; go(cur - 1, "all"); }
}
function nextSlide() { if (cur < COUNT - 1) go(cur + 1, 0); }
function prevSlide() { if (cur > 0) go(cur - 1, 0); }

window.addEventListener("hashchange", function () {
  if (hashLock) { hashLock = false; return; }
  const i = parseInt(location.hash.replace("#", ""), 10);
  if (!isNaN(i)) go(i - 1, pending === null ? "all" : pending);
  pending = null;
});

/* =============================================================== grid */
const gridEl   = document.getElementById("gridview");
const thumbsEl = document.getElementById("thumbs");
let thumbsBuilt = false;
function buildThumbs() {
  if (thumbsBuilt) return;
  thumbsBuilt = true;
  nodes.forEach(function (s, i) {
    /* draw the slide in its finished state before taking the snapshot */
    if (s._def.render) s._def.render(s._frags.length, s._ctx);
    const tw = d("tw");
    const clone = s.querySelector(".stage").cloneNode(true);
    clone.style.transform = "none";
    clone.style.setProperty("--k", 1);
    tw.appendChild(clone);
    const t = d("thumb", [tw, h("tn", "<b>" + (i + 1) + "</b><span>" +
      (s._def.plain || "").replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>")]);
    t.addEventListener("click", function () { toggleGrid(false); go(i, "all"); });
    thumbsEl.appendChild(t);
  });
  /* put the live slide back into its current build state */
  paintFrags();
  scaleThumbs();
}
function scaleThumbs() {
  NN.$$(".thumb", thumbsEl).forEach(function (t) {
    const w = t.clientWidth || 248;
    t.querySelector(".tw").style.transform = "scale(" + (w / 1280) + ")";
  });
}
function toggleGrid(on) {
  gridOpen = on === undefined ? !gridOpen : on;
  if (gridOpen) { buildThumbs(); scaleThumbs(); }
  gridEl.classList.toggle("open", gridOpen);
  document.getElementById("btnGrid").classList.toggle("on", gridOpen);
  if (gridOpen) {
    const c = NN.$$(".thumb", thumbsEl)[cur];
    if (c && c.scrollIntoView) {
      c.scrollIntoView({ block: "center", behavior: RM ? "auto" : "smooth" });
    }
  }
}
window.addEventListener("resize", function () { if (thumbsBuilt) scaleThumbs(); });

/* ============================================================== notes */
function toggleNotes(on) {
  notesOpen = on === undefined ? !notesOpen : on;
  notesEl.classList.toggle("open", notesOpen);
  document.getElementById("btnNotes").classList.toggle("on", notesOpen);
  relayout();
}

/* =============================================================== help */
const helpEl = document.getElementById("help");
const KEYS = [
  ["→ · Space · Page Down · Enter", "next build step, then next slide"],
  ["← · Backspace · Page Up", "previous build step, then previous slide"],
  ["↓ / ↑", "skip to next / previous slide, ignoring builds"],
  ["Home / End", "first / last slide"],
  ["G", "overview grid — click a thumbnail to jump"],
  ["Esc", "open the grid, or close whatever is open"],
  ["S", "speaker notes panel"],
  ["F", "fullscreen"],
  ["B or .", "blackout the screen"],
  ["T", "light / dark theme"],
  ["?", "this list"],
  ["click", "right third = forward, left third = back"]
];
(function () {
  const list = document.getElementById("keysList");
  KEYS.forEach(function (k) {
    list.appendChild(el("div", {}, k[0].split(" · ").map(function (x, i) {
      return el("span", {}, [i ? " · " : "", el("kbd", {}, x)]);
    })));
    list.appendChild(el("div", { class: "muted", text: k[1] }));
  });
})();
function toggleHelp(on) {
  helpOpen = on === undefined ? !helpOpen : on;
  helpEl.classList.toggle("open", helpOpen);
}

/* ========================================================== blackout */
const blackEl = document.getElementById("black");
function toggleBlack() { blacked = !blacked; blackEl.classList.toggle("on", blacked); }

/* ========================================================== keyboard */
document.addEventListener("keydown", function (e) {
  if (/input|textarea|select/i.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (blacked && k !== "b" && k !== "B" && k !== "." && k !== "Escape") { return; }
  switch (k) {
    case "ArrowRight": case " ": case "PageDown": case "Enter":
      e.preventDefault(); next(); break;
    case "ArrowLeft": case "PageUp": case "Backspace":
      e.preventDefault(); prev(); break;
    case "ArrowDown": e.preventDefault(); nextSlide(); break;
    case "ArrowUp":   e.preventDefault(); prevSlide(); break;
    case "Home": e.preventDefault(); go(0, 0); break;
    case "End":  e.preventDefault(); go(COUNT - 1, "all"); break;
    case "g": case "G": toggleGrid(); break;
    case "s": case "S": toggleNotes(); break;
    case "f": case "F":
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
      else { document.exitFullscreen(); }
      break;
    case "b": case "B": case ".": e.preventDefault(); toggleBlack(); break;
    case "t": case "T": document.getElementById("themeToggle").click(); break;
    case "?": toggleHelp(); break;
    case "Escape":
      if (helpOpen) toggleHelp(false);
      else if (blacked) toggleBlack();
      else toggleGrid();
      break;
  }
});

/* ===================================================== click / pointer */
const NOCLICK = "a,button,input,select,textarea,svg,.tensor,.chart,.no-nav,.memstrip,.bits";
deck.addEventListener("click", function (e) {
  if (e.target.closest && e.target.closest(NOCLICK)) return;
  const third = window.innerWidth / 3;
  if (e.clientX > third * 2) next();
  else if (e.clientX < third) prev();
});
const ehL = document.getElementById("ehL"), ehR = document.getElementById("ehR");
document.addEventListener("mousemove", function (e) {
  if (gridOpen || helpOpen) { ehL.classList.remove("show"); ehR.classList.remove("show"); return; }
  const third = window.innerWidth / 3;
  ehL.classList.toggle("show", e.clientX < third * .6 && cur > 0);
  ehR.classList.toggle("show", e.clientX > window.innerWidth - third * .6);
});
btnNext.addEventListener("click", next);
btnPrev.addEventListener("click", prev);
document.getElementById("btnGrid").addEventListener("click", function () { toggleGrid(); });
document.getElementById("btnNotes").addEventListener("click", function () { toggleNotes(); });
document.getElementById("btnHelp").addEventListener("click", function () { toggleHelp(); });
helpEl.addEventListener("click", function () { toggleHelp(false); });

/* touch: swipe */
let tx = null, ty = null;
deck.addEventListener("touchstart", function (e) {
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, { passive: true });
deck.addEventListener("touchend", function (e) {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
  tx = null;
});

/* redraw charts that read CSS variables when the theme flips */
window.addEventListener("nn:theme", function () {
  const s = nodes[cur];
  if (s._def.render) s._def.render(fragN, s._ctx);
});

/* ============================================================== start */
const startHash = parseInt(location.hash.replace("#", ""), 10);
cur = (!isNaN(startHash) && startHash >= 1 && startHash <= COUNT) ? startHash - 1 : 0;
fragN = 0;
paintSlide(); paintFrags(); relayout();
window.addEventListener("load", relayout);
setTimeout(relayout, 250);

/* expose for the console */
NN.deck = { go: go, next: next, prev: prev, slides: SLIDES };

})();
</script>
</body>
</html>
