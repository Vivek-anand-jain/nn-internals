  }
});

/* -------------------------------------------------- T22. block 1 receives */
S({
  chapter: "Forward L1 · the stream accumulates",
  plain: "Block 1 receives block 0's output — the stream carries history",
  notes: "Block 1 is the same seven operations with its own twenty tensors, so " +
    "we compress. But the thing that is genuinely new deserves a slide: the " +
    "tensor entering block 1 is not the input any more. It is the input PLUS " +
    "what attention contributed PLUS what the MLP contributed. Read the three " +
    "columns: the original input, block 0's total contribution, and the sum " +
    "which is block 1's input. The residual stream is a running total. Each " +
    "block reads the accumulated state, decides on a correction, and adds it. " +
    "That framing — blocks as incremental editors of a shared workspace rather " +
    "than as a chain of transformations — is the single most useful mental " +
    "model for a transformer, and it is the one that interpretability work is " +
    "built on.",
  build: function (ctx) {
    const delta = FL[0].resid2.map(function (r, i) {
      return r.map(function (v, j) { return v - F2.forward.x_in[i][j]; });
    });
    ctx.x = am("original input x", F2.forward.x_in, "", 4);
    ctx.d = am("block 0's total contribution", delta, "attn + MLP", 4);
    ctx.s = am("block 1's input", FL[1].stream_in, "= x + contribution", 4);
    return [
      kicker("Forward · block 1 · the accumulated stream"),
      title("The stream is a running total, not a relay", true),
      frag(d("rowflex top", [ctx.x, h("ar", "+"), ctx.d, h("ar", "="), ctx.s]), "f-fade"),
      frag(d("cols3", [
        NN.tiles([{ k: "largest single edit block 0 made",
          v: fS(mflat(delta).reduce(function (a, b) {
                 return Math.abs(b) > Math.abs(a) ? b : a; }, 0), 4),
          s: "one channel of one token", cls: "activation" }]),
        NN.tiles([{ k: "stream width", v: DM + " channels",
          s: "unchanged through the whole stack", cls: "activation" }]),
        NN.tiles([{ k: "blocks writing into it", v: String(NL * 2),
          s: NL + " blocks × 2 sub-layers", cls: "activation" }])
      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("key", "Blocks are editors, not a pipeline",
          "Every sub-layer reads the current state of the workspace through a " +
          "LayerNorm, computes a correction, and adds it. Nothing is ever " +
          "destroyed, which is why you can ask what a particular layer " +
          "<em>contributed</em> — the question is well-posed precisely because " +
          "the contributions add."),
        NN.callout("why", "And it is why the width is constant",
          "A running total only works if every term has the same shape. That is " +
          "the real reason <span class='mono'>d_model</span> is fixed across " +
          "the whole stack while <span class='mono'>d_ff</span> is free to be " +
          "wider inside a branch.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const hot = n >= 1 ? [[0, 2]] : null;
    ctx.x.highlight(hot, false); ctx.d.highlight(hot, false); ctx.s.highlight(hot, false);
  }
});

/* ---------------------------------------------- T23. block 1, attention */
S({
  chapter: "Forward L1 · attention",
  plain: "Block 1's attention: new weights, new statistics, different pattern",
  notes: "The same five operations, compressed onto one slide. What is worth " +
    "pointing at is that nothing repeats numerically. Block 1 has its own " +
    "W_q, W_k, W_v and W_o — twenty tensors per block, forty in the model — " +
    "and it is reading a different stream, so its attention pattern is its " +
    "own. Compare block 0's head-0 last row, " +
    FL[0].heads[0].P[SQ - 1].map(function (v) { return f(v, 3); }).join(", ") +
    ", with block 1's, " +
    FL[1].heads[0].P[SQ - 1].map(function (v) { return f(v, 3); }).join(", ") +
    ". The causal structure is identical — it is a property of the mask, not " +
    "of the weights — but where the mass sits is not.",
  build: function (ctx) {

/* ======================================================================== */
/*  PART T-B · THE BACKWARD PASS, DERIVED BY HAND                           */
/* ======================================================================== */

/* the gradient as it travels down the spine, stage by stage */
function mag(M) { return Math.max.apply(null, mflat(M).map(Math.abs)); }
const SPINE = [
  { lab: "dL/dy · out of the loss",        v: F2.dOut },
  { lab: "block 1 · into residual 2",      v: bstep(1, "resid2").value },
  { lab: "block 1 · into residual 1",      v: AB[1].dA },
  { lab: "block 1 · leaving the block",    v: bstep(1, "ln1").value },
  { lab: "block 0 · into residual 2",      v: bstep(0, "resid2").value },
  { lab: "block 0 · into residual 1",      v: AB[0].dA },
  { lab: "block 0 · leaving the stack",    v: bstep(0, "ln1").value }
];
(function () {
  const e = Math.max(maxdiff2(bstep(0, "ln1").value, F2.dx_in),
                     maxdiff2(bstep(1, "ln1").value, bstep(0, "resid2").value));
  if (e > 1e-15) {
    console.warn("nn-internals slides: the TF2 residual spine does not join up, by " + e);
  }
})();

/* --------------------------------------------------------- B1. the plan */
S({
  chapter: "Backward · the plan",
  plain: "The plan: " + BST.length + " steps, block 1 first",
  notes: "Turn round. The backward pass is the chain rule applied " +
    BST.length + " times, from the loss down to the input, and the order is " +
    "the exact reverse of the forward pass — block 1's residual-2 add is the " +
    "first thing differentiated and block 0's LayerNorm 1 is the last. Read " +
    "the list: seven steps per block, twice. Three of them deserve several " +
    "slides each because they are the ones people get wrong. LayerNorm " +
    "backward is NOT dL/dy·g/σ; the mean and the variance " +
    "both depend on every element of the row, so there are two correction " +
    "terms. The softmax Jacobian is NOT diagonal; every output depends on " +
    "every input because the normaliser couples them. And the residual add is " +
    "the one that makes deep stacks trainable, which is worth two slides on " +
    "its own. Every number on the next twenty slides was checked against " +
    "central finite differences to " + f(GC2.max_abs_err, 1) + ".",
  build: function () {
    const rows = BST.map(function (s, i) {
      const extra = s.ln_detail ? "per-token LayerNorm detail"

      return el("tr", {}, [
        el("td", { class: "n" }, String(i + 1)),
        el("td", { class: "mono" }, "block " + s.layer),
        el("td", { class: "v-gradient", style: { textAlign: "left" } }, s.label),
        el("td", { class: "mono muted" }, s.id),
        el("td", { style: { textAlign: "left" }, class: "muted" }, extra)
      ]);
    });
    return [
      kicker("Backward · the plan"),
      title(BST.length + " steps, in exact reverse order"),
      d("cols wide-l", [
        frag(d("panel g", [ph("TF2.backward_steps · block " + (NL - 1) +
          " first, block 0 last"),
          el("table", { class: "data" }, [
            el("thead", {}, el("tr", {}, [
              el("th", {}, "#"), el("th", {}, "block"),
              el("th", { style: { textAlign: "left" } }, "step"),
              el("th", {}, "id"),
              el("th", { style: { textAlign: "left" } }, "extra detail shipped")])),
            el("tbody", {}, rows)
          ])]), "f-left"),
        d("stack", [
          frag(NN.callout("warn", "Three of these are where people go wrong",
            "<b>LayerNorm backward</b> — the naive answer is wrong and we " +
            "derive the two correction terms. <b>The softmax Jacobian</b> — " +
            "dense, not diagonal, and every row of the result sums to zero. " +
            "<b>The residual add</b> — the same gradient down both paths, " +
            "which is the whole reason depth works."), "f-right"),
          frag(NN.tiles([
            { k: "steps", v: String(BST.length), s: "7 per block × " + NL,
              cls: "gradient" },
            { k: "parameter tensors", v: String(Object.keys(GR2).length),
              s: "each gets a gradient of identical shape", cls: "gradient" },
            { k: "worst finite-difference error", v: f(GC2.max_abs_err, 1),
              s: GC2.passed ? "PASS" : "FAIL", cls: "gradient" }
          ]), "f-right"),
          frag(NN.callout("key", "Reverse order is not a convention",
            "Step k's output is step k+1's input. The chain rule composes " +
            "right to left, so the gradient must be computed in exactly the " +
            "opposite order to the forward pass — which is also why the " +
            "activations the forward pass wrote first are the ones freed " +
            "last."), "f-right")
        ])
      ])

  }
});

/* ------------------------------------------------------- B2. dL/dy */
S({
  chapter: "Backward · the seed",
  plain: "dL/dy = 2(y − t)/" + (SQ * DM) + " — where every gradient comes from",
  notes: "Everything starts here. The loss is the mean of squared errors over " +
    (SQ * DM) + " outputs, so the derivative with respect to one output is " +
    "2 times the error divided by " + (SQ * DM) + ". Work element [0][0]: the " +
    "output was " + f(F2.forward.out[0][0], 5) + ", the target " +
    f(F2.input.target[0][0], 3) + ", so the error is " +
    fS(F2.forward.out[0][0] - F2.input.target[0][0], 5) + " and the gradient " +
    "is " + fS(F2.dOut[0][0], 6) + ". Two remarks. The sign is the useful " +
    "part: it says which direction to move each output. And the whole " +
    "backward pass is downstream of this one tensor — every one of the " + NP2 +
    " parameter gradients is a chain of matrix products starting from these " +
    (SQ * DM) + " numbers.",
  build: function (ctx) {
    const err = F2.forward.out.map(function (r, i) {
      return r.map(function (v, j) { return v - F2.input.target[i][j]; });
    });
    return [
      kicker("Backward · the seed gradient"),
      title("One tensor, and the whole backward pass hangs off it", true),
      frag(d("rowflex top", [
        am("y", F2.forward.out, "", 4), h("ar", "−"),
        am("target", F2.input.target, "", 3), h("ar", "="),
        gm("y − t", err, "", 4)
      ]), "f-fade"),
      frag(d("rowflex top", [
        gm("y − t", err, "", 5), h("ar", "× 2 / " + (SQ * DM) + " ="),

      ]), "f-pop"),
      frag(d("cols", [
        NN.formula({ rule: "L = (1/n) Σ (y − t)²,  n = " + (SQ * DM),
          sub: "∂L/∂y = 2(y − t)/n", cls: "gradient" }),
        NN.formula({ rule: "element [0][0]",
          sub: "2 × (" + f(F2.forward.out[0][0], 5) + " − " +
               f(F2.input.target[0][0], 3) + ") ÷ " + (SQ * DM),
          result: f(F2.dOut[0][0], 8), cls: "gradient" })
      ]), "f-fade"),
      frag(NN.callout("key", "Everything downstream is linear algebra",
        "From here on there is no new idea — just the chain rule applied to " +
        "matmuls, elementwise functions, a softmax and a normalisation. " +
        "Different heads and different losses change only this first tensor."), "f-fade")
    ];
  }
});

/* ------------------------------------------------ B3. residual 2 backward */
S({
  chapter: "Backward L1 · residual 2",
  plain: "The residual add splits the gradient — the SAME gradient, twice",
  notes: "The first step, and the one that makes deep networks work. The " +
    "forward operation was h2 = h1 + D. Both partial derivatives of a sum are " +
    "exactly 1, so the incoming gradient goes down BOTH paths, unchanged, " +
    "un-scaled, un-attenuated. Read the numbers: the gradient arriving is " +
    "the seed, the copy sent into the MLP branch is bit-identical, and the " +
    "copy that continues down the skip is bit-identical too. Not " +
    "approximately — the same numbers. TF2's own note on this step says it: " +
    "the identity branch is a gradient superhighway. Step the build and watch " +
    "one tensor become two.",
  build: function (ctx) {
    const dD = bstep(1, "resid2").value;
    ctx.src = gm("dL/dh₂ · arriving", dD, "", 5);
    ctx.br  = gm("→ into the MLP branch", dD, "identical", 5);
    ctx.sk  = gm("→ down the skip", dD, "identical", 5);
    return [
      kicker("Backward · block 1 · residual 2"),
      title("<span class='mono'>∂(a+b)/∂a = ∂(a+b)/∂b = 1</span>", true),
      frag(d("panel g", [ph("the gradient arriving at the top of block 1"),
        ctx.src]), "f-fade"),
      frag(d("cols", [
        d("panel g", [ph("copy 1 · into MLP(LN2(h))"), ctx.br]),
        d("panel a", [ph("copy 2 · straight down the residual path"), ctx.sk])
      ]), "f-pop"),
      frag(d("cols", [
        NN.formula({ rule: "max |difference| between the two copies",
          sub: "they are the same tensor",
          result: f(maxdiff2(dD, dD), 1) + " — exactly zero", cls: "gradient" }),
        NN.callout("key", "This is not an approximation",
          "Addition is the only operation in the whole block whose backward " +
          "pass involves no multiplication at all. Every matmul scales the " +
          "gradient by its weights; every nonlinearity scales it by a " +
          "derivative. The skip scales it by 1.")
      ]), "f-fade"),
      frag(h("small muted", "<b>TF2's note on this step</b> — " +
        bstep(1, "resid2").note))
    ];
  },
  render: function (n, ctx) {
    const hot = n >= 2 ? [[0, 0]] : null;
    ctx.src.highlight(hot, false); ctx.br.highlight(hot, false); ctx.sk.highlight(hot, false);
  }
});

/* -------------------------------------------- B4. the gradient superhighway */
S({
  chapter: "Backward · the superhighway",
  plain: "The residual path never shrinks the gradient — measured, not asserted",
  notes: "Now the consequence, on real numbers. Follow the largest-magnitude " +
    "entry of the gradient as it travels down the spine of the whole model, " +
    "from the loss to the input. It goes " +
    SPINE.map(function (s) { return f(mag(s.v), 4); }).join(" → ") +
    ". It does not decay. The reason is structural: at every junction the skip " +
    "path hands the gradient on untouched, and the branch path ADDS its " +
    "contribution on top. So the gradient leaving a block is the gradient that " +
    "entered it PLUS a correction — it can only fail to survive if the branch " +
    "actively cancels it, which is a measure-zero accident rather than a " +
    "systematic decay. Contrast a plain stack, where every layer multiplies " +
    "the gradient by a weight matrix and a nonlinearity derivative, so the " +
    "magnitude is a product of " + CFG.layers + " factors: if they average " +
    "slightly below one you get vanishing gradients, slightly above one and " +
    "you get exploding ones, and there is no setting that is stable for " +
    "long. That single fact is why " + CFG.layers + "-layer stacks train.",
  build: function (ctx) {
    ctx.host = el("div", { style: { minHeight: "250px" } });
    ctx.lab = h("phaselabel", "");
    ctx.tens = gm("dL/dh at this point on the spine", SPINE[0].v, "", 5);
    const beats = SPINE.map(function (s, i) {
      return frag(d("pill" + (i === SPINE.length - 1 ? " hot" : ""),
        (i + 1) + " · " + s.lab), "f-pop");
    });
    return [
      kicker("Backward · why depth works at all"),
      title("Down " + (NL * 2) + " junctions, and nothing multiplied it", true),
      d("cols wide-l", [
        d("panel g", [ph("largest |dL/dh| along the residual spine"), ctx.host]),
        d("stack", [ctx.lab, ctx.tens])
      ]),
      d("rowflex", beats),
      frag(d("cols", [
        NN.callout("key", "Add, do not multiply",
          "A plain stack computes <span class='mono'>h ← f(h)</span>, so the " +
          "gradient is multiplied by <span class='mono'>f′</span> at every " +
          "layer and the magnitude is a product of " + CFG.layers + " factors. " +
          "A residual stack computes <span class='mono'>h ← h + f(h)</span>, so " +
          "the gradient is a <em>sum</em>: one term that passed through nothing, " +
          "plus corrections. Products die or explode; sums do neither."),
        NN.callout("warn", "And this is why pre-LN matters",
          "Under post-LN the normalisation sits <em>on</em> the residual path, " +
          "so every junction rescales the gradient after all and the " +
          "superhighway is toll-gated. Moving the norm inside the branch — " +
          "which is what this model does — is what restored the clean path.")
      ]), "f-fade")
    ];
  },
  render: function (n, ctx) {
    const k = NN.clamp(n, 0, SPINE.length - 1);
    ctx.host.innerHTML = "";
    ctx.host.appendChild(NN.chart.bars({
      items: SPINE.slice(0, k + 1).map(function (s, i) {
        return { label: s.lab, value: mag(s.v),
                 color: i === k ? "var(--warning)" : "var(--gradient)",
                 sub: "· max |dL/dh|" };
      }),
      unit: "", max: Math.max.apply(null, SPINE.map(function (s) { return mag(s.v); })) * 1.08
    }));
    ctx.lab.textContent = (k + 1) + " / " + SPINE.length + " · " + SPINE[k].lab;
    ctx.tens.update(SPINE[k].v);
  }
});

/* -------------------------------------------------- B5. MLP backward */
S({
  chapter: "Backward L1 · the MLP",
  plain: "MLP backward: two outer products and one elementwise gate",

/* --------------------------------------- B6. the naive answer is wrong */
S({
  chapter: "Backward L1 · LayerNorm (1/4)",
  plain: "The naive LayerNorm gradient is WRONG — and here is the number",
  notes: "Everybody's first answer to LayerNorm backward is dL/dx = " +

    "before deriving right. The reason is one sentence: μ and var are " +
    "themselves functions of EVERY element of the row, so nudging x_j does " +
    "not only change xhat_j — it moves the mean and the variance, and " +
    "therefore moves every other xhat in the row as well. The naive answer " +
    "drops those paths entirely. TF2 ships both: for token 0 of block 1's " +
    "LayerNorm 2, the naive answer is " +
    bstep(1, "ln2").ln_detail[0].naive_dx.map(function (v) { return f(v, 5); }).join(", ") +
    " and the true answer is " +

    ". Look at channel " + 2 + ": the naive answer is off by a factor of two " +
    "and the error is not a rounding error, it is a missing term.",
  build: function (ctx) {

        d("stack", [

          gm("the true answer · TF2's dx", [D.dx], "correct", 6),

      frag(NN.callout("warn", "Why the naive derivation misses the point",
        "It treats <span class='mono'>μ</span> and " +

        "<span class='mono'>x₂</span> moves the mean, which moves " +

});

/* ------------------------------------------------- B7. the derivation */
S({
  chapter: "Backward L1 · LayerNorm (2/4)",
  plain: "The derivation: one main term and two corrections",
  notes: "Do the derivation symbolically. Start with dxhat_j = dL/dy_j · " +
    "g_j — the gradient with respect to the normalised value, which is easy " +
    "because the gain is elementwise. Now xhat_j = (x_j − μ)/σ " +
    "and BOTH μ and σ depend on every x. Carry all three " +
    "dependency paths through — the direct one, the one through the mean, and " +
    "the one through the variance — and everything collapses into a strikingly " +
    "compact result: dL/dx_j = inv_std × [ dxhat_j − mean_k(dxhat_k) − " +
    "xhat_j · mean_k(dxhat_k · xhat_k) ]. Read the three terms. The first is " +
    "the naive answer. The second subtracts the mean of the incoming gradient " +
    "— that is the mean's contribution, and it makes the output gradient " +
    "sum to zero over the row. The third subtracts the component of the " +
    "incoming gradient that is CORRELATED with xhat — that is the variance's " +
    "contribution, and it removes the part of the gradient that would only " +
    "rescale the row, which normalisation would undo anyway. Both terms vanish " +
    "only if the incoming gradient happens to be zero-mean and uncorrelated " +
    "with xhat, which in general it is not.",
  build: function (ctx) {
    const D = bstep(1, "ln2").ln_detail[0];
    return [
      kicker("Backward · LayerNorm · the derivation"),
      title("Three paths from <span class='mono'>x_j</span> to the loss", true),
      d("cols wide-l", [
        d("stack", [
          frag(NN.formula({ rule: "① the direct path",
            sub: "x_j → xhat_j → y_j",
            result: "dxhat_j · inv_std", cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "② through the MEAN",
            sub: "x_j → μ → every xhat_k → every y_k",
            result: "− inv_std · mean_k(dxhat_k)", cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "③ through the VARIANCE",
            sub: "x_j → var → inv_std → every xhat_k",
            result: "− inv_std · xhat_j · mean_k(dxhat_k · xhat_k)",
            cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "all together",
            sub: "dL/dx_j = inv_std · [ dxhat_j − mean(dxhat) − xhat_j · mean(dxhat·xhat) ]",
            cls: "gradient" }), "f-pop")
        ]),
        d("stack", [
          frag(d("panel g", [ph("the four ingredients, token 0, block 1 LN2"),
            d("stack", [
              gm("dxhat = dL/dy · g", [D.dxhat], "", 6),
              am("xhat · saved from forward", [D.xhat], "", 5),
              d("kv", [
                h("k", "inv_std"), h("", f(D.inv_std, 6)),
                h("k", "mean(dxhat)"), h("", f(D.mean_dxhat, 8)),
                h("k", "mean(dxhat·xhat)"), h("", f(D.mean_dxhat_xhat, 8))
              ])
            ])]), "f-right"),
          frag(NN.callout("key", "What the two corrections mean",
            "Term ② removes the <b>mean</b> of the incoming gradient: a " +
            "gradient that shifts the whole row uniformly cannot change the " +
            "output, because the mean is subtracted again. Term ③ removes the " +
            "part <b>correlated with xhat</b>: a gradient that rescales the row " +
            "uniformly cannot change the output either, because the variance " +
            "normalises it away."), "f-right"),
          frag(NN.callout("why", "So LayerNorm projects the gradient",
            "The two corrections are exactly a projection: they strip out the " +
            "two directions the layer is invariant to — shift and scale. " +
            "A LayerNorm hands back only the part of the gradient that could " +
            "actually have changed its output."), "f-right")
        ])
      ])
    ];
  }
});

/* ---------------------------------------- B8. corrections, one at a time */
S({
  chapter: "Backward L1 · LayerNorm (3/4)",
  plain: "Watch the two corrections land, one at a time, on real numbers",
  notes: "Now animate it. Start from the naive answer, subtract the mean term, " +

    "small. Two more things to point at. First, watch the row SUM in the " +
    "footer: after the mean correction it is essentially zero, and it stays " +
    "zero — that is the algebraic signature of the shift-invariance. Second, " +
    "the corrections are per-token: each row gets its own mean and its own " +
    "correlation, because each row was normalised by its own statistics.",
  build: function (ctx) {
    const det = bstep(1, "ln2").ln_detail;

          "t" + t + " · " + s), "f-pop"));
      });
    });

      kicker("Backward · LayerNorm · the corrections landing"),
      title("naive  →  − mean term  →  − variance term  =  the truth", true),

        d("stack", [
          d("panel g", [ctx.lab, ctx.row, ctx.foot]),
          ctx.form,
          NN.callout("key", "The row sum is the tell",
            "The naive answer has a non-zero row sum. The mean correction " +
            "drives it to zero and the variance correction leaves it there. " +
            "That is the shift-invariance of LayerNorm showing up in its " +
            "gradient — a uniform push on every channel cannot change the " +
            "output, so it must not appear in the input gradient either.")
        ]),
        d("stack", [
          (d("panel g tight", [ph("all " + SQ +
            " tokens · naive vs true, channel by channel"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", { style: { textAlign: "left" } }, "cell"),
                el("th", {}, "naive"), el("th", {}, "true"), el("th", {}, "Δ")])),
              el("tbody", {}, [].concat.apply([], det.map(function (D, t) {
                return D.dx.map(function (v, j) {
                  return el("tr", {}, [
                    el("td", { style: { textAlign: "left" }, class: "mono" },

    const labs = [

      result: f(vals[0], 7), cls: "gradient" }));
  }
});

/* ------------------------------------- B9. gain, bias and what is saved */
S({
  chapter: "Backward L1 · LayerNorm (4/4)",
  plain: "dgain and dbias accumulate over tokens — and what forward must save",
  notes: "Two loose ends. First, the parameter gradients. The gain and bias " +
    "are shared across tokens: the same " + DM + " numbers are applied to " +
    "every row. So their gradients ACCUMULATE — dgain_j is the sum over all " +
    SQ + " tokens of dL/dy_j times xhat_j, and dbias_j is just the sum of " +
    "dL/dy_j. That is a general rule and not a LayerNorm quirk: whenever a " +
    "parameter is reused, its gradient is the sum over every use. Second, the " +
    "memory consequence, which is the reason this section belongs in this " +
    "deck. Look at what the backward formula actually needs: xhat and inv_std, " +
    "for every token. Neither is recoverable from the output. So a LayerNorm " +
    "cannot free them at the end of the forward pass — it holds them until " +
    "backward runs, which may be milliseconds and " + CFG.layers +
    " layers later.",
  build: function (ctx) {
    const det = bstep(1, "ln2").ln_detail;
    const dg = GR2["L1.ln2.g"], db = GR2["L1.ln2.b"];
    const contrib = det.map(function (D, t) {
      return D.dxhat.map(function (dxh, j) {
        return (dxh / PRM["L1.ln2.g"][j]) * D.xhat[j];
      });
    });
    return [
      kicker("Backward · LayerNorm · parameters and memory"),
      title("Shared parameters accumulate. Saved statistics cannot be freed.", true),
      frag(d("panel g", [ph("dgain_j = Σ over tokens of  dL/dy_j · xhat_j"),
        d("rowflex top", contrib.map(function (c, t) {
          return gm("token " + t + " · “" + TOK[t] + "”", [c], "", 6);
        }).concat([h("ar", "Σ ="), gm("dL/d(ln2.gain)", [dg], "", 6)]))]), "f-fade"),
      frag(d("rowflex top", [
        gm("dL/d(ln2.gain)", [dg], DM + " numbers", 6),
        gm("dL/d(ln2.bias)", [db], "= Σ dL/dy", 6)
      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("key", "Reused parameter ⇒ summed gradient",
          "The gain is applied to all " + SQ + " tokens, so it appears " + SQ +
          " times in the computation graph and its gradient is the sum of " +
          SQ + " contributions. Exactly the same rule makes a weight matrix's " +
          "gradient an outer product summed over the batch."),
        NN.callout("mem", "What LayerNorm holds from forward to backward",
          "<span class='mono'>xhat</span> (" + (SQ * DM) + " elements here) " +
          "and <span class='mono'>inv_std</span> (one per token). Frameworks " +
          "store <span class='mono'>μ</span> and " +
          "<span class='mono'>inv_std</span> — two floats a token — and " +
          "recompute <span class='mono'>xhat</span>. Either way, something " +

          CFG.layers + "</span> LayerNorms in " + CFG.name + ", each holding " +
          "that for every token in the batch.")
      ]), "f-fade")
    ];
  }
});

/* ------------------------------- B12. the softmax Jacobian is dense */
S({
  chapter: "Backward L1 · attention (2/5)",
  plain: "The softmax Jacobian is DENSE — look at the off-diagonals",
  notes: "Here is the second thing everybody gets wrong. Softmax is not an " +
    "elementwise function. p_i = exp(s_i)/Σ exp(s_k), and that " +
    "denominator contains every s, so EVERY output depends on EVERY input. " +
    "The Jacobian is dp_i/ds_j = p_i(δ_ij − p_j) — a full " +
    "matrix. Show it as a heatmap for the last row of head 0, which is the " +
    "only row with all three keys visible. The diagonal entries are " +
    "p_i(1 − p_i), positive. The off-diagonals are −p_i·p_j, " +
    "strictly negative, and they are NOT small — for this row the largest " +
    "off-diagonal is " +
    f(Math.max.apply(null, mflat(softJac(FL[1].heads[0].P[SQ - 1])).map(function (v) {
      return v < 0 ? -v : 0; })), 5) + " against a largest diagonal of " +
    f(Math.max.apply(null, mflat(softJac(FL[1].heads[0].P[SQ - 1])).map(Math.abs)), 5) +
    ". Treat this matrix as diagonal and you get a gradient that is wrong in " +
    "both magnitude and direction. The intuition is competitive: pushing one " +
    "attention weight up necessarily pushes the others down, because they sum " +
    "to one.",
  build: function (ctx) {
    const p = FL[1].heads[0].P[SQ - 1];
    const J = softJac(p);
    ctx.J = J; ctx.p = p;
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 100,
      rowLab: TOK.map(function (t, i) { return "∂p" + i; }),
      colLab: TOK.map(function (t, i) { return "∂s" + i; }),
      caption: "head 0, row " + (SQ - 1) + " · the full Jacobian ∂pᵢ/∂sⱼ" });
    ctx.cap = h("phaselabel", "");
    return [
      kicker("Backward · block 1 · attention · the Jacobian"),
      title("<span class='mono'>∂pᵢ/∂sⱼ = pᵢ(δᵢⱼ − pⱼ)</span> — every entry is non-zero", true),
      d("cols wide-r", [
        d("stack", [
          frag(am("p · the row we are differentiating", [p],
            "sums to " + f(FL[1].heads[0].row_sums[SQ - 1], 6), 5), "f-fade"),
          frag(NN.formula({ rule: "diagonal · i = j",
            sub: "p₀(1 − p₀) = " + f(p[0], 4) + "(1 − " + f(p[0], 4) + ")",
            result: f(J[0][0], 7), cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "off-diagonal · i ≠ j",
            sub: "−p₀·p₁ = −" + f(p[0], 4) + " × " + f(p[1], 4),
            result: f(J[0][1], 7), cls: "gradient" }), "f-left"),
          frag(NN.formula({ rule: "every ROW of the Jacobian sums to",
            sub: "pᵢ(1 − Σⱼ pⱼ) = pᵢ(1 − 1)",
            result: "0 — exactly", cls: "gradient" }), "f-left"),
          frag(NN.callout("key", "Softmax is competitive, so its gradient is too",
            "The outputs are constrained to sum to one. Pushing " +
            "<span class='mono'>p₀</span> up must push the others down — " +
            "there is no way to change one without changing the rest. The " +
            "negative off-diagonals are that constraint, written as calculus."), "f-left")
        ]),
        d("stack", [frag(d("panel g", [ctx.cap, ctx.hm]), "f-right")])
      ])
    ];
  },
  render: function (n, ctx) {
    if (n >= 3) {
      ctx.hm.paint(ctx.J, { color: "var(--gradient)", digits: 4,
        hot: function (i, j) { return i !== j; } });
      ctx.cap.textContent = "the off-diagonals are outlined — they are the whole point";
    } else {
      ctx.hm.paint(ctx.J, { color: "var(--gradient)", digits: 4 });
      ctx.cap.textContent = "∂pᵢ/∂sⱼ · " + (SQ * SQ) +
        " entries, none of them zero";
    }
  }
});

/* -------------------------------- B13. contracting with the Jacobian */
S({
  chapter: "Backward L1 · attention (3/5)",
  plain: "dL/dsᵢ = pᵢ(dL/dpᵢ − Σⱼ dL/dpⱼ pⱼ)",
  notes: "You never build that Jacobian in practice — you contract dL/dp with " +
    "it, and the result collapses into one line. dL/ds_i = p_i times " +
    "(dL/dp_i minus a scalar), where the scalar is the dot product of dL/dp " +
    "with p itself. That scalar is the SAME for every i in the row, which is " +
    "why the whole dense Jacobian costs one extra dot product rather than a " +
    "matrix multiply. TF2 records those scalars: for head 0 of block 1 they " +
    "are " + bstep(1, "attn").heads[0].softmax_dots.map(function (v) {
      return f(v, 6); }).join(", ") + ", one per row. Work row " + (SQ - 1) +
    " on screen. And notice the interpretation: you are subtracting the " +
    "AVERAGE incoming gradient, weighted by the attention probabilities. Only " +
    "the part of dL/dp that differs from that average survives — attention " +
    "cares about relative preference, not absolute level.",
  build: function (ctx) {
    const HB = bstep(1, "attn").heads[0];
    const i = SQ - 1;
    const p = FL[1].heads[0].P[i], dp = HB.dP[i], dot = HB.softmax_dots[i];
    return [
      kicker("Backward · block 1 · attention · the contraction"),
      title("The dense Jacobian collapses to one subtraction", true),
      d("cols wide-l", [
        d("stack", [
          frag(d("panel g", [ph("row " + i + " of head 0 · “" + TOK[i] + "”"),
            d("stack", [
              am("p", [p], "the attention weights", 5),
              gm("dL/dp", [dp], "arriving", 6),
              gm("dL/ds", [HB.dS[i]], "leaving", 6)
            ])]), "f-fade"),
          frag(NN.formula({ rule: "the shared scalar · Σⱼ dL/dpⱼ · pⱼ",
            sub: dp.map(function (v, j) { return f(v, 5) + "×" + f(p[j], 4); }).join(" + "),
            result: f(dot, 8), cls: "gradient" }), "f-pop"),
          frag(NN.formula({ rule: "dL/ds₀ = p₀ · (dL/dp₀ − dot)",
            sub: f(p[0], 5) + " × (" + f(dp[0], 6) + " − " + f(dot, 6) + ")",
            result: f(HB.dS[i][0], 9), cls: "gradient" }), "f-pop")
        ]),
        d("stack", [
          frag(d("panel g tight", [ph("the shared scalar, one per row · TF2 softmax_dots"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", { style: { textAlign: "left" } }, "row"),
                el("th", {}, "Σ dL/dp · p"), el("th", {}, "visible keys")])),
              el("tbody", {}, HB.softmax_dots.map(function (v, k) {
                return el("tr", {}, [
                  el("td", { style: { textAlign: "left" } }, tokRow(k)),
                  el("td", { class: "n v-gradient" }, f(v, 8)),
                  el("td", { class: "n" }, String(k + 1))
                ]);
              }))
            ])]), "f-right"),
          frag(NN.callout("key", "One dot product, not a matrix product",
            "Naively, contracting with a dense " + SQ + "×" + SQ +
            " Jacobian per row would cost <span class='mono'>seq²</span> " +
            "per row and <span class='mono'>seq³</span> per head. The " +
            "collapse makes it <span class='mono'>seq</span> per row. That " +
            "is why softmax backward is cheap despite being dense."), "f-right"),
          frag(NN.callout("why", "And read what the subtraction means",
            "<span class='mono'>Σ dL/dpⱼ pⱼ</span> is the " +
            "attention-weighted average of the incoming gradient. Subtracting " +
            "it leaves only the part that says “this key deserves more " +
            "than the others”. A uniform push on every attention weight " +
            "produces exactly zero score gradient."), "f-right")
        ])
      ])
    ];
  }
});

/* ---------------------------------- B14. every row of dS sums to zero */
S({
  chapter: "Backward L1 · attention (4/5)",
  plain: "Every row of dS sums to exactly zero — and that is not a coincidence",
  notes: "Check the consequence, on the shipped numbers. TF2 records the row " +
    "sums of dS: for head 0 of block 1 they are " +
    bstep(1, "attn").heads[0].row_sums_dS.map(function (v) { return f(v, 1); }).join(", ") +
    " — zero to the last bit. The proof is two lines. Σ_i dL/ds_i = " +
    "Σ_i p_i·dL/dp_i − (Σ_i p_i)·dot, and since Σ p_i = 1, the second term " +
    "is exactly the dot itself, which is Σ_i p_i·dL/dp_i. They cancel. So " +
    "the zero row sum is the algebraic shadow of the fact that softmax " +
    "outputs sum to one — the constraint on the forward pass shows up as a " +
    "constraint on the backward pass. It also has a practical meaning: a " +
    "constant shift of all the scores in a row changes nothing, so the " +
    "gradient must be blind to that direction, and a vector orthogonal to " +
    "the all-ones direction is exactly a vector that sums to zero.",
  build: function (ctx) {
    const rows = [];
    for (let Lx = NL - 1; Lx >= 0; Lx--) {
      bstep(Lx, "attn").heads.forEach(function (HB) {
        HB.row_sums_dS.forEach(function (v, k) {
          rows.push(el("tr", {}, [
            el("td", { class: "mono" }, "block " + Lx),
            el("td", { class: "mono" }, "head " + HB.head),
            el("td", { style: { textAlign: "left" } }, tokRow(k)),
            el("td", { class: "n v-gradient" }, f(v, 1)),
            el("td", { class: "n" }, Math.abs(v) === 0 ? "exactly 0" : f(Math.abs(v), 1))
          ]));
        });
      });
    }
    const HB = bstep(1, "attn").heads[0];
    ctx.hm = heatGrid({ rows: SQ, cols: SQ, cell: 92,
      rowLab: TOK.map(function (t, i) { return "q" + i + " " + t; }),
      colLab: TOK.map(function (t, i) { return "k" + i; }),
      caption: "head 0 · dL/dS · masked entries are structurally zero" });
    ctx.HB = HB;
    return [
      kicker("Backward · block 1 · attention · the invariant"),
      title("Σᵢ dL/dsᵢ = 0, on every row, in every head", true),
      d("cols wide-l", [
        d("stack", [
          frag(d("panel g", [ctx.hm]), "f-fade"),
          frag(NN.formula({ rule: "the proof, in one line",
            sub: "Σᵢ pᵢ(dL/dpᵢ − dot) = Σᵢ pᵢ dL/dpᵢ − dot · Σᵢ pᵢ",
            result: "= dot − dot · 1 = 0", cls: "gradient" }), "f-pop")
        ]),
        d("stack", [
          frag(d("panel g tight", [ph("TF2.backward_steps[].heads[].row_sums_dS · " +
            "all " + (NL * NH * SQ) + " rows"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", {}, "block"), el("th", {}, "head"),
                el("th", { style: { textAlign: "left" } }, "row"),
                el("th", {}, "Σ dS"), el("th", {}, "|Σ|")])),
              el("tbody", {}, rows)
            ])]), "f-right"),
          frag(NN.callout("key", "A forward constraint becomes a backward constraint",
            "Softmax outputs sum to 1 for every input, so the score direction " +
            "“add the same constant to every score” cannot change " +
            "the output. A direction the function ignores is a direction the " +
            "gradient must be orthogonal to — and orthogonal to all-ones " +
            "means summing to zero."), "f-right")
        ])
      ]),
      frag(NN.callout("why", "And the mask takes care of itself",
        "A masked position had <span class='mono'>p = 0</span>, and " +
        "<span class='mono'>dL/ds = p(dL/dp − dot)</span>, so its score " +
        "gradient is zero automatically. No special case is needed in the " +
        "backward kernel — the forward mask has already done the work."), "f-fade")
    ];
  },
  render: function (n, ctx) {
    ctx.hm.paint(ctx.HB.dS, { color: "var(--gradient)", digits: 5 });
  }
});

/* --------------------------------------------- B15. dQ and dK from dS */
S({
  chapter: "Backward L1 · attention (5/5)",
  plain: "dQ = dS·K·scale and dK = dSᵀ·Q·scale — each reads the other",
  notes: "The last step inside attention. The forward operation was S = " +
    "(Q·Kᵀ)·scale, so its backward is the matmul pair with the scale " +
    "carried along: dQ is dS times K, dK is dS transposed times Q, both " +
    "multiplied by the same 1/√d_head. Point at the symmetry, because it " +
    "is the reason both Q and K have to be saved: computing the gradient for " +
    "Q requires K, and computing the gradient for K requires Q. Neither can " +
    "be freed after the forward pass. Then the per-head results are written " +
    "back into the same column ranges the heads were cut from, which " +
    "reassembles the full " + SQ + "×" + DM + " dQ, dK and dV.",
  build: function (ctx) {
    const HB = bstep(1, "attn").heads[0];
    const FH = FL[1].heads[0];
    return [
      kicker("Backward · block 1 · attention · scores to Q and K"),
      title("The two gradients cross over", true),
      frag(d("cols", [
        d("panel g", [ph("dQ needs K"),
          d("rowflex top", [
            gm("dS", HB.dS, "", 5), h("ar", "×"),
            am("K head 0", FH.K, "SAVED", 4), h("ar", "× " + f(SCL, 4) + " ="),
            gm("dQ head 0", HB.dQ, "", 6)
          ])]),
        d("panel g", [ph("dK needs Q"),
          d("rowflex top", [
            gm("dSᵀ", mT(HB.dS), "", 5), h("ar", "×"),
            am("Q head 0", FH.Q, "SAVED", 4), h("ar", "× " + f(SCL, 4) + " ="),
            gm("dK head 0", HB.dK, "", 6)
          ])])
      ]), "f-fade"),
      frag(d("rowflex top", [
        gm("dQ · reassembled", QB[1].dQ, SQ + "×" + DM, 6),
        gm("dK · reassembled", QB[1].dK, SQ + "×" + DM, 6),
        gm("dV · reassembled", QB[1].dV, SQ + "×" + DM, 6)
      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("mem", "Q and K are mutually hostage",
          "<span class='mono'>dQ</span> reads <span class='mono'>K</span>; " +
          "<span class='mono'>dK</span> reads <span class='mono'>Q</span>. " +
          "Neither can be freed at the end of the forward pass. Together with " +
          "<span class='mono'>V</span>, that is " +
          ACT2.filter(function (a) { return a.name === "Q,K,V"; })[0].elements +
          " elements a block here, <span class='mono'>3 · batch · seq · d</span> " +
          "in general."),
        NN.callout("key", "The scale reappears, unchanged",
          "The forward multiplied by <span class='mono'>" + f(SCL, 6) +
          "</span>; the backward multiplies by exactly the same constant. A " +
          "constant factor is its own derivative — which is another way of " +
          "saying that getting the scale wrong corrupts the forward pass and " +
          "the gradient by the same factor, silently.")
      ]), "f-fade")
    ];
  }
});

/* ---------------------------------------------- B16. Q/K/V gradients ADD */
S({
  chapter: "Backward L1 · Q/K/V",
  plain: "Three gradients arrive at one tensor, so they ADD",
  notes: "Now cash in the promise from the forward pass. Q, K and V all read " +
    "the same tensor — the LayerNorm-1 output — so in the computation graph " +
    "that tensor has three consumers. The rule for a node with several " +
    "consumers is that its gradient is the SUM of the gradients coming back " +
    "from each of them. Show the three contributions separately and then the " +
    "sum. They are genuinely different in size: the V path contributes the " +
    "most here, which makes sense because V feeds the output directly while Q " +
    "and K only influence it through a softmax that has already flattened " +
    "much of the signal. Also note the weight gradients: dW_q, dW_k and dW_v " +
    "are three separate outer products against the SAME saved input. One " +
    "activation, three uses, three gradients — and if you forget the addition " +
    "you get a model that trains, slowly and wrongly.",
  build: function (ctx) {
    const B = QB[1];
    return [
      kicker("Backward · block 1 · Q, K and V converge"),
      title("One saved tensor, three consumers, one summed gradient", true),
      /* the whole claim is one equation, so it gets one row */
      frag(d("rowflex top", [
        gm("from the Q path", B.fromQ, "dQ · W_qᵀ", 5),
        h("ar", "+"),
        gm("from the K path", B.fromK, "dK · W_kᵀ", 5),
        h("ar", "+"),
        gm("from the V path", B.fromV, "dV · W_vᵀ", 5),
        h("ar", "="),
        gm("dL/dn₁", B.dn1, "the sum, not any one", 5)
      ]), "f-fade"),
      frag(d("cols3", [
        NN.tiles([{ k: "Q path contributes", v: f(mag(B.fromQ), 5),
                    s: "max |contribution|", cls: "gradient" }]),
        NN.tiles([{ k: "K path contributes", v: f(mag(B.fromK), 5),
                    s: "max |contribution|", cls: "gradient" }]),
        NN.tiles([{ k: "V path contributes", v: f(mag(B.fromV), 5),
                    s: "max |contribution|", cls: "gradient" }])
      ]), "f-pop"),
      frag(d("cols wide-l", [
        d("rowflex top", [
          gm("dL/dW_q", GR2["L1.Wq"], "", 5),
          gm("dL/dW_k", GR2["L1.Wk"], "", 5),
          gm("dL/dW_v", GR2["L1.Wv"], "", 5)
        ]),
        NN.callout("key", "Fan-out forward means fan-in backward",
          "A tensor read by k consumers receives k gradients and its own " +
          "gradient is their sum. That is the general rule and it is why " +
          "autograd engines keep a reference count: a node's backward cannot " +
          "run until every consumer has reported. Here k = 3, and the three " +
          "weight gradients beside this are three outer products against one " +
          "saved activation.")
      ]), "f-fade")
    ];
  }
});

/* -------------------------------------- B17. LN1 backward + rejoining */
S({
  chapter: "Backward L1 · rejoin",
  plain: "LayerNorm 1 backward, then the skip copy rejoins",
  notes: "The last step of block 1. dn1 goes back through LayerNorm 1 with the " +
    "same three-term formula we derived — and then the residual-1 skip copy, " +
    "which has been waiting since the split, is added back in. THAT is the " +
    "moment the superhighway pays off, and you can read it off the screen: " +
    "the branch contributed a maximum of " +
    f(mag(bstep(1, "ln1").value.map(function (r, i) {
      return r.map(function (v, j) { return v - AB[1].dA[i][j]; }); })), 5) +
    " and the skip carried " + f(mag(AB[1].dA), 5) + " through untouched, so " +
    "the gradient leaving block 1 has magnitude " +
    f(mag(bstep(1, "ln1").value), 5) + " — larger than what the branch alone " +
    "produced, because the identity path was never attenuated. TF2's own note " +
    "on this step puts it exactly: the gradient leaving the block is never " +
    "smaller than the one that entered by the skip path alone.",
  build: function (ctx) {
    const skip = AB[1].dA;
    const out = bstep(1, "ln1").value;
    const branch = out.map(function (r, i) {
      return r.map(function (v, j) { return v - skip[i][j]; });
    });
    return [
      kicker("Backward · block 1 · the residual rejoins"),
      title("Branch + skip = the gradient leaving the block", true),
      frag(d("rowflex top", [
        gm("through LayerNorm 1 · the branch", branch, "", 6),
        h("ar", "+"),
        gm("the skip copy · untouched since the split", skip, "", 6),
        h("ar", "="),
        gm("dL/dh · leaving block 1", out, "", 6)
      ]), "f-fade"),
      frag(d("cols3", [
        NN.tiles([{ k: "branch contributed", v: f(mag(branch), 5),
                    s: "max magnitude", cls: "gradient" }]),
        NN.tiles([{ k: "skip carried", v: f(mag(skip), 5),
                    s: "unmodified", cls: "activation" }]),
        NN.tiles([{ k: "leaving the block", v: f(mag(out), 5),
                    s: "the sum", cls: "gradient" }])
      ]), "f-pop"),
      frag(d("cols", [
        NN.callout("key", "The skip is the floor, the branch is the bonus",
          "Whatever the branch does — even if its weights are tiny, even if " +
          "its LayerNorm has projected most of the gradient away — the skip " +
          "copy arrives intact. The gradient can only be destroyed if the " +
          "branch actively cancels it, which is an accident rather than a " +
          "systematic decay."),
        NN.callout("mem", "And LayerNorm's saved statistics get consumed here",
          "<span class='mono'>xhat</span> and " +
          "<span class='mono'>inv_std</span> for LayerNorm 1 have been " +
          "resident since the very start of the forward pass. This is the " +
          "step that finally frees them.")
      ]), "f-fade"),
      frag(h("small muted", "<b>TF2's note on this step</b> — " +
        bstep(1, "ln1").note))
    ];
  }
});

/* ------------------------------------------- B18. block 0, the same again */
S({
  chapter: "Backward L0 · the same seven steps",
  plain: "Block 0 repeats all seven steps on the gradient block 1 handed down",
  notes: "Block 0's backward pass is character for character the same seven " +
    "steps, on the gradient block 1 produced. Nothing new happens, which is " +
    "the point worth making: a transformer's backward pass is one block's " +
    "backward pass repeated, exactly as its forward pass is one block's " +
    "forward pass repeated. Two observations from the table. The gradient " +
    "entering block 0 is bit-identical to the one leaving block 1 — they are " +
    "literally the same tensor, which is what 'the residual stream carries " +
    "gradient between blocks' means concretely. And block 0's parameter " +
    "gradients are a different size from block 1's, because block 0 sits " +
    "further from the loss and its influence is mediated by everything block " +
    "1 does.",
  build: function () {

    ].map(function (p) {
      return el("tr", {}, [
        el("td", { class: "v-weight" }, p[0]),

        el("td", { class: "n" }, f(mag(GR2["L1." + p[1]]) / mag(GR2["L0." + p[1]]), 2) + "×")
      ]);
    });
    return [
      kicker("Backward · block 0"),
      title("Nothing new — which is exactly the point", true),
      d("cols wide-l", [
        frag(d("panel g", [ph("block 0's seven steps · TF2.backward_steps"),
          el("table", { class: "data" }, [
            el("thead", {}, el("tr", {}, [
              el("th", {}, "#"),
              el("th", { style: { textAlign: "left" } }, "step"),
              el("th", {}, "max |value|"),
              el("th", { style: { textAlign: "left" } }, "why it is not trivial")])),
            el("tbody", {}, rows)
          ])]), "f-left"),
        d("stack", [
          frag(d("panel g tight", [ph("max |gradient| per matrix, block 0 vs block 1"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", {}, "matrix"), el("th", {}, "block 0"),

            ])]), "f-right"),
          frag(NN.callout("key", "The handoff is literal",
            "The tensor leaving block 1 and the tensor entering block 0 are the " +
            "same object — max difference <span class='mono'>" +
            f(maxdiff2(bstep(1, "ln1").value, bstep(0, "resid2").value), 1) +
            "</span>. That is what it means for the residual stream to carry " +

/* --------------------------- A11. where the two coefficients come from ------
   The next slide multiplies by 34 and by 5 and the slide after that by 10, 24
   and 34, and until now the deck has never said where any of them came from.
   They are not magic: they are tensor COUNTS times a dtype width, and
   transformer.js ships the count for every term. So derive them here, check
   the total against the coefficient the rest of the deck uses, and hand the
   next slide two numbers it has earned. This replaces a second activation
   census; the census itself is the slide two before this one, on the model
   the audience actually walked. */
const CK_BYTES = function (t) {
  return t.dtype === "mask" ? 1
       : t.dtype === "fp32" ? FP32B
       : (ACTC ? ACTC.act_bytes : BF16B);
};
const CK_SUM = function (list) {
  return list.reduce(function (a, t) { return a + t.elems * CK_BYTES(t); }, 0);
};

if (XA) {
S({
  chapter: "Scale · the coefficients",
  plain: "Where 34 and 5 come from: tensor counts times a dtype width",
  notes: "Two numbers are about to do a lot of work — every activation figure " +

    "arrive as constants. " + XA.source + " The accounting is: bytes per layer " +
    "= " + XA.formula + ". The 34 and the 5 are not measured and not fitted. " +
    "They are counts. Read the left table: the linear terms are " +
    XA.linear_terms.filter(function (t) { return t.dtype !== "mask"; })
      .reduce(function (a, t) { return a + t.elems; }, 0) +

    " bytes plus " +
    XA.linear_terms.filter(function (t) { return t.dtype === "mask"; })
      .reduce(function (a, t) { return a + t.elems; }, 0) +
    " dropout masks at 1 byte, which is " + CK_SUM(XA.linear_terms) +
    ". The quadratic terms are the softmax output, its dropout mask and the " +

    "two, which is the only place in this accounting where a tensor's dtype " +
    "differs from the model's — a detail that changes the answer by " +

  build: function () {

          d("cols", [tbl(XA.linear_terms.slice(0, half), "activation"),

/* ------------------------------------------- F2. why you cannot just stream it */
S({

    "every key has been scored. Worse, the maximum is needed BEFORE the first " +
    "exponential, because exp of a large score overflows. So a naive streaming " +
    "kernel needs one pass to find the maximum, a second to accumulate the " +
    "sum and a third to divide — and the only way to avoid three passes is to " +
    "keep the scores, which is the tensor we are trying not to keep. The trick " +

            "overflow. <span class='mono'>lᵢ</span> is only known " +

/* ------------------------------ F3. online softmax, one dimension, the setup */
S({
  chapter: "FlashAttention · online softmax",

    "than " + FOS.block + " of them at once. That constraint is exactly the " +
    "constraint a tiled attention kernel is under. The device is two running " +
    "numbers: m, the largest value seen so far, and l, the sum of exp(x − m) " +
    "over everything seen so far. Both start empty — m at minus infinity, l at " +
    "zero. The whole of FlashAttention is the update rule for that pair. If " +
    "the room takes one thing away from this run it should be the next three " +
    "slides, not anything about GPUs.",
  build: function () {

    });

      ]), "f-fade"),

});

/* ------------------------------------------ F4. block 0: nothing to correct */

    f(FOS.steps[0].l_new, 6) + ". The correction the generator records for " +

            result: f(st.added, 8), cls: "activation" }), "f-right"),

/* --------------------------------- F5. block 1: THE MAX JUMPS — the rescale */
S({
  chapter: "FlashAttention · the rescale",
  plain: "Block 1: the max jumps " + f(FOS.steps[1].m_old, 0) + " → " +

  notes: "This is the slide the run exists for. Block 1 is " +
    FOS.steps[1].values.join(" and ") + ", and that " +

    "maximum jumps from " + f(FOS.steps[1].m_old, 0) + " to " +
    f(FOS.steps[1].m_new, 0) + ". Everything already inside l was measured " +
    "against the old maximum: each term is exp(x − " +
    f(FOS.steps[1].m_old, 0) + ") and needs to be exp(x − " +
    f(FOS.steps[1].m_new, 0) + "). Divide one by the other and the x cancels, " +
    "so the ratio is the same for every term: exp(" +
    f(FOS.steps[1].m_old, 0) + " − " + f(FOS.steps[1].m_new, 0) + ") = " +
    f(FOS.steps[1].correction, 8) + ". One multiply repairs the entire " +
    "accumulated total, whatever it contains and however many terms went into " +
    "it. l collapses from " + f(FOS.steps[1].l_old, 6) + " to " +
    f(FOS.steps[1].l_rescaled, 8) + ", the new block adds " +
    f(FOS.steps[1].added, 6) + ", and the total is " +
    f(FOS.steps[1].l_new, 8) + ". Step it slowly and let the collapse land. " +
    "That correction factor is FlashAttention; everything on the remaining " +
    "slides is bookkeeping around it.",
  build: function (ctx) {
    const st = FOS.steps[1];
    ctx.st = st;

    ctx.l = h("midnum v-activation", f(st.l_old, 6));
    ctx.bar = el("div", { class: "memstrip" });
    ctx.seg = el("div", { class: "memseg a", style: { flexGrow: "1" } }, "");
    ctx.free = el("div", { class: "memseg free", style: { flexGrow: "0.001" } }, "");
    ctx.bar.appendChild(ctx.seg); ctx.bar.appendChild(ctx.free);
    ctx.lab = h("phaselabel", "");
    return [
      kicker("FlashAttention · online softmax · block <b>1</b> · " +
             "<span class='v-activation'>the maximum moves</span>"),
      title("One multiply repairs everything accumulated so far", true),
      d("cols wide-l", [
        d("stack", [
          frag(d("cols", [
            d("panel a", [ph("m · running maximum"), ctx.m]),
            d("panel a", [ph("l · running Σ exp(x − m)"), ctx.l])
          ]), "f-pop"),
          frag(d("panel a tight", [ctx.lab, ctx.bar,
            h("small muted", "l drawn to scale against the largest value it " +
              "takes during this block")]), "f-fade")
        ]),
        d("stack", [
          frag(NN.formula({ rule: "the block · " +
              st.values.map(function (v) { return f(v, 0); }).join(", ") +
              " — the " + f(st.m_new, 0) + " is a new record",
            result: "m_new = " + f(st.m_new, 0), cls: "activation" }), "f-right"),
          frag(NN.formula({ rule: "correction = exp(m_old − m_new)",
            sub: "exp(" + f(st.m_old, 0) + " − " + f(st.m_new, 0) + ")",
            result: f(st.correction, 8), cls: "activation" }), "f-right"),
          frag(NN.formula({ rule: "l_rescaled = l_old × correction",
            sub: f(st.l_old, 6) + " × " + f(st.correction, 6),
            result: f(st.l_rescaled, 8), cls: "activation" }), "f-right"),
          frag(NN.formula({ rule: "added = Σ exp(x − m_new)",
            sub: st.values.map(function (v) {
              return "exp(" + f(v, 0) + "−" + f(st.m_new, 0) + ")"; }).join(" + "),
            result: f(st.added, 8), cls: "activation" }), "f-right"),
          frag(NN.formula({ rule: "l ← l_rescaled + added",
            sub: f(st.l_rescaled, 6) + " + " + f(st.added, 6),

        ])
      ]),
      frag(NN.callout("key", "Why one factor is enough — and why it is exact",
        "Every term inside l is <span class='mono'>exp(x − m_old)</span> and " +
        "every one of them wants to be <span class='mono'>exp(x − " +
        "m_new)</span>. Divide the second by the first and the x cancels: the " +
        "ratio is <span class='mono'>exp(m_old − m_new)</span> for " +
        "<em>all</em> of them, no matter what they are or how many there were. " +
        "That is not an approximation and it does not accumulate error — it is " +
        "the same algebra that lets you subtract the row maximum in an " +

  },
  render: function (n, ctx) {
    const st = ctx.st;

    ctx.m.textContent = stage >= 1 ? f(st.m_new, 0) : f(st.m_old, 0);
    ctx.l.textContent = f(val, 6);

  }
});

/* ------------------------------------- F6. block 2: the max holds, corr = 1 */

    f(FOS.steps[2].correction, 0) + " — exp(0) — so the rescale is a multiply " +
    "by one and the accumulator is simply added to. Two things worth saying. " +
    "This is the common case: a running maximum settles quickly, so most tiles " +
    "cost nothing but the add. And the branch is not skipped in practice — the " +
    "multiply by one is executed unconditionally, because a data-dependent " +
    "branch inside a warp costs more than the arithmetic it saves. The price " +
    "of the correction is one fused multiply-add per element, always, whether " +
    "or not it does anything.",
  build: function (ctx) {
    const st = FOS.steps[2];

      d("cols wide-l", [
        frag(d("cols", [
          d("panel a", [ph("m · running maximum"), ctx.m,

          frag(NN.formula({ rule: "correction = exp(m_old − m_new)",

            result: f(st.correction, 0), cls: "activation" }), "f-right"),
          frag(NN.formula({ rule: "l ← l × 1 + added",

      frag(d("cols", [

          "A kernel does not test <span class='mono'>max_moved</span> and skip " +

/* ----------------------------------------- F8. lifting it into two dimensions */

  chapter: "FlashAttention · backward",
  plain: "Backward rebuilds every tile from two numbers: p = exp(s − lse)",

    "there is nothing stored. The recovery is one line: " + FBW.note +
    " Because lse is m + ln(l), subtracting it from a score performs the " +
    "max-subtraction and the division by the denominator in a single " +
    "operation. Take row " + (FBR - 1) + ": its saved lse is " +
    f(FBW.detail[FBR - 1].lse, 6) + ", and exponentiating each recomputed " +
    "score minus that number gives probabilities summing to " +
    f(FBW.detail[FBR - 1].sum, 12) + ". Across the entire matrix the " +
    "recomputed P differs from the one the standard implementation stored by " +
    f(FBW.recompute_max_err, 1) + ". So the backward pass does not approximate " +
    "the forward pass's probabilities — it reconstructs them exactly, from " +
    FFL.saved_elements + " numbers instead of " + FSTD.stored_elements + ".",
  build: function (ctx) {
    const i = FBR - 1, det = FBW.detail[i];
    ctx.hm = heatGrid({ rows: FSEQ, cols: FSEQ, cell: 50,

    const rows = det.entries.map(function (e) {
      return el("tr", {}, [
        el("td", { style: { textAlign: "left" } }, "k" + e.j),
        el("td", { class: "n" }, f(e.s, 6)),
        el("td", { class: "n" }, f(e.s - det.lse, 6)),
        el("td", { class: "n v-activation" }, f(e.p, 6)),
        el("td", { class: "n" }, f(FSTD.P[i][e.j], 6))
      ]);
    });
    return [
      kicker("FlashAttention · backward · recomputation"),
      title("<span class='mono'>pᵢⱼ = exp(sᵢⱼ − lseᵢ)</span> — that is the " +
            "whole recovery", true),
      d("cols wide-r", [
        d("stack", [
          frag(NN.formula({ rule: "lseᵢ, saved by the forward pass",
            sub: "mᵢ + ln(lᵢ) — one number per query row",
            result: f(det.lse, 6) + " for row " + i,
            cls: "activation" }), "f-left"),
          frag(d("panel a tight", [ph("row " + i + " rebuilt entry by entry, " +
            "against the matrix the standard version stored"),
            el("table", { class: "data" }, [
              el("thead", {}, el("tr", {}, [
                el("th", { style: { textAlign: "left" } }, "key"),
                el("th", {}, "s recomputed"), el("th", {}, "s − lse"),

            ]),
            h("small muted", "row sum " + f(det.sum, 12) +
              " — the normalisation came out of one saved number, not out of " +
              "a second pass over the row")]), "f-left"),
          frag(NN.tiles([

          ]), "f-left")
        ]),

  },

  }
});

/* -------------------------------------------------- F19. why it is also faster */
S({
  chapter: "FlashAttention · why it is also faster",
  plain: "Not only a memory trick: the matrix never leaves SRAM",
  notes: "The last conceptual slide, and it explains why this is not a " +

    " Put the mechanism plainly. A naive attention kernel writes the seq² " +
    "matrix to HBM, reads it back to apply the softmax, writes it again, reads " +
    "it a third time for the value average — and a fourth time in the backward " +
    "pass. Every one of those trips is off-chip. Attention's arithmetic " +
    "intensity is low enough that the kernel spends most of its time waiting " +
    "for memory rather than multiplying, so it is bandwidth-bound, not " +
    "compute-bound. FlashAttention fuses the whole sequence into one kernel " +
    "whose working set is a tile small enough to live in SRAM, and the matrix " +
    "is written to HBM zero times. On long sequences it is simultaneously " +
    "smaller and faster, which is why it became the default implementation " +
    "rather than something you switch on when you run out of memory.",

      kicker("FlashAttention · the part that is not about memory"),

          d("pill", "softmax"), h("ar", "→"), d("pill hot", "write HBM"),

        ]),

        ]),
        h("small muted", "the " + FBR + "×" + FBC + " tile — " +
          FFL.peak_tile_elements + " elements — never leaves the chip")]), "f-pop"),
      frag(NN.callout("key", "The claim, from the generator, verbatim",

      frag(d("cols", [

/* ------------------------------------- B5. activation checkpointing, derived
   The deck quotes "about 30% more compute" as the price of activation
   checkpointing on four separate slides and has never shown where it comes
   from, nor what it buys. Both are arithmetic on quantities already on the
   table: a step costs one forward plus a backward worth two forwards, and the
   recomputation adds exactly one more forward however many segments you cut
   the stack into — which is why the segment count is a free memory knob. */
const CKPT = (function () {
  const A_LAYER = CFG.actFlashSeq / CFG.layers;          /* one layer, one seq */
  const BOUND   = CFG.seq * CFG.d * BF16B;               /* one segment input  */
  const at = function (k) { return k * BOUND + (CFG.layers / k) * A_LAYER; };
  /* d/dk [ k·BOUND + L·A/k ] = 0  →  k = sqrt(L·A/BOUND) */
  const kStar = Math.max(1, Math.min(CFG.layers,
    Math.round(Math.sqrt(CFG.layers * A_LAYER / BOUND))));
  return { A_LAYER: A_LAYER, BOUND: BOUND, at: at, kStar: kStar,
           none: CFG.actFlashSeq, every: at(CFG.layers), best: at(kStar) };
})();
/* forward = 1 unit of matmul work, backward = 2 (one for dW, one for dInput);
   recomputation adds exactly one more forward, whatever k is */
const CKPT_FWD = 1, CKPT_BWD = 2;
const CKPT_OVERHEAD = CKPT_FWD / (CKPT_FWD + CKPT_BWD);

S({
  chapter: "Scale · checkpointing", plain: "Activation checkpointing: where the " +
    f(CKPT_OVERHEAD * 100, 0) + "% comes from, and what it buys",
  notes: "The deck has now said “about a third more compute” three " +
    "times without showing the arithmetic, so here it is, and it is two lines. " +
    "A training step costs one forward pass plus a backward pass, and a " +
    "backward pass is worth about two forwards because every matmul has to be " +
    "differentiated twice — once against its weights and once against its " +
    "input. So a step is " + (CKPT_FWD + CKPT_BWD) + " units. Activation " +
    "checkpointing throws the interior of each segment away and re-runs it " +
    "during backward, which adds exactly ONE more forward pass — and here is " +
    "the part people miss: exactly one, no matter how many segments you cut " +
    "the stack into, because every segment is recomputed precisely once. " +
    "That is " + f(CKPT_OVERHEAD * 100, 0) + "% more compute, and it is a " +
    "constant. Which makes the segment count a free knob, and the curve on " +
    "the right is what it buys. Keep everything and " + MODEL.name +
    " costs " + BY(CKPT.none) + " a sequence. Checkpoint every block and it " +
    "is " + BY(CKPT.every) + " — " + f(CKPT.none / CKPT.every, 1) +
    "× less for the same " + f(CKPT_OVERHEAD * 100, 0) + "%. The true " +
    "minimum is at k = √(L·A/boundary) ≈ " + CKPT.kStar + " segments and " +
    BY(CKPT.best) + ", which is barely better than the simple answer, which " +

const PA = window.PARALLEL || null;

                "Run `python3 code/parallel_toy.py` to regenerate it.");

const COLL  = PA.collectives;
const SUB   = ["₀", "₁", "₂", "₃", "₄", "₅", "₆", "₇"];
const SUP   = ["⁰", "¹", "²", "³", "⁴", "⁵", "⁶", "⁷"];
const byOp  = function (op) {
